<script type="text/babel" data-presets="react">
const {useState,useEffect,useMemo,useRef}=React;

/* ========== 常數 ========== */
const VER='v0.1-012';
const JSPDF_URL='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
const FONT='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
const P='slowve-';
const SVCS=[{id:'dry',name:'全身指壓',short:'指壓'},{id:'oil',name:'深層油壓',short:'油壓'},{id:'foot',name:'腳底按摩',short:'腳底'}];
const SVC_SHORT={dry:'指壓',oil:'油壓',foot:'腳底'};
const MINS=[60,90,120];
const WK='日一二三四五六';
const STORAGE_LIMIT=5*1024*1024;
const DEFAULT_SETTINGS={
  prices:{dry:[1000,1400,1800],oil:[1200,1600,2000],foot:[1000,1400,1800]},
  promo:{svc:'dry',min:90,price:1300},
  addons:[
    {id:'eoil',name:'特殊精油',price:300,zh:0},    // zh＝老師多算幾支
    {id:'guasha',name:'刮痧',price:500,zh:1},
    {id:'bagua',name:'拔罐',price:500,zh:1},
    {id:'xiujiao',name:'修腳皮',price:500,zh:1}
  ],
  comm:{per30:280,laodian:20},     // per30＝每支費用（沿用舊欄位名）、laodian＝老點每單加給
  zhiMin:30,                      // 幾分鐘算 1 支
  cutoff:'05:00',
  teachers:[],
  expCats:['耗材','清潔用品','水電瓦斯','房租','餐費','雜支','其他'],
  expNames:[],
  device:'',
  lastBackupAt:null,
  backupPwd:''
};

/* ========== 儲存 ========== */
const ls={
  get(k,d){try{const v=localStorage.getItem(P+k);return v==null?d:JSON.parse(v)}catch(_e){return d}},
  set(k,v){try{localStorage.setItem(P+k,JSON.stringify(v));return true}catch(_e){return false}}
};
const clone=o=>JSON.parse(JSON.stringify(o));
function mergeSettings(s){
  s=s||{};const d=clone(DEFAULT_SETTINGS);
  const r=Object.assign({},d,s);
  r.prices=Object.assign({},d.prices,s.prices||{});
  r.promo=Object.assign({},d.promo,s.promo||{});
  r.comm=Object.assign({},d.comm,s.comm||{});
  r.addons=((s.addons&&s.addons.length)?s.addons:d.addons).map(a=>{
    if(a.zh!=null)return a;const def=d.addons.find(x=>x.id===a.id);   // 舊設定沒有 zh 欄位 → 補預設值
    const b=Object.assign({},a,{zh:def?def.zh:0});delete b.comm;return b;});
  r.teachers=Array.isArray(s.teachers)?s.teachers:[];
  r.expCats=(Array.isArray(s.expCats)&&s.expCats.length)?s.expCats:d.expCats;
  r.expNames=Array.isArray(s.expNames)?s.expNames:[];
  if(!r.device)r.device=Math.random().toString(36).slice(2,6).toUpperCase();
  return r;
}
function loadSettings(){return mergeSettings(ls.get('settings',null))}
function slowveKeys(){const a=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(P)===0)a.push(k)}}catch(_e){}return a}
function storageBytes(){let n=0;slowveKeys().forEach(k=>{try{n+=(k.length+(localStorage.getItem(k)||'').length)*2}catch(_e){}});return n}
/* 同網域（john7t.github.io）的其他系統（如 massage-pay）共用同一個 localStorage 上限 */
function originBytes(){let n=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'';n+=(k.length+(localStorage.getItem(k)||'').length)*2}}catch(_e){}return n}

/* ========== 日期 ========== */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const monKey=s=>s.slice(0,7);
function bizToday(cutoff){
  const now=new Date();const c=(cutoff||'05:00').split(':').map(Number);
  const d=new Date(now);if(now.getHours()*60+now.getMinutes()<c[0]*60+(c[1]||0))d.setDate(d.getDate()-1);
  return ymd(d);
}
const fmtDate=s=>{const d=parseYmd(s);return (d.getMonth()+1)+'/'+d.getDate()+'（'+WK[d.getDay()]+'）'};
const money=n=>'$'+Number(n||0).toLocaleString('en-US');
const smoney=n=>(n>0?'+':n<0?'-':'')+money(Math.abs(n||0));
function agoText(ts){
  if(!ts)return '尚未備份';
  const m=Math.floor((Date.now()-ts)/60000);
  if(m<60)return m<1?'剛剛備份':m+' 分鐘前備份';
  const h=Math.floor(m/60);if(h<24)return h+' 小時前備份';
  return Math.floor(h/24)+' 天前備份';
}

/* ========== 月／日資料 ========== */
function loadMonth(mk){const m=ls.get('m-'+mk,null);return (m&&m.days)?m:{days:{}}}
function emptyDay(){return {orders:[],expenses:[],close:null,log:[]}}
function mutateMonth(mk,fn){const md=loadMonth(mk);fn(md);return ls.set('m-'+mk,md)}
function getDay(md,date){const d=md.days[date.slice(8)];return d?Object.assign(emptyDay(),d):emptyDay()}
function mutateDay(date,fn){
  const mk=monKey(date);const md=loadMonth(mk);
  md.days[date.slice(8)]=fn(clone(getDay(md,date)));
  return ls.set('m-'+mk,md);
}

/* ========== 計價／統計 ========== */
/* 支：主項目分鐘數 ÷ 幾分鐘算 1 支（預設 30 分鐘＝1 支）＋ 額外品項各自設定的支數（刮痧／拔罐／修腳皮各 1 支） */
const zhiCalc=(o,S)=>{
  let z=(o.svc&&o.min)?Math.floor(o.min/(Number(S.zhiMin)||30)):0;
  (o.ad||[]).forEach(id=>{const a=S.addons.find(x=>x.id===id);if(a)z+=Number(a.zh)||0});
  return z;
};
const zhiOf=(o,S)=>o.zh!=null?o.zh:zhiCalc(o,S);   // 訂單存有快照就用快照
function calcOrder(o,S){
  let amt=0,cm=0;const zh=zhiCalc(o,S);
  if(o.svc&&o.min){
    if(o.promo)amt+=Number(S.promo.price)||0;
    else amt+=Number((S.prices[o.svc]||[])[MINS.indexOf(o.min)])||0;
  }
  (o.ad||[]).forEach(id=>{const a=S.addons.find(x=>x.id===id);if(a)amt+=Number(a.price)||0});
  cm+=zh*(Number(S.comm.per30)||0);
  if(o.ld)cm+=Number(S.comm.laodian)||0;
  return {amt,cm,zh};
}
function orderLabel(o,S){
  const parts=[];
  if(o.svc)parts.push(SVC_SHORT[o.svc]+o.min+(o.promo?'・平日':''));
  (o.ad||[]).forEach(id=>{const a=S.addons.find(x=>x.id===id);parts.push(a?a.name:id)});
  return parts.join(' ＋ ');
}
const SKIP_BY={store:'店家',counter:'櫃台',teacher:'老師'};
/* 跳單（客人未付款）：老闆逐筆決定是否計入營業額（skipRev）；不論是否計入，都不算進應有現金；老師費用照算
   責任歸屬 skipBy：store 店家／counter 櫃台／teacher 老師；skipNote 說明
   打槍（被換下的老師）：每筆訂單可記多位，統計被打槍次數 */
/* 一筆流水（訂單）可有多位同行客人 items[]，每位各自有方案／老師／老點／額外品項／打槍與金額快照；
   跳單、時間、備註、作廢屬於整筆。舊資料沒有 items 的，整筆視為 1 位客人。 */
function orderItems(o){
  if(o.items&&o.items.length)return o.items;
  return [{svc:o.svc,min:o.min,promo:!!o.promo,ad:o.ad||[],tc:o.tc,ld:!!o.ld,rj:o.rj||[],amt:o.amt,cm:o.cm,zh:o.zh}];
}
// 攤平成「每位客人一行」，並帶上整筆的欄位（統計、老師明細、薪資條都用這個）
function orderLines(o,date){
  return orderItems(o).map((it,i)=>Object.assign({},it,{id:o.id+'_'+i,oid:o.id,idx:i,sn:o.sn,t:o.t,
    skip:o.skip,skipRev:o.skipRev,skipBy:o.skipBy,skipNote:o.skipNote,void:o.void,note:o.note,ca:o.ca},date?{date}:{}));
}
const orderAmt=o=>orderItems(o).reduce((s,x)=>s+(x.amt||0),0);
const orderTcs=o=>orderItems(o).map(x=>x.tc);
const orderSummary=(o,S)=>orderItems(o).map(x=>orderLabel(x,S)+' '+x.tc+'師').join('／');
function statsOf(orders,S){
  const live=orders.filter(o=>!o.void);
  const r={n:live.length,guests:0,amt:0,cash:0,cm:0,zh:0,skip:0,skipN:0,skipRev:0,skipBy:{store:0,counter:0,teacher:0},skipList:[],byT:{},rj:{}};
  live.forEach(o=>{
    const oa=orderAmt(o);
    if(o.skip){r.skip+=oa;r.skipN++;if(o.skipRev)r.skipRev+=oa;const by=o.skipBy||'store';r.skipBy[by]=(r.skipBy[by]||0)+oa;r.skipList.push(o)}
    orderLines(o).forEach(l=>{
      const z=zhiOf(l,S);const a=l.amt||0;const rev=o.skip?(o.skipRev?a:0):a;
      r.guests++;r.amt+=rev;r.cash+=o.skip?0:a;r.cm+=l.cm||0;r.zh+=z;
      const t=r.byT[l.tc]||(r.byT[l.tc]={tc:l.tc,n:0,zh:0,ld:0,cm:0,amt:0});
      t.n++;t.zh+=z;t.ld+=l.ld?1:0;t.cm+=l.cm||0;t.amt+=rev;
      (l.rj||[]).forEach(c=>{r.rj[c]=(r.rj[c]||0)+1});
    });
  });
  return r;
}
function expStatsOf(expenses){
  const r={total:0,cash:0,byCat:{}};
  (expenses||[]).forEach(e=>{const a=Number(e.amt)||0;r.total+=a;if(e.cash!==false)r.cash+=a;r.byCat[e.cat]=(r.byCat[e.cat]||0)+a});
  return r;
}
const sortT=byT=>Object.values(byT).sort((a,b)=>String(a.tc).localeCompare(String(b.tc),'zh-Hant',{numeric:true}));
const snNum=o=>{const n=parseInt(o.sn,10);return isNaN(n)?1e9:n};
const newId=dev=>Date.now().toString(36)+dev+Math.random().toString(36).slice(2,5);

/* ========== 匯出／匯入 ========== */
async function shareOrDownload(blob,name,title){
  try{
    const file=new File([blob],name,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:title||name});return 'shared'}
  }catch(e){if(e&&e.name==='AbortError')return 'abort'}
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);
  return 'download';
}
function loadScript(src){return new Promise((res,rej)=>{const el=document.createElement('script');el.src=src;el.onload=res;el.onerror=()=>rej(new Error('載入失敗：'+src));document.head.appendChild(el)})}
async function exportJson(S){
  const now=new Date();
  const name='slowve-backup-'+ymd(now).replace(/-/g,'')+'-'+pad(now.getHours())+pad(now.getMinutes())+'.json';
  const data={};slowveKeys().forEach(k=>{data[k]=localStorage.getItem(k)});
  const text=JSON.stringify({app:'slowve',ver:VER,exportedAt:now.toISOString(),device:S.device,data});
  return shareOrDownload(new Blob([text],{type:'application/json'}),name);
}
function readFileText(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result||''));r.onerror=rej;r.readAsText(file)})}

/* ========== 共用 UI ========== */
function Sheet({onClose,children,title,footer}){
  return (
    <div className="fixed inset-0 z-40 flex items-end justify-center bg-black/40" onClick={onClose}>
      <div className="sheet-in w-full max-w-md bg-bg rounded-t-2xl max-h-[92vh] flex flex-col" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between px-4 pt-3 pb-2 border-b border-line">
          <div className="serif text-lg">{title}</div>
          <button className="w-9 h-9 rounded-full text-mute text-xl" onClick={onClose} aria-label="關閉">×</button>
        </div>
        <div className="overflow-y-auto px-4 py-3 flex-1">{children}</div>
        {footer&&<div className="border-t border-line px-4 py-3 pb-safe bg-card rounded-b-none">{footer}</div>}
      </div>
    </div>
  );
}
function Dialog({dlg,onDone}){
  if(!dlg)return null;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-6">
      <div className="w-full max-w-sm bg-card rounded-2xl p-5 shadow-xl">
        <div className="text-lg font-semibold mb-2">{dlg.title}</div>
        {dlg.msg&&<div className="text-mute whitespace-pre-line mb-4">{dlg.msg}</div>}
        <div className="flex gap-2 justify-end">
          {!dlg.okOnly&&<button className="px-4 py-2 rounded-xl border border-line" onClick={()=>onDone(false)}>取消</button>}
          <button className={'px-4 py-2 rounded-xl text-white '+(dlg.danger?'bg-warn':'bg-sage')} onClick={()=>onDone(true)}>{dlg.okText||'確定'}</button>
        </div>
      </div>
    </div>
  );
}
const Card=({children,className})=><div className={'bg-card rounded-2xl border border-line '+(className||'')}>{children}</div>;
function Stat({label,value,big,tone}){
  return (
    <div>
      <div className="text-xs text-mute">{label}</div>
      <div className={'num '+(big?'text-3xl serif ':'text-lg ')+(tone==='brown'?'text-brown':tone==='sage'?'text-sageD':'')}>{value}</div>
    </div>
  );
}

/* ========== 訂單編輯（一筆流水可有多位客人，每位客人各自選方案與老師） ========== */
const blankItem=()=>({svc:null,min:null,promo:false,ad:[],tc:'',ld:false,rj:[]});
const sameItem=(a,b)=>!!a&&!!b&&a.svc===b.svc&&a.min===b.min&&!!a.promo===!!b.promo&&!!a.ld===!!b.ld
  &&[...(a.ad||[])].sort().join()===[...(b.ad||[])].sort().join();
function OrderEditor({S,order,dayOrders,locked,onSave,onToggleVoid,onClose,ask,prev,count}){
  const isNew=!order;
  const origItems=order?orderItems(order):[];
  const nextSn=()=>{let mx=0;dayOrders.forEach(o=>{const n=parseInt(o.sn,10);if(!isNaN(n)&&n>mx)mx=n});return String(mx+1)};
  const [f,setF]=useState(()=>order?Object.assign({},order,{items:origItems.map(x=>Object.assign({},x,{ad:[...(x.ad||[])],rj:[...(x.rj||[])]}))}):
    {id:newId(S.device),sn:nextSn(),t:'',items:[blankItem()],skip:false,skipRev:false,skipBy:'store',skipNote:'',note:'',void:false});
  const [cur,setCur]=useState(0);
  const [rjIn,setRjIn]=useState('');
  const set=(k,v)=>setF(p=>Object.assign({},p,{[k]:v}));
  const it=f.items[cur]||f.items[0];
  const setIt=fn=>setF(p=>{const items=p.items.map((x,i)=>i===cur?Object.assign({},x,fn(x)):x);return Object.assign({},p,{items})});
  const pickCell=(svc,min)=>setIt(x=>(x.svc===svc&&x.min===min&&!x.promo)?{svc:null,min:null}:{svc,min,promo:false});
  const pickPromo=()=>setIt(x=>x.promo?{svc:null,min:null,promo:false}:{svc:S.promo.svc,min:S.promo.min,promo:true});
  const togAd=id=>setIt(x=>({ad:x.ad.includes(id)?x.ad.filter(y=>y!==id):[...x.ad,id]}));
  const addRj=c=>{c=String(c||'').trim();if(!c)return;setIt(x=>({rj:(x.rj||[]).includes(c)?x.rj:[...(x.rj||[]),c]}));setRjIn('')};
  const delRj=c=>setIt(x=>({rj:(x.rj||[]).filter(y=>y!==c)}));
  const addGuest=()=>{setF(p=>Object.assign({},p,{items:[...p.items,blankItem()]}));setCur(f.items.length);setRjIn('')};
  const delGuest=async()=>{
    if(f.items.length<=1)return;
    if(!await ask({title:'移除客人 '+(cur+1)+'？',okText:'移除',danger:true}))return;
    setF(p=>Object.assign({},p,{items:p.items.filter((_,i)=>i!==cur)}));setCur(Math.max(0,cur-1));
  };

  // 各客人的金額／支數／費用：品項沒變就沿用原本快照
  const priced=f.items.map((x,i)=>{
    const o=origItems[i];
    if(!isNew&&sameItem(o,x)&&o.amt!=null)return {amt:o.amt,cm:o.cm,zh:o.zh!=null?o.zh:calcOrder(x,S).zh,kept:true};
    return Object.assign(calcOrder(x,S),{kept:false,changed:!isNew&&!!o&&o.amt!=null});
  });
  const tot=priced.reduce((s,p)=>({amt:s.amt+p.amt,cm:s.cm+p.cm,zh:s.zh+p.zh}),{amt:0,cm:0,zh:0});

  const save=async(next)=>{
    for(let i=0;i<f.items.length;i++){
      const x=f.items[i];const who=f.items.length>1?'客人 '+(i+1)+'：':'';
      if(!x.svc){setCur(i);await ask({title:who+'尚未選擇主項目',msg:'請先點選主項目（指壓／油壓／腳底或平日限定），額外品項不能單獨成單。',okOnly:true});return}
      const tc=String(x.tc||'').trim();
      if(!tc){setCur(i);await ask({title:who+'請輸入老師編號',okOnly:true});return}
      if((x.rj||[]).includes(tc)){setCur(i);await ask({title:who+'老師編號重複',msg:tc+' 老師同時被登記為「打槍老師」，請確認。',okOnly:true});return}
    }
    const sn=String(f.sn||'').trim();
    const dup=sn&&dayOrders.find(o=>o.id!==f.id&&!o.void&&String(o.sn)===sn);
    if(dup){
      const ok=await ask({title:'流水號重複',msg:'#'+sn+' 已有一筆（'+orderTcs(dup).join('、')+' 老師）。\n同一張單的多位客人請在同一筆裡「＋新增客人」。確定要另存一筆嗎？',okText:'仍要儲存'});
      if(!ok)return;
    }
    const now=Date.now();
    const items=f.items.map((x,i)=>({svc:x.svc,min:x.min,promo:!!x.promo,ad:[...x.ad],tc:String(x.tc).trim(),ld:!!x.ld,rj:[...(x.rj||[])],amt:priced[i].amt,cm:priced[i].cm,zh:priced[i].zh}));
    onSave({id:f.id,sn,t:f.t||'',note:f.note||'',void:!!f.void,skip:!!f.skip,skipRev:!!f.skipRev,skipBy:f.skipBy||'store',skipNote:f.skipNote||'',items,ca:f.ca||now,ua:now},!!next);
  };

  const cellCls=on=>'h-14 rounded-xl border text-base num transition-colors '+(on?'bg-sage border-sage text-white shadow-inner':'bg-card border-line active:bg-sageL');
  const recent=S.teachers.slice(0,12);
  const usedTc=f.items.map((x,i)=>i!==cur?String(x.tc):null).filter(Boolean);

  const footer=(
    <div>
      <div className="flex items-end justify-between mb-3">
        <div className="text-sm text-mute">{f.items.length>1&&<span className="text-ink">{f.items.length} 位・</span>}<span className="num text-ink">{tot.zh}</span> 支・老師抽成 <span className="num text-ink">{money(tot.cm)}</span></div>
        <div className="text-right"><span className="text-sm text-mute mr-1">{f.skip?(f.skipRev?'跳單・計入':'跳單・不計入'):'金額'}</span><span className={'serif text-3xl num '+(f.skip?'text-warn'+(f.skipRev?'':' line-through'):'text-brown')}>{money(tot.amt)}</span></div>
      </div>
      {locked?
        <div className="text-center text-mute text-sm py-2">此日已日結，需先解除日結才能修改</div>:
        <div className="flex gap-2">
          {!isNew&&<button className={'px-4 h-12 rounded-xl border '+(f.void?'border-sage text-sageD':'border-warn text-warn')} onClick={()=>onToggleVoid(f)}>{f.void?'恢復':'作廢'}</button>}
          {isNew?<>
            <button className="px-4 h-12 rounded-xl border border-sage text-sageD" onClick={()=>save(false)}>存檔關閉</button>
            <button className="flex-1 h-12 rounded-xl bg-sage text-white text-lg" onClick={()=>save(true)}>儲存，下一筆 ›</button>
          </>:<button className="flex-1 h-12 rounded-xl bg-sage text-white text-lg" onClick={()=>save(false)}>儲存</button>}
        </div>}
    </div>
  );

  return (
    <Sheet onClose={onClose} title={isNew?'新增訂單':(f.void?'訂單（已作廢）':'編輯訂單')} footer={footer}>
      {prev&&<div className="mb-3 px-3 py-2 rounded-xl bg-sageL text-sageD text-sm num">
        <span className="float-right text-xs text-mute">連續第 {count} 筆</span>
        ✓ 已存 #{prev.sn||'-'}　{orderItems(prev).length>1?orderItems(prev).length+' 位　':''}{money(orderAmt(prev))}
        <div className="text-xs truncate">{orderSummary(prev,S)}</div>
      </div>}
      <fieldset disabled={locked} className={locked?'opacity-70':''}>
        <div className="flex gap-3 mb-4">
          <label className="flex-1">
            <div className="text-xs text-mute mb-1">流水號</div>
            <input className="w-full h-11 px-3 rounded-xl border border-line bg-card num" inputMode="numeric" value={f.sn} onChange={e=>set('sn',e.target.value)}/>
          </label>
          <label className="flex-1">
            <div className="text-xs text-mute mb-1">時間（選填）</div>
            <input type="time" className="w-full h-11 px-3 rounded-xl border border-line bg-card" value={f.t||''} onChange={e=>set('t',e.target.value)}/>
          </label>
        </div>

        <div className="text-xs text-mute mb-1">客人（同一張單的同行客人各自選方案與老師）</div>
        <div className="flex gap-2 overflow-x-auto pb-1 mb-3">
          {f.items.map((x,i)=>(
            <button key={i} type="button" className={'shrink-0 min-w-[5.5rem] px-3 py-1.5 rounded-xl border text-left '+(i===cur?'bg-sage border-sage text-white':'bg-card border-line')} onClick={()=>{setCur(i);setRjIn('')}}>
              <div className="text-xs opacity-80">客人 {i+1}</div>
              <div className="text-sm num whitespace-nowrap">{x.svc?SVC_SHORT[x.svc]+x.min:'未選'}{x.tc?'・'+x.tc:''}</div>
            </button>))}
          <button type="button" className="shrink-0 px-3 rounded-xl border border-dashed border-sage text-sageD text-sm" onClick={addGuest}>＋ 新增客人</button>
        </div>

        <div className={'rounded-2xl '+(f.items.length>1?'border border-sage/40 p-3 mb-4 bg-sageL/20':'')}>
          {f.items.length>1&&<div className="flex justify-between items-center mb-2">
            <div className="text-sm text-sageD font-semibold">客人 {cur+1}</div>
            <button type="button" className="text-xs text-warn" onClick={delGuest}>移除此客人</button>
          </div>}
          <div className="text-xs text-mute mb-1">主項目</div>
          <div className="grid grid-cols-[3.5rem_1fr_1fr_1fr] gap-2 items-center mb-2">
            <div></div>
            {MINS.map(m=><div key={m} className="text-center text-xs text-mute">{m} 分</div>)}
            {SVCS.map(s=>(
              <React.Fragment key={s.id}>
                <div className="text-sm leading-tight">{s.short}</div>
                {MINS.map((m,i)=>(
                  <button key={m} type="button" className={cellCls(it.svc===s.id&&it.min===m&&!it.promo)} onClick={()=>pickCell(s.id,m)}>
                    {(S.prices[s.id]||[])[i]}
                  </button>
                ))}
              </React.Fragment>
            ))}
          </div>
          <button type="button" className={'w-full h-12 rounded-xl border mb-4 '+(it.promo?'bg-brown border-brown text-white':'bg-brownL border-line text-brown')} onClick={pickPromo}>
            平日限定　{S.promo.min} 分{SVC_SHORT[S.promo.svc]}　<span className="num font-semibold">{money(S.promo.price)}</span>
          </button>

          <div className="text-xs text-mute mb-1">老師編號</div>
          <div className="flex gap-2 mb-2">
            <input className="flex-1 h-12 px-3 rounded-xl border border-line bg-card text-lg num" inputMode="numeric" placeholder="例：122" value={it.tc} onChange={e=>{const v=e.target.value;setIt(()=>({tc:v}))}}/>
            <button type="button" className={'px-4 h-12 rounded-xl border whitespace-nowrap '+(it.ld?'bg-sage border-sage text-white':'bg-card border-line')} onClick={()=>setIt(x=>({ld:!x.ld}))}>
              {it.ld?'✓ ':''}老點
            </button>
          </div>
          {recent.length>0&&<div className="flex flex-wrap gap-2 mb-4">
            {recent.map(t=><button key={t} type="button" disabled={usedTc.includes(t)} className={'min-w-[2.75rem] h-9 px-3 rounded-full border text-sm num disabled:opacity-30 '+(String(it.tc)===t?'bg-sageL border-sage text-sageD':'bg-card border-line')} onClick={()=>setIt(()=>({tc:t}))}>{t}</button>)}
          </div>}
          {recent.length===0&&<div className="mb-4"></div>}

          <div className="text-xs text-mute mb-1">額外品項{!it.svc&&<span className="ml-2 text-brown">（需先選主項目）</span>}</div>
          <div className="grid grid-cols-2 gap-2 mb-4">
            {S.addons.map(a=>{const on=it.ad.includes(a.id);return (
              <button key={a.id} type="button" className={'h-12 rounded-xl border flex items-center justify-between px-3 '+(on?'bg-sageL border-sage text-sageD':'bg-card border-line')} onClick={()=>togAd(a.id)}>
                <span>{on?'☑':'☐'} {a.name}{Number(a.zh)>0&&<span className="text-xs text-mute ml-1">+{a.zh}支</span>}</span><span className="num text-sm">{a.id==='eoil'?'+':''}{a.price}</span>
              </button>);})}
          </div>

          <div className="text-xs text-mute mb-1">打槍老師（這位客人換下的老師，可多位）</div>
          <div className="flex gap-2 mb-2">
            <input className="flex-1 h-11 px-3 rounded-xl border border-line bg-card num" inputMode="numeric" placeholder="輸入編號後按加入" value={rjIn} onChange={e=>setRjIn(e.target.value)}/>
            <button type="button" className="px-4 h-11 rounded-xl border border-warn text-warn bg-card" onClick={()=>addRj(rjIn)}>加入</button>
          </div>
          <div className={'flex flex-wrap gap-2 '+(f.items.length>1?'mb-1':'mb-4')}>
            {(it.rj||[]).map(c=><span key={c} className="inline-flex items-center h-8 pl-3 pr-1 rounded-full bg-warnL text-warn num text-sm">{c} 老師<button type="button" className="w-6 h-6 ml-1 rounded-full" onClick={()=>delRj(c)} aria-label={'移除 '+c}>×</button></span>)}
            {!(it.rj||[]).length&&recent.filter(t=>t!==String(it.tc)).slice(0,8).map(t=><button key={t} type="button" className="h-8 px-3 rounded-full border border-line bg-card text-sm num text-mute" onClick={()=>addRj(t)}>+{t}</button>)}
          </div>
          {priced[cur]&&priced[cur].changed&&<div className="text-xs text-brown mt-2">這位客人的品項已變更，金額依目前價目表重新計算（原 {money(origItems[cur].amt)}）</div>}
        </div>

        <button type="button" className={'w-full h-12 border text-left px-3 '+(f.skip?'rounded-t-xl bg-warnL border-warn text-warn':'rounded-xl mb-4 bg-card border-line')} onClick={()=>set('skip',!f.skip)}>
          {f.skip?'☑':'☐'} 跳單（客人未付款就離開）<span className="text-xs text-mute ml-1">整張單・老師費用照算</span>
        </button>
        {f.skip&&<div className="mb-4 px-3 py-3 rounded-b-xl border border-t-0 border-warn bg-card space-y-3">
          <div className="flex items-center gap-2"><div className="w-20 text-sm text-mute">營業額</div>
            <div className="flex-1 flex rounded-lg border border-line overflow-hidden text-sm">
              {[[false,'不計入'],[true,'計入']].map(([v,l])=><button key={l} type="button" className={'flex-1 h-10 '+(!!f.skipRev===v?'bg-warn text-white':'bg-card')} onClick={()=>set('skipRev',v)}>{l}</button>)}
            </div></div>
          <div className="flex items-center gap-2"><div className="w-20 text-sm text-mute">責任歸屬</div>
            <div className="flex-1 flex rounded-lg border border-line overflow-hidden text-sm">
              {Object.keys(SKIP_BY).map(k=><button key={k} type="button" className={'flex-1 h-10 '+((f.skipBy||'store')===k?'bg-warn text-white':'bg-card')} onClick={()=>set('skipBy',k)}>{SKIP_BY[k]}</button>)}
            </div></div>
          <input className="w-full h-11 px-3 rounded-lg border border-line bg-card" placeholder="跳單說明（例：客人說去領錢就沒回來）" value={f.skipNote||''} onChange={e=>set('skipNote',e.target.value)}/>
          <div className="text-xs text-mute">不論是否計入營業額，跳單金額都不算進日結的應有現金。責任歸老師時，每位老師吸收自己服務那位客人的金額。</div>
        </div>}

        <label className="block mb-2">
          <div className="text-xs text-mute mb-1">備註</div>
          <input className="w-full h-11 px-3 rounded-xl border border-line bg-card" value={f.note||''} onChange={e=>set('note',e.target.value)}/>
        </label>
      </fieldset>
    </Sheet>
  );
}

/* ========== 日結 ========== */
function CloseSheet({S,st,ex,onSave,onClose}){
  const [cash,setCash]=useState('');
  const [note,setNote]=useState('');
  const expected=st.cash-ex.cash;
  const c=cash===''?null:Number(cash);
  const diff=c==null||isNaN(c)?null:c-expected;
  const footer=(
    <button className="w-full h-12 rounded-xl bg-sage text-white text-lg disabled:opacity-40" disabled={diff==null}
      onClick={()=>onSave({revenue:st.amt,skip:st.skip,skipN:st.skipN,skipRev:st.skipRev,cashExp:ex.cash,expected,cash:c,diff,note:note.trim(),at:Date.now()})}>確認日結</button>
  );
  return (
    <Sheet onClose={onClose} title="日結" footer={footer}>
      <Card className="p-3 mb-4 num">
        <div className="flex justify-between py-1"><span className="text-mute">營業額（{st.n} 單）</span><span>{money(st.amt)}</span></div>
        {st.skipRev>0&&<div className="flex justify-between py-1 text-warn"><span>－ 跳單未收（已計入營業額）</span><span>{money(st.skipRev)}</span></div>}
        <div className="flex justify-between py-1"><span className="text-mute">－ 現金支出</span><span>{money(ex.cash)}</span></div>
        <div className="flex justify-between pt-2 mt-1 border-t border-line"><span>應有現金</span><span className="serif text-2xl text-brown">{money(expected)}</span></div>
      </Card>
      {st.skipN>0&&<Card className="p-3 mb-4 border-warn">
        <div className="text-sm font-semibold text-warn mb-2">跳單 {st.skipN} 筆・共 {money(st.skip)}</div>
        {st.skipList.map(o=>(
          <div key={o.id} className="py-2 border-t border-line text-sm num">
            <div className="flex justify-between gap-2"><span>#{o.sn||'-'}　{orderSummary(o,S)}</span><span className="text-warn">{money(orderAmt(o))}</span></div>
            <div className="text-xs text-mute mt-0.5">責任：{SKIP_BY[o.skipBy||'store']}・{o.skipRev?'計入營業額':'不計入營業額'}{o.skipNote?'・'+o.skipNote:''}</div>
          </div>))}
      </Card>}
      <label className="block mb-3">
        <div className="text-xs text-mute mb-1">實收現金（盤點）</div>
        <input className="w-full h-14 px-3 rounded-xl border border-line bg-card text-2xl num" inputMode="numeric" value={cash} onChange={e=>setCash(e.target.value.replace(/[^\d-]/g,''))} placeholder="盤點後輸入"/>
      </label>
      {diff!=null&&<div className={'mb-3 text-lg num '+(diff===0?'text-sageD':'text-warn')}>差額 {smoney(diff)}{diff===0?'　✓ 相符':''}</div>}
      <label className="block">
        <div className="text-xs text-mute mb-1">備註</div>
        <input className="w-full h-11 px-3 rounded-xl border border-line bg-card" value={note} onChange={e=>setNote(e.target.value)} placeholder="例：找錯錢、借零錢"/>
      </label>
      <div className="text-xs text-mute mt-3">日結後當日訂單與支出會鎖定，需要修改時可解除日結。</div>
    </Sheet>
  );
}

/* ========== 支出編輯 ========== */
function ExpenseEditor({S,exp,locked,onSave,onDelete,onClose,ask,prev,count}){
  const isNew=!exp;
  const [f,setF]=useState(()=>exp?Object.assign({},exp):{id:newId(S.device),cat:S.expCats[0]||'其他',name:'',amt:'',cash:true,note:''});
  const set=(k,v)=>setF(p=>Object.assign({},p,{[k]:v}));
  const save=async next=>{
    const amt=Number(f.amt);
    if(!f.amt||!amt||amt<0){await ask({title:'請輸入金額',okOnly:true});return}
    const name=String(f.name||'').trim();
    const now=Date.now();
    onSave(Object.assign({},f,{name,amt,ca:f.ca||now,ua:now}),!!next);
  };
  const names=S.expNames.slice(0,10);
  const footer=locked?<div className="text-center text-mute text-sm py-2">此日已日結，需先解除日結才能修改</div>:(
    <div className="flex gap-2">
      {!isNew&&<button className="px-4 h-12 rounded-xl border border-warn text-warn" onClick={()=>onDelete(f)}>刪除</button>}
      {isNew?<>
        <button className="px-4 h-12 rounded-xl border border-sage text-sageD" onClick={()=>save(false)}>存檔關閉</button>
        <button className="flex-1 h-12 rounded-xl bg-sage text-white text-lg" onClick={()=>save(true)}>儲存，下一筆 ›</button>
      </>:<button className="flex-1 h-12 rounded-xl bg-sage text-white text-lg" onClick={()=>save(false)}>儲存</button>}
    </div>
  );
  return (
    <Sheet onClose={onClose} title={isNew?'新增支出':'編輯支出'} footer={footer}>
      {prev&&<div className="mb-3 px-3 py-2 rounded-xl bg-sageL text-sageD text-sm num">
        ✓ 已存 {prev.cat}{prev.name?'・'+prev.name:''}　{money(prev.amt)}
        <span className="float-right text-xs text-mute">連續第 {count} 筆</span>
      </div>}
      <fieldset disabled={locked} className={locked?'opacity-70':''}>
        <div className="text-xs text-mute mb-1">類別</div>
        <div className="flex flex-wrap gap-2 mb-4">
          {S.expCats.map(c=><button key={c} type="button" className={'h-10 px-4 rounded-full border '+(f.cat===c?'bg-sage border-sage text-white':'bg-card border-line')} onClick={()=>set('cat',c)}>{c}</button>)}
        </div>
        <label className="block mb-2">
          <div className="text-xs text-mute mb-1">項目名稱（選填）</div>
          <input className="w-full h-11 px-3 rounded-xl border border-line bg-card" value={f.name} onChange={e=>set('name',e.target.value)} placeholder="例：毛巾送洗、精油補貨"/>
        </label>
        {names.length>0&&<div className="flex flex-wrap gap-2 mb-4">
          {names.map(n=><button key={n} type="button" className="h-8 px-3 rounded-full border border-line bg-card text-sm" onClick={()=>set('name',n)}>{n}</button>)}
        </div>}
        <label className="block mb-3">
          <div className="text-xs text-mute mb-1">金額</div>
          <input className="w-full h-14 px-3 rounded-xl border border-line bg-card text-2xl num" inputMode="numeric" value={f.amt} onChange={e=>set('amt',e.target.value.replace(/[^\d]/g,''))} placeholder="0"/>
        </label>
        <button type="button" className={'w-full h-12 rounded-xl border mb-3 text-left px-3 '+(f.cash!==false?'bg-sageL border-sage text-sageD':'bg-card border-line')} onClick={()=>set('cash',f.cash===false)}>
          {f.cash!==false?'☑':'☐'} 從店內現金支付<span className="text-xs text-mute ml-2">（勾選時日結會扣除）</span>
        </button>
        <label className="block">
          <div className="text-xs text-mute mb-1">備註</div>
          <input className="w-full h-11 px-3 rounded-xl border border-line bg-card" value={f.note||''} onChange={e=>set('note',e.target.value)}/>
        </label>
      </fieldset>
    </Sheet>
  );
}

/* ========== 日頁 ========== */
function DayPage({S,date,setDate,rev,openEditor,openExp,openClose,onUnlock}){
  const today=bizToday(S.cutoff);
  const dd=useMemo(()=>getDay(loadMonth(monKey(date)),date),[date,rev]);
  const orders=useMemo(()=>[...dd.orders].sort((a,b)=>snNum(a)-snNum(b)||(a.ca||0)-(b.ca||0)),[dd]);
  const st=useMemo(()=>statsOf(dd.orders,S),[dd,S]);
  const ex=useMemo(()=>expStatsOf(dd.expenses),[dd]);
  const exps=useMemo(()=>[...(dd.expenses||[])].sort((a,b)=>(a.ca||0)-(b.ca||0)),[dd]);
  const closed=!!dd.close;
  const dateRef=useRef(null);

  return (
    <div className="pb-28">
      <div className="flex items-center justify-between mb-3">
        <button className="w-11 h-11 rounded-full bg-card border border-line text-lg" onClick={()=>setDate(addDays(date,-1))} aria-label="前一天">◀</button>
        <label className="relative flex flex-col items-center">
          <span className="text-xs text-mute num">{date.slice(0,4)}</span>
          <span className="serif text-2xl num">{fmtDate(date)}</span>
          <input ref={dateRef} type="date" className="absolute inset-0 opacity-0" value={date} onChange={e=>e.target.value&&setDate(e.target.value)}/>
        </label>
        <button className="w-11 h-11 rounded-full bg-card border border-line text-lg" onClick={()=>setDate(addDays(date,1))} aria-label="後一天">▶</button>
      </div>
      <div className="h-7 mb-2 text-center">
        {date!==today?<button className="px-3 h-7 rounded-full bg-sageL text-sageD text-sm" onClick={()=>setDate(today)}>回到今天</button>:
          <span className="text-xs text-mute">今天的營業日</span>}
      </div>

      <Card className="p-4 mb-3">
        <div className="flex items-end justify-between">
          <Stat label="營業額" value={money(st.amt)} big tone="brown"/>
          <div className="text-right text-sm text-mute">{st.n} 單{st.guests>st.n&&<span>・{st.guests} 位</span>}{closed&&<span className="ml-2 px-2 py-0.5 rounded-full bg-sageL text-sageD">已日結</span>}</div>
        </div>
        <div className="grid grid-cols-3 gap-3 mt-3 pt-3 border-t border-line">
          <Stat label="老師抽成" value={money(st.cm)}/>
          <Stat label="支出" value={money(ex.total)}/>
          <Stat label="店家淨額" value={money(st.amt-st.cm-ex.total)} tone="sage"/>
        </div>
        {st.skipN>0&&<div className="mt-3 pt-2 border-t border-line text-sm text-warn num">跳單 {st.skipN} 筆・未收 {money(st.skip)}{st.skipRev>0&&<span>（其中 {money(st.skipRev)} 計入營業額）</span>}</div>}
      </Card>

      {closed&&<Card className="p-4 mb-3 bg-sageL/60">
        <div className="flex items-center justify-between mb-2"><div className="font-semibold text-sageD">日結</div>
          <button className="text-sm text-warn" onClick={onUnlock}>解除日結</button></div>
        <div className="grid grid-cols-3 gap-2 text-sm num">

/* ========== 月報 ========== */
/* 發薪週期：上期 1～15 號（當月 20 號發薪）、下期 16 號～月底（次月 5 號發薪） */
const PERIODS=[{id:'all',label:'整月'},{id:'h1',label:'上期'},{id:'h2',label:'下期'}];
const PERIOD_LABEL={all:'整月',h1:'上期',h2:'下期'};
function periodRange(ym,p){const a=ym.split('-').map(Number);const dim=new Date(a[0],a[1],0).getDate();return p==='h1'?[1,15]:p==='h2'?[16,dim]:[1,dim]}
function periodText(ym,p){const m=Number(ym.split('-')[1]);const r=periodRange(ym,p);return m+'/'+r[0]+'～'+m+'/'+r[1]}
function payDay(ym,p){const a=ym.split('-').map(Number);if(p==='h1')return new Date(a[0],a[1]-1,20);if(p==='h2')return new Date(a[0],a[1],5);return null}
const fmtPayDay=d=>d?(d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()):'';
const adjIn=(list,p)=>p==='all'?list:list.filter(j=>(j.p||'h2')===p);   // 舊資料沒標期別的，視為下期（月底結算）
const adjSumOf=list=>list.reduce((s,x)=>s+(Number(x.amt)||0),0);

function monthData(ym,S,p){
  const md=loadMonth(ym);const [from,to]=periodRange(ym,p||'all');
  const rows=[];const tot={n:0,amt:0,cm:0,exp:0,zh:0,skip:0,skipN:0,skipRev:0,skipBy:{store:0,counter:0,teacher:0},skipList:[],byT:{},byCat:{},rj:{}};
  for(let d=from;d<=to;d++){
    const dd=md.days[pad(d)];
    if(!dd||(!(dd.orders||[]).length&&!(dd.expenses||[]).length&&!dd.close))continue;
    const st=statsOf(dd.orders||[],S);const ex=expStatsOf(dd.expenses);
    rows.push({date:ym+'-'+pad(d),st,ex,closed:!!dd.close});
    tot.n+=st.n;tot.amt+=st.amt;tot.cm+=st.cm;tot.exp+=ex.total;tot.zh+=st.zh;tot.skip+=st.skip;tot.skipN+=st.skipN;tot.skipRev+=st.skipRev;
    Object.keys(st.skipBy).forEach(k=>{tot.skipBy[k]=(tot.skipBy[k]||0)+st.skipBy[k]});st.skipList.forEach(o=>tot.skipList.push(Object.assign({date:ym+'-'+pad(d)},o)));
    Object.keys(st.rj).forEach(c=>{tot.rj[c]=(tot.rj[c]||0)+st.rj[c]});
    Object.keys(ex.byCat).forEach(c=>{tot.byCat[c]=(tot.byCat[c]||0)+ex.byCat[c]});
    Object.values(st.byT).forEach(t=>{const x=tot.byT[t.tc]||(tot.byT[t.tc]={tc:t.tc,n:0,zh:0,ld:0,cm:0,amt:0});x.n+=t.n;x.zh+=t.zh;x.ld+=t.ld;x.cm+=t.cm;x.amt+=t.amt});
  }
  return {rows,tot,pay:md.pay||{}};
}
function teacherOrders(ym,tc,p){
  const md=loadMonth(ym);const [from,to]=periodRange(ym,p||'all');const list=[];
  Object.keys(md.days).sort().forEach(d=>{
    const dn=Number(d);if(dn<from||dn>to)return;
    (md.days[d].orders||[]).filter(o=>!o.void)
      .sort((a,b)=>snNum(a)-snNum(b)||(a.ca||0)-(b.ca||0))
      .forEach(o=>orderLines(o,ym+'-'+d).filter(l=>String(l.tc)===String(tc)).forEach(l=>list.push(l)));
  });
  return list;
}
function PeriodSeg({value,onChange,ym,noAll}){
  return (
    <div className="flex rounded-xl border border-line overflow-hidden bg-card">
      {PERIODS.filter(x=>!(noAll&&x.id==='all')).map(x=>(
        <button key={x.id} className={'flex-1 h-11 text-sm leading-tight '+(value===x.id?'bg-sage text-white':'text-ink')} onClick={()=>onChange(x.id)}>
          {x.label}{x.id!=='all'&&<div className={'text-[11px] num '+(value===x.id?'text-white/80':'text-mute')}>{periodText(ym,x.id)}</div>}
        </button>))}
    </div>
  );
}

/* ========== 薪資條（給老師看：一律寫「費用」，不出現「抽成」） ========== */
const SERIF='"Noto Serif TC","Songti TC","PMingLiU",serif';
const SLIP_TITLES={salary:{title:'薪資明細',total:'應領薪資'},fee:{title:'費用明細',total:'應領費用'}};
function drawPayslipPages({S,ym,tc,orders,adj,showAmt,size,kind,showBrand,per}){
  const L=size==='a4'?{W:1240,H:1754,M:90,k:1,fixed:true}:{W:1080,H:3840,M:60,k:1.12,fixed:false};
  const {W,M}=L;const f=n=>Math.round(n*L.k);
  const ROW=f(52),FOOT=f(110);
  const TT=SLIP_TITLES[kind]||SLIP_TITLES.salary;
  const C={ink:'#3b3a36',mute:'#8b8478',line:'#e4dccf',sage:'#6f7d62',sageD:'#56624b',sageL:'#eef1ea',brown:'#a0784f',brownL:'#f6efe6',warn:'#b5543c'};
  const a=ym.split('-');per=per||'all';
  const ymText=a[0]+' 年 '+Number(a[1])+' 月'+(per!=='all'?'・'+PERIOD_LABEL[per]+'（'+periodText(ym,per)+'）':'');
  const pdText=per!=='all'?'發薪日 '+fmtPayDay(payDay(ym,per)):'';
  const sumFee=orders.reduce((s,o)=>s+(o.cm||0),0);
  const sumAmt=orders.reduce((s,o)=>s+(o.amt||0),0);
  const sumZhi=orders.reduce((s,o)=>s+zhiOf(o,S),0);
  const sumLd=orders.filter(o=>o.ld).length;
  const total=sumFee+adj.reduce((s,x)=>s+(Number(x.amt)||0),0);
  const font=(sz,w,serif)=>(w||'')+' '+f(sz)+'px '+(serif?SERIF:FONT);
  // ctx 為 null 時只計算高度不畫
  const text=(ctx,t,x,y,o)=>{if(!ctx)return;o=o||{};ctx.font=font(o.size||28,o.weight,o.serif);ctx.fillStyle=o.color||C.ink;ctx.textAlign=o.align||'left';ctx.textBaseline='alphabetic';
    let s=String(t);if(o.max){const full=s;while(s.length>1&&ctx.measureText(s).width>o.max)s=s.slice(0,-1);if(s!==full)s=s.slice(0,-1)+'…'}
    ctx.fillText(s,x,y)};
  const rect=(ctx,x,y,w,h,col)=>{if(!ctx)return;ctx.fillStyle=col;ctx.fillRect(x,y,w,h)};
  const hline=(ctx,y,col,w)=>rect(ctx,M,y,W-2*M,w||2,col||C.line);

  const cols=size==='a4'
    ?[{k:'date',t:'日期',w:185},{k:'sn',t:'流水號',w:115},{k:'item',t:'項目',w:0},{k:'zh',t:'支',w:80,center:true},{k:'ld',t:'老點',w:95,center:true}]
    :[{k:'date',t:'日期',w:200},{k:'sn',t:'單號',w:85},{k:'item',t:'項目',w:0},{k:'zh',t:'支',w:65,center:true},{k:'ld',t:'老點',w:85,center:true}];
  if(showAmt)cols.push({k:'amt',t:'金額',w:size==='a4'?160:150,right:true});
  cols.push({k:'fee',t:'費用',w:size==='a4'?160:150,right:true});
  const fixedW=cols.reduce((s,c)=>s+c.w,0);cols.forEach(c=>{if(!c.w)c.w=W-2*M-fixedW});
  let x=M;cols.forEach(c=>{c.x=x;x+=c.w});
  const tableHead=(ctx,y)=>{rect(ctx,M,y,W-2*M,ROW,C.brownL);
    cols.forEach(c=>text(ctx,c.t,c.right?c.x+c.w-14:c.center?c.x+c.w/2:c.x+14,y+ROW*0.66,{size:24,color:C.mute,align:c.right?'right':c.center?'center':'left'}));return y+ROW};

  const firstHeader=ctx=>{
    let y=M+f(40);
    if(showBrand!==false){
      text(ctx,'緩 緩',M,y+f(10),{size:64,serif:true,color:C.sageD});
      text(ctx,'S L O W V E   B O D Y  S P A',M+f(190),y,{size:size==='a4'?22:18,color:C.brown});
      text(ctx,TT.title.split('').join(' '),W-M,y,{size:40,serif:true,align:'right'});
    }else{
      text(ctx,TT.title.split('').join(' '),M,y+f(10),{size:56,serif:true,color:C.sageD});
    }

const LIFF_ID='2011703958-OP1Os8vL';

const yuan=n=>Number(n||0).toLocaleString('en-US')+' 元';

// 精簡資料：{v,y,m,t,k,b,f,z,l,a:[[名稱,金額]],d:[[日,支,老點,費用]]}
function payShareData({S,ym,tc,orders,adj,kind,showBrand,per}){
  const a=ym.split('-');const byDay={};
  orders.forEach(o=>{const d=Number(o.date.slice(8));const x=byDay[d]||(byDay[d]=[d,0,0,0]);x[1]+=zhiOf(o,S);x[2]+=o.ld?1:0;x[3]+=o.cm||0});
  return {v:1,y:Number(a[0]),m:Number(a[1]),t:String(tc),k:kind==='fee'?'fee':'salary',b:showBrand===false?0:1,p:per||'all',
    f:orders.reduce((s,o)=>s+(o.cm||0),0),z:orders.reduce((s,o)=>s+zhiOf(o,S),0),l:orders.filter(o=>o.ld).length,
    a:adj.map(j=>[String(j.name||''),Number(j.amt)||0]),d:Object.values(byDay).sort((p,q)=>p[0]-q[0])};

function buildPayFlex(D){

  const y=D.y,m=D.m,tc=D.t;const dim=new Date(y,m,0).getDate();

  const G={sage:'#6f7d62',brown:'#a0784f',mute:'#8b8478',ink:'#3b3a36',warn:'#b5543c'};
  const net=D.f+D.a.reduce((s,x)=>s+(Number(x[1])||0),0);
  const T=(text,o)=>Object.assign({type:'text',text:String(text)||' ',wrap:true},o||{});
  const row=(l,r,o)=>{o=o||{};return {type:'box',layout:'horizontal',margin:o.margin||'md',contents:[
    T(l,{size:o.size||'sm',color:o.lc||G.mute,flex:5}),T(r,{size:o.rsize||o.size||'sm',color:o.rc||G.ink,align:'end',flex:5,weight:o.bold?'bold':'regular'})]}};
  const header=sub=>({type:'box',layout:'vertical',backgroundColor:G.sage,paddingAll:'16px',contents:[
    ...(showBrand?[T('緩緩 SLOWVE',{size:'xs',color:'#e7ebe1'})]:[]),
    T(TT.title+(sub?'｜'+sub:''),{size:'md',color:'#ffffff',weight:'bold'}),
    T(y+'年'+m+'月'+(perLabel?perLabel:'')+'・'+tc+' 老師',{size:'xs',color:'#e7ebe1'})]});
  const b1={type:'bubble',size:'mega',header:header(''),body:{type:'box',layout:'vertical',contents:[
    T(y+'年'+m+'月'+(perLabel?'　'+perLabel+'（'+periodText(ymk,per)+'）':''),{size:'sm',color:G.mute}),
    T(tc+' 老師',{size:'xl',weight:'bold',color:G.ink,margin:'sm'}),
    row('應領金額',yuan(D.f),{margin:'lg',size:'md',lc:G.ink,bold:true}),

async function liffReady(){

/* 代發頁：網址帶 ?share=（或 LIFF 導轉中的 liff.state）時，不載入門店資料，只負責發卡片 */
function ShareRelay(){
  const [st,setSt]=useState('loading');   // loading / picking / done / cancelled / error
  const [err,setErr]=useState('');
  const [D,setD]=useState(null);
  const pick=data=>{
    setSt('picking');
    if(!(window.liff.isApiAvailable&&window.liff.isApiAvailable('shareTargetPicker'))){setSt('error');setErr('此環境不支援分享功能，請在 LINE App 內開啟。');return}
    window.liff.shareTargetPicker([buildPayFlex(data)],{isMultiple:true})
      .then(r=>setSt(r?'done':'cancelled')).catch(e=>{setSt('error');setErr(String(e&&e.message||e))});
  };
  useEffect(()=>{
    (async()=>{
      try{
        if(!window.liff)await loadScript(LIFF_SDK);
        await window.liff.init({liffId:LIFF_ID});
        const q=new URLSearchParams(location.search);
        if(!q.get('share'))return;              // 仍在 liff.state 導轉中，LIFF 會自己換頁
        if(!window.liff.isLoggedIn()){window.liff.login({redirectUri:location.href});return}
        const data=JSON.parse(b64uDec(q.get('share')));setD(data);pick(data);
      }catch(e){setSt('error');setErr(String(e&&e.message||e))}
    })();
  },[]);
  const close=()=>{try{window.liff.closeWindow()}catch(_e){location.href=location.pathname}};
  return (
    <div className="min-h-screen flex flex-col items-center justify-center gap-4 p-6 text-center">
      <div className="serif text-3xl tracking-widest text-sageD">緩緩</div>
      {D&&<div className="text-sm text-mute num">{D.y}年{D.m}月・{D.t} 老師</div>}
      {(st==='loading'||st==='picking')&&<div className="text-mute">{st==='loading'?'準備中…':'請選擇要傳送的對象…'}</div>}
      {st==='done'&&<div className="text-lg text-sageD">✓ 已傳送</div>}
      {st==='cancelled'&&<div className="text-mute">已取消傳送</div>}
      {st==='error'&&<div className="text-warn text-sm whitespace-pre-line">{err}</div>}
      {(st==='done'||st==='cancelled'||st==='error')&&<div className="flex gap-2">
        {D&&st!=='error'&&<button className="px-5 h-11 rounded-xl border border-sage text-sageD" onClick={()=>pick(D)}>再傳一次</button>}
        <button className="px-6 h-11 rounded-xl bg-sage text-white" onClick={close}>關閉</button>
      </div>}
    </div>
  );
}

/* ========== LINE 登入測試（目前只測能不能正常登入，不做任何資料綁定） ==========
   沿用 massage-pay 1.12～1.13 的經驗：
   - 由按鈕觸發登入（使用者手勢），外部瀏覽器才不會擋導轉
   - 先 logout 再 login，清掉瀏覽器快取的舊 token
   - redirectUri 用乾淨網址（不帶上次殘留的 query）
   - 導回後若網址帶 code=，要再 liff.init 一次才算完成登入 */
const LINE_TEST_KEY=P+'linetest-pending';
function uaInfo(){
  const ua=navigator.userAgent||'';
  const os=/iPhone|iPad|iPod/.test(ua)?'iOS':/Android/.test(ua)?'Android':/Mac/.test(ua)?'Mac':/Windows/.test(ua)?'Windows':'其他';
  const br=/Line\//i.test(ua)?'LINE 內建瀏覽器':/CriOS|Chrome/.test(ua)&&!/Edg/.test(ua)?'Chrome':/Safari/.test(ua)?'Safari':/Edg/.test(ua)?'Edge':'其他';
  const standalone=(window.navigator.standalone===true)||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
  return {os,br,standalone};
}
function LineLoginTest({standalone}){
  const [st,setSt]=useState('idle');   // idle / working / done / error
  const [info,setInfo]=useState(null);
  const [err,setErr]=useState('');
  const ui=uaInfo();
  const selfUrl=()=>location.origin+location.pathname+(standalone?'?linetest=1':'');
  const collect=async()=>{
    const L=await liffReady();
    const r={inClient:L.isInClient(),loggedIn:L.isLoggedIn(),os:L.getOS&&L.getOS(),sdk:L.getVersion&&L.getVersion(),lineVer:L.getLineVersion&&L.getLineVersion(),
      share:L.isApiAvailable&&L.isApiAvailable('shareTargetPicker'),at:Date.now()};
    if(r.loggedIn){
      try{const p=await L.getProfile();r.name=p.displayName;r.uid=p.userId;r.pic=p.pictureUrl}catch(e){r.profileErr=String(e&&e.message||e)}
      try{r.idToken=!!L.getIDToken()}catch(_e){r.idToken=false}
    }
    setInfo(r);setSt(r.loggedIn?'done':'idle');
    try{if(/[?&](code|liffClientId|liffRedirectUri)=/.test(location.search))history.replaceState(null,'',location.pathname+(standalone?'?linetest=1':'')+location.hash)}catch(_e){}
    return r;
  };
  const login=async()=>{
    setSt('working');setErr('');
    try{
      const L=await liffReady();
      if(L.isInClient()){await collect();return}          // LINE App 內一定是登入狀態
      try{if(L.isLoggedIn())L.logout()}catch(_e){}
      try{sessionStorage.setItem(LINE_TEST_KEY,'1')}catch(_e){}
      L.login({redirectUri:selfUrl()});
    }catch(e){setSt('error');setErr(String(e&&e.message||e))}
  };
  const logout=async()=>{try{const L=await liffReady();L.logout()}catch(_e){}setInfo(null);setSt('idle')};
  useEffect(()=>{
    let pend=false;try{pend=sessionStorage.getItem(LINE_TEST_KEY)==='1';sessionStorage.removeItem(LINE_TEST_KEY)}catch(_e){}
    if(pend||standalone||/[?&]code=/.test(location.search)){
      setSt('working');collect().catch(e=>{setSt('error');setErr(String(e&&e.message||e))});
    }
  },[]);
  const Row=({k,v,ok})=><div className="flex justify-between py-1 border-t border-line text-sm"><span className="text-mute">{k}</span><span className={'num text-right '+(ok===false?'text-warn':ok?'text-sageD':'')}>{v}</span></div>;
  return (
    <div>
      <div className="text-xs text-mute mb-2">環境：{ui.os}・{ui.br}{ui.standalone?'・主畫面 App':''}</div>
      {info&&<div className="mb-3">
        {info.loggedIn&&info.name&&<div className="flex items-center gap-3 mb-2">
          {info.pic&&<img src={info.pic} alt="" className="w-10 h-10 rounded-full"/>}
          <div><div className="font-semibold">{info.name}</div><div className="text-xs text-mute num">{info.uid?info.uid.slice(0,6)+'…'+info.uid.slice(-4):''}</div></div>
        </div>}
        <Row k="登入狀態" v={info.loggedIn?'✓ 已登入':'未登入'} ok={info.loggedIn}/>
        <Row k="執行環境" v={info.inClient?'LINE App 內':'外部瀏覽器'}/>
        <Row k="選好友分享" v={info.share?'可用':'不可用'} ok={!!info.share}/>
        {info.loggedIn&&<Row k="ID Token" v={info.idToken?'有':'無'} ok={!!info.idToken}/>}
        {info.profileErr&&<Row k="讀取個人資料" v={info.profileErr} ok={false}/>}
        <Row k="LIFF SDK" v={(info.sdk||'-')+(info.lineVer?'・LINE '+info.lineVer:'')}/>
      </div>}
      {st==='error'&&<div className="text-sm text-warn mb-2 whitespace-pre-line">登入失敗：{err}</div>}
      <div className="flex gap-2">
        <button className="flex-1 h-10 rounded-lg text-white disabled:opacity-50" style={{background:'#06c755'}} disabled={st==='working'} onClick={login}>{st==='working'?'連線中…':info&&info.loggedIn?'重新登入測試':'LINE 登入測試'}</button>
        {info&&info.loggedIn&&<button className="px-4 h-10 rounded-lg border border-line" onClick={logout}>登出</button>}
      </div>
      {!standalone&&<a className="block text-center text-sm text-sageD underline mt-2" href={'https://liff.line.me/'+LIFF_ID+'?linetest=1'}>改用 LINE App 開啟測試頁</a>}
    </div>
  );
}
function LineTestPage(){
  const close=()=>{try{window.liff&&window.liff.closeWindow()}catch(_e){location.href=location.pathname}};
  return (
    <div className="min-h-screen max-w-md mx-auto p-6">
      <div className="serif text-3xl tracking-widest text-sageD text-center mb-1">緩緩</div>
      <div className="text-center text-mute mb-6">LINE 登入測試（不會讀取或修改門店資料）</div>
      <Card className="p-4"><LineLoginTest standalone/></Card>
      <button className="w-full h-11 mt-4 rounded-xl border border-line bg-card" onClick={close}>關閉</button>
    </div>
  );
}

        <div className="flex items-center justify-between mb-3">
          <div>上次備份</div><div className={S.lastBackupAt&&Date.now()-S.lastBackupAt<3*864e5?'text-sageD':'text-warn'}>{agoText(S.lastBackupAt)}</div>
        </div>
        <div className="opacity-50">
          <div className="text-xs text-mute mb-1">雲端備份（Google Drive）</div>
          <input disabled className="w-full h-10 px-3 rounded-lg border border-line bg-card mb-2" placeholder="連線密碼"/>
          <div className="grid grid-cols-2 gap-2">
            <button disabled className="h-10 rounded-lg border border-line">備份到雲端</button>
            <button disabled className="h-10 rounded-lg border border-line">從雲端還原</button>
          </div>
          <div className="text-xs text-mute mt-1">雲端備份尚未開放（下一版接上 GAS）</div>
        </div>
        <div className="text-xs text-mute mt-4 mb-1">本機檔案</div>
        <div className="grid grid-cols-2 gap-2">
          <button className="h-10 rounded-lg bg-sage text-white" onClick={doExport}>匯出備份檔</button>
          <button className="h-10 rounded-lg border border-sage text-sageD" onClick={()=>fileRef.current&&fileRef.current.click()}>匯入備份檔</button>
        </div>
        <input ref={fileRef} type="file" accept=".json,application/json" className="hidden" onChange={doImport}/>
      </Card>

      <div className={sec}>本機儲存空間</div>
      <Card className="p-3 text-sm">
        <div className="flex justify-between mb-1 num"><span>本系統 {(used/1024).toFixed(1)} KB</span><span className="text-mute">整個網域 {(allUsed/1024).toFixed(1)} KB／約 5 MB</span></div>
        <div className="h-2 rounded-full bg-line overflow-hidden flex">
          <div className="h-full bg-sage" style={{width:Math.max(1,pctMine)+'%'}}></div>
          <div className={'h-full '+(pct>80?'bg-warn':'bg-brown/50')} style={{width:Math.max(0,pct-pctMine)+'%'}}></div>
        </div>
        <div className="text-xs text-mute mt-2">同網域的其他系統（如 massage-pay）共用同一個空間上限</div>
        {pct>80&&<div className="text-xs text-warn mt-2">空間快滿了，請先匯出備份</div>}
      </Card>

      <div className={sec}>LINE 登入（測試）</div>
      <Card className="p-3">
        <div className="text-xs text-mute mb-2">目前只測試能不能正常登入，不會綁定或上傳任何資料。</div>
        <LineLoginTest/>
      </Card>

      <div className={sec}>版本紀錄</div>
      <Card className="px-3 py-1"><ChangelogList/></Card>

      <div className="text-center text-xs text-mute mt-6 num">緩緩門店 {VER}　裝置 {S.device}</div>

      {dirty&&<div className="fixed left-0 right-0 bottom-[4.5rem] z-30 px-4" style={{marginBottom:'env(safe-area-inset-bottom)'}}>
        <div className="max-w-md mx-auto flex gap-2">
          <button className="flex-1 h-12 rounded-xl border border-line bg-card" onClick={()=>setDr(clone(S))}>取消變更</button>
          <button className="flex-[2] h-12 rounded-xl bg-sage text-white shadow-lg" onClick={doSave}>儲存設定</button>
        </div>
      </div>}
    </div>
  );
}

/* ========== App ========== */
function App(){
  const [S,setS]=useState(()=>{const s=loadSettings();ls.set('settings',s);return s});
  const [date,setDate]=useState(()=>bizToday(loadSettings().cutoff));
  const [tab,setTab]=useState(()=>{   // LINE 登入測試導回時，直接回到設定頁顯示結果
    try{if(sessionStorage.getItem(LINE_TEST_KEY)==='1'||/[?&]code=/.test(location.search))return 'set'}catch(_e){}
    return 'day';
  });
  const [rev,setRev]=useState(0);
  const [ed,setEd]=useState(null);        // 訂單編輯 {order,k,prev,count}
  const [xe,setXe]=useState(null);        // 支出編輯 {exp,k,prev,count}
  const [pay,setPay]=useState(null);      // 薪資條 {ym,tc}
  const [closeSt,setCloseSt]=useState(null);
  const [dlg,setDlg]=useState(null);
  const [toastMsg,setToastMsg]=useState('');
  const bump=()=>setRev(r=>r+1);
  const toast=m=>{setToastMsg(m);clearTimeout(window.__tt);window.__tt=setTimeout(()=>setToastMsg(''),2200)};
  const ask=o=>new Promise(res=>setDlg(Object.assign({},o,{res})));
  const saveS=ns=>{setS(ns);if(!ls.set('settings',ns))toast('設定儲存失敗：空間不足')};

  const dayData=()=>getDay(loadMonth(monKey(date)),date);

  const saveFail=()=>ask({title:'儲存失敗',msg:'本機儲存空間可能已滿，請先匯出備份。',okOnly:true});
  const onSaveOrder=(o,next)=>{
    if(!mutateDay(date,d=>{const i=d.orders.findIndex(x=>x.id===o.id);if(i>=0)d.orders[i]=o;else d.orders.push(o);return d})){saveFail();return}
    const tcs=orderTcs(o).map(String);
    saveS(Object.assign({},S,{teachers:[...tcs,...S.teachers.filter(x=>!tcs.includes(x))].slice(0,40)}));
    bump();
    if(next){setEd(p=>({order:null,k:((p&&p.k)||0)+1,prev:o,count:((p&&p.count)||0)+1}))}
    else{setEd(null);toast('已儲存 #'+(o.sn||'')+'　'+money(orderAmt(o)))}
  };
  const onSaveExp=(e,next)=>{
    if(!mutateDay(date,d=>{d.expenses=d.expenses||[];const i=d.expenses.findIndex(x=>x.id===e.id);if(i>=0)d.expenses[i]=e;else d.expenses.push(e);return d})){saveFail();return}
    if(e.name)saveS(Object.assign({},S,{expNames:[e.name,...S.expNames.filter(x=>x!==e.name)].slice(0,30)}));
    bump();
    if(next){setXe(p=>({exp:null,k:((p&&p.k)||0)+1,prev:e,count:((p&&p.count)||0)+1}))}
    else{setXe(null);toast('已儲存支出 '+money(e.amt))}
  };
  const onDeleteExp=async e=>{
    if(!await ask({title:'刪除這筆支出？',msg:e.cat+(e.name?'・'+e.name:'')+'　'+money(e.amt),okText:'刪除',danger:true}))return;
    mutateDay(date,d=>{d.expenses=(d.expenses||[]).filter(x=>x.id!==e.id);d.log=(d.log||[]).concat([{act:'delExp',at:Date.now(),exp:e}]);return d});
    setXe(null);bump();toast('已刪除支出');
  };
  const onToggleVoid=async o=>{
    const toVoid=!o.void;
    const ok=await ask(toVoid?{title:'作廢這筆訂單？',msg:'作廢後不計入營業額，之後仍可恢復。',okText:'作廢',danger:true}:{title:'恢復這筆訂單？',okText:'恢復'});
    if(!ok)return;
    mutateDay(date,d=>{const x=d.orders.find(y=>y.id===o.id);if(x){x.void=toVoid;x.ua=Date.now()}return d});
    setEd(null);bump();toast(toVoid?'已作廢':'已恢復');
  };
  const onClose=c=>{
    mutateDay(date,d=>{d.close=c;d.log=(d.log||[]).concat([{act:'close',at:c.at,revenue:c.revenue,cashExp:c.cashExp,expected:c.expected,cash:c.cash,diff:c.diff}]);return d});
    setCloseSt(null);bump();toast('日結完成');
  };
  const onUnlock=async()=>{
    const ok=await ask({title:'解除日結？',msg:'解除後可以修改當日訂單與支出，修改完請重新日結。',okText:'解除',danger:true});
    if(!ok)return;
    mutateDay(date,d=>{d.log=(d.log||[]).concat([{act:'unlock',at:Date.now(),prev:d.close}]);d.close=null;return d});
    bump();toast('已解除日結');
  };

  const backupOld=!S.lastBackupAt||Date.now()-S.lastBackupAt>3*864e5;
  const NAV=[{id:'day',label:'每日',icon:'◷'},{id:'month',label:'月報',icon:'▤'},{id:'set',label:'設定',icon:'⚙'}];
  const TITLE={day:'每日訂單',month:'月報',set:'設定'};

  return (
    <div className="min-h-screen">
      <header className="sticky top-0 z-20 bg-bg/95 backdrop-blur border-b border-line" style={{paddingTop:'env(safe-area-inset-top)'}}>
        <div className="max-w-md mx-auto flex items-center justify-between px-4 h-14">
          <div className="flex items-baseline gap-2">
            <span className="serif text-2xl tracking-widest text-sageD">緩緩</span>
            <span className="text-xs tracking-[0.2em] text-brown">SLOWVE</span>
            <span className="text-sm text-mute ml-1">{TITLE[tab]}</span>
          </div>
          <button className={'text-xs px-2.5 h-7 rounded-full '+(backupOld?'bg-warnL text-warn':'bg-sageL text-sageD')} onClick={()=>setTab('set')}>{agoText(S.lastBackupAt)}</button>
        </div>
      </header>

      <main className="max-w-md mx-auto px-4 pt-4">
        {tab==='day'&&<DayPage S={S} date={date} setDate={setDate} rev={rev}
          openEditor={o=>setEd({order:o,k:0})} openExp={e=>setXe({exp:e,k:0})} openClose={(st,ex)=>setCloseSt({st,ex})} onUnlock={onUnlock}/>}
        {tab==='month'&&<MonthPage S={S} rev={rev} goDay={d=>{setDate(d);setTab('day')}} openPay={(ym,tc,per)=>setPay({ym,tc,per})}/>}
        {tab==='set'&&<SettingsPage S={S} saveS={saveS} ask={ask} toast={toast} onImported={()=>{setS(loadSettings());bump()}}/>}
      </main>

      <nav className="fixed bottom-0 left-0 right-0 z-20 bg-card border-t border-line pb-safe">
        <div className="max-w-md mx-auto grid grid-cols-3">
          {NAV.map(n=><button key={n.id} className={'h-16 flex flex-col items-center justify-center gap-0.5 '+(tab===n.id?'text-sageD':'text-mute')} onClick={()=>setTab(n.id)}>
            <span className="text-xl leading-none">{n.icon}</span><span className="text-xs">{n.label}</span>
            {tab===n.id&&<span className="w-6 h-0.5 rounded bg-sage mt-0.5"></span>}
          </button>)}
        </div>
      </nav>

      {ed&&<OrderEditor key={'o'+ed.k} S={S} order={ed.order} dayOrders={dayData().orders} locked={!!dayData().close} prev={ed.prev} count={ed.count}
        onSave={onSaveOrder} onToggleVoid={onToggleVoid} onClose={()=>{if(ed.count)toast('已連續新增 '+ed.count+' 筆');setEd(null)}} ask={ask}/>}
      {xe&&<ExpenseEditor key={'x'+xe.k} S={S} exp={xe.exp} locked={!!dayData().close} prev={xe.prev} count={xe.count}
        onSave={onSaveExp} onDelete={onDeleteExp} onClose={()=>{if(xe.count)toast('已連續新增 '+xe.count+' 筆支出');setXe(null)}} ask={ask}/>}
      {pay&&<TeacherPaySheet S={S} ym={pay.ym} tc={pay.tc} per={pay.per} rev={rev} bump={bump} onClose={()=>setPay(null)} toast={toast} ask={ask}/>}
      {closeSt&&<CloseSheet S={S} st={closeSt.st} ex={closeSt.ex} onSave={onClose} onClose={()=>setCloseSt(null)}/>}
      <Dialog dlg={dlg} onDone={v=>{const r=dlg.res;setDlg(null);r(v)}}/>
      {toastMsg&&<div className="fixed left-1/2 -translate-x-1/2 bottom-24 z-50 px-4 py-2 rounded-full bg-ink/90 text-white text-sm shadow-lg">{toastMsg}</div>}
    </div>
  );
}

const __q=new URLSearchParams(location.search);const __ls=__q.get('liff.state')||'';
const IS_LINE_TEST=__q.has('linetest')||__ls.indexOf('linetest')>=0;
const IS_SHARE_RELAY=!IS_LINE_TEST&&(__q.has('share')||__ls.indexOf('share')>=0);
ReactDOM.createRoot(document.getElementById('root')).render(IS_LINE_TEST?<LineTestPage/>:IS_SHARE_RELAY?<ShareRelay/>:<App/>);
</script>
</body>
</html>
