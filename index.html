const FL=({label,opt,children,hint})=><label className="block mb-4"><div className="text-xs text-mute mb-1">{label}{opt&&<span className="ml-1">（選填）</span>}</div>{children}{hint&&<div className="text-xs text-mute mt-1">{hint}</div>}</label>;
const fin='w-full min-w-0 h-12 px-3 rounded-xl border border-line bg-card text-lg';
const Chips=({opts,val,multi,onChange})=>(
  <div className="flex flex-wrap gap-2">{opts.map(o=>{const v=typeof o==='string'?o:o[0],l=typeof o==='string'?o:o[1];const on=multi?(val||[]).includes(v):val===v;return (
    <button key={v} type="button" className={'h-10 px-4 rounded-full border text-sm '+(on?'bg-sage border-sage text-white':'bg-card border-line')}
      onClick={()=>onChange(multi?(on?val.filter(x=>x!==v):(val||[]).concat([v])):v)}>{l}</button>);})}</div>);
function Consent({kind,on,set}){
  const [open,setOpen]=useState(false);
  return (
    <div className="mb-4 rounded-xl border border-line bg-card p-3 text-sm">
      <div className="flex items-center gap-2">
        <button type="button" role="checkbox" aria-checked={on} className="flex-1 text-left flex items-center gap-2 min-h-[2.5rem]" onClick={()=>set(!on)}>
          <span className={'w-6 h-6 shrink-0 rounded border flex items-center justify-center '+(on?'bg-sage border-sage text-white':'border-line')}>{on?'✓':''}</span>
          <span>我已閱讀並同意個人資料告知事項</span>
        </button>
        <button type="button" className="shrink-0 h-8 px-2 text-xs text-sageD underline" onClick={()=>setOpen(!open)}>{open?'收起':'查看'}</button>
      </div>
      {open&&<div className="mt-2 text-xs text-mute leading-relaxed">{PRIVACY[kind]}</div>}
    </div>);
}

/* 成為會員／成為工作夥伴頁最下方：複製 LINE userId（開通有問題時提供給店家；主櫃公務機也用這個取得 userId） */
function UidNote({uid}){
  const [ok,setOk]=useState(false);
  if(!uid)return null;
  return (<div className="mt-10 pt-4 border-t border-line text-xs text-mute leading-relaxed">
    本系統以您的 LINE 帳號產生本系統專用的識別碼（userId）作為會員身分管理依據。若開通過程中遇到問題，請點選下方按鈕複製您的識別碼，並提供給本店服務人員，我們將儘速協助您處理。此識別碼僅限本系統使用，無法用來加您的 LINE 好友，也不含姓名、電話等個人資料；公開本系統專用的識別碼（userId）並不會造成個資外露之風險。
    <button className="mt-2 w-full h-10 rounded-xl border border-line bg-card text-sm text-ink" onClick={()=>copyStr(uid,()=>{setOk(true);setTimeout(()=>setOk(false),2000)})}>{ok?'✓ 已複製識別碼':'複製我的 LINE 識別碼'}</button>
  </div>);
}
function JoinOnline({pre:pre0,prof0}){
  const [st,setSt0]=useState('loading');
  const stRef=useRef('loading');const setSt=v=>{stRef.current=v;setSt0(v)};   // loading / error / home / pick / guest / staff / status / setup / approved
  const [err,setErr]=useState('');
  const [prof,setProf]=useState(null);
  const [info,setInfo]=useState(null);
  const [f,setF]=useState({});
  const [busy,setBusy]=useState(false);
  const [fe,setFe]=useState('');
  const [inClient,setInClient]=useState(false);
  const set=(k,v)=>{setF(p=>Object.assign({},p,{[k]:v}));setFe('')};
  const idt=()=>{const t=window.liff&&window.liff.getIDToken&&window.liff.getIDToken();if(!t)throw new Error('取不到 LINE 身分，請確認 LIFF 已勾選 openid 權限，或關閉後重新開啟');return t};
  const goHome=()=>setTimeout(()=>{location.replace('https://liff.line.me/'+LIFF_ID)},1500);
  const route=j=>{
    setInfo(j);const a=j.app;
    if(j.member){hintSet(j.member);setSt('approved');goHome();return}
    if(!a){if(stRef.current==='loading'||stRef.current==='status'||stRef.current==='setup')setSt('home');return}
    if(a.status==='hired'){if(stRef.current!=='setup')setF({in:'',out:'',tc:'',support:a.want==='part'});setSt('setup');return}
    if(a.status==='approved'&&!j.member){setSt('home');return}
    setSt('status');
  };
  const load=async()=>route(await cloud.call({action:'joinInfo',idToken:idt()},30000));
  /* v0.1-053：先用 members.json（GitHub 上，很快）決定第一個畫面，再向 GAS 拿細節（面試時間、可選編號…）
     第一次來的人：馬上顯示「成為會員／成為工作夥伴」；GAS 回來時，如果他已經開始填表就不打斷 */
  const quick=m=>{
    if(!m)return false;
    if(!isApplicant(m)){hintSet(m);setInfo({member:m});setSt('approved');goHome();return true}
    const a={uid:m.uid,role:m.apply||'teacher',status:m.stage,iv:m.iv||'',_pre:true};   // 面試時間也在名單上（沒有個資）
    setInfo({app:a,_pre:true});
    if(a.status==='hired'){setF({in:'',out:'',tc:'',support:false});setSt('setup')}else setSt('status');
    return true;
  };
  useEffect(()=>{(async()=>{
    try{
      const L=await liffReady();
      if(new URLSearchParams(location.search).has('liff.state'))return;
      if(!L.isLoggedIn()){L.login({redirectUri:location.href});return}
      const p=prof0||await L.getProfile();
      // v0.1-093：公務機不管從哪個連結打開（例如加入會員的連結），一律轉到主櫃首頁
      if(KIOSK_UIDS.includes(p.userId)){location.replace(location.pathname+'?mainc=1');return}
      setProf(p);setInClient(L.isInClient());
      let m=pre0;
      if(m===undefined){try{m=(await fetchMembers(true)).find(x=>x&&x.uid===p.userId)||null}catch(_e){m=null}}
      if(quick(m)&&!isApplicant(m))return;
      // v0.1-120：從圖文選單點「加入會員」「加入工作夥伴」直接進對應的表單（go=member／staff）
      const go=new URLSearchParams(location.search).get('go')||(/go=(member|staff)/.exec(decodeURIComponent(__ls))||[])[1]||'';
      if(!m){if(go==='member')startGuest();else if(go==='staff')setSt('pick');else setSt('home')}
      try{await load()}
      catch(e){if(stRef.current==='loading'){setErr(String(e&&e.message||e));setSt('error')}else setFe('暫時連不上雲端，部分資料還沒載入：'+e.message)}
    }catch(e){setErr(String(e&&e.message||e));setSt('error')}
  })()},[]);
  const recheck=async()=>{setBusy(true);setFe('');try{await load()}catch(e){setFe(e.message)}setBusy(false)};
  const startGuest=()=>{setF({role:'guest',phone:'',last:'',gender:'',birth:'',consent:false});setFe('');setSt('guest')};
  const startStaff=role=>{const a=info&&info.app;
    setF(Object.assign({role,phone:'',last:'',first:'',nick:'',gender:'',birth:'',city:'',addr:'',emgName:'',emgRel:'',emgRelOther:'',emgPhone:'',years:'',skills:[],certs:'',expArea:'',expShop:'',expWhy:'',expNote:'',want:'full',slots:[],start:'',contact:[],ivPref:[],source:'',referrer:'',consent:false},
      a&&a.role!=='guest'?Object.assign({},a,{role,consent:false},a.emgRel&&!EMG_REL.includes(a.emgRel)?{emgRel:'其他',emgRelOther:a.emgRel}:{}):{}));setFe('');setSt('staff')};
  const send=async()=>{
    const ph=String(f.phone||'').replace(/[\s-]/g,'');
    if(!/^09\d{8}$/.test(ph))return setFe('請輸入正確的手機號碼（09 開頭 10 碼）');
    if(f.role==='guest'){
      if(!String(f.last||'').trim())return setFe('請輸入姓');
      if(!f.gender)return setFe('請選擇先生或小姐');
      if(!f.birth)return setFe('請選擇生日');
      if(ageOf(f.birth)<ADULT)return setFe('未滿 '+ADULT+' 歲無法加入會員，請由成年人代為預約並陪同到店');
    }
    else{
      const need=[['last','姓'],['first','名'],['gender','性別'],['birth','出生年月日'],['city','縣市'],['addr','地址'],['emgName','緊急聯絡人'],['emgRel','緊急聯絡人關係'],['emgPhone','緊急聯絡電話'],['years','年資']];
      const miss=need.filter(([k])=>!String(f[k]||'').trim()).map(x=>x[1]);
      if(f.emgRel==='其他'&&!String(f.emgRelOther||'').trim())miss.push('緊急聯絡人關係（其他）');
      if(miss.length)return setFe('請填寫：'+miss.join('、'));
    }
    if(!f.consent)return setFe('請先閱讀並勾選個人資料告知事項');
    setBusy(true);
    try{const form=Object.assign({},f,{phone:ph});delete form.consent;delete form.role;
      if(f.role!=='guest')form.emgRel=f.emgRel==='其他'?String(f.emgRelOther||'').trim():f.emgRel;delete form.emgRelOther;
      route(await cloud.call({action:'apply',idToken:idt(),lineName:prof.displayName,role:f.role,consent:true,form},40000));
      window.scrollTo(0,0);
    }catch(e){setFe(e.message)}
    setBusy(false);
  };
  const setup=async()=>{
    const L=tLabel(info.app.role);
    if(!f.in||!f.out)return setFe('請選擇'+L[0]+'、'+L[1]+'時間');
    if(info.app.role==='teacher'&&!f.tc)return setFe('請選擇編號');
    setBusy(true);
    try{route(await cloud.call(Object.assign({action:'setup',idToken:idt(),in:f.in,out:f.out,tc:f.tc,support:f.support},Array.isArray(f.svcSk)&&f.svcSk.length?{svcSk:f.svcSk}:{}),40000))}
    catch(e){setFe(e.message);try{const j=await cloud.call({action:'joinInfo',idToken:idt()});setInfo(j)}catch(_e){}}
    setBusy(false);
  };
  const close=()=>{try{window.liff.closeWindow()}catch(_e){}};
  const app=info&&info.app;
  const Big=({t,d,onClick})=><button className="w-full text-left rounded-2xl border border-line bg-card px-5 py-5 mb-3 active:bg-sageL flex items-center gap-3" onClick={onClick}><span className="flex-1"><span className="block text-xl">{t}</span><span className="block text-xs text-mute mt-1">{d}</span></span><span className="text-mute text-xl">›</span></button>;
  const Err=()=>fe?<div className="mb-3 px-3 py-2 rounded-xl bg-warnL text-warn text-sm">{fe}</div>:null;
  const Back=({to})=><button className="w-full h-11 mt-2 rounded-xl border border-line bg-card" onClick={()=>{setFe('');setSt(to)}}>返回</button>;
  const age=ageOf(f.birth);
  return (
    <GateShell>
      {st==='loading'&&<div className="text-center text-mute"><Ld t="載入中…"/></div>}
      {st==='error'&&<Card className="p-4 text-center"><div className="text-warn text-sm whitespace-pre-line mb-3">{err}</div><button className="h-11 px-6 rounded-xl bg-sage text-white" onClick={()=>location.reload()}>重試</button></Card>}
      {st==='approved'&&info&&<Card className="p-5 text-center bg-sageL">
        <div className="text-lg text-sageD font-semibold">✓ 帳號已開通（{memberInfo(info.member).label}）</div>
        <div className="text-sm mt-1">正在進入系統…</div></Card>}

      {st==='home'&&<>
        <div className="text-center text-lg mb-1">歡迎{prof&&'，'+prof.displayName}</div>
        <div className="text-center text-sm text-mute mb-5">請選擇</div>
        <Big t="成為會員" d="預約、查看消費紀錄與優惠（填寫後立即開通）" onClick={startGuest}/>
        <Big t="成為工作夥伴" d="應徵老師或櫃台人員（填寫個人簡歷，店家會以手機聯繫面試）" onClick={()=>setSt('pick')}/>
      </>}
      {st==='pick'&&<>
        <div className="text-center text-lg mb-5">應徵職務</div>
        <Big t="老師" d="按摩服務" onClick={()=>startStaff('teacher')}/>
        <Big t="櫃台" d="接待、預約、結帳" onClick={()=>startStaff('counter')}/>
        <Back to={app?'status':'home'}/>
      </>}

      {st==='guest'&&<>
        <div className="text-center text-lg mb-4">成為會員</div>
        <div className="grid grid-cols-[2fr_3fr] gap-2">
          <FL label="姓"><input className={fin} maxLength={4} placeholder="例：王" value={f.last} onChange={e=>set('last',e.target.value.trim())}/></FL>
          <div className="mb-4"><div className="text-xs text-mute mb-1">稱呼</div><div className="grid grid-cols-2 gap-2">{[['M','先生'],['F','小姐']].map(([v,l])=><button key={v} type="button" className={'h-12 rounded-xl border '+(f.gender===v?'bg-sage border-sage text-white':'bg-card border-line')} onClick={()=>set('gender',v)}>{l}</button>)}</div></div>
        </div>
        {f.last&&f.gender&&<div className="-mt-2 mb-3 text-sm text-sageD">我們會稱呼你「{honor(f.last,f.gender)}」</div>}
        <FL label="手機"><input className={fin+' num'} inputMode="tel" placeholder="0912-345-678" value={f.phone} onChange={e=>set('phone',e.target.value)}/></FL>
        <FL label="生日" hint={'本店服務對象為年滿 '+ADULT+' 歲的成年人，填寫生日用於確認年齡。未成年人如需服務，請由年滿 '+ADULT+' 歲的成年人代為預約並陪同到店。'}><input type="date" className={fin+' num'} value={f.birth} onChange={e=>set('birth',e.target.value)}/></FL>
        {f.birth&&ageOf(f.birth)!=null&&ageOf(f.birth)<ADULT&&<div className="-mt-2 mb-3 px-3 py-2 rounded-xl bg-warnL text-warn text-sm">未滿 {ADULT} 歲無法加入會員，請由成年人代為預約並陪同到店。</div>}
        <Consent kind="guest" on={f.consent} set={v=>set('consent',v)}/>
        <Err/>
        <button className="w-full h-12 rounded-xl bg-sage text-white text-lg disabled:opacity-50" disabled={busy} onClick={send}>{busy?'送出中…':'送出，立即開通'}</button>
        <Back to="home"/>
      </>}

      {st==='staff'&&<>
        <div className="text-center text-lg mb-1">應徵{joinRoleLabel(f.role)}・個人簡歷</div>
        <div className="text-center text-xs text-mute mb-4">送出後店家會以手機與你聯繫面試</div>
        <div className="text-sm font-semibold text-sageD mb-2">基本資料</div>
        <FL label="手機（通知面試用）"><input className={fin+' num'} inputMode="tel" placeholder="0912345678" value={f.phone} onChange={e=>set('phone',e.target.value)}/></FL>
        <div className="grid grid-cols-[2fr_3fr] gap-2">
          <FL label="姓"><input className={fin} maxLength={10} value={f.last} onChange={e=>set('last',e.target.value)}/></FL>
          <FL label="名"><input className={fin} maxLength={10} value={f.first} onChange={e=>set('first',e.target.value)}/></FL>
        </div>
        <FL label="慣用稱呼" opt hint="在店裡希望被怎麼稱呼（例：小花）"><input className={fin} maxLength={20} value={f.nick} onChange={e=>set('nick',e.target.value)}/></FL>
        <div className="mb-4"><div className="text-xs text-mute mb-1">性別</div><Chips opts={[['F','女'],['M','男']]} val={f.gender} onChange={v=>set('gender',v)}/></div>
        <FL label="出生年月日" hint={age!=null&&age<18?'未滿 18 歲：面試時請攜帶法定代理人同意書':''}><input type="date" className={fin+' num'} value={f.birth} onChange={e=>set('birth',e.target.value)}/></FL>
        <div className="mb-4"><div className="text-xs text-mute mb-1">通訊地址</div>
          <select className={fin+' mb-2'} value={f.city} onChange={e=>set('city',e.target.value)}><option value="">選擇縣市</option>{CITIES.map(c=><option key={c}>{c}</option>)}</select>
          <input className={fin} placeholder="區、路、號、樓" value={f.addr} onChange={e=>set('addr',e.target.value)}/></div>
        <div className="grid grid-cols-2 gap-2">
          <FL label="緊急聯絡人"><input className={fin} maxLength={20} placeholder="姓名" value={f.emgName} onChange={e=>set('emgName',e.target.value)}/></FL>
          <FL label="關係"><select className={fin} value={f.emgRel||''} onChange={e=>set('emgRel',e.target.value)}><option value="">請選擇</option>{EMG_REL.map(x=><option key={x}>{x}</option>)}</select></FL>
        </div>
        {f.emgRel==='其他'&&<FL label="關係（其他）"><input className={fin} maxLength={10} placeholder="例：阿姨、室友" value={f.emgRelOther||''} onChange={e=>set('emgRelOther',e.target.value)}/></FL>}
        <FL label="緊急聯絡電話"><input className={fin+' num'} inputMode="tel" value={f.emgPhone} onChange={e=>set('emgPhone',e.target.value)}/></FL>
        <div className="text-sm font-semibold text-sageD mb-2 mt-2">工作經歷</div>
        <div className="mb-4"><div className="text-xs text-mute mb-1">相關年資</div><Chips opts={YEARS} val={f.years} onChange={v=>set('years',v)}/></div>
        {f.role==='teacher'&&<div className="mb-4"><div className="text-xs text-mute mb-1">擅長項目（可複選，選填）</div><Chips multi opts={SKILLS} val={f.skills} onChange={v=>set('skills',v)}/></div>}
        <FL label="證照" opt><input className={fin} maxLength={100} placeholder="例：按摩技術士、美容丙級" value={f.certs} onChange={e=>set('certs',e.target.value)}/></FL>
        <div className="text-xs text-mute mb-1">經歷</div>
        <FL label="前一份同業的工作地點" opt><input className={fin} maxLength={30} placeholder="例：臺北市大安區" value={f.expArea||''} onChange={e=>set('expArea',e.target.value)}/></FL>
        <FL label="前一份同業的工作店家" opt><input className={fin} maxLength={30} placeholder="店名" value={f.expShop||''} onChange={e=>set('expShop',e.target.value)}/></FL>
        <FL label="前一份同業的離職原因" opt><input className={fin} maxLength={100} value={f.expWhy||''} onChange={e=>set('expWhy',e.target.value)}/></FL>
        <FL label="其他（自填）" opt><textarea className="w-full min-w-0 px-3 py-2 rounded-xl border border-line bg-card" rows={3} maxLength={500} placeholder="其他經歷、年份、工作內容" value={f.expNote} onChange={e=>set('expNote',e.target.value)}/></FL>
        <div className="text-sm font-semibold text-sageD mb-2 mt-2">希望工作條件</div>
        <div className="mb-4"><div className="text-xs text-mute mb-1">希望工作型態</div><Chips opts={[['full','正職'],['part','兼職（支援）']]} val={f.want} onChange={v=>set('want',v)}/></div>
        <div className="mb-4"><div className="text-xs text-mute mb-1">可上班時段（可複選，選填）</div><Chips multi opts={SLOTS} val={f.slots} onChange={v=>set('slots',v)}/></div>
        <FL label="最快可上班日期" opt><input type="date" className={fin+' num'} value={f.start} onChange={e=>set('start',e.target.value)}/></FL>
        <div className="mb-4"><div className="text-xs text-mute mb-1">方便聯絡時間（可複選，選填）</div><Chips multi opts={TIMES} val={f.contact} onChange={v=>set('contact',pickTimes(f.contact,v))}/></div>
        <div className="mb-4"><div className="text-xs text-mute mb-1">方便面試時間（可複選，選填）</div><Chips multi opts={TIMES} val={f.ivPref} onChange={v=>set('ivPref',pickTimes(f.ivPref,v))}/></div>
        <div className="mb-4"><div className="text-xs text-mute mb-1">如何得知職缺（選填）</div><Chips opts={SOURCES} val={f.source} onChange={v=>set('source',v)}/></div>
        {f.source==='店內人員推薦'&&<FL label="推薦人（姓名或老師編號）"><input className={fin} maxLength={20} value={f.referrer} onChange={e=>set('referrer',e.target.value)}/></FL>}
        <Consent kind="staff" on={f.consent} set={v=>set('consent',v)}/>
        <Err/>
        <button className="w-full h-12 rounded-xl bg-sage text-white text-lg disabled:opacity-50" disabled={busy} onClick={send}>{busy?'送出中…':'送出簡歷'}</button>
        <Back to="pick"/>
      </>}

      {st==='status'&&app&&<>
        {app.status==='applied'&&<div className="mb-3 px-4 py-3 rounded-xl bg-brownL text-brown"><div className="font-semibold">簡歷已送出</div><div className="text-sm mt-1">店家會以{app.phone?<>手機 <span className="num">{fmtPhone(app.phone)}</span> </>:'你留的手機'}與你聯繫面試，請留意來電。</div></div>}
        {app.status==='interview'&&<div className="mb-3 px-4 py-3 rounded-xl bg-sageL text-sageD"><div className="font-semibold">已安排面試</div>{app.iv?<div className="text-sm mt-1">面試時間：<b className="num">{ivText(app.iv)}</b></div>:app._pre?<div className="text-sm mt-1 text-mute"><Ld t="讀取面試時間…"/></div>:app.note&&<div className="text-sm mt-1">{app.note}</div>}{info&&info.shop&&<div className="text-sm mt-1">地點：{info.shop}</div>}<div className="text-sm mt-1">如需改期，請直接回覆 LINE 官方帳號或聯繫店家。</div></div>}
        {app.status==='rejected'&&<div className="mb-3 px-4 py-3 rounded-xl bg-bg border border-line text-mute"><div className="font-semibold text-ink">感謝你的應徵</div><div className="text-sm mt-1">這次未能錄取，期待日後有機會合作。</div></div>}

          <div className="flex justify-between py-1 border-b border-line"><span className="text-mute">姓名</span><span>{(app.last||'')+(app.first||'')}{app.nick?'（'+app.nick+'）':''}</span></div>

        {app.status==='rejected'&&<button className="w-full h-11 rounded-xl border border-line bg-card" onClick={()=>setSt('home')}>重新申請</button>}
        {inClient&&<button className="w-full h-11 mt-2 rounded-xl border border-line bg-card" onClick={close}>回到聊天室</button>}
      </>}

      {st==='setup'&&app&&<>
        <div className="mb-4 px-4 py-3 rounded-xl bg-sageL text-sageD"><div className="font-semibold text-lg">🎉 恭喜錄取！</div><div className="text-sm mt-1">最後一步：設定{app.role==='teacher'?'工作型態、上下牌時間與你的編號':'上下班時間'}，送出後帳號立即開通。</div></div>
        {app.role==='teacher'&&<div className="mb-4"><div className="text-xs text-mute mb-1">工作型態</div>
          <div className="grid grid-cols-2 gap-2">{[[false,'正職'],[true,'兼職（支援）']].map(([v,l])=><button key={l} type="button" className={'h-12 rounded-xl border '+(f.support===v?'bg-sage border-sage text-white':'bg-card border-line')} onClick={()=>set('support',v)}>{l}</button>)}</div>
          {f.support&&<div className="text-xs text-mute mt-1">兼職（支援）老師每天下班時向櫃台領現金。</div>}</div>}
        {app.role==='teacher'&&<div className="mb-4"><div className="text-xs text-mute mb-1">技能（會做的項目）</div><SkillPick value={f.svcSk||''} gender={app.gender} onChange={v=>set('svcSk',v)}/></div>}
        {app.role==='teacher'?<div className="mb-4"><div className="text-xs text-mute mb-1">上牌時間（整點）</div>
          <div className="grid grid-cols-5 gap-1.5">{T_IN_OPTS.map(t=><button key={t} type="button" className={'h-11 rounded-xl border num '+(f.in===t?'bg-sage border-sage text-white':'bg-card border-line')} onClick={()=>{set('in',t);set('out',plusH(t,T_SHIFT_H))}}>{t}</button>)}</div>
          <div className="mt-2 text-sm">下牌時間：<b className="num">{f.out||'—'}</b><span className="text-xs text-mute ml-1">（上牌＋{T_SHIFT_H} 小時，之後可在「我的資料」修改）</span></div>
        </div>:<div className="mb-4"><div className="text-xs text-mute mb-1">{tLabel(app.role)[0]}／{tLabel(app.role)[1]}時間</div>
          <div className="flex items-center gap-2">
            <input type="time" step="1800" aria-label={tLabel(app.role)[0]+'時間'} className={fin+' w-0 flex-1 num'} value={f.in} onChange={e=>set('in',e.target.value)}/>
            <span className="text-mute">～</span>
            <input type="time" step="1800" aria-label={tLabel(app.role)[1]+'時間'} className={fin+' w-0 flex-1 num'} value={f.out} onChange={e=>set('out',e.target.value)}/>
          </div></div>}
        {app.role==='teacher'&&<>
          <div className="text-xs text-mute mb-1">選擇編號{f.tc&&<b className="ml-2 text-sageD num text-sm">{f.tc} 號</b>}</div>
          <div className="mb-4">{info._pre?<div className="h-24 rounded-xl border border-line bg-card flex items-center justify-center text-sm text-mute"><Ld t="讀取可選的編號…"/></div>:<NumberPicker min={info.min} max={info.max} taken={info.taken||{}} value={f.tc} onPick={v=>set('tc',v)}/>}</div>
        </>}
        <Err/>
        <button className="w-full h-12 rounded-xl bg-sage text-white text-lg disabled:opacity-50" disabled={busy||info._pre} onClick={setup}>{busy?'開通中…':'送出，開通帳號'}</button>
      </>}
      {prof&&<UidNote uid={prof.userId}/>}
    </GateShell>
  );
}

/* 設定 → 測試分身：列出目前的分身、一鍵清除（名單、履歷、請假、打卡、個人資料；訂單要老闆自己刪） */
function AltAdmin({S,saveS,toast,ask}){
  const st=useCloud();const [list,setList]=useState(null);const [mgr,setMgr]=useState([]);const [busy,setBusy]=useState(false);const [msg,setMsg]=useState('');
  const [all,setAll]=useState([]);
  const load=()=>fetchMembers(true).then(l=>{setAll(l);__memAll=l;setList(l.filter(x=>x&&isAltOf(x.uid,l)));setMgr(l.filter(x=>x&&memberInfo(x).admin==='manager'))}).catch(e=>setMsg('✗ '+e.message));
  const perm=async(m,on)=>{setBusy(true);setMsg('');try{await cloud.call({action:'altperm',uid:m.uid,on});setMgr(a=>a.map(x=>x.uid===m.uid?Object.assign({},x,{altOk:on?undefined:false}):x));toast((on?'已開放 ':'已關閉 ')+(m.name||'主管')+' 使用分身')}catch(e){setMsg('✗ '+e.message)}setBusy(false)};
  useEffect(()=>{load()},[]);
  const clear=async()=>{
    if(!await ask({title:'清除全部測試分身？',msg:'會把分身從開通名單移除，並刪掉它們的履歷、請假、打卡、補打卡、個人資料。\n分身登打過的訂單是日報表的一部分，請自己到每日訂單刪除。',okText:'清除',danger:true}))return;
    setBusy(true);setMsg('');
    try{const j=await cloud.call({action:'altclear'},60000);
      const tcs=(j.members||[]).map(m=>String(m.tc||'')).filter(Boolean);
      if(tcs.length){const n=clone(S);n.teachers=n.teachers.filter(t=>!tcs.includes(String(t)));n.support=(n.support||[]).filter(t=>!tcs.includes(String(t)));saveS(mergeSettings(n))}
      __testTc=null;__memAll=null;__memP=null;try{window.dispatchEvent(new Event('slowve-people'))}catch(_e){}toast('已清除 '+(j.members||[]).length+' 個分身');setMsg('✓ 已清除名單 '+(j.members||[]).length+' 筆、資料 '+(j.rows||0)+' 筆'+(tcs.length?'；設定的老師名單也拿掉 '+tcs.join('、')+' 號':''));
      setTimeout(load,1500);
    }catch(e){setMsg('✗ '+e.message)}setBusy(false)};
  return (<div className="text-sm">
    <div className="text-xs text-mute mb-2">老闆在 LINE 的歡迎畫面點「分身 1～9」，就能用虛擬帳號測試新老師、新櫃台的流程。分身在主櫃、月報、薪資、應徵與人員資料上都標「測試」。</div>
    {mgr.length>0&&<div className="mb-3"><div className="text-xs text-mute mb-1">開放主管使用分身（只有老闆能改）</div>
      {mgr.map(m=>{const ok=m.altOk!==false;return <button key={m.uid} type="button" disabled={busy||!st.on} className={'w-full mb-1.5 rounded-xl border px-3 py-2 text-left disabled:opacity-60 '+(ok?'bg-sageL border-sage':'bg-card border-line')} onClick={()=>perm(m,!ok)}>
        {ok?'☑':'☐'} {m.tc?m.tc+' ':''}{m.name||'主管'}<span className="ml-2 text-xs text-mute">{ok?'可以使用分身 1～9':'不能使用分身'}</span></button>})}</div>}
    {list===null?<div className="text-xs text-mute"><Ld/></div>:list.length===0?<div className="text-xs text-mute">目前沒有分身在開通名單上。</div>:
      list.map(m=><div key={m.uid} className="flex items-center gap-2 py-1 border-b border-line last:border-0"><span className="text-warn text-xs w-20 num">{altLabel(m.uid,all)||'分身 '+m.uid.slice(-1)}</span><span className="flex-1">{m.stage?'應徵中':(m.tc?m.tc+' ':'')+(m.name||'')}</span><span className="text-xs text-mute">{m.stage?'':memberInfo(m).label}</span></div>)}
    {!st.on?<div className="text-xs text-mute mt-2">登入雲端同步（老闆）後才能清除。</div>:
      <button className="w-full h-10 mt-3 rounded-xl border border-warn text-warn disabled:opacity-40" disabled={busy} onClick={clear}>{busy?'清除中…':'清除分身資料'}</button>}
    {msg&&<div className={'text-xs mt-2 '+(msg[0]==='✗'?'text-warn':'text-sageD')}>{ldTxt(msg)}</div>}
  </div>);
}
/* 老闆頁：應徵與會員（約面試、錄取、不錄取；錄取後由申請人自己選編號開通） */
function JoinReview({S,saveS,toast,ask}){
  const st=useCloud();
  const [list,setList]=useState(null);
  const [meta,setMeta]=useState({});
  const [msg,setMsg]=useState('');
  const [tab,setTab]=useState('todo');
  const [openId,setOpenId]=useState(null);
  const [busy,setBusy]=useState('');
  const AB={action:'applist'};
  const load=async m=>{setMsg(pcAt(AB)?'':'讀取中…');try{const use=j=>{setList(j.list||[]);setMeta(j);setMsg('');
    const s=syncGet();s.joinN=(j.list||[]).filter(a=>a.status==='applied').length;syncSet(s);cloud.emit();
    // 已開通的支援老師：自動標記為「支援」
    const sup=(j.list||[]).filter(a=>a.status==='approved'&&a.role==='teacher'&&a.tc);
    if(sup.length){const n=clone(S);let ch=false;sup.forEach(a=>{const t=String(a.tc);if(!n.teachers.map(String).includes(t)){n.teachers=[t,...n.teachers];ch=true}if(a.support&&!n.support.includes(t)){n.support=n.support.concat([t]);ch=true}});if(ch)saveS(mergeSettings(n))}
  };use(await preCall(AB,0,use,m))}catch(e){setMsg('✗ '+e.message)}};
  useEffect(()=>{if(st.on)load()},[st.on]);
  if(!st.on)return <div className="text-sm text-mute">請先在下方「雲端同步」用 LINE 登入（老闆／主管），才能查看應徵與會員資料。</div>;
  const stage=async(a,to,note)=>{
    setBusy(a.uid);try{const r=await cloud.call({action:'stage',uid:a.uid,to,note});await load();toast((JOIN_ST[to]?'已改為「'+JOIN_ST[to]+'」':'已更新')+msgTxt(r.msg))}catch(e){setMsg('✗ '+e.message)}setBusy('');
  };
  // v0.1-063：約面試改用日期＋時間選擇器（不再跳文字框）；面試時間連同進度寫進開通名單（沒有個資）
  const [ivFor,setIvFor]=useState(null);const [ivD,setIvD]=useState('');const [ivT,setIvT]=useState('');
  const interview=a=>{const m=/^(\S+) (\S+)$/.exec(a.iv||'');setIvD(m?m[1]:ymd(new Date(Date.now()+864e5)));setIvT(m?m[2]:'14:00');setIvFor(a.uid)};
  const ivSend=async a=>{if(!ivD||!ivT){setMsg('✗ 請選擇面試日期和時間');return}setIvFor(null);setBusy(a.uid);try{const r=await cloud.call({action:'stage',uid:a.uid,to:'interview',iv:ivD+' '+ivT});await load();toast('已約面試 '+ivText(ivD+' '+ivT)+msgTxt(r.msg))}catch(e){setMsg('✗ '+e.message)}setBusy('')};
  const hire=async a=>{if(await ask({title:'錄取 '+((a.last||'')+(a.first||''))+'？',msg:'錄取後，申請人打開申請頁就會看到「恭喜錄取」，自己選'+(a.role==='teacher'?'編號、上下牌時間、正職／兼職':'上下班時間')+'，送出後帳號立即開通。\n請記得用手機通知對方。',okText:'錄取'}))stage(a,'hired')};
  // v0.1-103：已錄取、還沒開通的人，再發一次 LINE 錄取通知（附「進入門店系統」按鈕），提醒上線選編號、時間完成開通
  const renotify=async a=>{if(!await ask({title:'發通知給 '+((a.last||'')+(a.first||''))+'？',msg:'用 LINE 再發一次錄取通知，請對方上線完成應徵流程（選'+(a.role==='teacher'?'編號、上下牌時間':'上下班時間')+'）。會用掉 1 則 LINE 訊息額度。',okText:'發送'}))return;
    setBusy(a.uid);try{const r=await cloud.call({action:'renotify',uid:a.uid},30000);toast(r.msg&&r.msg.sent?'已發送通知'+msgTxt(r.msg):'沒有發送'+msgTxt(r.msg))}catch(e){setMsg('✗ '+e.message)}setBusy('')};
  const reject=async a=>{if(await ask({title:'不錄取？',msg:'申請人頁面會顯示「這次未能錄取」。資料會在 6 個月後自動清除。',okText:'不錄取',danger:true}))stage(a,'rejected')};
  const all=list||[];
  const groups={todo:all.filter(a=>a.status==='applied'||a.status==='interview'),hired:all.filter(a=>a.status==='hired'),done:all.filter(a=>a.status==='approved'||a.status==='rejected')};
  const shown=groups[tab];
  const K=({k,v})=>v?<div className="flex gap-2 py-0.5"><span className="w-20 shrink-0 text-mute">{k}</span><span className="flex-1 min-w-0 break-words">{v}</span></div>:null;
  return (
    <div className="text-sm">
      <div className="flex items-center gap-2 mb-2">
        <div className="flex-1 flex rounded-lg border border-line overflow-hidden text-xs">
          {[['todo','待處理'],['hired','已錄取'],['done','已完成']].map(([k,l])=><button key={k} className={'flex-1 h-9 '+(tab===k?'bg-sage text-white':'bg-card')} onClick={()=>setTab(k)}>{l}{list?' '+groups[k].length:''}</button>)}
        </div>
        <button className="h-9 px-3 rounded-lg border border-line text-xs" onClick={()=>load('check')}>重新整理</button>
      </div>
      <PcNote b={AB} onForce={()=>load('force')}/>
      {meta.github===false&&<div className="mb-2 px-3 py-2 rounded-lg bg-warnL text-warn text-xs">GAS 尚未設定 GITHUB_TOKEN，會員與錄取人員無法開通。</div>}
      <MsgQuota m={meta.msgInfo}/>
      {msg&&<div className={'text-xs mb-2 '+(msg[0]==='✗'?'text-warn':'text-mute')}>{ldTxt(msg)}</div>}
      {list&&!shown.length&&<div className="text-xs text-mute py-2">{tab==='todo'?'目前沒有待處理的應徵。':tab==='hired'?'沒有等待開通的人。':'最近 60 天沒有紀錄。'}</div>}
      {shown.map(a=>{const nm=a.role==='guest'?a.nick:(a.last||'')+(a.first||'');const op=openId===a.uid;const age=ageOf(a.birth);return (
        <div key={a.uid} className={'rounded-xl border p-3 mb-2 '+(a.status==='applied'?'border-brown/50 bg-brownL/30':'border-line bg-card')}>

              <b className="text-base">{nm}</b>{a.test&&<TestTag uid={a.uid}/>}{a.nick&&a.role!=='guest'&&<span className="text-xs text-mute">（{a.nick}）</span>}
              <span className="px-1.5 rounded bg-sage text-white text-xs">{joinRoleLabel(a.role)}</span>
              <span className={'ml-auto text-xs '+(a.status==='applied'?'text-brown font-semibold':a.status==='rejected'?'text-mute':'text-sageD')}>{JOIN_ST[a.status]}</span>
            </div>
            <div className="text-xs text-mute num mt-0.5">{a.gender==='F'?'女':a.gender==='M'?'男':''}{age!=null?'・'+age+' 歲':''}{a.years?'・'+a.years:''}{a.want?'・希望'+(a.want==='part'?'兼職':'正職'):''}・{clockText(a.at)} 送出{a.tc?'・'+a.tc+' 號':''} <span className="text-sageD">{op?'收起 ▲':'詳細 ▼'}</span></div>
            {(a.iv||a.note)&&<div className="text-xs text-sageD mt-0.5">面試：{a.iv?ivText(a.iv):a.note}</div>}
          </button>
          {a.phone&&<a href={'tel:'+a.phone} className="inline-flex items-center gap-1 mt-2 h-9 px-3 rounded-lg border border-sage text-sageD num">📞 {fmtPhone(a.phone)}</a>}
          {op&&<div className="mt-2 pt-2 border-t border-line text-xs">
            <K k="出生日期" v={a.birth?a.birth+(age!=null?'（'+age+' 歲'+(age<18?'，未成年':'')+'）':''):''}/>
            <K k="地址" v={(a.city||'')+(a.addr||'')}/>
            <K k="緊急聯絡" v={a.emgName?a.emgName+(a.emgRel?'（'+a.emgRel+'）':'')+' '+(a.emgPhone||''):''}/>
            <K k="擅長" v={(a.skills||[]).join('、')}/>
            <K k="證照" v={a.certs}/>
            <K k="前份工作" v={[a.expArea,a.expShop].filter(Boolean).join('・')}/>
            <K k="離職原因" v={a.expWhy}/>
            <K k={a.expArea||a.expShop||a.expWhy?'其他經歷':'經歷'} v={a.expNote}/>
            <K k="可上班" v={(a.slots||[]).join('、')}/>
            <K k="最快上班" v={a.start}/>
            <K k="方便聯絡" v={(a.contact||[]).join('、')}/>
            <K k="方便面試" v={(a.ivPref||[]).join('、')}/>
            <K k="得知管道" v={a.source?(a.source+(a.referrer?'：'+a.referrer:'')):''}/>
            <K k="LINE 名稱" v={a.lineName}/>
            {a.status==='approved'&&<K k="開通" v={(a.tc?a.tc+' 號・':'')+(a.in?a.in+'～'+a.out:'')+(a.support?'・兼職（支援）':'')}/>}
            {a.by&&<K k="處理人" v={a.by}/>}
          </div>}
          {ivFor===a.uid&&<div className="mt-3 rounded-xl border border-sage bg-sageL/30 p-3">
            <div className="text-xs text-mute mb-1">面試時間{(a.ivPref||[]).length?'（對方方便：'+a.ivPref.join('、')+'）':''}</div>
            <div className="flex gap-2"><input type="date" aria-label="面試日期" className="w-0 flex-[3] h-10 px-2 rounded-lg border border-line bg-card num" min={ymd(new Date())} value={ivD} onChange={e=>setIvD(e.target.value)}/><input type="time" step="900" aria-label="面試時間" className="w-0 flex-[2] h-10 px-2 rounded-lg border border-line bg-card num" value={ivT} onChange={e=>setIvT(e.target.value)}/></div>
            <div className="grid grid-cols-[1fr_2fr] gap-2 mt-2"><button className="h-9 rounded-lg border border-line bg-card" onClick={()=>setIvFor(null)}>取消</button><button className="h-9 rounded-lg bg-sage text-white" onClick={()=>ivSend(a)}>確定{ivD&&ivT?' '+ivText(ivD+' '+ivT):''}</button></div>

/* 老闆頁：人員資料（全部老師／櫃台；開啟審核時可核准／退回修改） */
// v0.1-141 老師技能（可預約的項目）選擇：沒設定時依性別預設（女：指壓、油壓、腳底；男：指壓、腳底）
function SkillPick({value,gender,onChange}){
  const set=Array.isArray(value)&&value.length,eff=skOf(set?value:null,gender);
  const tog=k=>{const n=eff.includes(k)?eff.filter(x=>x!==k):eff.concat([k]);if(n.length)onChange(SK_LIST.map(x=>x[0]).filter(x=>n.includes(x)))};
  return <div><div className="flex gap-2">{SK_LIST.map(([k,l])=><button key={k} type="button" className={'flex-1 h-10 rounded-lg border text-sm '+(eff.includes(k)?'bg-sage border-sage text-white':'bg-card border-line text-mute')} onClick={()=>tog(k)}>{eff.includes(k)?'✓ ':''}{l}</button>)}</div>
    <div className="text-[11px] text-mute mt-1">{set?<>已自訂・<button type="button" className="underline" onClick={()=>onChange('')}>恢復預設</button></>:'預設：指壓、腳底都會，油壓只有女老師'}（會員、主櫃只會把這些項目排給這位老師）</div></div>;
}
const skTxt=(sk,g)=>skOf(Array.isArray(sk)&&sk.length?sk:null,g).map(SVC_NAME).join('、');

// v0.1-137 老師的權限：主管（只有老闆能給）、卡班櫃台（櫃台身分，可登入主櫃、櫃台上下班）

  const mgr=P.admin==='manager',cnt=!!P.counter;

  const B=(k,on,l,d)=><button type="button" disabled={!!busy} className={'flex-1 rounded-lg border px-2 py-1.5 text-left leading-tight '+(on?'bg-sageL border-sage text-sageD':'bg-card border-line')} onClick={()=>set(k,!on,l)}>{busy===k?'處理中…':(on?'☑ ':'☐ ')+l}<span className="block text-[10px] text-mute">{d}</span></button>;

    <div className="flex gap-2">{B('mgr',mgr,'主管','老闆頁、主櫃、會員資料（只有老闆能設定）')}{B('counter',cnt,'卡班櫃台','可登入主櫃、櫃台上下班')}</div>

const LEAVE_ST={ok:'已登記',pending:'待審核',approved:'已核准',rejected:'已退回',cancelled:'已取消'};
const leaveTone=st=>st==='rejected'||st==='cancelled'?'text-mute line-through':st==='pending'?'text-brown':'text-sageD';

const leaveActive=L=>L.status!=='cancelled'&&L.status!=='rejected';
function leaveInMonth(L,ym){
  const a=ym+'-01',dim=new Date(Number(ym.slice(0,4)),Number(ym.slice(5)),0).getDate(),b=ym+'-'+pad(dim);
  const f=L.from>a?L.from:a,t=(L.to||L.from)<b?(L.to||L.from):b;
  if(f>t)return {days:0,hours:0,dates:[]};
  const dates=[];for(let d=parseYmd(f);ymd(d)<=t;d.setDate(d.getDate()+1))dates.push(ymd(d));
  if(L.all)return {days:dates.length,hours:0,dates};
  const m=x=>{const q=String(x||'0:0').split(':').map(Number);return q[0]*60+q[1]};
  return {days:0,hours:Math.max(0,(m(L.t2)-m(L.t1))/60),dates};
}
const leaveSum=(list,ym)=>{const r={personal:{days:0,hours:0},sick:{days:0,hours:0},off:{days:0,hours:0}};
  list.filter(leaveActive).forEach(L=>{const x=leaveInMonth(L,ym);if(r[L.kind]){r[L.kind].days+=x.days;r[L.kind].hours+=x.hours}});return r};
const dayHr=x=>x.days||x.hours?[x.days?x.days+' 天':'',x.hours?(+x.hours.toFixed(1))+' 小時':''].filter(Boolean).join(' '):'0';

/* v0.1-139 兼職（支援）老師：填可上班的日期和時間（D1：每天至少 8 小時，可跨午夜；沒填的日子當作不在）。存在 GAS（action avail） */

const MY_KEY='slowve.my.';   // 每月最後一次讀到的資料（v0.1-058 起改用下面的 boot 暫存）
/* v0.1-058：老師頁、櫃台頁打開時，先用這支手機上次的資料畫面，再「一次」向 GAS 確認（boot）：
   帶上每塊資料的異動時間，GAS 只回有變的部分。暫存：slowve.boot.{teacher|counter}＝{uid, sec:{'my:YYYY-MM'|'att:YYYY-MM'|leave|prof:{st,data,at}}} */
const BOOT_KEY='slowve.boot.';
const bootKk=(k,ym)=>(k==='my'||k==='att')?k+':'+ym:k;
function bootGet(page,uid){try{const x=JSON.parse(localStorage.getItem(BOOT_KEY+page+altSfx())||'null');return x&&x.uid===uid&&x.sec?x:{uid,sec:{}}}catch(_e){return {uid,sec:{}}}}
function bootSet(page,c){
  const ks=Object.keys(c.sec).filter(k=>k.indexOf(':')>0).sort();   // 每月的資料只留最近 4 個月
  const keep={};['my','att'].forEach(p=>ks.filter(k=>k.startsWith(p+':')).slice(-4).forEach(k=>{keep[k]=1}));
  ks.forEach(k=>{if(!keep[k])delete c.sec[k]});
  try{localStorage.setItem(BOOT_KEY+page+altSfx(),JSON.stringify(c))}catch(_e){}
}
const bootData=(page,uid,k,ym)=>{const x=bootGet(page,uid).sec[bootKk(k,ym)];return x?x.data:null};
function bootPut(page,uid,k,ym,data){if(!data||!data.st)return;const c=bootGet(page,uid);c.sec[bootKk(k,ym)]={st:data.st,data,at:Date.now()};bootSet(page,c)}
async function bootCall(page,uid,ym,want,force,extra){
  const c=bootGet(page,uid);const have={};
  if(!force)want.forEach(k=>{const x=c.sec[bootKk(k,ym)];if(x&&x.data)have[k]=x.st});
  const t=window.liff&&window.liff.getIDToken&&window.liff.getIDToken();
  if(!t)throw new Error('取不到 LINE 身分，請關閉後重新開啟');
  const j=await cloud.call(Object.assign({action:'boot',page,ym,want,have,idToken:t},extra||{}),40000);
  const c2=bootGet(page,uid);let changed=0;
  Object.keys(j.sec||{}).forEach(k=>{const x=j.sec[k],kk=bootKk(k,ym);if(x.same){if(c2.sec[kk])c2.sec[kk].at=Date.now()}else{c2.sec[kk]={st:x.st,data:x.data,at:Date.now()};changed++}});
  bootSet(page,c2);
  const out={};want.forEach(k=>{const x=c2.sec[bootKk(k,ym)];out[k]=x?x.data:null});
  return {d:out,j,changed};
}

/* 櫃台範例情境（範例時間 14:50）：
   5 位老師在班；3 個預約＋1 位現場候位 → 4 位老師已被「壓牌」（保留給某位客人）。

   空檔規則：被壓牌的老師，只要壓牌前的空檔 ≥ 服務時間（預設 60 分），仍可先接現場客。 */
const DEMO_NOW='14:50';
const DEMO_ORDERS=[

  {t:'09:15',sn:'0402',st:'paid',pay:'10:50',g:[{svc:'oil',min:60,tc:'122',ex:1}]},
];
// 預約／候位：hold＝壓到哪位老師的牌；at＝開始服務時間；min＝服務分鐘
const DEMO_BOOK=[
  {id:'b1',kind:'book',t:'15:00',at:'15:00',min:90,who:'陳先生',item:'油壓 90',hold:'77',how:'指定',st:'已確認'},
  {id:'b2',kind:'book',t:'15:30',at:'15:30',min:60,who:'林小姐',item:'腳底 60',hold:'36',how:'不指定・依輪班排入',st:'已確認'},
  {id:'b3',kind:'book',t:'19:00',at:'19:00',min:120,who:'王小姐',item:'指壓 120',hold:'122',how:'指定',st:'待確認'},
  {id:'w1',kind:'walk',t:'14:40',at:'15:25',min:60,who:'張先生',item:'指壓 60',hold:'58',how:'等最快下鐘',st:'約 15:25 可開始'},
];
// 班表（上牌～下牌）。25 號是晚班，18:00 才上牌
const DEMO_SHIFT={'122':['09:00','21:00'],'77':['10:00','20:00'],'36':['12:00','22:00'],'58':['13:00','23:00'],'12':['14:00','24:00'],'25':['18:00','02:00']};
// 範例的支援老師（正式版依設定的 support／之後 members.json 的 support 標記）
const DEMO_SUPPORT=['58','36'];
// 老師性別（牌卡號碼顏色：男藍、女紅）。正式版性別只在 Sheet，由 GAS 只回傳 m／f 給主櫃，不放 members.json
const DEMO_SEX={'122':'f','77':'f','58':'m','36':'f','12':'m','25':'f','9':'m'};
const DEMO_OFFDONE=[{tc:'9',t:'14:00'}];   // 今天已下牌的老師（範例）
const DEMO_REST=[{tc:'12',s:'14:30',e:'15:40'}];
// 老師狀態：avail 可接客（rot＝輪班順位，先下鐘先輪）／serving 服務中（end＝預計下鐘）／rest 休息中
const DEMO_TSTAT=[
  {tc:'122',st:'serving',sn:'0423',note:'指壓 120',start:'13:30',end:'15:30'},
  {tc:'77',st:'avail',rot:3,since:'14:30'},
  {tc:'58',st:'serving',sn:'0424',note:'腳底 60',start:'14:25',end:'15:25'},
  {tc:'36',st:'avail',rot:2,since:'14:05'},
  {tc:'12',st:'rest',rot:1,note:'15:40 回來'},   // 原本排第 3，前兩位去服務後輪到第 1；休息中保留順位，來客時略過
];
const TST={avail:{label:'可接客',tone:'sage'},serving:{label:'服務中',tone:'brown'},rest:{label:'休息中',tone:''}};
const T_SORTS=[{id:'tc',label:'按編號'},{id:'rot',label:'輪班優先'},{id:'serv',label:'服務中優先'}];
function sortTeachers(list,by){
  const a=list.slice();
  const num=t=>Number(t.tc)||0;
  const rank={rot:{avail:0,serving:1,rest:2},serv:{serving:0,avail:1,rest:2}}[by];
  if(!rank)return a.sort((x,y)=>num(x)-num(y));
  // 輪班優先：在輪班中的人（含休息中但保留順位的）依順位排在最前面
  const inQ=t=>t.rot!=null&&(t.st==='avail'||t.st==='rest');
  if(by==='rot')return a.sort((x,y)=>{
    if(inQ(x)&&inQ(y))return x.rot-y.rot;if(inQ(x))return -1;if(inQ(y))return 1;
    const r=rank[x.st]-rank[y.st];if(r)return r;
    if(x.st==='serving')return x.end<y.end?-1:x.end>y.end?1:0;
    return num(x)-num(y);
  });
  return a.sort((x,y)=>{
    const r=rank[x.st]-rank[y.st];if(r)return r;
    if(x.st==='avail')return x.rot-y.rot;            // 可接客：依輪班順位
    if(x.st==='serving')return x.end<y.end?-1:x.end>y.end?1:0;   // 服務中：先下鐘的在前
    return num(x)-num(y);
  });
}

/* ---- 時間軸模型：分鐘數（跨午夜 +1440，例 02:00＝1560） ---- */
const tm=s=>{const a=String(s).split(':').map(Number);let m=a[0]*60+(a[1]||0);if(a[0]<6)m+=1440;return m};
const tf=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
const SLOT_LEN=60;                 // 空檔至少要能做 60 分鐘
const BK={done:{label:'已服務',cls:'bg-sageL text-sageD'},serve:{label:'服務中',cls:'bg-brownL text-brown'},book:{label:'預約',cls:'bg-warnL text-warn'},walk:{label:'現場',cls:'bg-warnL text-warn'},rest:{label:'休息',cls:'bg-bg text-mute border border-line'}};
function demoBlocks(){
  const b=[];
  DEMO_ORDERS.forEach(o=>o.g.forEach(x=>{const s=tm(o.t);b.push({tc:x.tc,s,e:s+x.min+(Number(x.ex)||0)*30,kind:o.st!=='serving'?'done':'serve',who:'#'+o.sn,item:SVC_SHORT[x.svc]+' '+x.min})}));
  DEMO_BOOK.forEach(k=>{const s=tm(k.at);b.push({tc:k.hold,s,e:s+k.min,kind:k.kind,who:k.who,item:k.item,how:k.how})});
  DEMO_REST.forEach(r=>b.push({tc:r.tc,s:tm(r.s),e:tm(r.e),kind:'rest',who:'',item:'休息'}));
  return b.sort((x,y)=>x.s-y.s);
}
// 從 t0 起（在 [t0, until) 內，每 5 分鐘找一次）最早可連續空 len 分鐘的時間；找不到回 null
function freeAt(tc,blocks,t0,until,len){
  const sh=DEMO_SHIFT[tc];if(!sh)return null;
  const on=tm(sh[0]),off=tm(sh[1]);len=len||SLOT_LEN;
  for(let t=Math.ceil(Math.max(t0,on)/5)*5;t<until;t+=5){
    if(t+len>off)return null;
    if(!blocks.some(b=>b.tc===tc&&b.s<t+len&&b.e>t))return t;
  }
  return null;
}
// 從 t 起的空檔到什麼時候（下一個占用或下牌）
function gapEnd(tc,blocks,t){
  const off=tm(DEMO_SHIFT[tc][1]);
  const nx=blocks.filter(b=>b.tc===tc&&b.s>=t).sort((x,y)=>x.s-y.s)[0];
  return nx?{e:Math.min(nx.s,off),next:nx}:{e:off,next:null};
}

/* 時段牌況：橫排＝時段（預設現在這小時起 3 個小時，可前後切換）；直排＝這個時段在班的每一張牌。
   每格顯示這張牌在該小時內的占用（服務中／預約／現場／休息）；排序：整小時都不能排的在上、可排的在下。 */
function SlotBoard({n}){
  n=n||3;
  const blocks=useMemo(demoBlocks,[]);
  const NOW=tm(DEMO_NOW);const nowH=Math.floor(NOW/60)*60;
  const [h0,setH0]=useState(nowH);
  const MIN_H=9*60,MAX_H=25*60;   // 09:00～01:00 開始的時段
  const hours=Array.from({length:n},(_,i)=>h0+i*60);
  const col=H=>{
    const E=H+60;const t0=Math.max(H,NOW);
    const on=Object.keys(DEMO_SHIFT).filter(tc=>{const s=DEMO_SHIFT[tc];return tm(s[0])<E&&tm(s[1])>H});
    const cards=on.map(tc=>{
      const bs=blocks.filter(b=>b.tc===tc&&b.s<E&&b.e>H);
      const fs=E<=NOW?null:freeAt(tc,blocks,t0,E);
      const sh=DEMO_SHIFT[tc];
      return {tc,bs,fs,in:tm(sh[0])>H?tm(sh[0]):null,out:tm(sh[1])<E?tm(sh[1]):null};
    });
    cards.sort((a,b)=>(b.fs==null?1e9:b.fs)-(a.fs==null?1e9:a.fs)||Number(a.tc)-Number(b.tc));
    const avail=cards.filter(c=>c.fs!=null);
    const atStart=avail.filter(c=>c.fs===t0).length;
    const last=avail.length?Math.max.apply(null,avail.map(c=>c.fs)):null;
    return {H,E,past:E<=NOW,cards,atStart,all:avail.length,last,t0};
  };
  const cols=hours.map(col);
  const span=(b,H,E)=>b.s<=H&&b.e>=E?'整小時':b.s<=H?'～'+tf(b.e):b.e>=E?tf(b.s)+'～':tf(b.s)+'-'+tf(b.e);
  // 下一小時內即將開始的壓牌（說明為什麼這張牌現在不能排 60 分）
  const soon=(tc,E)=>blocks.find(b=>b.tc===tc&&(b.kind==='book'||b.kind==='walk')&&b.s>=E&&b.s<E+SLOT_LEN);
  return (
    <>
      <div className="flex items-center gap-2 mb-3">
        <button className="w-9 h-9 rounded-lg border border-line bg-card text-lg disabled:opacity-30" disabled={h0<=MIN_H} onClick={()=>setH0(h0-60)}>‹</button>
        <div className="flex-1 text-center text-sm"><span className="num">{tf(h0)}～{tf(h0+n*60)}</span>{h0!==nowH&&<button className="ml-2 text-xs text-sageD underline" onClick={()=>setH0(nowH)}>回到現在</button>}</div>
        <button className="w-9 h-9 rounded-lg border border-line bg-card text-lg disabled:opacity-30" disabled={h0>=MAX_H-(n-1)*60} onClick={()=>setH0(h0+60)}>›</button>
      </div>
      <div className="grid gap-2" style={{gridTemplateColumns:'repeat('+n+',minmax(0,1fr))'}}>
        {cols.map(c=>(
          <div key={c.H} className={c.past?'opacity-50':''}>
            <div className={'text-center text-sm num mb-1 '+(c.H===nowH?'text-brown font-semibold':'')}>{tf(c.H)}{c.H===nowH&&<span className="text-[10px] font-normal"> 現在</span>}</div>
            <div className="text-center text-[11px] text-mute mb-1.5">{c.cards.length} 張牌</div>
            <div className="space-y-1">
              {c.cards.map((k,i)=>{
                const full=k.fs!=null&&k.fs===c.t0,part=k.fs!=null&&!full;
                return (

/* 老師個人：今日預約情形（上牌到下牌，每小時一格） */
function MyDayStrip({tc,day}){
  const blocks=useMemo(demoBlocks,[]);
  const NOW=tm(DEMO_NOW);
  const sh=DEMO_SHIFT[tc]||['10:00','20:00'];
  const on=tm(sh[0]),off=tm(sh[1]);

  const mine=day==='today'?blocks.filter(b=>b.tc===tc):TOMORROW;
  const now=day==='today'?NOW:-1;
  const hrs=[];for(let h=on;h<off;h+=60)hrs.push(h);
  const cls=h=>{const bs=mine.filter(b=>b.s<h+60&&b.e>h);if(bs.some(b=>b.kind==='book'||b.kind==='walk'))return 'book';if(bs.some(b=>b.kind==='serve'))return 'serve';if(bs.some(b=>b.kind==='done'))return 'done';if(bs.some(b=>b.kind==='rest'))return 'rest';return 'free'};
  const cnt=k=>hrs.filter(h=>cls(h)===k).length;
  const bk=mine.filter(b=>b.kind==='book'||b.kind==='walk');

              {now>=h&&now<h+60&&<div className="absolute top-0 bottom-0 w-[2px] bg-ink" style={{left:((now-h)/60*100)+'%'}}></div>}
            </div>

        {[['book','預約'],['serve','服務中'],['done','已服務'],['rest','休息']].map(([k,l])=><span key={k} className="flex items-center gap-1"><span className="inline-block w-3 h-3 rounded-sm" style={{background:COL[k],opacity:k==='done'?0.55:0.9}}></span>{l}</span>)}

  const [note,setNote]=useState(E?E.note||'':'');const [busy,setBusy]=useState('');const [err,setErr]=useState('');const [done,setDone]=useState(null);
  const setX=(i,k,v)=>{setG(g.map((x,j)=>j===i?Object.assign({},x,{[k]:v},k==='svc'&&x.tc&&tcsSk&&tcsSk[v]&&!tcsSk[v].includes(x.tc)?{tc:''}:{}):x));setSlots(null);setT('')};   // v0.1-138 油壓只有女老師
  const key=JSON.stringify([date,g.map(x=>[x.svc,x.min,x.ex,x.ad,x.tc])]);
  useEffect(()=>{if(!date)return;let dead=false;const h=setTimeout(async()=>{setBusy('slots');setErr('');try{const j=await guestCall(Object.assign({op:'slots',date,g},E?{id:E.id}:{}));if(!dead){setSlots(j.slots||[]);setTcs(j.tcs||[]);setTcsSk(j.tcsSk||(j.tcsOil?{oil:j.tcsOil}:{}))}}catch(e){if(!dead){setErr(e.message);setSlots(null)}}if(!dead)setBusy('')},500);return ()=>{dead=true;clearTimeout(h)}},[key]);
  const est=x=>{const i=MINS.indexOf(Number(x.min));return ((S.prices[x.svc]||[])[i]||0)+(Number(x.ex)||0)*((S.extra.price||{})[x.svc]||0)+(x.ad||[]).reduce((a,id)=>a+((S.addons.find(y=>y.id===id)||{}).price||0),0)};
  const book=async()=>{setBusy('book');setErr('');try{const j=await guestCall(Object.assign({op:E?'edit':'book',date,t,g,note:note.trim()},E?{id:E.id}:{}));setDone(j.booked);onDone&&onDone()}catch(e){setErr(e.message)}setBusy('')};

  if(done)return <div className="text-center py-4"><div className="text-3xl text-sageD mb-1">✓</div><div className="text-lg">{done.edit?'預約已修改':'預約成功'}</div>

    <button className="mt-4 h-10 px-5 rounded-full border border-sage text-sageD" onClick={()=>{if(done.edit&&onCancelEdit){onCancelEdit();return}setDone(null);setDate('');setT('');setSlots(null);setNote('');setG([blank()])}}>{done.edit?'完成':'再預約一筆'}</button></div>;
  const Seg=({opts,val,set})=><div className="flex flex-wrap gap-1.5">{opts.map(([v,l])=><button key={String(v)} type="button" className={'h-9 px-3 rounded-full border text-sm '+(val===v?'bg-sage border-sage text-white':'bg-card border-line')} onClick={()=>set(v)}>{l}</button>)}</div>;

      <div className="text-[11px] text-mute mt-1.5 num">約 {money(est(x))}・{gDur(x)} 分鐘</div>
    </div>)}
    {date&&<><div className="text-xs text-mute mb-1">時間{busy==='slots'?'（查詢中…）':slots?'（可預約 '+okN+' 個時段）':''}</div>

/* ========== 確認碼打卡／上牌 ==========
   主櫃點某位人員「上牌／打卡」→ 以「該人員 userId＋日期＋產生當下的時:分」算出 3 位數確認碼，並把這一刻記為上牌／打卡時間。
   人員在自己手機輸入確認碼，手機用自己的 userId 比對最近 10 分鐘（含快 1 分鐘的誤差），吻合即成功。
   主櫃畫面上的確認碼不倒數，關閉（做別的操作）後就看不到，只能重新產生；重新產生時以最新一次產生的時間為準。
   不經後端：演算法在公開程式裡，目的只是讓員工不容易看出規律。 */
const PUNCH_WIN=10;                       // 手機比對最近幾分鐘
const PUNCH_EASY=true;                     // 測試期：確認碼為 000、111…999 這類重複數字（正式改成 false＝隨機 3 位數）。主櫃與手機用同一份程式，一起切換
function punchHash(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}h^=h>>>15;h=Math.imul(h,0x2c1b3c6d);h^=h>>>12;return h>>>0}
// v0.1-057：櫃台（上班／下班）的確認碼另外算（加 |c），老師上牌的碼不能拿來打櫃台卡，反之亦然
function punchCode(uid,d,kind){const h=punchHash('slowve-punch|'+uid+(kind==='counter'?'|c':'')+'|'+ymd(d)+'|'+pad(d.getHours())+':'+pad(d.getMinutes()));return PUNCH_EASY?String(h%10).repeat(3):String(h%1000).padStart(3,'0')}
function punchVerify(uid,code,now,kind){
  now=now||new Date();
  for(let k=-1;k<=PUNCH_WIN;k++){const d=new Date(now.getTime()-k*60000);if(punchCode(uid,d,kind)===code)return d}
  return null;
}
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
// 示範模式的資料另外存，不會混進真正的備份
const DS=()=>IS_ROLE_DEMO?'slowve.demo.':P;
const jget=(k,def)=>{try{const x=JSON.parse(localStorage.getItem(DS()+k)||'null');return x==null?def:x}catch(_e){return def}};
const jset=(k,v)=>{try{localStorage.setItem(DS()+k,JSON.stringify(v))}catch(_e){}};

/* 示範人員（假的 userId）；正式版改讀 members.json */
const DEMO_STAFF=[
  {uid:'Udemo0000000000000000000000000122',name:'阿芳',tc:'122',roles:['teacher']},
  {uid:'Udemo0000000000000000000000000077',name:'Ally',tc:'77',roles:['teacher','counter','guest']},
  {uid:'Udemo0000000000000000000000000058',name:'阿明',tc:'58',roles:['teacher']},
  {uid:'Udemo0000000000000000000000000036',name:'小琪',tc:'36',roles:['teacher']},
  {uid:'Udemo0000000000000000000000000012',name:'小安',tc:'12',roles:['teacher']},
  {uid:'Udemo000000000000000000000000mei1',name:'小美',roles:['counter'],admin:'manager'},
  {uid:'Udemo000000000000000000000000lili',name:'麗麗',roles:['counter']},
];
const demoUidOf=x=>{const f=DEMO_STAFF.find(s=>s.tc===x||s.name===x);return f?f.uid:'Udemo-unknown'};
const PK={teacher:{in:'上牌',out:'下牌'},counter:{in:'上班',out:'下班'}};
const personLabel=p=>p.tc?p.tc+' '+p.name:p.name;
// v0.1-076：主櫃系統裡老師一律只顯示編號（不顯示姓名、暱稱）；老師下去卡班顯示「編號 卡班」
const mcLabel=(p,r)=>p.tc?String(p.tc)+(r==='counter'?' 卡班':''):(p.name||'');

/* ---- 手機端：輸入確認碼 ---- */
function PunchPanel({me,kind,onDone,cloudRecs}){   // kind：teacher（上牌／下牌）／counter（上班／下班）；v0.1-126：櫃台按了就直接打卡（不用確認碼）
  const L=PK[kind];
  const uid=me&&me.uid;
  const key='mypunch-'+(kind==='counter'?'c-'+uid+'-'+bizToday(loadSettings().cutoff):uid+'-'+ymd(new Date()));   // 老師、櫃台的打卡分開存
  const [recs,setRecs]=useState(()=>jget(key,[]));
  const [st,setSt]=useState('idle');   // idle / input / fail
  const [act,setAct]=useState(null);
  const [val,setVal]=useState('');
  const [tries,setTries]=useState(0);
  const [ok,setOk]=useState(null);
  const inRef=useRef(null);
  const last=k=>{const r=recs.concat(cloudRecs||[]).filter(x=>x.k===k).map(x=>x.t).sort();return r.length?(k==='in'?r[0]:r[r.length-1]):null};   // 雲端的紀錄（換手機、補打卡）也算
  const direct=kind==='counter';
  const start=k=>{if(direct){const d=new Date();const r={k,t:hm(d),at:d.getTime()};const n=recs.concat([r]);setRecs(n);jset(key,n);onDone&&onDone({k,direct:true,at:d.getTime()});setOk(r);setSt('idle');return}
    setAct(k);setVal('');setTries(0);setOk(null);setSt('input');setTimeout(()=>{try{inRef.current.focus()}catch(_e){}},50)};
  const submit=()=>{
    if(!/^\d{3}$/.test(val))return;
    const d=punchVerify(uid,val,null,kind);
    if(d){
      const r={k:act,t:hm(d),at:Date.now()};const n=recs.concat([r]);setRecs(n);jset(key,n);
      onDone&&onDone({k:act,code:val,at:d.getTime()});   // v0.1-056：櫃台打卡上傳雲端
      setOk(r);setSt('idle');setVal('');setTries(0);return;
    }
    const n=tries+1;setTries(n);setVal('');
    if(n>=5)setSt('fail');
  };
  return (
    <div>
      <div className="flex justify-between text-sm mb-3"><span>今日{L.in} <span className="num">{last('in')||'—'}</span></span><span className={last('out')?'':'text-mute'}>{L.out} <span className="num">{last('out')||'—'}</span></span></div>
      {ok&&st==='idle'&&<div className="mb-3 px-3 py-2 rounded-xl bg-sageL text-sageD text-sm">✓ {L[ok.k]}成功・<span className="num">{ok.t}</span>{direct?'':'（主櫃產生確認碼的時間）'}</div>}
      {st==='idle'&&<div className="grid grid-cols-2 gap-2">
        <button className="h-12 rounded-xl bg-sage text-white" onClick={()=>start('in')}>{L.in}打卡</button>
        <button className="h-12 rounded-xl border border-sage text-sageD bg-card" onClick={()=>start('out')}>{L.out}打卡</button>
      </div>}
      {st==='input'&&<div className="rounded-xl border border-sage bg-sageL/30 p-3">
        <div className="text-sm mb-2"><b>{L[act]}</b>：請向主櫃索取確認碼後輸入</div>
        <div className="flex gap-2">
          <input ref={inRef} className="flex-1 min-w-0 w-full h-14 px-3 rounded-xl border border-line bg-card text-3xl tracking-[0.5em] text-center num" inputMode="numeric" maxLength={3} placeholder="———" value={val}
            onChange={e=>setVal(e.target.value.replace(/\D/g,'').slice(0,3))} onKeyDown={e=>{if(e.key==='Enter')submit()}}/>
          <button className="px-5 h-14 rounded-xl bg-sage text-white disabled:opacity-40" disabled={val.length!==3} onClick={submit}>確認</button>
        </div>
        {tries>0&&tries<3&&<div className="text-sm text-warn mt-2">確認碼不正確（第 {tries} 次）</div>}
        {tries>=3&&<div className="text-sm text-warn mt-2">確認碼已錯誤 {tries} 次。再持續輸入錯誤時，請向主櫃索取確認碼。</div>}
        <button className="w-full h-9 mt-2 text-sm text-mute" onClick={()=>setSt('idle')}>取消</button>
      </div>}
      {st==='fail'&&<div className="rounded-xl border border-warn bg-warnL p-3 text-center">
        <div className="text-warn font-semibold">打卡未成功</div>
        <div className="text-sm text-warn mt-1">確認碼錯誤 5 次，請重新打卡。</div>
        <button className="mt-3 h-11 px-6 rounded-xl bg-sage text-white" onClick={()=>{setSt('idle');setTries(0)}}>重新打卡</button>
      </div>}
      <div className="text-xs text-mute mt-2">{direct?<>按了就打卡，時間以雲端收到的時間為準；沒網路時會先存在手機，連上後自動上傳（10 分鐘內有效）。</>:<>確認碼由主櫃產生，{PUNCH_WIN} 分鐘內輸入有效；{L.in}時間以主櫃產生確認碼的時間為準。</>}</div>
    </div>
  );
}

      {!onTb&&<><div className="text-xs text-mute mb-1">老師</div>
      <div className="flex flex-wrap gap-2 mb-3">{people.filter(p=>p.tc).map(p=><Chip key={p.uid} p={Object.assign({},p,{_r:'teacher'})}/>)}</div></>}

/* ========== v0.1-105 主櫃上線（第一階段） ==========
   老闆在「設定 → 主櫃系統」打開「主櫃系統已上線」後，主櫃改用真的資料：
   - 當天（營業日）的訂單、老師上下牌（tb）都寫在這台的日報資料（跟老闆頁同一個格式），有異動 1.5 秒後上傳 GAS（action mc），每分鐘下載一次。
   - 雲端被別人改過（例如老闆修正）時，GAS 回傳衝突＋雲端資料，這裡逐筆合併（訂單、支出、上下牌依 id，取較新的），再上傳。
   - 訂單多了：st（serving 服務中／done 到時待買單／paid 已買單）、end（預計下鐘）、endAt（實際到時）、pay（{m:'cash', t, by}）、by（開單的人）；每位客人 seat（B1 床位／F1 腳位）。
   - 老師上下牌 tb：[{id, tc, k:'on'|'off', t, at, by}]。 */
const MC_SYNC='mc-sync';   // {date, base（上次拿到的雲端版本）, dirty（未上傳的修改時間）}
const mcSt=()=>jget(MC_SYNC,{date:'',base:0,dirty:0});
const mcStSet=v=>jset(MC_SYNC,v);
const MC={subs:new Set(),busy:false,err:'',at:0,timer:null,auth:null,emit(){this.subs.forEach(f=>{try{f()}catch(_e){}})}};
function useMc(){const [,setN]=useState(0);useEffect(()=>{const f=()=>setN(n=>n+1);MC.subs.add(f);return ()=>{MC.subs.delete(f)}},[]);return MC}
// v0.1-107 測試上線（MC.test）：當天資料另外存在 mc-test-日期，只在這台，不上傳
const MCT=date=>'mc-test-'+date;
const mcGetDay=date=>MC.test?Object.assign(emptyDay(),jget(MCT(date),null)||{}):getDay(loadMonth(monKey(date)),date);
function mcPutDay(date,d){const mk=monKey(date);const md=loadMonth(mk);md.days[date.slice(8)]=d;return ls.set('m-'+mk,md)}
function mcMutate(date,fn){
  const d=fn(clone(mcGetDay(date)));d.ua=Date.now();
  if(MC.test){jset(MCT(date),d);MC.emit();return true}
  if(!mcPutDay(date,d))return false;
  const s=mcSt();if(s.date!==date){s.date=date;s.base=0}s.dirty=d.ua;mcStSet(s);MC.emit();mcSoon(1500);return true;
}
function mcSoon(ms){clearTimeout(MC.timer);MC.timer=setTimeout(()=>{mcPush()},ms)}
function mcMerge(L,C){
  L=L||emptyDay();C=C||emptyDay();
  const t=x=>Number(x&&(x.ua||x.ca||x.at))||0;
  const un=(a,b)=>{const m={};(b||[]).forEach(x=>{if(x&&x.id)m[x.id]=x});(a||[]).forEach(x=>{if(!x||!x.id)return;const o=m[x.id];if(!o||t(x)>t(o))m[x.id]=x});return Object.values(m).sort((x,y)=>(x.ca||x.at||0)-(y.ca||y.at||0))};
  const lg=(a,b)=>{const seen={};return (b||[]).concat(a||[]).filter(x=>{const k=JSON.stringify(x);if(seen[k])return false;seen[k]=1;return true}).sort((x,y)=>(x.at||0)-(y.at||0))};
  const xd=[...new Set((L.expDel||[]).concat(C.expDel||[]))];   // v0.1-137 主櫃刪掉的支出（墓碑），合併時不再帶回來
  return Object.assign({},C,L,{expDel:xd,supPay:un(L.supPay,C.supPay),orders:un(L.orders,C.orders),expenses:un(L.expenses,C.expenses).filter(e=>!xd.includes(e.id)),tb:un(L.tb,C.tb),wait:un(L.wait,C.wait),shifts:un(L.shifts,C.shifts),log:lg(L.log,C.log),close:C.close||L.close||null,ua:Date.now()});
}
async function mcCall(b){
  const t=window.liff&&window.liff.getIDToken&&window.liff.getIDToken();if(!t)throw new Error('取不到主櫃的 LINE 身分，請重新開啟');
  return cloud.call(Object.assign({action:'mc',idToken:t},MC.auth&&MC.auth.ks?{ks:MC.auth.ks}:{},b),30000);
}
async function mcPush(){
  if(!MC.auth)return;if(MC.busy){mcSoon(1000);return}
  const s=mcSt();if(!s.dirty||!s.date)return;
  MC.busy=true;MC.emit();
  try{
    const d=mcGetDay(s.date),sent=s.dirty;
    const j=await mcCall({op:'push',date:s.date,base:s.base,ua:d.ua,data:d});
    const s2=mcSt();
    if(j.conflicts&&j.conflicts.length){   // 雲端被改過：合併後再傳
      mcPutDay(s.date,mcMerge(mcGetDay(s.date),j.data));s2.base=j.rev;s2.dirty=Date.now();mcStSet(s2);
    }else{s2.base=j.rev;if(s2.dirty===sent)s2.dirty=0;mcStSet(s2)}
    MC.err='';MC.at=Date.now();
  }catch(e){MC.err=String(e.message||e);clearTimeout(MC.timer);MC.timer=setTimeout(()=>{mcPush()},30000);MC.busy=false;MC.emit();return}
  MC.busy=false;MC.emit();
  if(mcSt().dirty)mcSoon(500);
}
async function mcPull(){
  if(!MC.auth||MC.busy)return;
  MC.busy=true;MC.emit();
  try{
    const S=loadSettings(),date=bizToday(S.cutoff);
    const j=await mcCall({op:'pull',date});
    if(j.settings&&!cloudOn()){const loc=ls.get('settings',null)||{};ls.set('settings',Object.assign({},j.settings,{device:loc.device||S.device}))}   // 價目表等跟老闆頁同一份（裝置代碼留這台的）
    const dd=j.date||date,s=mcSt();
    if(s.date!==dd){s.date=dd;s.base=0;s.dirty=0}
    if(j.rev!==s.base){
      if(s.dirty)mcPutDay(dd,mcMerge(mcGetDay(dd),j.data));
      else if(j.data)mcPutDay(dd,Object.assign(emptyDay(),j.data));
      if(s.dirty)s.dirty=Date.now();
      s.base=j.rev;
    }
    mcStSet(s);MC.err='';MC.at=Date.now();
  }catch(e){MC.err=String(e.message||e)}
  MC.busy=false;MC.emit();
  if(mcSt().dirty)mcSoon(300);
}

/* ---- 由當天資料算出：老師牌況、座位 ---- */
const SEAT_NAME=id=>!id?'':(id[0]==='F'?'腳位 ':'床 ')+id.slice(1);
const oSt=o=>o.st||'paid';
// v0.1-134 先買單後又加點：pay.amt＝已收的金額；oDue＞0 表示還有後加的沒收（到時進待買單收差額）
const oNet=o=>orderItems(o).reduce((s,x)=>s+(x.amt||0)-Math.min(Number(x.cp)||0,x.amt||0),0);
const oPaid=o=>!o.pay?0:o.pay.amt!=null?o.pay.amt:oNet(o);
const oDue=o=>Math.max(0,oNet(o)-oPaid(o));
// 開始後才加的（item.adds：[{t,ex,ad,amt}]）：原本的項目照原樣顯示，後加的另列一行
function itemBase(x){const A=x.adds||[];if(!A.length)return x;const ex=A.reduce((s,a)=>s+(a.ex||0),0),ad=A.flatMap(a=>a.ad||[]);
  return Object.assign({},x,{ex:Math.max(0,(Number(x.ex)||0)-ex),ad:(x.ad||[]).filter(a=>!ad.includes(a)),amt:(x.amt||0)-A.reduce((s,a)=>s+(a.amt||0),0)})}
const addLabel=(a,x,S)=>[a.ex?'加鐘'+(x.exs&&x.exs!==x.svc?SVC_SHORT[x.exs]:'')+a.ex*30+'分':''].concat((a.ad||[]).map(id=>{const d=S.addons.find(y=>y.id===id);return d?d.name:id})).filter(Boolean).join(' ＋ ');   // 老闆頁登打的舊訂單沒有狀態＝已完成
const mcLiveO=o=>!o.void&&!o.del;
// v0.1-110：刮痧、拔罐另外加 30 分（B11）
const ADD_MIN={guasha:30,bagua:30};
const gDur=x=>(Number(x.min)||0)+(Number(x.ex)||0)*30+(x.ad||[]).reduce((a,id)=>a+(ADD_MIN[id]||0),0);
function mcEnd(o){if(o.end)return o.end;let mx=0;orderItems(o).forEach(x=>{mx=Math.max(mx,gDur(x))});return tf(tm(o.t||hm(new Date()))+(mx||60))}
const shiftOf=sh=>{const m=/^(\d\d:\d\d)-(\d\d:\d\d)$/.exec(sh||'');return m?{in:m[1],out:m[2]}:null};
/* 老師：最後一次上下牌決定在不在；服務中＝有服務中的訂單；可接的人依「可以接客的時間」排輪班（上牌時間或上一位客人到時的時間，早的先）。
   v0.1-110：tb 也記休息（rest／back，休息中保留順位、來客時略過，A2）、準下（zx／zxoff，A10）、短單（short／shortoff，A11）；下牌時全部清掉。
   shifts：{tc:'HH:mm-HH:mm'} 班表，準下用下牌時間 out。 */
function mcBoard(d,shifts){
  const T={};
  (d.tb||[]).slice().sort((a,b)=>(a.at||0)-(b.at||0)).forEach(e=>{const r=T[e.tc]||(T[e.tc]={tc:e.tc,zh:0,n:0});
    if(e.k==='on'){r.on=true;r.onT=e.t;r.since=e.t;r.sinceAt=e.at||0;r.offT=null;r.rest=null;r.zx=false;r.short=false}
    else if(e.k==='off'){r.on=false;r.offT=e.t;r.rest=null;r.zx=false;r.short=false}
    else if(e.k==='rest')r.rest={t:e.t,back:e.back||''};else if(e.k==='back')r.rest=null;
    else if(e.k==='zx')r.zx=true;else if(e.k==='zxoff')r.zx=false;else if(e.k==='short')r.short=true;else if(e.k==='shortoff')r.short=false});
  (d.orders||[]).filter(mcLiveO).forEach(o=>orderItems(o).forEach(x=>{const tc=String(x.tc||'');if(!tc)return;
    const r=T[tc]||(T[tc]={tc,zh:0,n:0,on:false});r.zh+=Number(x.zh)||0;r.n++;
    if(oSt(o)==='serving')r.serv={id:o.id,sn:o.sn,end:mcEnd(o),start:o.t,label:(SVC_SHORT[x.svc]||'')+(x.min||''),rescue:!!x.sh};
    else if(o.endAt&&r.on&&!x.sh&&tm(o.endAt)>=tm(r.since||'06:00')){r.since=o.endAt;r.sinceAt=o.ua||0}   // v0.1-135 救援牌做完不移位置（仍是頭班）
    if(x.sh){const s=T[String(x.sh.tc)];if(s&&s.on&&x.sh.t&&tm(x.sh.t)>=tm(s.since||'06:00')){s.since=x.sh.t;s.sinceAt=o.ua||0}}}));   // 被打槍的：從打槍的時間排到後面
  const list=Object.values(T);
  list.forEach(r=>{const sh=shiftOf((shifts||{})[r.tc]);r.out=sh?sh.out:''});
  const q=list.filter(r=>r.on&&(!r.serv||r.serv.rescue)).sort((a,b)=>tm(a.since||'06:00')-tm(b.since||'06:00')||(a.sinceAt||0)-(b.sinceAt||0));   // 同一分鐘：先上牌（先到時）的先
  q.forEach((r,i)=>{r.rot=i+1});   // 休息中的也排順位（保留位置）
  const lastOn=tc=>{const a=(d.tb||[]).filter(e=>e.tc===tc&&(e.k==='on'||e.k==='off')).sort((x,y)=>(x.at||0)-(y.at||0));return a[a.length-1]||null};
  return {list,avail:q.filter(r=>!r.rest&&!r.serv),rest:q.filter(r=>r.rest&&!r.serv),rescue:q.filter(r=>r.serv),serving:list.filter(r=>r.on&&r.serv&&!r.serv.rescue).sort((a,b)=>tm(a.serv.end)-tm(b.serv.end)),off:list.filter(r=>!r.on).sort((a,b)=>(Number(a.tc)||0)-(Number(b.tc)||0)),
    lastOf:lastOn};
}
// 座位：服務中的佔用到下鐘；到時後空出清潔時間
function mcSeats(d,S,now){
  const m={},nm=tm(now||hm(new Date()));
  (d.orders||[]).filter(mcLiveO).forEach(o=>orderItems(o).forEach(x=>{if(!x.seat)return;
    if(oSt(o)==='serving')m[x.seat]={k:'serv',until:mcEnd(o),tc:x.tc,sn:o.sn};
    else if(o.endAt&&!m[x.seat]){const fr=tm(o.endAt)+(Number(S.cleanMin)||0);if(nm<fr)m[x.seat]={k:'clean',until:tf(fr)}}}));
  return m;
}

/* ========== v0.1-110 預約、壓牌、現場候位 ==========
   預約存在 GAS「預約」工作表（action bk，gas-4.45），可預約 14 天內（C3）；時間從整點或半點開始（B7），09:00～01:30（C1）。
   名額：那個時段班表上有、沒請假的老師（兼職支援老師沒填可上班時間前不算，D1），扣掉同時段其他預約與今天服務中的，
   再保留 1 位老師、1 張床給現場客（C4）；座位到時後加清潔時間（B6）；身體＋腳底的組合床位、腳位同時保留（B12）。
   壓牌（A2）：今天還沒報到的預約，依時間先後，從輪班（可接客依順位 → 服務中先下鐘的）壓牌；有指定老師的壓指定老師；休息中的跳過。
   被壓牌的老師，預約前的空檔夠（服務時間＋10 分鐘緩衝，A5）才可以先接現場客。
   報到：開單帶入客人、項目、老師（指定的或壓牌的）；遲到的時間從服務時間扣除（A6，下鐘時間＝預約時間＋服務時間）。
   測試上線：預約存在這台（mc-test-bk），老師名冊、請假照樣向雲端讀。 */
const BK_ST={ok:{l:'已確認',c:'bg-sageL text-sageD'},pend:{l:'待確認',c:'bg-warnL text-warn'},in:{l:'已報到',c:'bg-bg text-mute border border-line'},cancel:{l:'已取消',c:'bg-neutral-200 text-neutral-500'},noshow:{l:'未到',c:'bg-neutral-200 text-neutral-500'}};

/* v0.1-108 交接事項：主櫃（櫃台、主管、老闆）、老闆頁都能寫，不限交班時；交班點清、日結時列在下方。

      L=L.map(y=>y.id===b.id?Object.assign({},y,{st:b.st,stBy:who,stAt:t,note:b.note||'',hist:(y.hist||[]).concat([{st:b.st,by:who,uid:me,note:b.note||'',t,at:now}])}):y)}

// 一項交接事項：內容、處理紀錄、狀態按鈕；選「待處理／處理中」時要寫處理說明（不是寫的人一定要寫）

function HandNotes({mode,by,uid,ks,compact,title}){

// 主櫃登入後：別人寫的、還沒完成、這次登入後還沒確認的交接事項，逐項點狀態才能開始操作
function HnGate({by,uid,since,ks}){
  const [list,setList]=useState(__hn);const [busy,setBusy]=useState('');const [err,setErr]=useState('');
  useEffect(()=>{const f=L=>setList(L);HN_SUBS.add(f);if(uid)hnCall('mc',{op:'list',by,uid,ks}).then(j=>{setErr('');hnPut(j.list||[])}).catch(e=>setErr(e.message));return ()=>{HN_SUBS.delete(f)}},[uid,MC.test,ks]);
  const need=(list||[]).filter(x=>x.st!=='done'&&x.uid!==uid&&!(x.hist||[]).some(h=>h.uid===uid&&(h.at||0)>=(since||0)));
  if(!uid||!need.length)return null;

  return (

        :<>{real&&<div className="max-w-md mx-auto mt-2 px-4"><div className="px-3 py-2 rounded-xl bg-warnL text-warn text-xs">主櫃還沒上線：下方是示範資料。老闆在老闆頁「設定 → 主櫃系統」打開「主櫃系統已上線」後，這裡就改用真的訂單；打開「主櫃系統測試上線」可以先用真的畫面測試（不存檔）。{MC.err?'（'+MC.err+'）':''}</div></div>}
        <CounterHome me={me} mode={mode} desk={desk} sup={{paid:supPaid,onPay}} cust={{mode:real&&GAS_URL?'line':'demo',ks,admin:isOwner}}/></>}
      {real&&<HnGate by={op.name} uid={op.uid||''} since={op.ms||0} ks={ks}/>}

        <div className="w-full max-w-md bg-card rounded-2xl p-5 max-h-[92vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
          {login==='count'&&<>
            <div className="text-lg">交班點清</div>

            {hide?<div className="mb-3 px-3 py-2 rounded-xl bg-bg border border-line text-sm text-mute">主櫃不顯示營業額：請直接點清抽屜現金並輸入，差額由老闆查看。</div>:
              <div className="rounded-xl border border-line bg-bg px-3 py-2 mb-3 text-sm">

            {!h.skip&&(canSeeDiff?<div className="text-xs text-mute num">應有 {money(h.expected)}（營業額 {money(h.rev)} − 支出 {money(h.exp)}{h.sup?' − 支援 '+money(h.sup):''}）・<span className={h.diff===0?'text-sageD':'text-warn'}>差額 {smoney(h.diff)}</span>{h.note?'・'+h.note:''}</div>:
              <div className="text-xs text-mute">差額由老闆查看</div>)}

/* ---- 櫃台人員（個人，正式版 v0.1-055／差勤 v0.1-056） ----
   打卡：手機輸入主櫃確認碼 → 先存在這支手機 → 上傳 GAS（punch，GAS 再驗一次確認碼）。
   差勤：到職日起，正職櫃台每天都要有上班、下班打卡（請假的日子除外），沒有就記「異常」，本人可申請補打卡（填原因，老闆／主管核准）。
   扣薪（月薪）：日薪＝月薪÷30、時薪＝日薪÷8；遲到、早退按分鐘比例扣；事假扣全額、病假扣一半、休假（排休）不扣（依勞工請假規則）。
   支援櫃台（無底薪）：時薪 × 實際時數，每天下班向主櫃領現金（日結，記成現金支出）；不記異常、不扣薪。 */
const ATT_DEMO=true;   // 勞基法違規提示的「範例」差勤資料；跟老闆確認提示文字後改成 false（範例就不再顯示）
const toMin=t=>{const a=String(t||'').split(':');return a.length===2?Number(a[0])*60+Number(a[1]):null};
const minTxt=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?(h+' 小時'+(r?' '+r+' 分':'')):r+' 分'};
const hrTxt=m=>(+(m/60).toFixed(1))+' 時';
const leaveOn=(list,d)=>(list||[]).filter(L=>L.status!=='cancelled'&&L.status!=='rejected'&&L.from<=d&&(L.to||L.from)>=d);
const monthEndOf=ym=>ym+'-'+pad(new Date(Number(ym.slice(0,4)),Number(ym.slice(5)),0).getDate());
const shiftYm=(ym,n)=>{const d=new Date(Number(ym.slice(0,4)),Number(ym.slice(5))-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const workMin=(i,o)=>{let m=toMin(o)-toMin(i);if(m<0)m+=1440;return m};
const LEAVE_RATE={personal:1,sick:0.5,off:0};
/* v0.1-061：差勤檢查 10 條，老闆可在「設定 → 差勤檢查」逐條關閉；開關存在設定 attChecks（沒寫＝開），GAS 回傳給櫃台頁 */
const ATT_CHECKS=[
  ['miss','異常：沒有上下班打卡（缺上班或缺下班也算）','正職櫃台到職日起，沒打卡又沒請假記「異常」，可申請補打卡'],
  ['late','遲到','晚於上班時間打卡；月薪按分鐘比例扣薪'],
  ['early','早退','早於下班時間打卡；月薪按分鐘比例扣薪'],
  ['d8','每日超過 8 小時（加班提醒）','勞基法第 30、32 條'],
  ['d12','每日超過 12 小時','勞基法第 32 條'],
  ['w40','每週超過 40 小時','勞基法第 30 條'],
  ['m46','每月加班超過 46 小時','勞基法第 32 條'],
  ['c6','連續上班超過 6 天（一例一休）','勞基法第 36 條'],
  ['r11','下班到隔天上班少於 11 小時','勞基法第 34 條'],
  ['b4','連續工作 4 小時要休息 30 分鐘（提醒）','勞基法第 35 條'],
];
const ckOf=c=>{const o={};ATT_CHECKS.forEach(([k])=>{o[k]=!(c&&c[k]===false)});return o};   // 扣薪比例：事假全扣、病假扣半、休假不扣
const PAY_TYPE={monthly:'月薪',none:'無底薪（支援・時薪日結）'};
// 一天的上下班：第一次上班、最後一次下班
function inOutOf(recs){const r=recs||[];const i=r.filter(x=>x.k==='in'),o=r.filter(x=>x.k==='out');return {in:i.length?i[0].t:'',out:o.length?o[o.length-1].t:'',fixIn:i.some(x=>x.src==='fix'),fixOut:o.some(x=>x.src==='fix')}}
/* 差勤計算（櫃台頁與老闆月報共用）
   A：{hr, shift:{in,out}, punches:{date:[recs]}, fixes, leaves}；回傳每天的狀態、統計、扣薪、勞基法提示 */
function attCalc(A,ym,today){
  // A.teacher：老師（主管）下去卡班，一律算支援（時薪），不記異常、不扣薪
  const hr=A.teacher?Object.assign({hourly:0},A.hr||{},{payType:'none'}):(A.hr||null),sup=!!(hr&&hr.payType==='none'),monthly=!!(hr&&hr.payType!=='none'&&hr.hire);
  const sIn=(A.shift&&A.shift.in)||'',sOut=(A.shift&&A.shift.out)||'';
  const mStart=ym+'-01',mEnd=monthEndOf(ym);
  const from=hr&&hr.hire&&hr.hire>mStart?hr.hire:mStart;
  const kb=!!A.teacher;
  const ck=ckOf(A.checks);
  const to=mEnd<today?mEnd:today;
  const fixes=A.fixes||[];
  const days=[];
  for(let d=from;d<=to;d=addDays(d,1)){
    const io=inOutOf((A.punches||{})[d]);
    const L=leaveOn(A.leaves,d);const full=L.find(x=>x.all);
    const pend=fixes.filter(f=>f.date===d&&f.status==='pending');
    const rej=fixes.filter(f=>f.date===d&&f.status==='rejected');
    const x={date:d,in:io.in,out:io.out,fixIn:io.fixIn,fixOut:io.fixOut,leave:L,full:!!full,pend,rej,min:io.in&&io.out?workMin(io.in,io.out):null,late:0,early:0,issues:[],pay:0};
    if(monthly&&!full&&(ck.miss||ck.late||ck.early)){
      let es=sIn,ee=sOut;   // 部分時段請假：請在開頭／結尾的，應到／應退時間往後／往前移
      L.filter(z=>!z.all).forEach(z=>{if(es&&toMin(z.t1)<=toMin(es)&&toMin(z.t2)>toMin(es))es=z.t2;if(ee&&toMin(z.t2)>=toMin(ee)&&toMin(z.t1)<toMin(ee))ee=z.t1});
      if(d<today&&ck.miss){
        if(!io.in&&!io.out)x.issues.push('沒有上下班打卡');
        else{if(!io.in)x.issues.push('缺上班打卡');if(!io.out)x.issues.push('缺下班打卡')}
      }
      if(ck.late&&io.in&&es)x.late=Math.max(0,toMin(io.in)-toMin(es));
      if(ck.early&&io.out&&ee){   // 跨午夜：下班時間比上班早，表示過了午夜（換日前都算同一個營業日）
        const st=toMin(io.in||es||sIn||'00:00');const oA=toMin(io.out)+(toMin(io.out)<st?1440:0);const eA=toMin(ee)+(toMin(ee)<toMin(es||sIn||'00:00')?1440:0);
        x.early=Math.max(0,eA-oA)}
    }
    if(sup&&x.min!=null)x.pay=Math.round(x.min/60*(Number(hr.hourly)||0));
    days.push(x);
  }
  if(sup){const keep=days.filter(x=>x.in||x.out||x.leave.length);days.length=0;keep.forEach(x=>days.push(x))}   // 支援／卡班：只列有來的日子
  const worked=days.filter(x=>x.in||x.out);
  const lateMin=days.reduce((s,x)=>s+x.late+x.early,0);
  const salary=Number(hr&&hr.salary)||0,daily=salary/30,hourly=daily/8;
  // 請假扣薪：這個月（到職日以後）每一天的請假
  const lv={personal:0,sick:0,off:0};
  if(monthly)for(let d=from;d<=mEnd;d=addDays(d,1))leaveOn(A.leaves,d).forEach(L=>{if(lv[L.kind]==null)return;lv[L.kind]+=L.all?8:Math.min(8,Math.max(0,(toMin(L.t2)-toMin(L.t1))/60))});
  const dedLate=monthly?lateMin*hourly/60:0;
  const dedLeave={personal:lv.personal*hourly*LEAVE_RATE.personal,sick:lv.sick*hourly*LEAVE_RATE.sick};
  const ded=Math.round(dedLate+dedLeave.personal+dedLeave.sick);
  const law=lawCheck(Object.keys(A.punches||{}).sort().map(d=>{const io=inOutOf(A.punches[d]);return {date:d,in:io.in,out:io.out}}),ym,(A.cfg||{}).brk).filter(w=>ck[w.r==='ot'?'m46':w.r]);
  return {ck,days,sup,kb,monthly,hr,sIn,sOut,from,to,
    n:{work:worked.filter(x=>x.in).length,late:days.filter(x=>x.late>0).length,early:days.filter(x=>x.early>0).length,lateMin,
      issue:days.filter(x=>x.issues.length&&!x.pend.length).length,pend:fixes.filter(f=>f.status==='pending').length,
      min:days.reduce((s,x)=>s+(x.min||0),0),pay:days.reduce((s,x)=>s+x.pay,0)},
    lv,salary,daily,hourly,dedLate:Math.round(dedLate),dedLeave:{personal:Math.round(dedLeave.personal),sick:Math.round(dedLeave.sick)},ded,net:salary-ded,law};
}
/* 勞基法檢查（第 30、32、34、35、36 條）。days：[{date,in,out}]（可含上個月最後幾天，連續上班才算得準）；只回報落在 ym 的 */
function lawCheck(days,ym,brk){   // brk：每日休息（分鐘），從工時扣掉；有 30 分以上就不再提醒第 35 條
  brk=Number(brk)||0;
  const w=[];const inYm=d=>d.slice(0,7)===ym;
  const done=days.filter(x=>x.in&&x.out).map(x=>{const span=workMin(x.in,x.out);return Object.assign({},x,{span,min:Math.max(0,span-(span>240?brk:0))})});
  let ot=0;
  done.forEach(x=>{if(!inYm(x.date))return;const d=fmtDate(x.date);
    if(x.min>720)w.push({r:'d12',lv:'bad',date:x.date,t:d+' 工作 '+minTxt(x.min)+'，超過每日上限 12 小時（正常工時＋加班），違反勞基法第 32 條。'});
    else if(x.min>480)w.push({r:'d8',lv:'warn',date:x.date,t:d+' 工作 '+minTxt(x.min)+'，超過每日正常工時 8 小時，超過的 '+minTxt(x.min-480)+' 屬加班，需依法給加班費（第 30、32 條）。'});
    if(x.min>480)ot+=x.min-480;
    if(x.span>240&&brk<30)x.long=true;});
  // 每週 40 小時（週一～週日）
  const wk={};done.forEach(x=>{const d=parseYmd(x.date);const k=addDays(x.date,-((d.getDay()+6)%7));(wk[k]=wk[k]||[]).push(x)});
  Object.keys(wk).sort().forEach(k=>{const a=wk[k];const s=a.reduce((t,x)=>t+x.min,0);const e=addDays(k,6);if(!(inYm(k)||inYm(e)))return;
    if(s>2400)w.push({r:'w40',lv:'warn',date:k,t:fmtDate(k).replace(/（.）/,'')+'～'+fmtDate(e).replace(/（.）/,'')+' 這週工作 '+minTxt(s)+'，超過每週正常工時 40 小時，超過的部分屬加班（第 30 條）。'})});
  if(ot>46*60)w.push({r:'m46',lv:'bad',date:ym+'-31',t:'本月加班已達 '+minTxt(ot)+'，超過每月 46 小時上限（經工會或勞資會議同意最多 54 小時，每 3 個月合計不超過 138 小時），違反勞基法第 32 條。'});
  else if(ot>0)w.push({r:'ot',lv:'info',date:ym+'-31',t:'本月加班合計 '+minTxt(ot)+'（上限每月 46 小時）。'});
  // 連續上班超過 6 天
  const set={};days.filter(x=>x.in||x.out).forEach(x=>{set[x.date]=1});
  const ds=Object.keys(set).sort();let run=[];
  const flush=()=>{if(run.length>6&&inYm(run[run.length-1]))w.push({r:'c6',lv:'bad',date:run[0],t:fmtDate(run[0]).replace(/（.）/,'')+' 起連續上班 '+run.length+' 天（到 '+fmtDate(run[run.length-1]).replace(/（.）/,'')+'），超過 6 天；每 7 天應有 2 天休息（1 天例假、1 天休息日），違反勞基法第 36 條。'});run=[]};
  ds.forEach(d=>{if(run.length&&addDays(run[run.length-1],1)!==d)flush();run.push(d)});flush();
  // 下班到隔天上班至少休息 11 小時
  for(let i=1;i<done.length;i++){const a=done[i-1],b=done[i];if(addDays(a.date,1)!==b.date||!inYm(b.date))continue;

/* v0.1-102 人員頁的資料存在本機（localStorage，只限老闆頁、依登入帳號分開；登出就清掉）。
   GAS（gas-4.35 起）每次回應都附上各類資料的異動時間 revs：apps 應徵、prof 人員資料、leave 請假、cust 會員、att 差勤，mem＝開通名單。
   讀取時：本機有資料 → 先直接顯示；異動時間跟本機那份一樣就不再下載，不一樣才下載並更新畫面。
   15 秒內問過異動時間就直接比對（例如按了審核後重新讀取）；按「重新整理」會立刻問一次；「重新下載」不比對、直接下載。 */
const PC_KIND={applist:'apps',proflist:'prof',leavelist:'leave',custlist:'cust',attlist:'att'};
const PC_MAX=3*864e5,REV_FRESH=15000;
let __revs=null,__revsAt=0,__revsP=null;const PC_FLY={};
function revsPut(r){if(r&&typeof r==='object'){__revs=r;__revsAt=Date.now()}}
const pcRev=(kind,r)=>r&&r[kind]!=null?String(r[kind])+(kind==='cust'||kind==='att'?'':'|'+(r.mem||'')):null;
const pcUid=()=>{const c=cloudCfg();return (c.who&&c.who.uid)||''};
function pcAll(){const u=pcUid();try{const o=JSON.parse(localStorage.getItem('slowve.pc')||'null');if(o&&o.uid===u&&o.m)return o}catch(_e){}return {uid:u,m:{}}}
function pcGet(k){if(!pcUid())return null;const e=pcAll().m[k];return e&&Date.now()-e.at<PC_MAX?e:null}
function pcSet(k,e){if(!pcUid())return;const o=pcAll();o.m[k]=e;
  try{localStorage.setItem('slowve.pc',JSON.stringify(o))}catch(_e){try{localStorage.setItem('slowve.pc',JSON.stringify({uid:o.uid,m:{[k]:e}}))}catch(_e2){}}}
function pcClear(){try{localStorage.removeItem('slowve.pc')}catch(_e){}__revs=null;__revsAt=0}
const pcAt=b=>{const e=pcGet(JSON.stringify(b));return e?e.at:0};
function revsNow(force){
  if(!force&&__revs&&Date.now()-__revsAt<REV_FRESH)return Promise.resolve(__revs);
  if(!__revsP)__revsP=cloud.call({action:'revs'},20000).then(j=>{__revsP=null;return j.revs||null},e=>{__revsP=null;throw e});
  return __revsP;
}
async function pcFetch(body,ms){
  const k=JSON.stringify(body);if(PC_FLY[k])return PC_FLY[k];   // 同一份已經在下載：等同一個結果
  const p=cloud.call(body,ms).then(j=>{const rv=pcRev(PC_KIND[body.action],j.revs);if(rv)pcSet(k,{rev:rv,at:Date.now(),j});return j});
  PC_FLY[k]=p;try{return await p}finally{delete PC_FLY[k]}
}
// mode：''＝一般；'check'＝立刻問異動時間（重新整理）；'force'＝直接下載（重新下載）。onFresh：先顯示本機資料、背景發現有異動時，用新資料再呼叫一次
function preCall(body,ms,onFresh,mode){
  const k=JSON.stringify(body),kind=PC_KIND[body.action],e=mode!=='force'&&kind&&pcGet(k);
  if(!e)return pcFetch(body,ms);
  const same=r=>!!r&&pcRev(kind,r)===e.rev;
  if(mode==='check'||(__revs&&Date.now()-__revsAt<REV_FRESH))return revsNow(mode==='check').then(r=>same(r)?e.j:pcFetch(body,ms),()=>pcFetch(body,ms));
  revsNow().then(r=>{if(!same(r))return pcFetch(body,ms).then(j=>{onFresh&&onFresh(j)})}).catch(()=>{});
  return Promise.resolve(e.j);
}
// 本機資料的下載時間＋「重新下載」
function PcNote({b,at:at0,onForce}){
  const at=at0||(b?pcAt(b):0);if(!at)return null;const d=new Date(at),td=ymd(d)===ymd(new Date());
  return <div className="text-[11px] text-mute mb-2">本機資料 <span className="num">{td?'':fmtDate(ymd(d))+' '}{String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}</span> 下載・雲端沒有異動就不重新下載・<button type="button" className="underline text-sageD" onClick={onForce}>重新下載</button></div>;
}
async function fetchAtt(ym,force,onFresh){
  const use=j=>{const s=syncGet();s.fixN=(j.pending||[]).length;syncSet(s);cloud.emit();return j};
  return use(await preCall({action:'attlist',ym},40000,j=>{use(j);onFresh&&onFresh(j)},force===true?'check':force||''));
}
let __preAt=0;
function peoplePrefetch(){   // 老闆頁開啟時一併準備人員頁的資料（本機有、也沒異動就不下載）
  if(!cloudOn()||Date.now()-__preAt<300000)return;__preAt=Date.now();
  const ym=ymd(new Date()).slice(0,7);
  [{action:'applist'},{action:'proflist'},{action:'leavelist'},{action:'leavelist',ym},{action:'custlist'},{action:'attlist',ym}].forEach(b=>{preCall(b,b.action==='attlist'?40000:0).catch(()=>{})});
  loadMemAll();
}

      {P.log.slice(0,8).map((x,i)=><div key={i} className="text-xs py-1 border-b border-line last:border-0"><span className="num text-mute mr-2">{x.t}</span>{P.tags[x.tag]||x.tag} <span className="num">{x.n}</span> 人・{x.title?'【'+x.title+'】':''}{x.text}{x.err&&<span className="text-warn">（{x.err}）</span>}</div>)}</div>}

function SupportCounterCard({S,date,bump,closed,expenses}){

  if(!list.length)return null;

  return (<Card className="p-3 mb-2 text-sm">

  </Card>);
}

    <div><div className="text-xs text-mute mb-1">薪資型態</div><div className="grid grid-cols-2 gap-2">{[['monthly','月薪'],['none','無底薪（支援）']].map(([k,l])=><button key={k} type="button" className={'h-10 rounded-lg border text-sm '+(f.payType===k?'bg-sage border-sage text-white':'bg-card border-line')} onClick={()=>setF(Object.assign({},f,{payType:k}))}>{l}</button>)}</div></div>
    {f.payType==='monthly'?<label className="block"><div className="text-xs text-mute mb-1">月薪</div><input className={inp} inputMode="numeric" value={f.salary} onChange={e=>setF(Object.assign({},f,{salary:e.target.value.replace(/\D/g,'')}))}/><div className="text-[11px] text-mute mt-1">遲到早退按分鐘、事假全扣、病假扣半（日薪＝月薪÷30，時薪＝日薪÷8）。</div></label>
      :<label className="block"><div className="text-xs text-mute mb-1">時薪</div><input className={inp} inputMode="numeric" value={f.hourly} onChange={e=>setF(Object.assign({},f,{hourly:e.target.value.replace(/\D/g,'')}))}/><div className="text-[11px] text-mute mt-1">支援人員：時薪 × 實際時數，每天下班從櫃台現金支付；不記異常、不扣薪。</div></label>}
    {err&&<div className="text-xs text-warn">{err}</div>}
    <div className="grid grid-cols-[1fr_2fr] gap-2"><button className="h-9 rounded-lg border border-line bg-card" onClick={()=>setEd(false)}>取消</button><button className="h-9 rounded-lg bg-sage text-white disabled:opacity-50" disabled={busy} onClick={save}>{busy?'儲存中…':'儲存'}</button></div>
    <div className="text-[11px] text-mute">薪資只存在試算表，不會出現在公開的開通名單。</div>
  </div>);
}
