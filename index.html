function LineGate(){
  const [st,setSt]=useState('loading');   // loading / error / notmember / profile / welcome / view
  const [err,setErr]=useState('');
  const [prof,setProf]=useState(null);
  const [mem,setMem]=useState(null);
  const [me,setMe]=useState(null);
  const [view,setView]=useState(null);
  const [pre,setPre]=useState(null);
  const [real,setReal]=useState(null);   // 本人的 userId 與名單（歡迎畫面的測試分身用）
  const run=async()=>{
    setSt('loading');setErr('');
    try{
      const L=await liffReady();
      if(new URLSearchParams(location.search).has('liff.state'))return;   // LIFF 中繼頁
      if(!L.isLoggedIn()){L.login({redirectUri:location.href});return}
      let p=await L.getProfile();
      let list=[];
      try{list=await fetchMembers(true)}catch(e){if(String(e.message)!=='nofile')throw new Error('讀取開通名單失敗，請檢查網路後重試')}
      setReal({uid:p.userId,list});
      // v0.1-077：主櫃公務機（店內 iPad 固定登入的 LINE 帳號）→ 直接進主櫃首頁，換人用登入碼
      if(KIOSK_UIDS.includes(p.userId)||list.some(x=>x&&x.uid===p.userId&&x.kiosk)){__kiosk=true;setMe({uid:p.userId,name:'主櫃公務機',code:''});setView('mainc');setSt('view');return}
      const an=altGet();
      if(an){const o=list.find(x=>x&&x.uid===p.userId);   // 只有老闆可以用分身
        if(!altOk(o)){altSwitch(0);return}
        p=Object.assign({},p,{userId:p.userId+an,displayName:'分身'+an})}
      setProf(p);
      const hit=list.find(x=>x&&x.uid===p.userId);
      const m=(hit&&!isApplicant(hit)?hit:null)||hintGet(p.userId);   // 剛核准、GitHub Pages 還沒更新：先用核准時的資料
      // v0.1-053：沒開通 → 線上申請頁（第一次來：成為會員／成為工作夥伴；應徵中：直接顯示目前階段）
      if(!m){setPre(hit||null);setSt(GAS_URL?'join':'notmember');return}
      setMem(m);
      let mine=meGet(p.userId);
      // 線上開通的人：名單上已有姓名（老師還有編號）→ 不用再設定，直接進歡迎畫面
      if(!mine&&m.name&&(m.tc||!memberInfo(m).roles.includes('teacher'))){mine={uid:p.userId,code:m.tc||'',name:m.name,at:Date.now()};meSet(mine)}
      // v0.1-054：編號以名單為準（老闆改了編號，這支手機也跟著改）
      if(mine&&m.tc&&String(mine.code)!==String(m.tc)){mine=Object.assign({},mine,{code:String(m.tc)});meSet(mine)}
      setMe(mine);
      // 這台被設為主櫃（店內 iPad）：櫃台人員或老闆登入後直接進主櫃系統，操作人＝登入的人
      let mc=false;try{mc=localStorage.getItem('slowve.mainc')==='1'||localStorage.getItem('slowve.mainc-qr')==='1';localStorage.removeItem('slowve.mainc-qr')}catch(_e){}
      const mi=memberInfo(m);
      // v0.1-076：鎖定的主櫃（或從主櫃首頁掃碼登入）：一律回主櫃；櫃台、主管、老闆直接進入，其他人留在首頁並提示沒有權限
      if(mc){const ok=mi.roles.includes('counter')||mi.admin==='owner'||mi.admin==='manager';__maincAuto=ok;__maincDeny=ok?'':(mi.roles.includes('teacher')&&m.tc?String(m.tc):(m.name||'這個帳號'));setMem(m);setMe(mine||{uid:p.userId,name:m.name||p.displayName,code:m.tc||''});setView('mainc');setSt('view');return}
      // v0.1-121：圖文選單「會員中心」分頁帶 view=guest，工作夥伴直接用客人身分進入
      const wv=new URLSearchParams(location.search).get('view')||(/view=(\w+)/.exec(decodeURIComponent(__ls))||[])[1]||'';
      if(mine&&wv&&viewsOf(m).includes(wv)){setMem(m);setView(wv);setSt('view');return}
      if(mine&&viewsOf(m).length===1){setMem(m);setView(viewsOf(m)[0]);setSt('view');return}   // v0.1-123：只有一種身分（例如會員）直接進入
      setSt(mine?'welcome':'profile');
    }catch(e){setErr(String(e&&e.message||e));setSt('error')}
  };
  useEffect(()=>{run()},[]);
  const views=mem?viewsOf(mem):[];
  const lay=useLayout();
  const pick=v=>{try{localStorage.setItem(VIEW_KEY+altSfx(),v)}catch(_e){}setView(v);setSt('view')};
  if(st==='join')return <JoinOnline pre={pre} prof0={prof}/>;
  if(st==='view'&&view){
    return <RoleView real member={mem} view={view} me={me} mode={lay.mode} sw={{can:views.length>1,go:()=>{setView(null);setSt('welcome')}}} bar={<RoleBar view={view} me={me} wide={lay.mode!=='phone'} canSwitch={views.length>1} onSwitch={()=>{setView(null);setSt('welcome')}}/>}/>;
  }
  return (
    <GateShell>
      {st==='loading'&&<div className="text-center text-mute"><Ld t="確認帳號中…"/></div>}
      {st==='error'&&<Card className="p-4 text-center"><div className="text-warn text-sm whitespace-pre-line mb-3">{err}</div><button className="h-11 px-6 rounded-xl bg-sage text-white" onClick={run}>重試</button></Card>}
      {st==='notmember'&&<Card className="p-5 text-center">
        <div className="text-lg mb-1">{prof?prof.displayName+'，':''}你的帳號尚未開通</div>
        <div className="text-sm text-mute mb-4">請先申請開通帳號，並聯繫店家工作人員或主管完成開通。</div>
        <button className="w-full h-12 rounded-xl bg-sage text-white text-lg" onClick={()=>location.replace('https://liff.line.me/'+LIFF_ID+'?mode=join')}>申請開通帳號</button>
      </Card>}
      {st==='notmember'&&prof&&<UidNote uid={prof.userId}/>}
      {st==='profile'&&mem&&<ProfileForm m={mem} prof={prof} me={me} onSave={x=>{meSet(x);setMe(x);setSt('welcome')}} onCancel={me?()=>setSt('welcome'):null}/>}
      {st==='welcome'&&me&&<Welcome me={me} views={views} onPick={pick} onEdit={mem&&!mem.name?()=>setSt('profile'):null}/>}
      {st==='welcome'&&mem&&GAS_URL&&(memberInfo(mem).admin==='owner'||memberInfo(mem).admin==='manager')&&!memberInfo(mem).roles.includes('counter')&&<div className="mt-6"><KioskCodePanel/></div>}
      {st==='welcome'&&!altGet()&&altOk(mem)&&real&&<AltPicker real={real}/>}
    </GateShell>
  );
}

  ['v0.1-133','10-21','會員資料：「公司備註」改名「客人備註（櫃台）」（只有櫃台、主管、老闆看得到）；新增「客人備註（老師）」，老師在自己的服務明細看得到（只看到自己服務過的客人），櫃台、主管也看得到；在「＋ 新增服務前調查記錄」填寫。主櫃的「老師費用領取」「櫃台上下班」預設收合，點標題展開（GAS gas-4.59）'],
  ['v0.1-132','10-21','會員資料：建檔日期預設為新增當下的日期＋時間，新增「建檔人」（主櫃預設登入的人）；長期身體狀況改成細項點亮（重大疾病：心臟病、癌症、糖尿病、中風、腎臟病；慢性疾病：高血壓、氣喘、關節炎、骨質疏鬆、椎間盤突出），各有「其他」可自行輸入；「這次來店時的身體狀況」、特別注意事項、公司備註移出編輯會員資料，改在「＋ 新增服務前調查記錄」填寫（新增會員存檔後直接接著填），多一個「本次無異狀」；預約・排隊加「↻ 重新整理」按鈕並顯示上次更新時間（GAS gas-4.58）'],
  ['v0.1-131','10-21','主櫃主畫面調整：交接事項、老師費用領取、櫃台上下班移到最後；今日區塊不再整排滿寬，跟其他區塊一樣寬；預約・排隊的今天，已報到（和取消、未到）收合起來，未報到的一眼看得到；開單、預約入場、候位入座的畫面最下面可以選「未買單／先買單」，先買單的訂單仍是服務中，到時直接變已買單；開單、安排客人的備註旁有「指定女生／指定男生」快速按鈕，下方列出之前輸入過的備註（這台記住的＋會員 LINE 預約的備註），點一下加入'],
  ['v0.1-130','10-21','修正：主櫃頁面開著超過 1 小時，LINE 登入過期（IdToken expired），輸入登入碼或同步都會失敗。改成過期前自動重新登入；正在使用中的話，重新登入回來直接回到原本的人，不用再輸入登入碼。'],
  ['v0.1-129','10-21','修正：在電腦瀏覽器打開 ?mainc=1，LINE 登入完回來會停在店家介紹頁，進不了主櫃（登入回來的網址把參數包在 liff.state 裡）。'],
  ['v0.1-128','10-21','圖文選單改成大型（2500×1686），下排三格：地圖導航、撥打電話、Instagram，連結在設定頁「店家資訊」修改；LINE 訊息額度改讀官方帳號實際用量（含後台群發）；設定頁新增「LINE 群發」：依身分（會員、老師、櫃台、主管、全部工作夥伴、全部）發送（GAS gas-4.57）。'],
  ['v0.1-127','10-21','會員中心的資料存在手機上，顯示「最後檢查」和「資料更新於」的時間；打開時先問雲端有沒有變，有變才重新下載（預約、消費紀錄、價目表）。按「重新整理」一律重新下載（GAS gas-4.56）。'],
  ['v0.1-126','10-21','修正：主櫃（?mainc=1）回首頁後重新整理會直接進入，不用再輸入登入碼——改成一律要輸入登入碼。櫃台人員打卡改成按「上班打卡」就直接打卡（不用確認碼）。老闆、主管同時是櫃台時，登入碼只顯示在櫃台人員頁，不在選身分頁重複出現（GAS gas-4.55）。'],
  ['v0.1-125','10-21','會員中心線上預約：拿掉時間下方「XX 號老師這個時段沒有空」的紅字（不是指選的時段，容易誤會）；改成指定的老師整天都沒空時才提示。'],
  ['v0.1-124','10-21','客人頁改名「會員中心」；線上預約的指定老師改成選編號（列出那天有上班、沒請整天假的老師），選了老師時間只顯示那位老師有空的時段；備註提示改成「哪裡痛？例如頸肩」（GAS gas-4.54）。'],
  ['v0.1-123','10-21','客人頁（會員中心）上線（GAS gas-4.53）：我的預約（預約前 3 小時以前可以自己取消）、線上預約（明天起 14 天，跟主櫃事先預約一樣的名額規則，送出就成立，可輸入指定老師編號）、我的消費紀錄、價目表、店家資訊。老闆頁設定新增「線上預約」開關。'],
  ['v0.1-122','10-20','圖文選單套用修正（GAS gas-4.52）：測試分身、格式不對的帳號不綁定（之前會讓 LINE 整批拒絕）；個別綁不上的人（例如封鎖官方帳號）略過並顯示人數；自動清掉之前套用失敗留下的選單。'],
  ['v0.1-121','10-20','工作夥伴的圖文選單上方加分頁「工作夥伴／會員中心」（LINE 分頁切換，不開網頁、不用訊息額度）；會員中心分頁點下方直接用客人身分進入（GAS gas-4.51）。'],
  ['v0.1-120','10-20','LINE 圖文選單依身分自動切換（GAS gas-4.50）：還沒加入的人看到「加入會員」（右下角「加入工作夥伴」），會員看到「進入會員中心」，工作夥伴看到「門店系統」。老闆頁設定 → LINE 圖文選單按「套用」；開通名單有變動會自動換選單。從圖文選單點加入會員／加入工作夥伴，直接進對應的表單。'],
  ['v0.1-119','10-20','老師費用領取確認：領取日起（上期 20 號、下期次月 5 號），老師頁可以點「我已領取」；主櫃在領取期間顯示「老師費用領取」，看得到誰點了、幾點點的（不含金額）；老闆月報的老師統計也會標「老師已點」。'],
  ['v0.1-118','10-20','老師牌況照預覽圖第 5 版：上牌、服務中接成一排（中間空一格），未上牌、請假、下牌一排；每種牌第一張上面寫分類名稱，沒人的放透明虛框。壓牌改成只算名額（2 小時內不指定老師的預約，白底紅框），老點橘牌，現場客照樣頭班先出。服務中紅卡依開始時間排，點了可到時回牌。新增臨時請假（櫃台登記事假／病假，自動寫交接事項，老師補假單後自動完成）。'],
  ['v0.1-117','10-20','老師牌況：「可接客」改叫「上牌」，休息中不再另外一排，原地變綠色；服務中紅色、晚到／未到未請黃色、下牌灰色。iPad 上老師牌況移到最上面（在今日單數那條上方），分兩排：上牌｜服務中、請假｜未上牌。'],
  ['v0.1-116','10-19','主櫃「老師牌況」收進人員上下牌：多兩排「未上牌」（依預計到的時間排，有登記晚到用晚到時間，最前面是下一位；未到未請直接註明在編號下）、「今天請假」。點編號先上牌／下牌，後面是休息、準下、短單、登記晚到。「人員上牌／打卡」改成只剩櫃台上下班。'],
  ['v0.1-115','10-19','網址沒帶參數時改顯示店家介紹頁（服務項目與價格、平日限定、加購、營業時間、電話、地址地圖、用 LINE 加入會員），不讓路人直接進老闆頁；已經在用老闆頁的裝置照舊，新裝置用 ?owner=1 開一次就會記住'],
  ['v0.1-114','10-19','預約・排隊合併：現場、電話、事先預約的客人都用「＋ 安排客人」。先選人數、項目，今天由系統依目前狀況（服務中、其他預約、班表、請假、休息、短單、準下、床位／腳位與清潔時間）給出最快可以入場的時間（10 分鐘為單位）與其他選擇，其他日期看半點空檔；客人接受就留位子並壓牌，在店等候的客人提早有空時提示「現在就可以入場」；客人沒接受也記一筆。拿掉獨立的現場候位（GAS gas-4.47）'],
  ['v0.1-112','10-19','主櫃新增「登記晚到」：老師來電說會晚到（例如塞車晚 2 小時），在主櫃登記預計到的時間與原因，從「未到未請」移到「已通知晚到」；超過預計時間還沒上牌會變紅；今天的預約名額在預計到之前不算這位老師（A13）'],
  ['v0.1-111','10-19','主櫃老師牌況新增「未到未請」：班表的上牌時間已過、還沒上牌、也沒請假的老師，顯示晚了多久；另外列出今天請假的老師（全天或時段）與還沒設定上牌時間的老師'],
  ['v0.1-110','10-19','主櫃新增預約（14 天內，依班表、請假、床椅、清潔時間算名額並保留現場名額）、壓牌（今天的預約依輪班壓牌，被壓的老師預約前空檔夠才接現場）、報到開單（遲到時間從服務時間扣除）、現場候位（入座開單）；老師牌況可以設休息（保留順位）、準下（不超過下牌時間）、短單（不排 90 分以上），開單時檢查；刮痧、拔罐另加 30 分（GAS gas-4.45）'],
  ['v0.1-109','10-19','交接事項：不是寫的人改狀態、又不是「已完成」時，一定要寫處理說明；每次改狀態都留處理紀錄。主櫃有人登入時，別人寫、還沒完成的交接事項會先跳出來，逐項點狀態（非已完成要寫說明）後才能操作（GAS gas-4.44）'],
  ['v0.1-108','10-19','主櫃新增「交接事項」：櫃台、主管、老闆隨時都能寫，不限交班時；交班點清、老闆頁日結時列在下方；每一項旁邊可以改狀態（待處理／處理中／已完成），沒完成的一直留著，已完成的 3 天後不再列出（GAS gas-4.43）'],
  ['v0.1-107','10-18','主櫃的會員資料也存在本機，向雲端確認異動時間，一樣就不重新下載（GAS gas-4.40）；設定新增「主櫃系統測試上線」：主櫃用真的畫面，上牌、開單、到時、買單都能操作但只存在主櫃那台、不上傳，可清除；會員資料是真的'],
  ['v0.1-106','10-18','主櫃規則更新：輪班順序、遲到扣時間、老師上下牌由主櫃點、臨時晚到早退要主櫃確認、開單選座位、刮痧拔罐加 30 分、營業與預約（C）、班表與請休假（D）、買單（E）。規則內容改放在 GAS，要 LINE 登入且是店內老闆、主管、老師（主櫃另含櫃台）才看得到；老闆頁設定的主櫃規則區塊要用 LINE 登入才顯示（GAS gas-4.39）'],
  ['v0.1-105','10-18','主櫃上線第一階段：老闆打開「主櫃系統已上線」後，主櫃改用真的資料。老師上牌／下牌直接點；開單選項目、老師（自動帶輪班下一位）、床位／腳位、客人；訂單服務中 → 到時 → 買單（現金，可勾 IG 打卡折價券）；老師牌況（可接客依輪班、服務中、下牌）與座位（服務中、清潔中）即時顯示；當天資料自動上傳雲端，老闆頁看得到，老闆修正時自動合併（GAS gas-4.38）'],
  ['v0.1-104','10-18','主櫃一律用登入碼登入（公務機，以及老闆、主管 LINE 登入並鎖定的主櫃裝置），不再用 QR Code。登入碼在設定的時間內（4 小時、6 小時或 1 天，老闆在「設定 → 主櫃系統」選）可以重複使用，時間到自動換下一組；手機第一次取得時連下一組一起存在本機。另有「重設所有登入碼」（GAS gas-4.37）'],
  ['v0.1-103','10-18','老師應徵頁：年資 5 年以上細分為 5～9、10～19、20～29、30 年以上；擅長項目加整復、運動按摩；經歷改成 4 個選填欄位（前一份同業的工作地點、店家、離職原因、其他）；緊急聯絡人的關係改下拉選單。老闆頁「應徵 → 已錄取」可按「發通知」再用 LINE 提醒對方上線完成開通（GAS gas-4.36）'],
  ['v0.1-102','10-15','老闆頁人員資料（應徵、老師／櫃台資料、請假、會員、差勤）下載後存在本機；切換頁面時先顯示本機資料，向雲端確認異動時間，一樣就不重新下載，有異動才下載更新（GAS gas-4.35）。各區塊顯示本機資料的下載時間，可按「重新下載」；登出會清掉本機資料'],
  ['v0.1-101','10-15','會員資料：點搜尋結果會出現「＋ 新的訂單」與「編輯會員資料」（老闆頁按新的訂單會直接開今天的訂單並帶入客人）；表單的「填表日期」改名「建檔日期」並移到最後；手機文字置中；身體狀況只有重大疾病、慢性疾病是長期勾選，其他（懷孕、骨折、手術、發燒、皮膚紅腫）改成點一下就記一行「今天日期＋項目」，可逐筆刪除（GAS gas-4.33）'],
  ['v0.1-100','10-15','修正 10～12 月生日搜尋不到：4 碼數字（例如 1012）也會比對生日月日，打西元年（例如 1990）也能找出生年'],
  ['v0.1-099','10-15','會員資料列表只顯示編號、手機、名稱（例：江先生 800），身體狀況、備註、生日改到點開後才看得到；搜尋可以用手機末三碼（800）；搜尋框提示改成「編號、手機、末3碼、生日、姓」，下方附搜尋範例'],
  ['v0.1-098','10-15','日期／時間選擇器的文字改成垂直、水平置中；修正 iPhone 上空白日期仍顯示今天的日期'],
  ['v0.1-097','10-15','修正 iPhone 上日期／時間選擇器超出版面；空白的日期不再顯示今天的日期（iOS 會自動帶今天，容易誤以為已填），改顯示灰色「請選擇日期」'],
  ['v0.1-096','10-15','主櫃系統的「會員資料」移到最上面；點會員可以看到以往的消費紀錄（日期、單號、項目、老師、金額、折價券，來店次數與合計），老闆頁也一樣（GAS gas-4.32）'],
  ['v0.1-095','10-15','讀取中、載入中、確認中等文字前面加上轉動的載入圖示；面試、錄取的 LINE 通知改成卡片訊息（附「查看詳細資訊」「進入門店系統」按鈕），面試時間、地點改在系統的應徵進度頁查看（GAS gas-4.31）'],
  ['v0.1-094','10-14','測試分身新增兩個 LINE 通知開關：老闆、主管會收到分身的應徵通知；分身本身的面試、錄取通知會發到開分身的那個人本人（userId 扣掉最後一碼），訊息開頭加【測試】（GAS gas-4.30）'],
  ['v0.1-093','10-14','公務機從加入會員的連結打開時，也會自動轉到主櫃首頁；登入頁最下方顯示版本號，方便確認手機上是不是最新版'],
  ['v0.1-092','10-14','主櫃公務機綁定店內 iPad 的 LINE 帳號：公務機打開系統直接進主櫃首頁、用登入碼換人；拿掉老闆、主管切換身分頁的「主櫃（公務機）」預覽入口（GAS gas-4.29：只有公務機可以兌換登入碼）'],

      </div>}
    </div>
  );
}

/* ========== 雲端同步（GAS → Google 試算表） ==========
   設定（只存在這台裝置、不進備份）：localStorage['slowve.cloud']={url,key,name}（name＝這台裝置的名稱，例：小美主管）
   同步狀態：localStorage['slowve.sync']={dirty:{key:時間}, rev:{key:雲端版本}, sUa, pushAt, pullAt, cursor, err}
     key：'d:2026-10-06'（一天）／'p:2026-10'（該月薪資加扣項）／'s'（設定）
   多位主管各自登打：
   - 每台裝置記住每一天「上次同步時的雲端版本」（rev）。上傳時若雲端在這之後被別人改過、且內容不同 → 衝突。
   - 衝突時跳出提醒，比較本機與雲端的營業額：選「上傳本機資料」→ 覆蓋雲端；選「以雲端為主」→ 下載雲端資料覆蓋本機。
   - 設定（老師編號清單等）衝突時自動合併，不詢問。
   - 開啟時與每 3 分鐘自動下載別人的更新；本機沒有未上傳修改的日子直接更新，有的話一樣跳提醒。 */
/* GAS 網址（公開沒關係）：部署後把 /exec 網址貼在下面這行。
   權限不靠網址：老闆／主管用 LINE 登入，GAS 向 LINE 驗證身分並查 members.json 的 admin（owner／manager），
   通過後發 30 天的通行證（tok）存在這台裝置；沒有 LINE 的裝置可在設定頁「進階」改用連線金鑰。 */
const GAS_URL='https://script.google.com/macros/s/AKfycbzUwtSI4pmPtJaXMEQzzjwMwzXdc1zKJflTD8RYISNBvhz4G-lrH3jUASq-TSXDIQc/exec';
const CLOUD_KEY='slowve.cloud',SYNC_KEY='slowve.sync';
// 網址以程式內建的 GAS_URL 為準；只有「進階：連線金鑰」模式才使用自己填的網址（避免舊版留下的網址蓋過內建網址）
const cloudCfg=()=>{let c={};try{c=JSON.parse(localStorage.getItem(CLOUD_KEY)||'null')||{}}catch(_e){}return Object.assign({},c,{url:((c.key&&c.url)?c.url:(GAS_URL||c.url||'')).trim()})};
const cloudSave=patch=>{let c={};try{c=JSON.parse(localStorage.getItem(CLOUD_KEY)||'null')||{}}catch(_e){}try{localStorage.setItem(CLOUD_KEY,JSON.stringify(Object.assign(c,patch)))}catch(_e){}};
const tokValid=c=>!!(c.tok&&c.tokExp>Date.now());
const cloudOn=()=>{const c=cloudCfg();return !!(c.url&&(c.key||tokValid(c)))};
const syncGet=()=>{try{return Object.assign({dirty:{},rev:{}},JSON.parse(localStorage.getItem(SYNC_KEY)||'null')||{})}catch(_e){return {dirty:{},rev:{}}}};
const syncSet=x=>{try{localStorage.setItem(SYNC_KEY,JSON.stringify(x))}catch(_e){}};
const SETTINGS_LOCAL=['device','lastBackupAt','backupPwd'];   // 各裝置自己的設定，不上傳
const cloudSettings=S=>{const x=clone(S);SETTINGS_LOCAL.forEach(k=>delete x[k]);return x};
const noUa=o=>{const x=Object.assign({},o||{});delete x.ua;return JSON.stringify(x)};
const ckey=c=>c.type==='day'?'d:'+c.date:c.type==='pay'?'p:'+c.ym:'s';

const cloud={
  busy:false,timer:null,subs:new Set(),pend:[],dataVer:0,
  emit(){const st=this.state();this.subs.forEach(f=>{try{f(st)}catch(_e){}})},
  state(){const s=syncGet();const c=cloudCfg();return {url:!!c.url,who:tokValid(c)?c.who:null,tokExp:c.tokExp,keyMode:!!c.key,on:cloudOn(),busy:this.busy,n:Object.keys(s.dirty||{}).length,pushAt:s.pushAt,pullAt:s.pullAt,err:s.err,joinN:s.joinN||0,leaveN:s.leaveN||0,profN:s.profN||0,fixN:s.fixN||0,pend:this.pend.slice(),dataVer:this.dataVer}},
  mark(k){const s=syncGet();s.dirty[k]=Date.now();if(k==='s')s.sUa=Date.now();syncSet(s);this.emit();this.soon()},
  soon(ms){if(!cloudOn())return;clearTimeout(this.timer);this.timer=setTimeout(()=>this.push(),ms==null?3000:ms)},
  // 呼叫 GAS：同一台裝置一次只送一個請求（排隊），遇到暫時性錯誤（HTTP 404／5xx、網路中斷、回傳不是 JSON）自動重試 2 次
  q:Promise.resolve(),
  call(body,ms){
    const run=()=>this.callRetry(body,ms);
    const p=this.q.then(run,run);this.q=p.catch(()=>{});return p;
  },
  async callRetry(body,ms){
    const waits=[1500,4000];let last;
    for(let i=0;i<=waits.length;i++){
      try{return await this.callOnce(body,ms)}
      catch(e){last=e;if(!e.transient||i===waits.length)break;await new Promise(r=>setTimeout(r,waits[i]))}
    }
    throw last;
  },
  async callOnce(body,ms){
    const c=cloudCfg();if(!c.url)throw new Error('尚未設定 GAS 網址');
    if(body.idToken&&body.action!=='auth'&&altGet())body=Object.assign({},body,{alt:altGet()});   // 測試分身
    if(body.idToken&&!(body.action==='kiosk'&&body.op==='pass')){const k=ktGet(),sb=tokSub(body.idToken);if(k&&(!sb||sb===k.uid))body=Object.assign({},body,{kt:k.kt})}   // v0.1-143 公務機通行證
    const auth=(body.action==='auth'||body.idToken)?{}:c.key?{key:c.key}:tokValid(c)?{tok:c.tok}:null;   // 申請開通用 LINE ID Token，不需要通行證
    if(!auth)throw new Error('NEED_LOGIN：請先用 LINE 登入');
    const ctl=typeof AbortController!=='undefined'?new AbortController():null;
    const t=ctl&&setTimeout(()=>ctl.abort(),ms||25000);
    const tr=m=>{const e=new Error(m);e.transient=true;return e};
    try{
      let r;
      try{
        r=await fetch(c.url,{method:'POST',body:JSON.stringify(Object.assign(auth,{device:loadSettings().device,dname:c.name||(c.who&&c.who.name)||''},body)),
          headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow',signal:ctl?ctl.signal:undefined});
      }catch(e){if(e&&e.name==='AbortError')throw new Error('連線逾時，請稍後再試');throw tr('網路連線失敗，請檢查網路')}
      const txt=await r.text();let j=null;try{j=JSON.parse(txt)}catch(_e){}
      if(!j)throw tr(r.ok?'GAS 暫時沒有正常回應，請稍後再試':'連線失敗（HTTP '+r.status+'，已自動重試；GAS 偶爾會暫時無法回應，請稍後再按一次）');
      if(!j.ok){const m=j.error||'GAS 發生錯誤';if(/^NEED_LOGIN/.test(m)){cloudSave({tok:'',tokExp:0});this.emit()}throw new Error(m.replace(/^NEED_LOGIN：/,''))}
      if(j.revs&&!body.idToken){revsPut(j.revs);   // v0.1-102：各類資料的異動時間
        if((body.action==='custsave'||body.action==='custdel')&&j.list)pcSet(JSON.stringify({action:'custlist'}),{rev:pcRev('cust',j.revs),at:Date.now(),j:{list:j.list}})}
      return j;
    }finally{t&&clearTimeout(t)}
  },
  // LINE 登入 → 取得 ID Token → GAS 驗證並發通行證。interactive＝沒登入時導到 LINE 登入頁
  async login(interactive){
    const c=cloudCfg();if(!c.url)throw new Error('尚未設定 GAS 網址');
    const L=await liffReady();
    if(!L.isLoggedIn()){if(interactive)L.login({redirectUri:location.href.replace(/[?&](code|state|liffClientId|liffRedirectUri)=[^&]*/g,'')});return null}
    const idToken=L.getIDToken&&L.getIDToken();
    if(!idToken)throw new Error('取不到 LINE 身分，請確認 LIFF 已勾選 openid 權限');
    const j=await this.call({action:'auth',idToken},30000);
    cloudSave({tok:j.tok,tokExp:j.exp,who:{uid:j.uid,name:j.name,role:j.role,roleLabel:j.roleLabel}});
    const s=syncGet();s.err='';syncSet(s);this.emit();
    return j;
  },
  logout(){cloudSave({tok:'',tokExp:0,who:null});pcClear();this.emit()},
  // 開啟時：還沒有有效通行證、但 LINE 已登入 → 自動取得；通行證剩不到 7 天也自動換新
  async autoLogin(){
    const c=cloudCfg();if(!c.url||c.key)return;
    if(tokValid(c)&&c.tokExp-Date.now()>7*864e5)return;
    try{await this.login(false)}catch(_e){}
  },
  localData(k){
    if(k==='s')return cloudSettings(loadSettings());
    if(k.startsWith('d:')){const date=k.slice(2);return loadMonth(monKey(date)).days[date.slice(8)]||null}
    if(k.startsWith('p:'))return loadMonth(k.slice(2)).pay||{};
    return null;
  },
  itemFor(k,s){
    const base=(s.rev||{})[k]||0;
    if(k==='s')return {type:'settings',base,ua:s.sUa||0,data:this.localData('s')};
    if(k.startsWith('d:')){const d=this.localData(k);return d?{type:'day',date:k.slice(2),base,ua:d.ua||0,data:d}:null}
    if(k.startsWith('p:')){const md=loadMonth(k.slice(2));return {type:'pay',ym:k.slice(2),base,ua:md.payUa||0,data:md.pay||{}}}
    return null;
  },
  // 寫入雲端版本到本機（不標記待上傳）
  applyCloud(k,data,rev){
    const s=syncGet();
    if(k.startsWith('d:')){const date=k.slice(2);const ym=monKey(date);const md=loadMonth(ym);md.days[date.slice(8)]=Object.assign({},data);ls.set('m-'+ym,md)}
    else if(k.startsWith('p:')){const ym=k.slice(2);const md=loadMonth(ym);md.pay=data||{};md.payUa=Date.now();ls.set('m-'+ym,md)}
    else if(k==='s'){const loc=loadSettings();ls.set('settings',mergeSettings(Object.assign({},data,SETTINGS_LOCAL.reduce((o,x)=>(o[x]=loc[x],o),{}))))}
    s.rev[k]=rev;delete s.dirty[k];syncSet(s);this.dataVer++;
  },
  // 設定衝突：以雲端為底，老師編號、支出名稱等清單合併，再上傳一次
  mergeSettings(c){
    const loc=cloudSettings(loadSettings());const m=Object.assign({},c.data);
    ['teachers','expNames','expCats'].forEach(f=>{m[f]=Array.from(new Set([].concat(loc[f]||[],c.data[f]||[])))});
    this.applyCloud('s',m,c.rev);
    if(noUa(m)!==noUa(c.data))this.mark('s');
  },
  addPend(c){if(!this.pend.find(x=>x.k===c.k))this.pend.push(c)},
  // 使用者決定：local＝上傳本機覆蓋雲端；cloud＝以雲端為主（下載覆蓋本機）
  resolve(k,choice){
    const c=this.pend.find(x=>x.k===k);if(!c)return;
    this.pend=this.pend.filter(x=>x.k!==k);
    if(choice==='local'){const s=syncGet();s.rev[k]=c.rev;s.dirty[k]=Date.now();syncSet(s);this.soon(300)}
    else this.applyCloud(k,c.data,c.rev);
    this.emit();
  },
  async push(force){
    if(this.busy||!cloudOn())return;
    if(typeof navigator!=='undefined'&&navigator.onLine===false){const s=syncGet();s.err='目前離線，恢復網路後會自動上傳';syncSet(s);this.emit();return}
    const s0=syncGet();const keys=Object.keys(s0.dirty).filter(k=>!this.pend.find(x=>x.k===k)).slice(0,40);
    if(!keys.length)return;
    this.busy=true;this.emit();
    try{
      const items=keys.map(k=>this.itemFor(k,s0)).filter(Boolean);
      const sent={};keys.forEach(k=>sent[k]=s0.dirty[k]);
      const j=await this.call({action:'push',force:!!force,items});
      const s=syncGet();
      (j.saved||[]).forEach(x=>{const k=typeof x==='string'?x:x.k;if(x.rev)s.rev[k]=x.rev;if(s.dirty[k]&&s.dirty[k]<=sent[k])delete s.dirty[k]});
      keys.forEach(k=>{if(!this.localData(k)&&s.dirty[k]<=sent[k])delete s.dirty[k]});
      s.pushAt=Date.now();s.err='';syncSet(s);
      (j.conflicts||[]).forEach(c=>{c.k=c.k||ckey(c);if(c.type==='settings')this.mergeSettings(c);else this.addPend(c)});
      this.busy=false;this.emit();
      if(Object.keys(syncGet().dirty).some(k=>!this.pend.find(x=>x.k===k)))this.soon(500);
    }catch(e){
      const s=syncGet();s.err=String(e.message||e);syncSet(s);this.busy=false;this.emit();
      this.soon(60000);   // 失敗：一分鐘後再試
    }
  },
  markAll(){
    const s=syncGet();const now=Date.now();
    slowveKeys().filter(k=>/^slowve-m-\d{4}-\d{2}$/.test(k)).forEach(k=>{
      const ym=k.slice(9);const md=loadMonth(ym);
      Object.keys(md.days||{}).forEach(dd=>{s.dirty['d:'+ym+'-'+dd]=now});
      if(md.pay&&Object.keys(md.pay).length)s.dirty['p:'+ym]=now;
    });
    s.dirty.s=now;s.sUa=s.sUa||now;syncSet(s);this.emit();
  },
  // 下載：full＝全部重新比對；否則只拿上次下載之後雲端有變動的
  async pull(full){
    if(this.busy)return null;
    this.busy=true;this.emit();
    try{
      const s0=syncGet();
      const j=await this.call({action:'pull',since:full?0:(s0.cursor||0)},60000);
      let nd=0,np=0,ns=0,nc=0;
      const handle=(k,rec)=>{
        const s=syncGet();
        if((s.rev||{})[k]===rec.rev)return;                       // 本機已是這個版本
        const loc=this.localData(k);
        if(loc&&noUa(loc)===noUa(rec.data)){s.rev[k]=rec.rev;delete s.dirty[k];syncSet(s);return}   // 內容一樣
        if(s.dirty[k]&&k!=='s'){this.addPend({k,type:k[0]==='d'?'day':'pay',date:k[0]==='d'?k.slice(2):undefined,ym:k[0]==='p'?k.slice(2):undefined,rev:rec.rev,by:rec.by,data:rec.data});nc++;return}
        if(k==='s'&&s.dirty.s){this.mergeSettings({data:rec.data,rev:rec.rev});ns++;return}
        this.applyCloud(k,rec.data,rec.rev);
        if(k[0]==='d')nd++;else if(k[0]==='p')np++;else ns++;
      };
      (j.days||[]).forEach(x=>handle('d:'+x.date,x));
      (j.pay||[]).forEach(x=>handle('p:'+x.ym,x));
      if(j.settings)handle('s',j.settings);
      const s=syncGet();s.cursor=j.at||Date.now();s.pullAt=Date.now();s.err='';if(j.joinN!=null)s.joinN=j.joinN;if(j.leaveN!=null)s.leaveN=j.leaveN;if(j.profN!=null)s.profN=j.profN;if(j.fixN!=null)s.fixN=j.fixN;syncSet(s);
      this.busy=false;this.emit();
      return {nd,np,ns,nc,total:(j.days||[]).length};
    }catch(e){const s=syncGet();s.err=String(e.message||e);syncSet(s);this.busy=false;this.emit();throw e}
  },
};
if(typeof window!=='undefined'){
  window.addEventListener('online',()=>cloud.soon(1000));
  setInterval(()=>{if(cloudOn()&&cloud.state().n>0)cloud.push()},60000);                       // 有待上傳的就每分鐘再試
  setInterval(()=>{if(cloudOn()&&!cloud.busy)cloud.pull(false).catch(()=>{})},180000);           // 每 3 分鐘下載其他主管的更新
}
function useCloud(){
  const [st,setSt]=useState(()=>cloud.state());
  useEffect(()=>{const f=x=>setSt(x);cloud.subs.add(f);return ()=>cloud.subs.delete(f)},[]);
  return st;
}
const clockText=ts=>{if(!ts)return '—';const d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
function cloudChip(st){
  if(st.pend.length)return {t:'☁ 待確認 '+st.pend.length,c:'bg-warnL text-warn'};
  if(st.busy)return {t:'☁ 同步中…',c:'bg-sageL text-sageD'};
  if(st.err&&st.n)return {t:'☁ 未同步 '+st.n,c:'bg-warnL text-warn'};
  if(st.n)return {t:'☁ 待上傳 '+st.n,c:'bg-brownL text-brown'};
  return {t:'☁ 已同步',c:'bg-sageL text-sageD'};
}

/* 衝突提醒：同一天本機與雲端不同（多位主管各自登打）→ 比較營業額，選上傳本機或以雲端為主 */
function CloudConflict({S}){
  const st=useCloud();
  const c=st.pend[0];
  if(!c)return null;
  const loc=cloud.localData(c.k);
  let L,R,title;
  if(c.type==='day'){
    const a=statsOf((loc&&loc.orders)||[],S),b=statsOf((c.data&&c.data.orders)||[],S);
    const ea=expStatsOf(loc&&loc.expenses).total,eb=expStatsOf(c.data&&c.data.expenses).total;
    L={amt:a.amt,n:a.n,exp:ea,closed:!!(loc&&loc.close)};R={amt:b.amt,n:b.n,exp:eb,closed:!!(c.data&&c.data.close)};
    title=fmtDate(c.date)+' 的日報表雲端已有資料';
  }else{
    const sum=p=>Object.values(p||{}).reduce((s,x)=>s+(x.adj||[]).reduce((t,j)=>t+(Number(j.amt)||0),0),0);
    const cnt=p=>Object.values(p||{}).reduce((s,x)=>s+(x.adj||[]).length,0);
    L={amt:sum(loc),n:cnt(loc)};R={amt:sum(c.data),n:cnt(c.data)};
    title=Number(c.ym.slice(5))+' 月的薪資加扣項雲端已有資料';
  }
  const Col=({h,x,tone})=>(
    <div className={'rounded-xl border px-3 py-2 '+tone}>
      <div className="text-xs text-mute mb-1">{h}</div>
      <div className="serif text-2xl num">{money(x.amt)}</div>
      <div className="text-xs text-mute num">{c.type==='day'?x.n+' 單'+(x.exp?'・支出 '+money(x.exp):'')+(x.closed?'・已日結':''):x.n+' 項加扣項'}</div>
    </div>);
  return (
    <div className="fixed inset-0 z-[60] bg-black/50 flex items-center justify-center px-5">
      <div className="w-full max-w-sm bg-card rounded-2xl p-5 shadow-xl">
        <div className="text-lg font-semibold mb-1">{title}</div>
        <div className="text-sm text-mute mb-3">{c.by?'雲端資料由「'+c.by+'」上傳，':''}與這台裝置上的{c.type==='day'?'營業額':'金額'}{L.amt===R.amt?'相同，但內容不同（例如老師編號、品項或備註）':'不一樣'}。</div>
        <div className="grid grid-cols-2 gap-2 mb-3"><Col h="本機" x={L} tone="border-sage bg-sageL/40"/><Col h="雲端" x={R} tone="border-brown/40 bg-brownL/40"/></div>
        <div className="text-sm mb-4">是否要上傳本機的資料？<br/><span className="text-xs text-mute">不上傳就以雲端資料為主，將會下載雲端資料覆蓋你這台裝置上的這{c.type==='day'?'一天':'個月'}。</span></div>
        <button className="w-full h-12 rounded-xl bg-sage text-white mb-2" onClick={()=>cloud.resolve(c.k,'local')}>上傳本機資料（覆蓋雲端）</button>
        <button className="w-full h-12 rounded-xl border border-brown text-brown" onClick={()=>cloud.resolve(c.k,'cloud')}>不上傳，以雲端為主（下載覆蓋本機）</button>
        {st.pend.length>1&&<div className="text-xs text-mute text-center mt-2">還有 {st.pend.length-1} 筆待確認</div>}
      </div>
    </div>
  );
}

function CloudCard({toast,ask,onPulled}){
  const st=useCloud();
  const [name,setName]=useState(()=>cloudCfg().name||'');
  const [adv,setAdv]=useState(()=>!!cloudCfg().key);
  const [akey,setAkey]=useState(()=>cloudCfg().key||'');
  const [aurl,setAurl]=useState(()=>{const c=cloudCfg();return c.url!==GAS_URL?c.url:''});
  const [msg,setMsg]=useState('');
  const afterOn=()=>{cloud.pull(false).then(()=>{onPulled&&onPulled();cloud.soon(500);peoplePrefetch()}).catch(()=>{})};
  const doLogin=async()=>{
    setMsg('LINE 登入中…');
    try{const j=await cloud.login(true);if(!j){setMsg('正在前往 LINE 登入…');return}
      setMsg('✓ 已登入：'+j.name+'（'+j.roleLabel+'）');if(!name){setName(j.name);cloudSave({name:j.name})}afterOn()}
    catch(e){setMsg('✗ '+e.message)}
  };
  const saveAdv=async()=>{
    cloudSave({key:akey.trim(),url:aurl.trim()});setMsg('連線中…');
    try{const j=await cloud.call({action:'ping'});setMsg('✓ 連線成功：'+j.name);cloud.emit();afterOn()}catch(e){setMsg('✗ '+e.message)}
  };
  const pushAll=async()=>{
    if(!await ask({title:'全部上傳（以本機為準）？',msg:'會把這台裝置上所有日期的資料上傳，並覆蓋雲端上同一天的資料（其他主管登打的同一天也會被蓋掉）。',okText:'全部上傳',danger:true}))return;
    cloud.markAll();setMsg('上傳中…');
    let guard=0;while(cloud.state().n>0&&guard++<50){await cloud.push(true);if(cloud.state().err)break}
    const s=cloud.state();setMsg(s.err?'✗ '+s.err:'✓ 已全部上傳');
  };
  const pull=async()=>{
    setMsg('下載中…');
    try{const r=await cloud.pull(true);if(!r){setMsg('');return}
      setMsg('✓ 已下載：更新 '+r.nd+' 天'+(r.np?'、'+r.np+' 個月的加扣項':'')+(r.ns?'、設定':'')+(r.nc?'；'+r.nc+' 筆與本機不同，請確認':'')+'（雲端共 '+r.total+' 天）');onPulled&&onPulled();cloud.soon(500)}
    catch(e){setMsg('✗ '+e.message)}
  };
  if(!st.url)return <div className="text-sm text-warn">尚未設定 GAS 網址：請在 index.html 的 <span className="num">GAS_URL</span> 填入部署後的 /exec 網址。</div>;
  return (
    <div className="text-sm">
      {st.who?
        <div className="rounded-lg bg-sageL px-3 py-2 mb-2 flex items-center gap-2">
          <span className="flex-1">✓ 已用 LINE 登入：<b>{st.who.name}</b>（{st.who.roleLabel}）<span className="block text-xs text-mute num">通行證有效到 {clockText(st.tokExp)}，到期前開啟會自動換新</span></span>
          <button className="text-xs text-mute underline" onClick={()=>{cloud.logout();setMsg('')}}>登出</button>
        </div>:
        !st.keyMode&&<>
          <button className="w-full h-11 rounded-lg bg-[#06C755] text-white mb-1" onClick={doLogin}>用 LINE 登入，啟用雲端同步</button>
          <div className="text-xs text-mute mb-2">只有開通名單（members.json）中「老闆」或「主管」可以同步門店資料；登入一次可用 30 天。</div>
        </>}
      {st.on&&<label className="block mb-2"><div className="text-xs text-mute mb-1">這台裝置的名稱（其他主管看到「由誰上傳」用）</div>
        <input className="w-full h-10 px-3 rounded-lg border border-line bg-card" placeholder={st.who?st.who.name+'（預設用開通名單上的姓名）':'例：小美主管'} value={name} onChange={e=>setName(e.target.value)} onBlur={()=>cloudSave({name:name.trim()})}/></label>}
      {msg&&<div className={'text-xs mb-2 '+(msg[0]==='✗'?'text-warn':'text-sageD')}>{ldTxt(msg)}</div>}
      {st.on&&<>
        <div className="rounded-lg bg-bg border border-line px-3 py-2 mb-2 text-xs num space-y-0.5">
          <div className="flex justify-between"><span className="text-mute">狀態</span><span>{cloudChip(st).t}</span></div>
          <div className="flex justify-between"><span className="text-mute">待上傳</span><span>{st.n} 筆</span></div>
          <div className="flex justify-between"><span className="text-mute">上次上傳</span><span>{clockText(st.pushAt)}</span></div>
          <div className="flex justify-between"><span className="text-mute">上次下載</span><span>{clockText(st.pullAt)}</span></div>
          {st.err&&<div className="text-warn">{st.err}</div>}
        </div>
        <div className="grid grid-cols-3 gap-2">
          <button className="h-10 rounded-lg border border-sage text-sageD disabled:opacity-40" disabled={st.busy||!st.n} onClick={()=>cloud.push()}>立即上傳</button>
          <button className="h-10 rounded-lg border border-sage text-sageD disabled:opacity-40" disabled={st.busy} onClick={pull}>從雲端下載</button>
          <button className="h-10 rounded-lg border border-line disabled:opacity-40" disabled={st.busy} onClick={pushAll}>全部上傳</button>
        </div>
      </>}
      <div className="text-xs text-mute mt-2">啟用後，每次登打、修改、日結都會在幾秒內自動上傳；每 3 分鐘也會自動下載其他主管的更新。同一天若其他主管已上傳、而且和你這台不一樣，會跳出提醒讓你選擇以哪一邊為主。</div>
      <button className="mt-3 text-xs text-mute underline" onClick={()=>setAdv(!adv)}>{adv?'收起進階設定':'進階：沒有 LINE 的裝置改用連線金鑰'}</button>
      {adv&&<div className="mt-2 rounded-lg border border-line px-3 py-2">
        <label className="block mb-2"><div className="text-xs text-mute mb-1">連線金鑰（GAS 指令碼屬性 API_KEY）</div>
          <input type="password" className="w-full h-10 px-3 rounded-lg border border-line bg-card" value={akey} onChange={e=>setAkey(e.target.value)}/></label>
        <label className="block mb-2"><div className="text-xs text-mute mb-1">GAS 網址（留空＝使用程式內建網址）</div>
          <input className="w-full h-10 px-3 rounded-lg border border-line bg-card text-xs" placeholder="https://script.google.com/macros/s/…/exec" value={aurl} onChange={e=>setAurl(e.target.value)}/></label>
        <button className="w-full h-10 rounded-lg border border-sage text-sageD" onClick={saveAdv}>儲存並測試連線</button>
        <div className="text-xs text-mute mt-1">金鑰只存在這台裝置；有填金鑰時以金鑰連線，清空並儲存即改回 LINE 登入。</div>
      </div>}
    </div>
  );
}

/* ========== 版型（依畫面寬度；設定頁可手動指定，只存在這台裝置、不進備份） ==========
   phone：未滿 768｜wide：768 以上（雙欄）｜xwide：1100 以上（三欄）
   fine：主要輸入是滑鼠（筆電）→ 啟用鍵盤快捷鍵 */
const LAYOUT_KEY='slowve.layout';   // 不用 slowve- 開頭，避免被匯出／匯入備份
const LAYOUT_PREFS=[{id:'auto',label:'自動'},{id:'phone',label:'手機版'},{id:'tablet',label:'平板版'}];
function useLayout(){
  const [pref,setPref]=useState(()=>{try{return localStorage.getItem(LAYOUT_KEY)||'auto'}catch(_e){return 'auto'}});
  const [w,setW]=useState(()=>window.innerWidth);
  useEffect(()=>{
    const f=()=>setW(window.innerWidth);
    window.addEventListener('resize',f);window.addEventListener('orientationchange',f);
    return ()=>{window.removeEventListener('resize',f);window.removeEventListener('orientationchange',f)};
  },[]);
  const auto=w>=1100?'xwide':w>=768?'wide':'phone';
  const mode=pref==='phone'?'phone':pref==='tablet'?(w>=1100?'xwide':'wide'):auto;
  let fine=false;try{fine=window.matchMedia('(pointer: fine)').matches}catch(_e){}
  const save=p=>{try{localStorage.setItem(LAYOUT_KEY,p)}catch(_e){}setPref(p)};
  return {mode,pref,setPref:save,w,auto,fine};
}
const MODE_LABEL={phone:'手機版',wide:'平板雙欄',xwide:'平板三欄'};

/* ========== App ========== */
function App(){
  const lay=useLayout();const wide=lay.mode!=='phone';
  const [S,setS]=useState(()=>{const s=loadSettings();ls.set('settings',s);return s});
  const [date,setDate]=useState(()=>bizToday(loadSettings().cutoff));
  const [tab,setTab]=useState(()=>{   // LINE 登入測試導回時，直接回到設定頁顯示結果
    try{if(ltSentGet()||/[?&](code|lt)=/.test(location.search))return 'set'}catch(_e){}
    return 'day';
  });
  const [rev,setRev]=useState(0);
  const [repLast,setRepLast]=useState('day');   // 報表上次看的是日報還是月報
  const [pSub,setPSub]=useState('join');        // 人員頁的小分頁
  const [fix,setFix]=useState(false);           // 主櫃上線後的修正模式
  const ro=!!S.maincLive&&!fix;
  const fixLog=(d,t)=>{if(!S.maincLive)return;const c=cloudCfg();d.log=(d.log||[]).concat([{act:'fix',at:Date.now(),by:(c.who&&c.who.name)||c.name||'本機',t}])};
  const [ed,setEd]=useState(null);        // 訂單編輯 {order,k,prev,count}
  const [xe,setXe]=useState(null);        // 支出編輯 {exp,k,prev,count}
  const [pay,setPay]=useState(null);      // 薪資條 {ym,tc}
  const [closeSt,setCloseSt]=useState(null);
  const [shEd,setShEd]=useState(null);    // 交班小計 {sh}
  const [dlg,setDlg]=useState(null);
  const [toastMsg,setToastMsg]=useState('');
  const bump=()=>setRev(r=>r+1);
  const toast=m=>{setToastMsg(m);clearTimeout(window.__tt);window.__tt=setTimeout(()=>setToastMsg(''),2200)};
  const ask=o=>new Promise(res=>setDlg(Object.assign({},o,{res})));
  const saveS=ns=>{setS(ns);if(!ls.set('settings',ns)){toast('設定儲存失敗：空間不足');return}
    if(JSON.stringify(cloudSettings(ns))!==JSON.stringify(cloudSettings(S)))cloud.mark('s')};
  const cst=useCloud();
  useEffect(()=>{cloud.autoLogin().then(()=>{if(cloudOn())cloud.pull(false).catch(()=>{}).then(()=>{cloud.soon(500);peoplePrefetch()})})},[]);   // v0.1-084：日報月報資料下載後，一併預抓人員頁資料   // 開啟時：LINE 已登入就自動取得通行證；先下載其他主管的更新，再上傳
  useEffect(()=>{if(cst.dataVer){setS(loadSettings());bump()}},[cst.dataVer]);                   // 雲端資料寫入本機後重新整理畫面

  const dayData=()=>getDay(loadMonth(monKey(date)),date);

  const saveFail=()=>ask({title:'儲存失敗',msg:'本機儲存空間可能已滿，請先匯出備份。',okOnly:true});
  const onSaveOrder=(o,next)=>{
    if(!mutateDay(date,d=>{const i=d.orders.findIndex(x=>x.id===o.id);fixLog(d,(i>=0?'修改':'新增')+'訂單 #'+(o.sn||'-')+' '+money(orderAmt(o)));if(i>=0)d.orders[i]=o;else d.orders.push(o);return syncCpExp(d,o.id)})){saveFail();return}
    const tcs=orderTcs(o).map(String);
    saveS(Object.assign({},S,{teachers:[...tcs,...S.teachers.filter(x=>!tcs.includes(x))].slice(0,40)}));
    bump();
    if(next){setEd(p=>({order:null,k:((p&&p.k)||0)+1,prev:o,count:((p&&p.count)||0)+1}))}
    else{setEd(null);toast('已儲存 #'+(o.sn||'')+'　'+money(orderAmt(o)))}
  };
  const onSaveExp=(e,next)=>{
    if(!mutateDay(date,d=>{d.expenses=d.expenses||[];const i=d.expenses.findIndex(x=>x.id===e.id);fixLog(d,(i>=0?'修改':'新增')+'支出 '+e.cat+(e.name?'・'+e.name:'')+' '+money(e.amt));if(i>=0)d.expenses[i]=e;else d.expenses.push(e);return d})){saveFail();return}
    if(e.name)saveS(Object.assign({},S,{expNames:[e.name,...S.expNames.filter(x=>x!==e.name)].slice(0,30)}));
    bump();
    if(next){setXe(p=>({exp:null,k:((p&&p.k)||0)+1,prev:e,count:((p&&p.count)||0)+1}))}
    else{setXe(null);toast('已儲存支出 '+money(e.amt))}
  };
  const onDeleteExp=async e=>{
    if(!await ask({title:'刪除這筆支出？',msg:e.cat+(e.name?'・'+e.name:'')+'　'+money(e.amt),okText:'刪除',danger:true}))return;
    mutateDay(date,d=>{fixLog(d,'刪除支出 '+e.cat+' '+money(e.amt));d.expenses=(d.expenses||[]).filter(x=>x.id!==e.id);d.log=(d.log||[]).concat([{act:'delExp',at:Date.now(),exp:e}]);return d});
    setXe(null);bump();toast('已刪除支出');
  };
  const onToggleVoid=async o=>{
    const toVoid=!o.void;
    const ok=await ask(toVoid?{title:'作廢這筆訂單？',msg:'作廢後不計入營業額，之後仍可恢復。',okText:'作廢',danger:true}:{title:'恢復這筆訂單？',okText:'恢復'});
    if(!ok)return;
    mutateDay(date,d=>{const x=d.orders.find(y=>y.id===o.id);if(x){x.void=toVoid;x.ua=Date.now()}fixLog(d,(toVoid?'作廢':'恢復')+'訂單 #'+(o.sn||'-'));return syncCpExp(d,o.id)});
    setEd(null);bump();toast(toVoid?'已作廢':'已恢復');
  };
  // 刪除（只限已作廢的訂單）：拿掉流水號、仍保留紀錄；後面的流水號不遞補（流水號對應紙本單號）
  const onRelease=async o=>{
    const ok=await ask({title:'刪除這筆作廢訂單？',msg:'#'+(o.sn||'-')+' 的流水號會被拿掉，之後可以給別的訂單使用；後面訂單的流水號不會改變。\n這筆仍會以「已刪除」顯示在列表最下面，不計入任何統計，刪除後不能恢復。',okText:'刪除',danger:true});
    if(!ok)return;
    mutateDay(date,d=>{fixLog(d,'刪除作廢訂單 #'+(o.sn||'-'));const x=d.orders.find(y=>y.id===o.id);if(x){x.del=true;x.snDel=x.sn;x.sn='';x.void=true;x.delAt=Date.now();x.ua=Date.now()}d.log=(d.log||[]).concat([{act:'delOrder',at:Date.now(),id:o.id,sn:o.sn}]);return syncCpExp(d,o.id)});
    setEd(null);bump();toast('已刪除，#'+(o.sn||'')+' 已釋出');
  };
  const onClose=c=>{
    mutateDay(date,d=>{d.close=c;d.log=(d.log||[]).concat([{act:'close',at:c.at,revenue:c.revenue,cashExp:c.cashExp,expected:c.expected,cash:c.cash,diff:c.diff}]);return d});
    setCloseSt(null);bump();toast('日結完成');
  };
  const onSaveShift=sh=>{
    if(!mutateDay(date,d=>{d.shifts=d.shifts||[];const i=d.shifts.findIndex(x=>x.id===sh.id);if(i>=0)d.shifts[i]=sh;else d.shifts.push(sh);return d})){saveFail();return}
    setShEd(null);bump();toast('已儲存交班小計');
  };
  const onDeleteShift=async sh=>{
    if(!await ask({title:'刪除這個交班小計？',okText:'刪除',danger:true}))return;
    mutateDay(date,d=>{d.shifts=(d.shifts||[]).filter(x=>x.id!==sh.id);return d});setShEd(null);bump();toast('已刪除交班小計');
  };
  const onUnlock=async()=>{
    const ok=await ask({title:'解除日結？',msg:'解除後可以修改當日訂單與支出，修改完請重新日結。',okText:'解除',danger:true});
    if(!ok)return;
    mutateDay(date,d=>{fixLog(d,'解除日結');d.log=(d.log||[]).concat([{act:'unlock',at:Date.now(),prev:d.close}]);d.close=null;return d});
    bump();toast('已解除日結');
  };

  const backupOld=!S.lastBackupAt||Date.now()-S.lastBackupAt>3*864e5;
  // v0.1-065：底部分頁改成 報表（日報／月報）｜人員｜設定
  const NAV=[{id:'rep',label:'報表',icon:'▤'},{id:'people',label:'人員',icon:'☺'},{id:'set',label:'設定',icon:'⚙'}];
  const TITLE={day:'日報',month:'月報',people:'人員',set:'設定'};
  const navOn=id=>id==='rep'?(tab==='day'||tab==='month'):tab===id;
  const goNav=id=>setTab(id==='rep'?repLast:id);
  const repSeg=(tab==='day'||tab==='month')&&(<div className={(wide?'px-4':'max-w-md mx-auto px-4')+' pb-2'}><div className="flex rounded-lg border border-line overflow-hidden text-sm bg-card">
    {[['day','日報'],['month','月報']].map(([k,l])=><button key={k} className={'flex-1 h-9 '+(tab===k?'bg-sage text-white':'')} onClick={()=>{setTab(k);setRepLast(k)}}>{l}</button>)}</div></div>);

  // 平板版：訂單／支出編輯固定在右側面板；同時只開一個
  const openOrder=o=>{setXe(null);setEd({order:o,k:0})};
  const openExpense=e=>{setEd(null);setXe({exp:e,k:0})};
  const endEd=()=>{if(ed&&ed.count)toast('已連續新增 '+ed.count+' 筆');setEd(null)};
  const endXe=()=>{if(xe&&xe.count)toast('已連續新增 '+xe.count+' 筆支出');setXe(null)};
  // 筆電（滑鼠）快捷鍵：N 新增訂單、Esc 關閉編輯
  useEffect(()=>{
    if(!wide||!lay.fine)return;
    const h=e=>{
      const t=e.target,typing=t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable);
      if(dlg||pay||closeSt)return;
      if(e.key==='Escape'&&(ed||xe)){if(typing)t.blur();if(ed)endEd();else endXe();e.preventDefault();return}
      if(!typing&&tab==='day'&&(e.key==='n'||e.key==='N')&&!e.metaKey&&!e.ctrlKey&&!e.altKey){setXe(null);setEd({order:null,k:Date.now()});e.preventDefault()}
    };
    window.addEventListener('keydown',h);return ()=>window.removeEventListener('keydown',h);
  });

  const dayProps={S,date,bump,ro,fix,setFix,setDate:d=>{setDate(d);setEd(null);setXe(null)},rev,openClose:(st,ex)=>setCloseSt({st,ex}),onUnlock,openShift:sh=>setShEd({sh})};
  const locked=!!dayData().close||ro;
  const panel=wide&&tab==='day'&&(
    xe?<ExpenseEditor inline key={'x'+date+xe.k} S={S} exp={xe.exp} locked={locked} prev={xe.prev} count={xe.count}
        onSave={onSaveExp} onDelete={onDeleteExp} onClose={endXe} ask={ask}/>:
    (ed||!locked)?<OrderEditor inline key={'o'+date+(ed?ed.k+'-'+(ed.order?ed.order.id:'new'):'auto')} S={S} order={ed?ed.order:null} dayOrders={dayData().orders} locked={locked} prev={ed&&ed.prev} count={ed&&ed.count} cu={ed&&ed.cu}
        onSave={onSaveOrder} onToggleVoid={onToggleVoid} onRelease={onRelease} onClose={ed?endEd:null} ask={ask}/>:
    <div className="h-full flex flex-col items-center justify-center text-center px-8 text-mute">
      <div className="text-4xl mb-3 text-sageD">✓</div>
      <div className="text-lg text-ink mb-1">{fmtDate(date)} 已日結</div>
      <div className="text-sm">點左側訂單或支出可查看內容。要修改請先「解除日結」。</div>
    </div>
  );

  const header=(
    <header className="sticky top-0 z-20 bg-bg/95 backdrop-blur border-b border-line" style={{paddingTop:'env(safe-area-inset-top)'}}>
      <div className={(wide?'':'max-w-md mx-auto ')+'flex items-center justify-between px-4 h-14'}>
        <div className="flex items-baseline gap-2">
          {!wide&&<><span className="serif text-2xl tracking-widest text-sageD">緩緩</span>
          <span className="text-xs tracking-[0.2em] text-brown">SLOWVE</span></>}
          <span className={wide?'text-lg':'text-sm text-mute ml-1'}>{TITLE[tab]}</span>
        </div>
        {cst.on?(()=>{const c=cloudChip(cst);return <button className={'text-xs px-2.5 h-7 rounded-full '+c.c} onClick={()=>setTab('set')}>{c.t}</button>})():
          <button className={'text-xs px-2.5 h-7 rounded-full '+(backupOld?'bg-warnL text-warn':'bg-sageL text-sageD')} onClick={()=>setTab('set')}>{agoText(S.lastBackupAt)}</button>}
      </div>
      {repSeg}
      {cst.on&&cst.joinN>0&&!(tab==='people'&&pSub==='join')&&<button className="w-full h-9 bg-brownL text-brown text-sm" onClick={()=>{setTab('people');setPSub('join')}}>有 {cst.joinN} 筆新的應徵履歷 ›</button>}
      {cst.on&&cst.profN>0&&tab!=='people'&&<button className="w-full h-9 bg-brownL text-brown text-sm border-t border-white/60" onClick={()=>{setTab('people');setPSub('teacher')}}>有 {cst.profN} 筆人員資料修改待審核 ›</button>}
      {cst.on&&cst.fixN>0&&!(tab==='people'&&pSub==='counter')&&<button className="w-full h-9 bg-brownL text-brown text-sm border-t border-white/60" onClick={()=>{setTab('people');setPSub('counter')}}>有 {cst.fixN} 筆補打卡待審核（人員 → 櫃台）›</button>}
      {cst.on&&cst.leaveN>0&&tab!=='people'&&<button className="w-full h-9 bg-brownL text-brown text-sm border-t border-white/60" onClick={()=>{setTab('people');setPSub('teacher')}}>有 {cst.leaveN} 筆請假待審核 ›</button>}
    </header>
  );
  const otherTabs=(<>
    {tab==='month'&&<MonthPage S={S} rev={rev} ask={ask} toast={toast} goDay={d=>{setDate(d);setTab('day');setRepLast('day')}} openPay={(ym,tc,per)=>setPay({ym,tc,per})}/>}
    {tab==='people'&&<SettingsPage key="people" page="people" onCustOrder={cu=>{setDate(ymd(new Date()));setTab('day');setRepLast('day');setXe(null);setEd({order:null,k:Date.now(),cu});toast('新的訂單：'+cuLabel(cu))}} sub={pSub} setSub={setPSub} S={S} saveS={saveS} ask={ask} toast={toast} lay={lay} onImported={()=>{setS(loadSettings());bump()}}/>}
    {tab==='set'&&<SettingsPage key="set" page="set" S={S} saveS={saveS} ask={ask} toast={toast} lay={lay} onImported={()=>{setS(loadSettings());bump()}}/>}
  </>);
  const H='calc(100dvh - 6.25rem - env(safe-area-inset-top))';   // 扣掉頂部標題列＋日報／月報切換   // 平板版內容區高度（扣掉頂部標題列）

  const modals=(<>
    {!wide&&ed&&<OrderEditor key={'o'+ed.k} S={S} order={ed.order} dayOrders={dayData().orders} locked={locked} prev={ed.prev} count={ed.count} cu={ed.cu}
      onSave={onSaveOrder} onToggleVoid={onToggleVoid} onRelease={onRelease} onClose={endEd} ask={ask}/>}
    {!wide&&xe&&<ExpenseEditor key={'x'+xe.k} S={S} exp={xe.exp} locked={locked} prev={xe.prev} count={xe.count}
      onSave={onSaveExp} onDelete={onDeleteExp} onClose={endXe} ask={ask}/>}
    {pay&&<TeacherPaySheet S={S} ym={pay.ym} tc={pay.tc} per={pay.per} rev={rev} bump={bump} onClose={()=>setPay(null)} toast={toast} ask={ask}/>}
    {shEd&&(()=>{const dd=dayData();const sorted=[...dd.orders].sort((a,b)=>snNum(a)-snNum(b)||(a.ca||0)-(b.ca||0));
      return <ShiftSheet S={S} orders={sorted} shifts={dd.shifts||[]} sh={shEd.sh} locked={!!dd.close} onSave={onSaveShift} onDelete={onDeleteShift} onClose={()=>setShEd(null)}/>})()}
    {closeSt&&<CloseSheet S={S} st={closeSt.st} ex={closeSt.ex} onSave={onClose} onClose={()=>setCloseSt(null)}/>}
    <CloudConflict S={S}/>
    <Dialog dlg={dlg} onDone={v=>{const r=dlg.res;setDlg(null);r(v)}}/>
    {toastMsg&&<div className={'fixed left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full bg-ink/90 text-white text-sm shadow-lg '+(wide?'bottom-6':'bottom-24')}>{toastMsg}</div>}
  </>);

  if(wide){
    const sel=ed&&ed.order?ed.order.id:null,selX=xe&&xe.exp?xe.exp.id:null;
    return (
      <div className="flex min-h-screen">
        {/* 左側導覽列（平板版取代底部導覽） */}
        <nav className="sticky top-0 h-[100dvh] w-20 shrink-0 bg-card border-r border-line flex flex-col items-center pt-3" style={{paddingTop:'calc(env(safe-area-inset-top) + 0.75rem)'}}>
          <div className="serif text-xl tracking-widest text-sageD leading-tight text-center mb-1">緩緩</div>
          <div className="text-[9px] tracking-[0.2em] text-brown mb-5">SLOWVE</div>
          {NAV.map(n=><button key={n.id} className={'w-16 h-16 mb-2 rounded-2xl flex flex-col items-center justify-center gap-0.5 '+(navOn(n.id)?'bg-sageL text-sageD':'text-mute')} onClick={()=>goNav(n.id)}>
            <span className="text-xl leading-none">{n.icon}</span><span className="text-xs">{n.label}</span>
          </button>)}
        </nav>
        <div className="flex-1 min-w-0">
          {header}
          {tab==='day'?(
            <div className="flex" style={{height:H}}>
              {lay.mode==='xwide'&&<div className="w-[21rem] shrink-0 overflow-y-auto px-4 pt-4 border-r border-line">
                <DayPage {...dayProps} part="side" wide openEditor={openOrder} openExp={openExpense} selExpId={selX}/></div>}
              <div className="flex-1 min-w-0 overflow-y-auto px-4 pt-4">
                <DayPage {...dayProps} part={lay.mode==='xwide'?'list':'all'} wide openEditor={openOrder} openExp={openExpense} selId={sel} selExpId={selX}/></div>
              <div className={(lay.mode==='xwide'?'w-[27rem]':'w-[24rem]')+' shrink-0 border-l border-line bg-card/40'}>{panel}</div>
            </div>
          ):<main className="max-w-2xl mx-auto px-4 pt-4">{otherTabs}</main>}
        </div>
        {modals}
      </div>
    );
  }

  return (
    <div className="min-h-screen">
      {header}
      <main className="max-w-md mx-auto px-4 pt-4">
        {tab==='day'&&<DayPage {...dayProps} openEditor={openOrder} openExp={openExpense}/>}
        {otherTabs}
      </main>

      <nav className="fixed bottom-0 left-0 right-0 z-20 bg-card border-t border-line pb-safe">
        <div className="max-w-md mx-auto grid grid-cols-3">
          {NAV.map(n=><button key={n.id} className={'h-16 flex flex-col items-center justify-center gap-0.5 '+(navOn(n.id)?'text-sageD':'text-mute')} onClick={()=>goNav(n.id)}>
            <span className="text-xl leading-none">{n.icon}</span><span className="text-xs">{n.label}</span>
            {navOn(n.id)&&<span className="w-6 h-0.5 rounded bg-sage mt-0.5"></span>}
          </button>)}
        </div>
      </nav>
      {modals}
    </div>
  );
}

/* v0.1-115 介紹頁：網址沒帶參數、不是在 LINE 裡開、也不是老闆用的裝置時，顯示店家介紹，不讓路人直接進老闆頁的離線模式。
   老闆用的裝置＝用 ?owner=1 開過，或本機已經有日報資料、登入過雲端同步（舊裝置自動認得，不受影響）。 */
const OWNER_DEV='slowve.owner-dev';
function isOwnerDev(q){
  try{
    if(q.get('owner')==='1'){localStorage.setItem(OWNER_DEV,'1');return true}
    if(localStorage.getItem(OWNER_DEV)==='1')return true;
    const c=JSON.parse(localStorage.getItem('slowve.cloud')||'null')||{};
    let has=!!(c.tok||c.key||c.who);
    for(let i=0;!has&&i<localStorage.length;i++)if(/^slowve-m-\d{4}-\d{2}$/.test(localStorage.key(i)||''))has=true;
    if(has){localStorage.setItem(OWNER_DEV,'1');return true}
  }catch(_e){}
  return false;
}
function IntroPage(){
  const S=mergeSettings(null);const [img,setImg]=useState(true);
  const ADDR='新北市板橋區雙十路三段 10 巷 1 號 1 樓',TEL='02-8257-1199';

  const add=S.addons.filter(a=>!a.tc);
  return (<div className="min-h-screen bg-bg text-ink">
    <div className="max-w-3xl mx-auto px-5 pb-16">
      {img?<div className="pt-6"></div>:<header className="pt-10 pb-6 text-center">
        <div className="serif text-5xl tracking-[0.3em] text-sageD pl-[0.3em]">緩緩</div>
        <div className="text-sm tracking-[0.4em] text-brown mt-2 pl-[0.4em]">SLOWVE BODY SPA</div>
        <div className="serif text-2xl mt-8 tracking-widest">把放鬆，留給今天的自己</div>
        <div className="text-xs tracking-[0.25em] text-brown mt-2">FOR A SLOWER, MORE SERENE YOU</div>
      </header>}
      {img&&<img src="brand/slowve-line-cover-1080x540.png" alt="緩緩 SLOWVE BODY SPA" className="w-full rounded-2xl mb-8 border border-line" onError={()=>setImg(false)}/>}
      <div className="grid sm:grid-cols-2 gap-3 mb-10">
        <a href={liff} className="h-14 rounded-2xl bg-sage text-white text-lg flex items-center justify-center">用 LINE 加入會員・預約</a>
        <a href={'tel:'+TEL.replace(/-/g,'')} className="h-14 rounded-2xl border border-sage text-sageD text-lg flex items-center justify-center num">📞 {TEL}</a>
      </div>
      <section className="mb-10">
        <div className="serif text-2xl text-sageD mb-1">服務項目</div>
        <div className="text-xs text-mute mb-3">價格以現場公告為準</div>
        <div className="rounded-2xl border border-line bg-card overflow-hidden">
          <div className="grid grid-cols-4 text-xs text-mute px-4 py-2 border-b border-line"><span></span>{MINS.map(m=><span key={m} className="text-right">{m} 分</span>)}</div>
          {SVCS.map(v=><div key={v.id} className="grid grid-cols-4 px-4 py-3 border-b border-line last:border-0 items-baseline">
            <span>{v.name}</span>{(S.prices[v.id]||[]).map((p,i)=><span key={i} className="text-right num">{money(p)}</span>)}</div>)}
        </div>
        <div className="grid sm:grid-cols-2 gap-3 mt-3">
          {[S.promo,S.promoFoot].map(P=><div key={P.svc} className="rounded-2xl bg-brownL/60 px-4 py-3">
            <div className="text-xs text-brown">平日限定</div><div className="flex items-baseline justify-between"><span>{SVC_SHORT[P.svc]} {P.min} 分</span><b className="num text-brown text-lg">{money(P.price)}</b></div></div>)}
        </div>
        <div className="text-sm text-mute mt-3">加購：{add.map(a=>a.name+' '+money(a.price)).join('・')}・加鐘每 30 分 {money(Math.min(...Object.values(S.extra.price)))} 起</div>
      </section>
      <section className="mb-10">
        <div className="serif text-2xl text-sageD mb-3">店家資訊</div>
        <div className="rounded-2xl border border-line bg-card p-4 space-y-2 text-sm">
          <div className="flex gap-3"><span className="text-mute w-16 shrink-0">營業時間</span><span className="num">每天 09:00～02:00</span></div>
          <div className="flex gap-3"><span className="text-mute w-16 shrink-0">電話</span><a className="underline text-sageD num" href={'tel:'+TEL.replace(/-/g,'')}>{TEL}</a></div>
          <div className="flex gap-3"><span className="text-mute w-16 shrink-0">地址</span><a className="underline text-sageD" target="_blank" rel="noopener" href={'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(ADDR.replace(/\s/g,''))}>{ADDR}</a></div>
        </div>
        <div className="text-sm text-mute mt-3">加入 LINE 會員後，可以查看自己的預約與消費紀錄。</div>
      </section>
      <footer className="pt-6 border-t border-line text-xs text-mute flex flex-wrap items-center gap-3">
        <span>© 緩緩 SLOWVE BODY SPA</span>
        <a className="ml-auto underline" href={'?gate=1'}>工作夥伴登入</a>
        <a className="underline" href={liff}>應徵工作夥伴</a>
      </footer>
    </div>
  </div>);
}
const __q=new URLSearchParams(location.search);const __ls=__q.get('liff.state')||'';
const IS_JOIN=__q.get('mode')==='join'||__ls.indexOf('mode=join')>=0;
const IS_LINE_TEST=!IS_JOIN&&(__q.has('linetest')||__ls.indexOf('linetest')>=0);
const IS_SHARE_RELAY=!IS_JOIN&&!IS_LINE_TEST&&(__q.has('share')||__ls.indexOf('share')>=0);
const IS_ROLE_DEMO=__q.get('demo')==='roles'||__ls.indexOf('demo=roles')>=0;
// 在 LINE App 內開啟 → 入口檢查（登入＋開通名單＋身分）；外部瀏覽器直接進門店系統（老闆離線使用）。?gate=1 可在瀏覽器強制測試
let __mc=false;try{__mc=localStorage.getItem('slowve.mainc')==='1'}catch(_e){}
// 主櫃 iPad 用 Safari 開（才能用 LINE 的 QR Code 換人登入），所以設為主櫃的裝置也走入口檢查
// v0.1-129：電腦瀏覽器 LINE 登入完回來時網址是 ?liff.state=%3Fmainc%3D1&code=…，參數包在 liff.state 裡，也要走入口檢查（不然會掉到介紹頁）
const IN_LINE=/\bLine\//i.test(navigator.userAgent)||__q.get('gate')==='1'||__q.get('mainc')==='1'||__mc||!!__ls;
ReactDOM.createRoot(document.getElementById('root')).render(IS_JOIN?<JoinPage/>:IS_ROLE_DEMO?<RoleDemo/>:IS_LINE_TEST?<LineTestPage/>:IS_SHARE_RELAY?<ShareRelay/>:IN_LINE?<LineGate/>:isOwnerDev(__q)?<App/>:<IntroPage/>);
