<script type="text/babel" data-presets="react">
const {useState,useEffect,useMemo,useRef}=React;

/* ========== 常數 ========== */
const VER='v0.1-066';
const JSPDF_URL='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
const FONT='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
const P='slowve-';
const SVCS=[{id:'dry',name:'全身指壓',short:'指壓'},{id:'oil',name:'深層油壓',short:'油壓'},{id:'foot',name:'腳底按摩',short:'腳底'}];
const SVC_SHORT={dry:'指壓',oil:'油壓',foot:'腳底'};
const MINS=[60,90,120];
const WK='日一二三四五六';
const STORAGE_LIMIT=5*1024*1024;
const JOIN_MIN=10,JOIN_HARD_MAX=100;   // 線上開通可選的編號範圍（老闆可設定上限，最多 100）
const DEFAULT_SETTINGS={
  prices:{dry:[1000,1400,1800],oil:[1200,1600,2000],foot:[1000,1400,1800]},
  promo:{svc:'dry',min:90,price:1300},
  addons:[
    {id:'eoil',name:'特殊精油',price:300,zh:0},    // zh＝老師多算幾支
    {id:'guasha',name:'刮痧',price:500,zh:1},
    {id:'bagua',name:'拔罐',price:500,zh:1},
    {id:'xiujiao',name:'修腳皮',price:500,zh:1,tc:'69'}   // tc＝指定老師：這項的支數固定算給該老師（目前只有 69 號會修腳皮）
  ],
  extra:{price:{dry:500,oil:600,foot:500},zh:1},   // 加鐘：每 30 分鐘的價格（依項目）與支數
  empRate:0.8,                    // 員工按摩折扣（8 折）；老師費用照算
  comm:{per30:280,laodian:20},     // per30＝每支費用（沿用舊欄位名）、laodian＝老點每單加給
  zhiMin:30,                      // 幾分鐘算 1 支
  cutoff:'05:00',
  teachers:[],
  joinMax:50,
  leaveReview:false,
  profileReview:false,            // 老師／櫃台修改個人資料是否需要審核（預設不用，存檔即生效）              // 請假是否需要老闆／主管審核（預設不用，送出即登記）                     // 線上開通：老師可選的編號 10～joinMax（最多 100）
  support:[],                     // 支援老師編號：每日下班向櫃台領現金（現結），不走月薪
  expCats:['耗材','清潔用品','水電瓦斯','房租','餐費','雜支','其他'],
  expNames:[],
  device:'',
  lastBackupAt:null,
  backupPwd:''
};

/* ========== 儲存 ========== */
const ls={
  get(k,d){try{const v=localStorage.getItem(P+k);return v==null?d:JSON.parse(v)}catch(_e){return d}},
  set(k,v){try{localStorage.setItem(P+k,JSON.stringify(v));return true}catch(_e){return false}}
};
const clone=o=>JSON.parse(JSON.stringify(o));
function mergeSettings(s){
  s=s||{};const d=clone(DEFAULT_SETTINGS);
  const r=Object.assign({},d,s);
  r.prices=Object.assign({},d.prices,s.prices||{});
  r.promo=Object.assign({},d.promo,s.promo||{});
  r.comm=Object.assign({},d.comm,s.comm||{});
  r.addons=((s.addons&&s.addons.length)?s.addons:d.addons).map(a=>{
    const def=d.addons.find(x=>x.id===a.id);
    const b=Object.assign({},a);
    if(b.zh==null)b.zh=def?def.zh:0;                   // 舊設定沒有 zh 欄位 → 補預設值
    if(b.tc===undefined)b.tc=def&&def.tc?def.tc:'';     // 舊設定沒有指定老師 → 補預設（修腳皮＝69）
    b.solo=!!b.solo;                                     // solo＝可單點（不用搭配主項目），老闆在設定頁決定
    delete b.comm;return b;});
  r.extra=Object.assign({},d.extra,s.extra||{});
  if(typeof r.extra.price!=='object'||!r.extra.price){   // v0.1-030 舊設定是單一價格 → 改成依項目
    const n=Number(r.extra.price);r.extra.price=(!n||n===500)?clone(d.extra.price):{dry:n,oil:n,foot:n};
  }
  r.extra.price=Object.assign({},d.extra.price,r.extra.price);
  if(r.empRate==null)r.empRate=d.empRate;
  r.teachers=Array.isArray(s.teachers)?s.teachers:[];
  r.support=Array.isArray(s.support)?s.support.map(String):[];
  r.joinMax=Math.max(JOIN_MIN,Math.min(JOIN_HARD_MAX,Number(r.joinMax)||50));
  r.expCats=(Array.isArray(s.expCats)&&s.expCats.length)?s.expCats:d.expCats;
  r.expNames=Array.isArray(s.expNames)?s.expNames:[];
  r.maincLive=!!s.maincLive;                                      // v0.1-065：主櫃系統已上線（日報改由主櫃登打）
  r.attChecks=Object.assign({},s.attChecks||{});                 // v0.1-061：差勤檢查開關（沒寫的＝開）
  r.attLog=(Array.isArray(s.attLog)?s.attLog:[]).slice(-200);   // 誰在什麼時候開關了哪一條
  r.attOffDays=s.attOffDays==null||s.attOffDays===''?8:Math.max(0,Math.min(31,Number(s.attOffDays)||0));   // v0.1-062：櫃台每月休假天數
  r.attBreak=s.attBreak==null||s.attBreak===''?60:Math.max(0,Math.min(180,Number(s.attBreak)||0));       // 每日休息（分鐘），不算工時
  if(!r.device)r.device=Math.random().toString(36).slice(2,6).toUpperCase();
  return r;
}
function loadSettings(){return mergeSettings(ls.get('settings',null))}
function slowveKeys(){const a=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(P)===0)a.push(k)}}catch(_e){}return a}
function storageBytes(){let n=0;slowveKeys().forEach(k=>{try{n+=(k.length+(localStorage.getItem(k)||'').length)*2}catch(_e){}});return n}
/* 同網域（john7t.github.io）的其他系統（如 massage-pay）共用同一個 localStorage 上限 */
function originBytes(){let n=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'';n+=(k.length+(localStorage.getItem(k)||'').length)*2}}catch(_e){}return n}

/* ========== 日期 ========== */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const monKey=s=>s.slice(0,7);
function bizToday(cutoff){
  const now=new Date();const c=(cutoff||'05:00').split(':').map(Number);
  const d=new Date(now);if(now.getHours()*60+now.getMinutes()<c[0]*60+(c[1]||0))d.setDate(d.getDate()-1);
  return ymd(d);
}
const fmtDate=s=>{const d=parseYmd(s);return (d.getMonth()+1)+'/'+d.getDate()+'（'+WK[d.getDay()]+'）'};
const money=n=>'$'+Number(n||0).toLocaleString('en-US');
const smoney=n=>(n>0?'+':n<0?'-':'')+money(Math.abs(n||0));
function agoText(ts){
  if(!ts)return '尚未備份';
  const m=Math.floor((Date.now()-ts)/60000);
  if(m<60)return m<1?'剛剛備份':m+' 分鐘前備份';
  const h=Math.floor(m/60);if(h<24)return h+' 小時前備份';
  return Math.floor(h/24)+' 天前備份';
}

/* ========== 月／日資料 ========== */
function loadMonth(mk){const m=ls.get('m-'+mk,null);return (m&&m.days)?m:{days:{}}}
function emptyDay(){return {orders:[],expenses:[],close:null,log:[]}}
function mutateMonth(mk,fn){const md=loadMonth(mk);fn(md);md.payUa=Date.now();const ok=ls.set('m-'+mk,md);if(ok)cloud.mark('p:'+mk);return ok}   // 目前只有薪資加扣項用到
function getDay(md,date){const d=md.days[date.slice(8)];return d?Object.assign(emptyDay(),d):emptyDay()}
function mutateDay(date,fn){
  const mk=monKey(date);const md=loadMonth(mk);
  const d=fn(clone(getDay(md,date)));d.ua=Date.now();   // ua＝這一天最後修改時間（雲端同步比對用）
  md.days[date.slice(8)]=d;
  const ok=ls.set('m-'+mk,md);
  if(ok)cloud.mark('d:'+date);   // 標記待上傳（沒設定雲端時只記錄，不會連線）
  return ok;
}

/* ========== 計價／統計 ========== */
/* 支：主項目分鐘數 ÷ 幾分鐘算 1 支（預設 30 分鐘＝1 支）＋ 加鐘（每 30 分 1 支）＋ 額外品項各自設定的支數（刮痧／拔罐各 1 支）
   額外品項若有「指定老師」（修腳皮＝69 號），那幾支算給指定老師，不算主項目的老師（主老師就是指定老師時才算給他自己） */
// 加鐘每 30 分的價格：依加鐘的項目（exs；沒有就用主項目）
const exPrice=(o,S)=>Number(((S.extra||{}).price||{})[o.exs||o.svc])||0;
const adOwner=(a,o)=>a&&a.tc&&String(a.tc)!==String(o.tc||'')?String(a.tc):null;
const zhiCalc=(o,S)=>{
  let z=(o.svc&&o.min)?Math.floor(o.min/(Number(S.zhiMin)||30)):0;
  z+=(Number(o.ex)||0)*(Number((S.extra||{}).zh)||0);
  (o.ad||[]).forEach(id=>{const a=S.addons.find(x=>x.id===id);if(a&&!adOwner(a,o))z+=Number(a.zh)||0});
  return z;
};
// 算給指定老師的支數（快照存在客人的 xs：[{tc,zh,cm,ad}]）
const xsCalc=(o,S)=>{
  const out=[];
  (o.ad||[]).forEach(id=>{const a=S.addons.find(x=>x.id===id);const t=adOwner(a,o);
    if(t&&Number(a.zh)>0)out.push({tc:t,zh:Number(a.zh),cm:Number(a.zh)*(Number(S.comm.per30)||0),ad:id})});
  return out;
};
const zhiOf=(o,S)=>o.zh!=null?o.zh:zhiCalc(o,S);   // 訂單存有快照就用快照
function calcOrder(o,S){
  let amt=0,cm=0;const zh=zhiCalc(o,S);
  if(o.svc&&o.min){
    if(o.promo)amt+=Number(S.promo.price)||0;
    else amt+=Number((S.prices[o.svc]||[])[MINS.indexOf(o.min)])||0;
  }
  (o.ad||[]).forEach(id=>{const a=S.addons.find(x=>x.id===id);if(a)amt+=Number(a.price)||0});
  amt+=(Number(o.ex)||0)*exPrice(o,S);
  if(o.emp)amt=Math.round(amt*(Number(S.empRate)||1));   // 員工按摩：整位客人打折，老師費用不變
  cm+=zh*(Number(S.comm.per30)||0);
  if(o.ld)cm+=Number(S.comm.laodian)||0;
  return {amt,cm,zh,xs:xsCalc(o,S)};
}
function orderLabel(o,S){
  const parts=[];
  if(o.svc)parts.push(SVC_SHORT[o.svc]+o.min+(o.promo?'・平日':''));
  if(Number(o.ex))parts.push('加鐘'+(o.exs&&o.exs!==o.svc?SVC_SHORT[o.exs]:'')+(Number(o.ex)*30)+'分');
  if(o.emp)parts.push('員工價');
  (o.ad||[]).forEach(id=>{const a=S.addons.find(x=>x.id===id);parts.push(a?a.name:id)});
  return parts.join(' ＋ ')+(o.xsOf?'（'+o.xsOf+' 老師的客人）':'');
}
const SKIP_BY={store:'店家',counter:'櫃台',teacher:'老師'};
/* 跳單（客人未付款）：老闆逐筆決定是否計入營業額（skipRev）；不論是否計入，都不算進應有現金；老師費用照算
   責任歸屬 skipBy：store 店家／counter 櫃台／teacher 老師；skipNote 說明
   打槍（被換下的老師）：每筆訂單可記多位，統計被打槍次數 */
/* 一筆流水（訂單）可有多位同行客人 items[]，每位各自有方案／老師／老點／額外品項／打槍與金額快照；
   跳單、時間、備註、作廢屬於整筆。舊資料沒有 items 的，整筆視為 1 位客人。 */
function orderItems(o){
  if(o.items&&o.items.length)return o.items;
  return [{svc:o.svc,min:o.min,promo:!!o.promo,ad:o.ad||[],tc:o.tc,ld:!!o.ld,rj:o.rj||[],amt:o.amt,cm:o.cm,zh:o.zh}];
}
// 攤平成「每位客人一行」，並帶上整筆的欄位（統計、老師明細、薪資條都用這個）
// 指定老師的品項（修腳皮→69）另外產生一行給那位老師：金額 0（營業額已算在主行）、只有支數與費用，xsOf＝原本服務的老師
function orderLines(o,date){
  const base={sn:o.sn,t:o.t,skip:o.skip,skipRev:o.skipRev,skipBy:o.skipBy,skipNote:o.skipNote,void:o.void,note:o.note,ca:o.ca};
  const out=[];
  orderItems(o).forEach((it,i)=>{
    out.push(Object.assign({},it,{id:o.id+'_'+i,oid:o.id,idx:i},base,date?{date}:{}));
    (it.xs||[]).forEach((x,j)=>out.push(Object.assign({svc:null,min:null,promo:false,ad:[x.ad],ex:0,ld:false,rj:[],amt:0},base,
      {tc:x.tc,zh:x.zh,cm:x.cm,xsOf:it.tc,id:o.id+'_'+i+'x'+j,oid:o.id,idx:i},date?{date}:{})));
  });
  return out;
}
const orderAmt=o=>orderItems(o).reduce((s,x)=>s+(x.amt||0),0);
const orderTcs=o=>orderItems(o).map(x=>x.tc);
const orderSummary=(o,S)=>orderItems(o).map(x=>orderLabel(x,S)+' '+x.tc+'師').join('／');
function statsOf(orders,S){
  const live=orders.filter(o=>!o.void);
  const r={n:live.length,guests:0,amt:0,cash:0,cm:0,zh:0,skip:0,skipN:0,skipRev:0,skipBy:{store:0,counter:0,teacher:0},skipList:[],byT:{},rj:{}};
  live.forEach(o=>{
    const oa=orderAmt(o);
    if(o.skip){r.skip+=oa;r.skipN++;if(o.skipRev)r.skipRev+=oa;const by=o.skipBy||'store';r.skipBy[by]=(r.skipBy[by]||0)+oa;r.skipList.push(o)}
    orderLines(o).forEach(l=>{
      const z=zhiOf(l,S);const a=l.amt||0;const rev=o.skip?(o.skipRev?a:0):a;
      if(!l.xsOf)r.guests++;r.amt+=rev;r.cash+=o.skip?0:a;r.cm+=l.cm||0;r.zh+=z;
      const t=r.byT[l.tc]||(r.byT[l.tc]={tc:l.tc,n:0,zh:0,ld:0,cm:0,amt:0,skipDed:0});
      t.n++;t.zh+=z;t.ld+=l.ld?1:0;t.cm+=l.cm||0;t.amt+=rev;
      if(o.skip&&o.skipBy==='teacher'&&!l.xsOf)t.skipDed+=a;   // 責任歸老師的跳單：老師吸收自己服務那位客人的金額
      (l.rj||[]).forEach(c=>{r.rj[c]=(r.rj[c]||0)+1});
    });
  });
  return r;
}
/* 現金結餘（v0.1-040）：手上應該有的現金＝現金收入（不含跳單）－ 現金支出 － 支援老師現結。
   正職老師的費用 5 號／20 號才發，這裡還沒扣，所以會比店家淨額多；跟日結的「應有現金」是同一個算法。
   v0.1-041：支援老師現結當作支出（雜項現金支出）顯示；「老師抽成」只算正職老師（月結），店家淨額不重複扣。 */
/* 統計卡（v0.1-048）：營業額、現金支出、現金結餘、老師費用、公司淨利，各一排（左：名稱＋說明，右：大字金額，顏色不同）
   現金支出＝店內現金付的雜項支出＋支援老師現結；現金結餘＝現金收入（營業額扣掉跳單未收）－現金支出；
   老師費用＝正職老師的費用（5／20 號發薪，支援老師已現結不重複算）；公司淨利＝現金結餘－老師費用（有非現金支出時再扣掉） */
const MR_COL={amt:'#a0784f',exp:'#b5654f',cash:'#6f7d62',fee:'#7d6385',net:'#3f6478'};
function MoneyRows({title,meta,amt,cashIn,expCash,nonCash,sup,skipRev,fee}){
  const exp=expCash+sup,cash=cashIn-exp,net=cash-fee-(nonCash||0);   // 非現金支出（如房租轉帳）不影響現金，但公司淨利要扣
  const expSub=sup>0?'雜項支出 ＋ 支援老師費用 '+money(sup):'雜項支出（店內現金）';
  // v0.1-052：金額為 0 的那排隱藏（營業額那排一定顯示，沒生意時才看得到 $0）
  const rows=[
    [title,meta,amt,MR_COL.amt],
    ['現金支出',expSub,exp,MR_COL.exp],
    ['現金結餘',['營業額',skipRev>0&&'跳單未收 '+money(skipRev),exp!==0&&'現金支出'].filter(Boolean).join(' − '),cash,MR_COL.cash],
    ['老師費用','正職老師・5／20 號發薪',fee,MR_COL.fee],
    ['公司淨利',[cash!==0&&'現金結餘',fee!==0&&'老師費用',nonCash>0&&'非現金支出 '+money(nonCash)].filter(Boolean).join(' − ').replace(/^(老師費用|非現金支出)/,'− $1')||'—',net,MR_COL.net],
  ].filter((r,i)=>i===0||Math.round(r[2]||0)!==0);
  return (<>{rows.map(([lab,sub,val,c],i)=>(
    <div key={lab} className={'flex items-center justify-between gap-3 '+(i===0?'':'mt-3 pt-3 border-t border-line')}>
      <div className="min-w-0"><div className="text-[17px] font-semibold">{lab}</div><div className="text-xs text-mute num mt-0.5">{sub}</div></div>
      <div className={'serif num whitespace-nowrap '+(i===0?'text-3xl':'text-[1.7rem]')} style={{color:val<0?'#b5654f':c}}>{val<0?'-'+money(-val):money(val)}</div>
    </div>))}</>);
}
/* 支援老師（v0.1-039）：編號列在設定 support，每天下班向櫃台領現金。
   應付＝當天老師費用（支數×每支費用＋老點，含加鐘、修腳皮）－ 責任歸他的跳單金額。
   現結從櫃台現金付出，所以日結的應有現金要扣掉；費用本來就算在老師抽成裡，店家淨額不重複扣。 */
const isSup=(S,tc)=>(S.support||[]).some(x=>String(x)===String(tc));
function supportOf(st,S){
  const list=sortT(st.byT).filter(t=>isSup(S,t.tc)).map(t=>{const ded=t.skipDed||0;return {tc:String(t.tc),n:t.n,zh:t.zh,cm:t.cm,ded,pay:Math.max(0,t.cm-ded)}});
  return {list,n:list.length,zh:list.reduce((s,t)=>s+t.zh,0),cm:list.reduce((s,t)=>s+t.cm,0),pay:list.reduce((s,t)=>s+t.pay,0)};
}
function expStatsOf(expenses){
  const r={total:0,cash:0,byCat:{}};
  (expenses||[]).forEach(e=>{const a=Number(e.amt)||0;r.total+=a;if(e.cash!==false)r.cash+=a;r.byCat[e.cat]=(r.byCat[e.cat]||0)+a});
  return r;
}
const sortT=byT=>Object.values(byT).sort((a,b)=>String(a.tc).localeCompare(String(b.tc),'zh-Hant',{numeric:true}));
const snNum=o=>{const n=parseInt(o.sn,10);return isNaN(n)?1e9:n};
const newId=dev=>Date.now().toString(36)+dev+Math.random().toString(36).slice(2,5);

/* ========== 匯出／匯入 ========== */
async function shareOrDownload(blob,name,title){
  try{
    const file=new File([blob],name,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:title||name});return 'shared'}
  }catch(e){if(e&&e.name==='AbortError')return 'abort'}
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);
  return 'download';
}
function loadScript(src){return new Promise((res,rej)=>{const el=document.createElement('script');el.src=src;el.onload=res;el.onerror=()=>rej(new Error('載入失敗：'+src));document.head.appendChild(el)})}
async function exportJson(S){
  const now=new Date();
  const name='slowve-backup-'+ymd(now).replace(/-/g,'')+'-'+pad(now.getHours())+pad(now.getMinutes())+'.json';
  const data={};slowveKeys().forEach(k=>{data[k]=localStorage.getItem(k)});
  const text=JSON.stringify({app:'slowve',ver:VER,exportedAt:now.toISOString(),device:S.device,data});
  return shareOrDownload(new Blob([text],{type:'application/json'}),name);
}
function readFileText(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result||''));r.onerror=rej;r.readAsText(file)})}

/* ========== 共用 UI ========== */

    <div className="h-full flex flex-col bg-bg">
      <div className="flex items-center justify-between px-4 h-12 shrink-0 border-b border-line bg-card/60">
        <div className="serif text-lg">{title}</div>
        {onClose&&<button className="w-9 h-9 rounded-full text-mute text-xl" onClick={onClose} aria-label="關閉">×</button>}

      {footer&&<div className="border-t border-line px-4 py-3 pb-safe bg-card shrink-0">{footer}</div>}

  );
  return (
    <div className="fixed inset-0 z-40 flex items-end md:items-center justify-center bg-black/40" onClick={onClose}>
      <div className="sheet-in w-full max-w-md bg-bg rounded-t-2xl md:rounded-2xl max-h-[92vh] md:max-h-[88vh] flex flex-col overflow-hidden" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between px-4 pt-3 pb-2 border-b border-line">
          <div className="serif text-lg">{title}</div>
          <button className="w-9 h-9 rounded-full text-mute text-xl" onClick={onClose} aria-label="關閉">×</button>
        </div>
        <div className="overflow-y-auto px-4 py-3 flex-1">{children}</div>
        {footer&&<div className="border-t border-line px-4 py-3 pb-safe bg-card rounded-b-none">{footer}</div>}
      </div>
    </div>
  );
}
function Dialog({dlg,onDone}){
  if(!dlg)return null;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-6">
      <div className="w-full max-w-sm bg-card rounded-2xl p-5 shadow-xl">
        <div className="text-lg font-semibold mb-2">{dlg.title}</div>
        {dlg.msg&&<div className="text-mute whitespace-pre-line mb-4">{dlg.msg}</div>}
        <div className="flex gap-2 justify-end">
          {!dlg.okOnly&&<button className="px-4 py-2 rounded-xl border border-line" onClick={()=>onDone(false)}>取消</button>}
          <button className={'px-4 py-2 rounded-xl text-white '+(dlg.danger?'bg-warn':'bg-sage')} onClick={()=>onDone(true)}>{dlg.okText||'確定'}</button>
        </div>
      </div>

  );
}
const Card=({children,className})=><div className={'bg-card rounded-2xl border border-line '+(className||'')}>{children}</div>;
function Stat({label,value,big,tone}){
  return (
    <div>
      <div className="text-xs text-mute">{label}</div>
      <div className={'num '+(big?'text-3xl serif ':'text-lg ')+(tone==='brown'?'text-brown':tone==='sage'?'text-sageD':'')}>{value}</div>

  );
}

/* ========== 訂單編輯（一筆流水可有多位客人，每位客人各自選方案與老師） ========== */
const blankItem=()=>({svc:null,min:null,promo:false,ex:0,exs:null,emp:false,ad:[],tc:'',ld:false,rj:[]});
const sameItem=(a,b)=>!!a&&!!b&&a.svc===b.svc&&a.min===b.min&&!!a.promo===!!b.promo&&!!a.ld===!!b.ld
  &&(Number(a.ex)||0)===(Number(b.ex)||0)&&(Number(a.ex)?(a.exs||a.svc)===(b.exs||b.svc):true)&&!!a.emp===!!b.emp
  &&[...(a.ad||[])].sort().join()===[...(b.ad||[])].sort().join()
  &&String(a.tc||'')===String(b.tc||'');   // 換老師也重算（指定老師的品項歸屬可能改變）
function OrderEditor({S,order,dayOrders,locked,onSave,onToggleVoid,onRelease,onClose,ask,prev,count,inline}){
  const isNew=!order;
  const origItems=order?orderItems(order):[];
  const nextSn=()=>{let mx=0;dayOrders.forEach(o=>{const n=parseInt(o.sn,10);if(!isNaN(n)&&n>mx)mx=n});return String(mx+1)};
  const [f,setF]=useState(()=>order?Object.assign({},order,{items:origItems.map(x=>Object.assign({},x,{ad:[...(x.ad||[])],rj:[...(x.rj||[])]}))}):
    {id:newId(S.device),sn:nextSn(),t:'',items:[blankItem()],skip:false,skipRev:false,skipBy:'store',skipNote:'',note:'',void:false});
  const [cur,setCur]=useState(0);
  const [rjIn,setRjIn]=useState('');
  const set=(k,v)=>setF(p=>Object.assign({},p,{[k]:v}));
  const it=f.items[cur]||f.items[0];
  const setIt=fn=>setF(p=>{const items=p.items.map((x,i)=>i===cur?Object.assign({},x,fn(x)):x);return Object.assign({},p,{items})});
  const pickCell=(svc,min)=>setIt(x=>(x.svc===svc&&x.min===min&&!x.promo)?{svc:null,min:null}:{svc,min,promo:false});
  // 加鐘：點哪一列就是哪個項目的加鐘（每點一次 +30 分）；換列時重新計算
  const addEx=svc=>setIt(x=>(x.exs||x.svc)===svc&&Number(x.ex)?{ex:Number(x.ex)+1,exs:svc}:{ex:1,exs:svc});
  const pickPromo=()=>setIt(x=>x.promo?{svc:null,min:null,promo:false}:{svc:S.promo.svc,min:S.promo.min,promo:true});
  const togAd=id=>setIt(x=>({ad:x.ad.includes(id)?x.ad.filter(y=>y!==id):[...x.ad,id]}));
  const addRj=c=>{c=String(c||'').trim();if(!c)return;setIt(x=>({rj:(x.rj||[]).includes(c)?x.rj:[...(x.rj||[]),c]}));setRjIn('')};
  const delRj=c=>setIt(x=>({rj:(x.rj||[]).filter(y=>y!==c)}));
  const addGuest=()=>{setF(p=>Object.assign({},p,{items:[...p.items,blankItem()]}));setCur(f.items.length);setRjIn('')};
  const delGuest=async()=>{
    if(f.items.length<=1)return;
    if(!await ask({title:'移除客人 '+(cur+1)+'？',okText:'移除',danger:true}))return;
    setF(p=>Object.assign({},p,{items:p.items.filter((_,i)=>i!==cur)}));setCur(Math.max(0,cur-1));
  };

  // 各客人的金額／支數／費用：品項沒變就沿用原本快照
  const priced=f.items.map((x,i)=>{
    const o=origItems[i];
    if(!isNew&&sameItem(o,x)&&o.amt!=null)return {amt:o.amt,cm:o.cm,zh:o.zh!=null?o.zh:calcOrder(x,S).zh,xs:o.xs||[],kept:true};
    return Object.assign(calcOrder(x,S),{kept:false,changed:!isNew&&!!o&&o.amt!=null});
  });
  const tot=priced.reduce((s,p)=>({amt:s.amt+p.amt,cm:s.cm+p.cm,zh:s.zh+p.zh}),{amt:0,cm:0,zh:0});

  const save=async(next)=>{
    for(let i=0;i<f.items.length;i++){
      const x=f.items[i];const who=f.items.length>1?'客人 '+(i+1)+'：':'';
      if(!x.svc){
        const soloAll=x.ad.length>0&&x.ad.every(id=>(S.addons.find(a=>a.id===id)||{}).solo);
        if(!soloAll){const sl=S.addons.filter(a=>a.solo).map(a=>a.name);setCur(i);
          await ask({title:who+'尚未選擇主項目',msg:'請先點選主項目（指壓／油壓／腳底或平日限定）。'+(sl.length?'\n沒有主項目時，只有「'+sl.join('、')+'」可以單點。':'\n額外品項不能單獨成單（可在設定頁開放單點）。'),okOnly:true});return}
      }
      const tc=String(x.tc||'').trim();
      if(!tc){setCur(i);await ask({title:who+'請輸入老師編號',okOnly:true});return}
      if((x.rj||[]).includes(tc)){setCur(i);await ask({title:who+'老師編號重複',msg:tc+' 老師同時被登記為「打槍老師」，請確認。',okOnly:true});return}
    }
    const sn=String(f.sn||'').trim();
    const dup=sn&&dayOrders.find(o=>o.id!==f.id&&!o.void&&String(o.sn)===sn);
    if(dup){
      const ok=await ask({title:'流水號重複',msg:'#'+sn+' 已有一筆（'+orderTcs(dup).join('、')+' 老師）。\n同一張單的多位客人請在同一筆裡「＋新增客人」。確定要另存一筆嗎？',okText:'仍要儲存'});
      if(!ok)return;
    }
    const now=Date.now();
    const items=f.items.map((x,i)=>Object.assign({svc:x.svc,min:x.min,promo:!!x.promo,ex:Number(x.ex)||0,exs:Number(x.ex)?(x.exs||x.svc):null,emp:!!x.emp,ad:[...x.ad],tc:String(x.tc).trim(),ld:!!x.ld,rj:[...(x.rj||[])],amt:priced[i].amt,cm:priced[i].cm,zh:priced[i].zh},(priced[i].xs||[]).length?{xs:priced[i].xs}:{}));
    onSave(Object.assign(f.del?{del:true,snDel:f.snDel,delAt:f.delAt}:{},{id:f.id,sn,t:f.t||'',note:f.note||'',void:!!f.void,skip:!!f.skip,skipRev:!!f.skipRev,skipBy:f.skipBy||'store',skipNote:f.skipNote||'',items,ca:f.ca||now,ua:now}),!!next);
  };

  const cellCls=on=>'h-14 rounded-xl border text-base num transition-colors '+(on?'bg-sage border-sage text-white shadow-inner':'bg-card border-line active:bg-sageL');
  const recent=S.teachers.slice(0,12);
  const usedTc=f.items.map((x,i)=>i!==cur?String(x.tc):null).filter(Boolean);

  const footer=(
    <div>
      <div className="flex items-end justify-between mb-3">
        <div className="text-sm text-mute">{f.items.length>1&&<span className="text-ink">{f.items.length} 位・</span>}<span className="num text-ink">{tot.zh}</span> 支・老師抽成 <span className="num text-ink">{money(tot.cm)}</span>
          {priced.some(p=>(p.xs||[]).length)&&<div className="text-xs text-brown">{priced.flatMap(p=>p.xs||[]).map((x,k)=><span key={k} className="mr-2">另 {x.tc} 老師 {x.zh} 支 {money(x.cm)}</span>)}</div>}</div>
        <div className="text-right"><span className="text-sm text-mute mr-1">{f.skip?(f.skipRev?'跳單・計入':'跳單・不計入'):'金額'}</span><span className={'serif text-3xl num '+(f.skip?'text-warn'+(f.skipRev?'':' line-through'):'text-brown')}>{money(tot.amt)}</span></div>
      </div>
      {locked?
        <div className="text-center text-mute text-sm py-2">此日已日結，需先解除日結才能修改</div>:
        f.del?<div className="text-center text-mute text-sm py-2">已刪除（原 #{f.snDel||'-'}），不計入統計、不佔流水號。需要時請重新登打一筆。</div>:
        <div className="flex gap-2">
          {!isNew&&f.void&&onRelease&&<button className="px-3 h-12 rounded-xl border border-warn text-warn bg-warnL/40" onClick={()=>onRelease(f)}>刪除</button>}
          {!isNew&&<button className={'px-4 h-12 rounded-xl border '+(f.void?'border-sage text-sageD':'border-warn text-warn')} onClick={()=>onToggleVoid(f)}>{f.void?'恢復':'作廢'}</button>}
          {isNew?<>
            {!inline&&<button className="px-4 h-12 rounded-xl border border-sage text-sageD" onClick={()=>save(false)}>存檔關閉</button>}
            <button className="flex-1 h-12 rounded-xl bg-sage text-white text-lg" onClick={()=>save(true)}>儲存，下一筆 ›</button>
          </>:<button className="flex-1 h-12 rounded-xl bg-sage text-white text-lg" onClick={()=>save(false)}>儲存</button>}
        </div>}
    </div>
  );

  return (
    <Sheet inline={inline} onClose={onClose} title={isNew?'新增訂單':(f.del?'訂單（已刪除）':f.void?'訂單（已作廢）':'編輯訂單')+(inline&&f.sn?' #'+f.sn:'')} footer={footer}>
      {prev&&<div className="mb-3 px-3 py-2 rounded-xl bg-sageL text-sageD text-sm num">
        <span className="float-right text-xs text-mute">連續第 {count} 筆</span>
        ✓ 已存 #{prev.sn||'-'}　{orderItems(prev).length>1?orderItems(prev).length+' 位　':''}{money(orderAmt(prev))}
        <div className="text-xs truncate">{orderSummary(prev,S)}</div>
      </div>}
      <fieldset disabled={locked} className={locked?'opacity-70':''}>
        <div className="flex gap-3 mb-4">
          <label className="flex-1">
            <div className="text-xs text-mute mb-1">流水號</div>
            <input className="w-full h-11 px-3 rounded-xl border border-line bg-card num" inputMode="numeric" value={f.sn} onChange={e=>set('sn',e.target.value)}/>
          </label>
          <label className="flex-1">
            <div className="text-xs text-mute mb-1">時間（選填）</div>
            <input type="time" className="w-full h-11 px-3 rounded-xl border border-line bg-card" value={f.t||''} onChange={e=>set('t',e.target.value)}/>
          </label>
        </div>

        <div className="text-xs text-mute mb-1">客人（同一張單的同行客人各自選方案與老師）</div>
        <div className="flex gap-2 overflow-x-auto pb-1 mb-3">
          {f.items.map((x,i)=>(
            <button key={i} type="button" className={'shrink-0 min-w-[5.5rem] px-3 py-1.5 rounded-xl border text-left '+(i===cur?'bg-sage border-sage text-white':'bg-card border-line')} onClick={()=>{setCur(i);setRjIn('')}}>
              <div className="text-xs opacity-80">客人 {i+1}</div>
              <div className="text-sm num whitespace-nowrap">{x.svc?SVC_SHORT[x.svc]+x.min:'未選'}{x.tc?'・'+x.tc:''}</div>
            </button>))}
          <button type="button" className="shrink-0 px-3 rounded-xl border border-dashed border-sage text-sageD text-sm" onClick={addGuest}>＋ 新增客人</button>
        </div>

        <div className={'rounded-2xl '+(f.items.length>1?'border border-sage/40 p-3 mb-4 bg-sageL/20':'')}>
          {f.items.length>1&&<div className="flex justify-between items-center mb-2">
            <div className="text-sm text-sageD font-semibold">客人 {cur+1}</div>
            <button type="button" className="text-xs text-warn" onClick={delGuest}>移除此客人</button>
          </div>}
          <div className="text-xs text-mute mb-1">主項目</div>
          <div className="grid grid-cols-[3rem_1fr_1fr_1fr_1fr] gap-2 items-center mb-2">
            <div></div>
            {MINS.map(m=><div key={m} className="text-center text-xs text-mute">{m} 分</div>)}
            <div className="text-center text-xs text-brown">加鐘 30 分</div>
            {SVCS.map(s=>{const exOn=Number(it.ex)>0&&(it.exs||it.svc)===s.id;return (
              <React.Fragment key={s.id}>
                <div className="text-sm leading-tight">{s.short}</div>
                {MINS.map((m,i)=>(
                  <button key={m} type="button" className={cellCls(it.svc===s.id&&it.min===m&&!it.promo)} onClick={()=>pickCell(s.id,m)}>
                    {(S.prices[s.id]||[])[i]}
                  </button>
                ))}
                <button type="button" aria-label={'加鐘'+s.short} className={'relative h-14 rounded-xl border text-base num '+(exOn?'bg-brown border-brown text-white':'bg-brownL/60 border-line text-brown active:bg-brownL')} onClick={()=>addEx(s.id)}>
                  +{(S.extra.price||{})[s.id]}
                  {exOn&&<span className="absolute -top-2 -right-2 min-w-[1.4rem] h-[1.4rem] px-1 rounded-full bg-ink text-white text-xs flex items-center justify-center">×{it.ex}</span>}
                </button>
              </React.Fragment>);})}
          </div>
          <button type="button" className={'w-full h-12 rounded-xl border mb-3 '+(it.promo?'bg-brown border-brown text-white':'bg-brownL border-line text-brown')} onClick={pickPromo}>
            平日限定　{S.promo.min} 分{SVC_SHORT[S.promo.svc]}　<span className="num font-semibold">{money(S.promo.price)}</span>
          </button>
          {Number(it.ex)>0&&<div className="flex items-center gap-2 mb-4 -mt-1 rounded-xl border border-brown/40 bg-brownL/40 px-3 h-11 text-sm">
            <span className="flex-1">加鐘 {SVC_SHORT[it.exs||it.svc]||''} <b className="num">{Number(it.ex)*30}</b> 分<span className="text-xs text-mute ml-1 num">{money(exPrice(it,S)*Number(it.ex))}・+{Number(it.ex)*(Number(S.extra.zh)||0)} 支</span></span>
            <button type="button" className="w-8 h-8 rounded-full border border-line bg-card" onClick={()=>setIt(x=>({ex:Math.max(0,(Number(x.ex)||0)-1)}))} aria-label="減少加鐘">−</button>
            <button type="button" className="h-8 px-2 rounded-lg text-xs text-mute" onClick={()=>setIt(()=>({ex:0,exs:null}))}>清除</button>
          </div>}

/* ========== 交班小計 ==========
   一天可插入多個交班小計（例：第 12 筆之後由小美交給麗麗）。每個小計涵蓋「上一個小計之後～這一筆」的訂單：
   營業額、現金收入（不含跳單）－ 本班現金支出 ＝ 應有現金，對照實點現金算差額。
   資料存在當日 shifts：[{id, after（訂單 id）, who（交班人）, exp（本班現金支出）, cash（實點現金）, note, at}] */
function calcShifts(sorted,shifts,S){
  const idx=id=>sorted.findIndex(o=>o.id===id);
  const list=shifts.map(sh=>({sh,i:idx(sh.after)})).sort((a,b)=>(a.i<0?1e9:a.i)-(b.i<0?1e9:b.i)||(a.sh.at||0)-(b.sh.at||0));
  let from=0;
  return list.map(x=>{
    const to=x.i<0?sorted.length-1:x.i;
    const part=sorted.slice(from,to+1);const st=statsOf(part,S);
    const r={sh:x.sh,orphan:x.i<0,from:part[0],to:part[part.length-1],n:st.n,amt:st.amt,cashIn:st.cash,exp:Number(x.sh.exp)||0};
    r.expected=r.cashIn-r.exp;r.diff=x.sh.cash==null||x.sh.cash===''?null:Number(x.sh.cash)-r.expected;
    from=to+1;return r;
  });
}

        {x.diff!=null&&<span>實點 <b>{money(x.sh.cash)}</b> <span className={x.diff===0?'text-sageD':'text-warn'}>差額 {smoney(x.diff)}</span></span>}

          <div className="flex justify-between py-0.5"><span className="text-mute">範圍</span><span>{calc.from?'#'+(calc.from.sn||'-')+'～#'+(calc.to.sn||'-'):'—'}（{calc.n||0} 單）</span></div>
          <div className="flex justify-between py-0.5"><span className="text-mute">營業額小計</span><span>{money(calc.amt)}</span></div>
          <div className="flex justify-between py-0.5"><span className="text-mute">現金收入（不含跳單）</span><span>{money(calc.cashIn)}</span></div>
          <div className="flex justify-between py-0.5"><span className="text-mute">－ 本班現金支出</span><span>{money(calc.exp)}</span></div>

        <div className="text-xs text-mute mt-3">可以邊做邊插入，也可以整天輸入完再補。小計涵蓋「上一個交班小計之後」到所選這一筆的訂單；日結仍以整天計算。</div>

/* ========== 日頁 ==========
   part：'all'＝手機版與平板雙欄的左欄（全部區塊）；平板三欄時拆成 'side'（日期、統計、支出、老師、日結）與 'list'（訂單列表）
   wide：平板版（不顯示右下「＋」，訂單在右側面板登打）；selId：右側面板正在編輯的訂單 */
function DayPage({S,date,setDate,rev,openEditor,openExp,openClose,onUnlock,part,wide,selId,selExpId,openShift,bump,ro,fix,setFix}){   // ro：主櫃已上線、不在修正模式（只看不打）
  part=part||'all';
  const today=bizToday(S.cutoff);
  const dd=useMemo(()=>getDay(loadMonth(monKey(date)),date),[date,rev]);
  const orders=useMemo(()=>[...dd.orders].sort((a,b)=>snNum(a)-snNum(b)||(a.ca||0)-(b.ca||0)),[dd]);
  const st=useMemo(()=>statsOf(dd.orders,S),[dd,S]);
  const ex=useMemo(()=>expStatsOf(dd.expenses),[dd]);
  const sup=useMemo(()=>supportOf(st,S),[st,S]);
  const exps=useMemo(()=>[...(dd.expenses||[])].sort((a,b)=>(a.ca||0)-(b.ca||0)),[dd]);

  // v0.1-065：主櫃系統上線後，日報由主櫃登打；老闆／主管可切到「修正模式」改錯，修改會記在這一天的紀錄

/* ========== 月報 ========== */
/* 發薪週期：上期 1～15 號（當月 20 號發薪）、下期 16 號～月底（次月 5 號發薪） */
const PERIODS=[{id:'all',label:'整月'},{id:'h1',label:'上期'},{id:'h2',label:'下期'}];
const PERIOD_LABEL={all:'整月',h1:'上期',h2:'下期'};
function periodRange(ym,p){const a=ym.split('-').map(Number);const dim=new Date(a[0],a[1],0).getDate();return p==='h1'?[1,15]:p==='h2'?[16,dim]:[1,dim]}
function periodText(ym,p){const m=Number(ym.split('-')[1]);const r=periodRange(ym,p);return m+'/'+r[0]+'～'+m+'/'+r[1]}
function payDay(ym,p){const a=ym.split('-').map(Number);if(p==='h1')return new Date(a[0],a[1]-1,20);if(p==='h2')return new Date(a[0],a[1],5);return null}
const fmtPayDay=d=>d?(d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()):'';
const adjIn=(list,p)=>p==='all'?list:list.filter(j=>(j.p||'h2')===p);   // 舊資料沒標期別的，視為下期（月底結算）
const adjSumOf=list=>list.reduce((s,x)=>s+(Number(x.amt)||0),0);

function monthData(ym,S,p){
  const md=loadMonth(ym);const [from,to]=periodRange(ym,p||'all');
  const rows=[];const tot={expList:[],n:0,amt:0,cash:0,expCash:0,cm:0,exp:0,zh:0,sup:0,supCm:0,skip:0,skipN:0,skipRev:0,skipBy:{store:0,counter:0,teacher:0},skipList:[],byT:{},byCat:{},rj:{}};
  for(let d=from;d<=to;d++){
    const dd=md.days[pad(d)];
    if(!dd||(!(dd.orders||[]).length&&!(dd.expenses||[]).length&&!dd.close))continue;
    const st=statsOf(dd.orders||[],S);const ex=expStatsOf(dd.expenses);
    rows.push({date:ym+'-'+pad(d),st,ex,sup:supportOf(st,S).pay,closed:!!dd.close});
    tot.n+=st.n;tot.amt+=st.amt;tot.cm+=st.cm;tot.exp+=ex.total;tot.zh+=st.zh;const sp=supportOf(st,S);tot.sup+=sp.pay;tot.supCm+=sp.cm;tot.cash+=st.cash;tot.expCash+=ex.cash;tot.skip+=st.skip;tot.skipN+=st.skipN;tot.skipRev+=st.skipRev;
    Object.keys(st.skipBy).forEach(k=>{tot.skipBy[k]=(tot.skipBy[k]||0)+st.skipBy[k]});st.skipList.forEach(o=>tot.skipList.push(Object.assign({date:ym+'-'+pad(d)},o)));
    Object.keys(st.rj).forEach(c=>{tot.rj[c]=(tot.rj[c]||0)+st.rj[c]});
    Object.keys(ex.byCat).forEach(c=>{tot.byCat[c]=(tot.byCat[c]||0)+ex.byCat[c]});
    (dd.expenses||[]).forEach(e=>tot.expList.push(Object.assign({date:ym+'-'+pad(d)},e)));
    Object.values(st.byT).forEach(t=>{const x=tot.byT[t.tc]||(tot.byT[t.tc]={tc:t.tc,n:0,zh:0,ld:0,cm:0,amt:0});x.n+=t.n;x.zh+=t.zh;x.ld+=t.ld;x.cm+=t.cm;x.amt+=t.amt});
  }
  return {rows,tot,pay:md.pay||{}};
}
function teacherOrders(ym,tc,p){
  const md=loadMonth(ym);const [from,to]=periodRange(ym,p||'all');const list=[];
  Object.keys(md.days).sort().forEach(d=>{
    const dn=Number(d);if(dn<from||dn>to)return;
    (md.days[d].orders||[]).filter(o=>!o.void)
      .sort((a,b)=>snNum(a)-snNum(b)||(a.ca||0)-(b.ca||0))
      .forEach(o=>orderLines(o,ym+'-'+d).filter(l=>String(l.tc)===String(tc)).forEach(l=>list.push(l)));
  });
  return list;
}
function PeriodSeg({value,onChange,ym,noAll}){
  return (
    <div className="flex rounded-xl border border-line overflow-hidden bg-card">
      {PERIODS.filter(x=>!(noAll&&x.id==='all')).map(x=>(
        <button key={x.id} className={'flex-1 h-11 text-sm leading-tight '+(value===x.id?'bg-sage text-white':'text-ink')} onClick={()=>onChange(x.id)}>
          {x.label}{x.id!=='all'&&<div className={'text-[11px] num '+(value===x.id?'text-white/80':'text-mute')}>{periodText(ym,x.id)}</div>}
        </button>))}
    </div>
  );
}

        {per==='all'&&<div className="mt-3 pt-3 border-t border-line grid grid-cols-2 gap-2 num">
          {['h1','h2'].map(h=>(
            <button key={h} className="text-left rounded-xl bg-bg border border-line px-3 py-2 active:bg-sageL" onClick={()=>setPer(h)}>

      {data.rows.length===0&&<Card className="p-6 text-center text-mute">{per==='all'?'本月':'本期'}沒有資料</Card>}
      {data.rows.length>0&&<Card className="overflow-hidden">
        {data.rows.map((r,i)=>(
          <button key={r.date} className={'w-full flex items-center px-3 py-3 text-left num active:bg-sageL '+(i?'border-t border-line':'')} onClick={()=>goDay(r.date)}>
            <div className="w-24">{fmtDate(r.date)}</div>
            <div className="flex-1 text-sm text-mute">{r.st.n} 單{r.closed?<span className="ml-2 text-sageD">✓ 日結</span>:<span className="ml-2 text-warn/80">未日結</span>}</div>
            <div className="text-right">{money(r.st.amt)}{r.ex.total+r.sup>0&&<div className="text-xs text-warn">支出 -{money(r.ex.total+r.sup)}</div>}</div>
          </button>
        ))}
      </Card>}

    let s=String(t);if(o.max){const full=s;while(s.length>1&&ctx.measureText(s).width>o.max)s=s.slice(0,-1);if(s!==full)s=s.slice(0,-1)+'…'}
    ctx.fillText(s,x,y)};

      const bx=M+i*(bw+f(20));rect(ctx,bx,y,bw,f(120),C.sageL);
      text(ctx,b[0],bx+f(22),y+f(44),{size:24,color:C.mute});text(ctx,b[1],bx+f(22),y+f(96),{size:36,weight:'600',color:i===3?C.sageD:C.ink,max:bw-f(30)});

async function liffReady(){
  if(!window.liff)await loadScript(LIFF_SDK);
  if(!window.__liffInited){await window.liff.init({liffId:LIFF_ID});window.__liffInited=true}
  return window.liff;
}
const liffShareUrl=D=>'https://liff.line.me/'+LIFF_ID+'?share='+b64uEnc(JSON.stringify(D));

/* 代發頁：網址帶 ?share=（或 LIFF 導轉中的 liff.state）時，不載入門店資料，只負責發卡片 */
function ShareRelay(){
  const [st,setSt]=useState('loading');   // loading / picking / done / cancelled / error
  const [err,setErr]=useState('');
  const [D,setD]=useState(null);
  const pick=data=>{
    setSt('picking');
    if(!(window.liff.isApiAvailable&&window.liff.isApiAvailable('shareTargetPicker'))){setSt('error');setErr('此環境不支援分享功能，請在 LINE App 內開啟。');return}
    window.liff.shareTargetPicker([buildPayFlex(data)],{isMultiple:true})
      .then(r=>setSt(r?'done':'cancelled')).catch(e=>{setSt('error');setErr(String(e&&e.message||e))});
  };
  useEffect(()=>{
    (async()=>{
      try{
        if(!window.liff)await loadScript(LIFF_SDK);
        await window.liff.init({liffId:LIFF_ID});
        const q=new URLSearchParams(location.search);
        if(!q.get('share'))return;              // 仍在 liff.state 導轉中，LIFF 會自己換頁
        if(!window.liff.isLoggedIn()){window.liff.login({redirectUri:location.href});return}
        const data=JSON.parse(b64uDec(q.get('share')));setD(data);pick(data);
      }catch(e){setSt('error');setErr(String(e&&e.message||e))}
    })();
  },[]);
  const close=()=>{try{window.liff.closeWindow()}catch(_e){location.href=location.pathname}};
  return (
    <div className="min-h-screen flex flex-col items-center justify-center gap-4 p-6 text-center">
      <div className="serif text-3xl tracking-widest text-sageD">緩緩</div>
      {D&&<div className="text-sm text-mute num">{D.y}年{D.m}月・{D.t} 老師</div>}
      {(st==='loading'||st==='picking')&&<div className="text-mute">{st==='loading'?'準備中…':'請選擇要傳送的對象…'}</div>}
      {st==='done'&&<div className="text-lg text-sageD">✓ 已傳送</div>}
      {st==='cancelled'&&<div className="text-mute">已取消傳送</div>}
      {st==='error'&&<div className="text-warn text-sm whitespace-pre-line">{err}</div>}
      {(st==='done'||st==='cancelled'||st==='error')&&<div className="flex gap-2">
        {D&&st!=='error'&&<button className="px-5 h-11 rounded-xl border border-sage text-sageD" onClick={()=>pick(D)}>再傳一次</button>}
        <button className="px-6 h-11 rounded-xl bg-sage text-white" onClick={close}>關閉</button>
      </div>}
    </div>
  );
}

    if(per==='all'){await ask({title:'請先選上期或下期',msg:'加項／扣項要歸在上期或下期，才會出現在該期的薪資明細。',okOnly:true});return}

  const gen=async type=>{
    if(busy)return;setBusy(type);
    try{
      const {canvases}=drawPayslipPages({S,ym,tc,orders,adj,showAmt,size,kind,showBrand,per});
      let r;
      if(type==='pdf'){
        if(!window.jspdf)await loadScript(JSPDF_URL);
        const pt=c=>size==='a4'?[595.28,841.89]:[c.width*0.5,c.height*0.5];
        const doc=new window.jspdf.jsPDF({unit:'pt',format:pt(canvases[0]),orientation:'portrait'});
        canvases.forEach((c,i)=>{const d=pt(c);if(i)doc.addPage(d,'portrait');doc.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,d[0],d[1])});
        r=await shareOrDownload(doc.output('blob'),base+'.pdf',shareTitle);
      }else{
        const blobs=await Promise.all(canvases.map(c=>canvasBlob(c,'image/png')));
        const files=blobs.map((b,i)=>new File([b],base+(blobs.length>1?'-'+(i+1):'')+'.png',{type:'image/png'}));
        r='download';
        try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,title:shareTitle});r='shared'}}
        catch(e){if(e&&e.name==='AbortError')r='abort'}

      }
      if(r!=='abort')toast(r==='shared'?'已開啟分享，可選 LINE 傳給老師':'已下載檔案');

      <button className="flex-[1.4] h-12 rounded-xl bg-sage text-white text-lg disabled:opacity-50" disabled={!!busy} onClick={()=>gen('pdf')}>{busy==='pdf'?'產生中…':'分享 PDF'}</button>
    </div>

    <Sheet onClose={onClose} title={'老師 '+tc+'・'+a[0]+'年'+Number(a[1])+'月'} footer={footer}>
      <div className="mb-3"><PeriodSeg value={per} onChange={setPer} ym={ym}/></div>
      {pd&&<div className="text-sm text-brown mb-2 px-1">{PERIOD_LABEL[per]}（{periodText(ym,per)}）・發薪日 {fmtPayDay(pd)}</div>}

        </div>
        <div className="flex justify-between py-1 border-t border-line pt-2"><span className="text-mute">費用合計</span><span>{money(sumFee)}</span></div>
        {adj.map((j,i)=>(
          <div key={i} className="flex items-center justify-between py-1">
            <span className="text-mute">{per==='all'&&<span className="mr-1 px-1 rounded bg-brownL text-brown text-xs">{PERIOD_LABEL[j.p||'h2']}</span>}{j.amt<0?'扣項':'加項'}：{j.name}</span>
            <span className={j.amt<0?'text-warn':''}>{smoney(j.amt)}
              <button className="ml-2 w-6 h-6 rounded-full text-mute" onClick={async()=>{if(await ask({title:'刪除這個項目？',okText:'刪除',danger:true}))saveAdj(allAdj.filter(x=>x!==j))}}>×</button></span>
          </div>))}
        <div className="flex items-end justify-between pt-2 mt-1 border-t border-line">
          <span>{TT.total}</span><span className="serif text-3xl text-brown">{money(sumFee+adjSum)}</span>
        </div>
      </Card>

      {orders.filter(o=>o.skip&&o.skipBy==='teacher').length>0&&<Card className="p-3 mb-3 border-warn">
        <div className="text-sm text-warn font-semibold mb-1">責任歸老師的跳單</div>
        {orders.filter(o=>o.skip&&o.skipBy==='teacher').map(o=>{
          const done=allAdj.some(j=>j.src===o.id);const d=Number(o.date.slice(8));
          return (
          <div key={o.id} className="flex items-center gap-2 py-1.5 border-t border-line text-sm num">

        <input className="w-24 h-11 px-2 rounded-xl border border-line bg-card num text-center" inputMode="numeric" placeholder="金額" value={am} onChange={e=>setAm(e.target.value.replace(/[^\d]/g,''))}/>

/* ========== LINE 登入測試（目前只測能不能正常登入，不做任何資料綁定） ==========
   沿用 massage-pay 1.12～1.13 的經驗：
   - 由按鈕觸發登入（使用者手勢），外部瀏覽器才不會擋導轉
   - 先 logout 再 login，清掉瀏覽器快取的舊 token
   - redirectUri 用乾淨網址（不帶上次殘留的 query）
   - 導回後若網址帶 code=，要再 liff.init 一次才算完成登入 */
const LINE_TEST_KEY=P+'linetest-pending';
const LT_SENT_KEY=P+'lt-sent';
const LT_ZH='緩緩測試';
const newNonce=()=>Math.random().toString(36).slice(2,8);
// 從一個網址（含 liff.state 裡包著的網址）取出測試參數
function ltFromUrl(u){
  try{
    const url=new URL(u);const q=url.searchParams;
    let lt=q.get('lt'),ltz=q.get('ltz');
    const st=q.get('liff.state');
    if((!lt||!ltz)&&st){const inner=new URLSearchParams(st.indexOf('?')>=0?st.slice(st.indexOf('?')+1):st);lt=lt||inner.get('lt');ltz=ltz||inner.get('ltz')}
    return {lt,ltz,liffState:!!st,liffParams:q.has('liffClientId')||q.has('liffRedirectUri'),code:q.has('code')};
  }catch(_e){return {}}
}
function urlLog(){try{return JSON.parse(localStorage.getItem('slowve-urllog')||'[]')}catch(_e){return []}}
// 送出的測試碼存 localStorage（15 分鐘有效），跨分頁也比對得到
function ltSentSet(n){try{localStorage.setItem(LT_SENT_KEY,JSON.stringify({n,t:Date.now()}))}catch(_e){}}
function ltSentGet(){try{const x=JSON.parse(localStorage.getItem(LT_SENT_KEY)||'null');return x&&Date.now()-x.t<9e5?x:null}catch(_e){return null}}
// 遮蔽網址裡的登入憑證（access_token 等），避免截圖或複製時外流
function maskUrl(u){
  let s=String(u||'');try{s=decodeURIComponent(s)}catch(_e){}
  return s.replace(/(access_token|context_token|id_token|refresh_token|code|state)=([^&#]+)/g,(m,k,v)=>k+'='+(v.length>8?v.slice(0,4)+'…（'+v.length+' 字）':v));
}
/* 開啟來源：看「這次測試的第一個網址」
   - hash 帶 context_token／access_token → 在 LINE App 以 LIFF 網址開啟
   - 帶 liff.state 但沒有 code → 從 liff.line.me 導入（外部瀏覽器）
   - 其他 → 直接開 GitHub 網址（LINE 登入導回時也會出現 liff.state，但會同時帶 code，所以不算） */
function sourceOf(u){
  const s=String(u||'');
  if(/[#&](context_token|access_token)=/.test(s))return 'LIFF 網址（LINE App 內開啟）';
  const x=ltFromUrl(s);
  if(x.liffState&&!x.code)return 'LIFF 網址（liff.line.me 導入）';
  return 'GitHub 網址直接開啟';
}
function uaInfo(){
  const ua=navigator.userAgent||'';
  const os=/iPhone|iPad|iPod/.test(ua)?'iOS':/Android/.test(ua)?'Android':/Mac/.test(ua)?'Mac':/Windows/.test(ua)?'Windows':'其他';
  const br=/Line\//i.test(ua)?'LINE 內建瀏覽器':/CriOS|Chrome/.test(ua)&&!/Edg/.test(ua)?'Chrome':/Safari/.test(ua)?'Safari':/Edg/.test(ua)?'Edge':'其他';
  const standalone=(window.navigator.standalone===true)||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
  return {os,br,standalone};
}
function LineLoginTest({standalone}){
  const [st,setSt]=useState('idle');   // idle / working / done / error
  const [info,setInfo]=useState(null);
  const [err,setErr]=useState('');
  const [copied,setCopied]=useState(false);
  const ui=uaInfo();
  const selfUrl=nonce=>location.origin+location.pathname+'?'+(standalone?'linetest=1&':'')+'lt='+nonce+'&ltz='+encodeURIComponent(LT_ZH);
  const liffTestUrl=nonce=>'https://liff.line.me/'+LIFF_ID+'?linetest=1&lt='+nonce+'&ltz='+encodeURIComponent(LT_ZH);
  const collect=async()=>{
    const L=await liffReady();
    // 網址還帶 liff.state＝LIFF 的中繼頁，liff.init 之後會自動換到最終網址；這裡先不測，免得提早清掉送出紀錄
    if(new URLSearchParams(location.search).has('liff.state'))return null;
    const r={inClient:L.isInClient(),loggedIn:L.isLoggedIn(),os:L.getOS&&L.getOS(),sdk:L.getVersion&&L.getVersion(),lineVer:L.getLineVersion&&L.getLineVersion(),
      share:L.isApiAvailable&&L.isApiAvailable('shareTargetPicker'),at:Date.now()};
    try{const c=L.getContext&&L.getContext();r.ctxType=c&&c.type}catch(_e){}
    if(r.loggedIn){
      try{const p=await L.getProfile();r.name=p.displayName;r.uid=p.userId;r.pic=p.pictureUrl}catch(e){r.profileErr=String(e&&e.message||e)}
      try{r.idToken=!!L.getIDToken()}catch(_e){r.idToken=false}
    }
    const sent=ltSentGet();
    const entry=window.__entryUrl||location.href;
    // 這次測試的網址序列：有送出紀錄就從送出時間前一點開始算，否則只看本次進入網址
    const log=urlLog();
    let seq;
    if(sent)seq=log.filter(x=>x.t>=sent.t-3000);
    else{ // 沒有送出紀錄：從最後一筆往回找，彼此相隔 15 秒內的視為同一串導轉
      seq=[];for(let i=log.length-1;i>=0;i--){if(seq.length&&seq[0].t-log[i].t>15000)break;seq.unshift(log[i])}
    }
    if(!seq.length)seq=[{u:entry,r:window.__entryRef||'',t:Date.now()}];
    r.source=sourceOf(seq[0].u);
    const all=seq.map(x=>x.u).concat([entry]);
    r.loginBack=all.some(u=>{const x=ltFromUrl(u);return x.code||x.liffParams});
    let got=null;for(const u of all.slice().reverse()){const x=ltFromUrl(u);if(x.lt){got=x;break}}
    r.ltGot=got?got.lt:null;r.ltzGot=got?got.ltz:null;r.ltSent=sent?sent.n:null;
    r.entry=entry;r.ref=window.__entryRef||'';r.log=seq.slice(-8);
    try{localStorage.removeItem(LT_SENT_KEY)}catch(_e){}   // 比對完就清掉，避免之後每次開都跳到設定頁
    setInfo(r);setSt(r.loggedIn?'done':'idle');
    try{if(/[?&](code|liffClientId|liffRedirectUri|lt)=/.test(location.search)||/access_token=/.test(location.hash))history.replaceState(null,'',location.pathname+(standalone?'?linetest=1':''))}catch(_e){}
    return r;
  };
  const login=async()=>{
    setSt('working');setErr('');
    try{
      const L=await liffReady();
      const nonce=newNonce();
      if(L.isInClient()){
        // LINE App 內本來就是登入狀態，不會經過登入頁；改用 liff.line.me 重新開啟測試頁，測 LIFF 網址帶參數
        ltSentSet(nonce);location.href=liffTestUrl(nonce);return;
      }
      try{if(L.isLoggedIn())L.logout()}catch(_e){}
      ltSentSet(nonce);
      L.login({redirectUri:selfUrl(nonce)});
    }catch(e){setSt('error');setErr(String(e&&e.message||e))}
  };
  const logout=async()=>{try{const L=await liffReady();L.logout()}catch(_e){}setInfo(null);setSt('idle')};
  useEffect(()=>{
    const pend=!!ltSentGet();
    if(pend||standalone||/[?&](code|lt)=/.test(location.search)||/context_token=/.test(location.hash)){
      setSt('working');collect().then(r=>{if(!r)setSt('working')}).catch(e=>{setSt('error');setErr(String(e&&e.message||e))});
    }
  },[]);

  const rows=info?[
    ['登入狀態',info.loggedIn?'✓ 已登入':'未登入',info.loggedIn],
    ['執行環境',info.inClient?'LINE App 內':'外部瀏覽器'],
    ['選好友分享',info.share?'可用':'不可用',!!info.share],
    ...(info.loggedIn?[['ID Token',info.idToken?'有':'無',!!info.idToken]]:[]),
    ...(info.profileErr?[['讀取個人資料',info.profileErr,false]]:[]),
    ['LIFF SDK',(info.sdk||'-')+(info.lineVer?'・LINE '+info.lineVer:'')],
    ['開啟來源',info.source],
    ['LINE 登入導回',info.loginBack?'✓ 有（網址帶 code）':'無（本次沒有經過登入頁）',info.loginBack?true:undefined],
    ...(info.ctxType?[['LIFF context',info.ctxType]]:[]),
    ['網址參數 lt',info.ltGot?(info.ltSent?(info.ltGot===info.ltSent?'✓ 收到 '+info.ltGot+'（與送出一致）':'✗ 收到 '+info.ltGot+'，送出 '+info.ltSent):'✓ 收到 '+info.ltGot+'（無送出紀錄可比對）'):(info.ltSent?'✗ 沒收到（送出 '+info.ltSent+'）':'（本次沒有帶測試參數）'),
      info.ltGot?(info.ltSent?info.ltGot===info.ltSent:true):(info.ltSent?false:undefined)],
    ...((info.ltGot||info.ltSent)?[['中文參數 ltz',info.ltzGot?(info.ltzGot===LT_ZH?'✓ '+info.ltzGot:'✗ '+info.ltzGot):'✗ 沒收到',info.ltzGot===LT_ZH]]:[]),
  ]:[];
  const copyText=()=>{
    const d=new Date(info.at);
    const lines=['緩緩門店 LINE 登入測試 '+VER,'時間：'+ymd(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()),
      '環境：'+ui.os+'・'+ui.br+(ui.standalone?'・主畫面 App':''),
      ...(info.name?['使用者：'+info.name+'（'+(info.uid?info.uid.slice(0,6)+'…'+info.uid.slice(-4):'')+'）']:[]),
      ...rows.map(r=>r[0]+'：'+r[1]),
      '本次進入網址：'+maskUrl(info.entry),
      ...(info.ref?['來源頁：'+maskUrl(info.ref)]:[]),
      ...(info.log&&info.log.length?['導轉經過的網址：',...info.log.map(x=>new Date(x.t).toLocaleTimeString('zh-TW',{hour12:false})+'　'+maskUrl(x.u))]:[])];
    return lines.join('\n');
  };
  const [uidCopied,setUidCopied]=useState(false);
  const copyStr=(t,done)=>{
    const fallback=()=>{try{const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();done()}catch(_e){}};
    try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done).catch(fallback);else fallback()}catch(_e){fallback()}
  };
  const copyUid=()=>copyStr(info.uid,()=>{setUidCopied(true);setTimeout(()=>setUidCopied(false),2000)});
  const doCopy=()=>{
    const t=copyText();
    const ok=()=>{setCopied(true);setTimeout(()=>setCopied(false),2000)};
    const fallback=()=>{try{const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();ok()}catch(_e){}};
    try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok).catch(fallback);else fallback()}catch(_e){fallback()}
  };
  const Row=({k,v,ok})=><div className="flex justify-between gap-3 py-1 border-t border-line text-sm"><span className="text-mute shrink-0">{k}</span><span className={'num text-right '+(ok===false?'text-warn':ok?'text-sageD':'')}>{v}</span></div>;
  return (
    <div>
      <div className="text-xs text-mute mb-2">環境：{ui.os}・{ui.br}{ui.standalone?'・主畫面 App':''}</div>
      {info&&<div className="mb-3">
        {info.loggedIn&&info.name&&<div className="flex items-center gap-3 mb-2">
          {info.pic&&<img src={info.pic} alt="" className="w-10 h-10 rounded-full"/>}
          <div className="flex-1 min-w-0"><div className="font-semibold">{info.name}</div><div className="text-xs text-mute num">{info.uid?info.uid.slice(0,6)+'…'+info.uid.slice(-4):''}</div></div>
          {info.uid&&<button className={'shrink-0 h-9 px-3 rounded-lg border text-sm '+(uidCopied?'border-sage bg-sageL text-sageD':'border-sage text-sageD')} onClick={copyUid}>{uidCopied?'✓ 已複製':'複製 LINE userId'}</button>}
        </div>}
        {rows.map(r=><Row key={r[0]} k={r[0]} v={r[1]} ok={r[2]}/>)}
        <div className="pt-2 border-t border-line text-xs">
          <div className="text-mute mb-1">本次進入網址<span className="ml-1">（登入憑證已遮蔽）</span></div>
          <div className="break-all num bg-bg rounded p-2">{maskUrl(info.entry)}</div>
          {info.ref&&<div className="text-mute mt-1 break-all">來源頁：{maskUrl(info.ref)}</div>}
          {info.log&&info.log.length>1&&<details className="mt-2"><summary className="text-mute">導轉經過的網址（{info.log.length}）</summary>
            {info.log.map((x,i)=><div key={i} className="break-all num mt-1 bg-bg rounded p-2"><span className="text-mute">{new Date(x.t).toLocaleTimeString('zh-TW',{hour12:false})}　</span>{maskUrl(x.u)}</div>)}
          </details>}
        </div>
        <button className="w-full h-10 mt-3 rounded-lg border border-sage text-sageD" onClick={doCopy}>{copied?'✓ 已複製':'複製測試結果'}</button>
      </div>}
      {st==='error'&&<div className="text-sm text-warn mb-2 whitespace-pre-line">登入失敗：{err}</div>}
      <div className="flex gap-2">
        <button className="flex-1 h-10 rounded-lg text-white disabled:opacity-50" style={{background:'#06c755'}} disabled={st==='working'} onClick={login}>
          {st==='working'?'連線中…':info&&info.inClient?'LIFF 參數傳遞測試':info&&info.loggedIn?'重新登入測試':'LINE 登入測試'}</button>
        {info&&info.loggedIn&&!info.inClient&&<button className="px-4 h-10 rounded-lg border border-line" onClick={logout}>登出</button>}
      </div>
      {info&&info.inClient&&<div className="text-xs text-mute mt-1">LINE App 內本來就已登入，按上面會以 liff.line.me 帶參數重新開啟，測試 LIFF 網址的參數傳遞。</div>}
      {!standalone&&<a className="block text-center text-sm text-sageD underline mt-2" href={liffTestUrl('app'+newNonce())} onClick={e=>{const u=new URL(e.currentTarget.href);ltSentSet(u.searchParams.get('lt'))}}>改用 LINE App 開啟測試頁</a>}
    </div>
  );
}

/* ========== 帳號開通申請（圖文選單 → liff.line.me/{LIFF_ID}?mode=join） ==========
   點選身分（老師／櫃台／客人）→ 立刻用 liff.sendMessages 以申請人名義，把「QR Code＋帳號申請碼」卡片與申請碼純文字
   傳進他與官方帳號的一對一聊天室；頁面上同時顯示同一張卡片，主管可直接掃申請人螢幕。
   帳號申請碼＝LINE userId。Flex 的圖片必須是公開網址，QR 圖由 api.qrserver.com 產生（申請碼會經過該服務）。
   前提：LIFF 勾選 chat_message.write；從官方帳號聊天室的圖文選單開啟；官方帳號開啟「聊天」。 */
const JOIN_ROLES=[{id:'teacher',label:'老師'},{id:'counter',label:'櫃台'},{id:'guest',label:'客人'}];
const joinQrUrl=code=>'https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=16&data='+encodeURIComponent(code);
// 顯示用名稱。工作身分 roles：teacher／counter／guest；管理權限 admin：owner 老闆／manager 主管
const ROLE_LABELS={owner:'老闆',teacher:'老師',counter:'櫃台',guest:'客人'};
const ADMIN_LABELS={owner:'老闆',manager:'主管'};
const joinRoleLabel=id=>ROLE_LABELS[id]||id;
/* members.json 一人一筆：{uid,name,roles:[...],tc,admin}；相容舊寫法 {role:'teacher'|'owner'} */
function memberInfo(m){
  let roles=Array.isArray(m.roles)?m.roles.slice():(m.role&&m.role!=='owner'?[m.role]:[]);
  const admin=m.admin||(m.role==='owner'?'owner':null);
  const parts=roles.map(r=>ROLE_LABELS[r]||r);
  if(m.tc&&roles.includes('teacher'))parts[roles.indexOf('teacher')]+=' '+m.tc;
  if(admin)parts.push(ADMIN_LABELS[admin]||admin);
  return {roles,admin,label:parts.join('・')};
}
function buildJoinFlex({name,role,uid}){
  const G={sage:'#6f7d62',mute:'#8b8478',ink:'#3b3a36',brown:'#a0784f',bg:'#f4efe7'};
  const T=(t,o)=>Object.assign({type:'text',text:String(t)||' ',wrap:true},o||{});
  return {type:'flex',altText:'帳號開通申請（'+joinRoleLabel(role)+'）',contents:{type:'bubble',size:'mega',
    hero:{type:'image',url:joinQrUrl(uid),size:'full',aspectRatio:'1:1',aspectMode:'fit',backgroundColor:'#ffffff'},
    body:{type:'box',layout:'vertical',spacing:'md',contents:[
      T('帳號開通申請',{size:'xl',weight:'bold',color:G.ink,align:'center'}),
      T(joinRoleLabel(role)+'・'+name,{size:'sm',color:G.sage,align:'center'}),
      {type:'separator',margin:'md'},
      T('請聯繫店家工作人員或主管掃描 QR Code 完成帳號開通作業，或分享以下帳號申請碼',{size:'sm',color:G.mute,align:'center',margin:'md'}),
      {type:'box',layout:'vertical',backgroundColor:G.bg,cornerRadius:'8px',paddingAll:'10px',contents:[
        T(uid,{size:'sm',color:G.ink,align:'center'})]},
      T('緩緩 SLOWVE BODY SPA',{size:'xxs',color:G.brown,align:'center',margin:'md'})
    ]}}};
}
/* 本機記錄申請過（LINE 內建瀏覽器的 localStorage）；userId 不同（換了 LINE 帳號）就不算 */
const JOIN_KEY=P+'join';
function joinGet(uid){try{const x=JSON.parse(localStorage.getItem(JOIN_KEY)||'null');return x&&x.uid===uid?x:null}catch(_e){return null}}
function joinSet(x){try{localStorage.setItem(JOIN_KEY,JSON.stringify(x))}catch(_e){}}
/* 已開通名單：GitHub 上的公開檔 members.json，格式 {"members":[{"uid":"U…","role":"teacher","name":"江將"}]}；
   沒有這個檔或讀取失敗 → 視為尚未審查 */
/* v0.1-053：名單裡也有應徵中的人 {uid,roles:['applicant'],apply:'teacher'|'counter',stage:'applied'|'interview'|'hired'|'rejected'}，
   只有 userId 和階段（沒有姓名電話），不算開通。fetchMembers() 只回開通的人；all=true 連應徵中的一起回 */
const isApplicant=m=>!!(m&&m.stage);
async function fetchMembers(all){
  const r=await fetch('./members.json?t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error(r.status===404?'nofile':'http '+r.status);
  const j=await r.json();const list=Array.isArray(j)?j:(j.members||[]);
  return all?list:list.filter(m=>!isApplicant(m));
}
function JoinCard({name,role,uid}){
  return (
    <div className="bg-white rounded-2xl border border-line overflow-hidden">
      <img src={joinQrUrl(uid)} alt="QR Code" className="w-full aspect-square bg-white p-4"/>
      <div className="p-4 text-center">
        <div className="text-xl font-semibold">帳號開通申請</div>
        <div className="text-sm text-sageD mt-1">{joinRoleLabel(role)}・{name}</div>
        <div className="border-t border-line my-3"></div>
        <div className="text-sm text-mute">請聯繫店家工作人員或主管掃描 QR Code 完成帳號開通作業，或分享以下帳號申請碼</div>
        <div className="mt-2 rounded-lg bg-bg px-3 py-2 text-sm num break-all">{uid}</div>
        <div className="text-[11px] tracking-widest text-brown mt-3">緩緩 SLOWVE BODY SPA</div>
      </div>
    </div>
  );
}
/* 線上開通（v0.1-042）：有 GAS 時走線上申請；沒有 GAS 才用舊的「傳申請卡到聊天室」 */
function JoinPage(){return GAS_URL?<JoinOnline/>:<JoinPageOld/>}
function JoinPageOld(){
  const [st,setSt]=useState('loading');   // loading / pick / sending / done / error
  const [err,setErr]=useState('');
  const [prof,setProf]=useState(null);
  const [inClient,setInClient]=useState(false);
  const [role,setRole]=useState(null);
  const [sent,setSent]=useState(false);
  const [copied,setCopied]=useState(false);
  const [rec,setRec]=useState(null);           // 本機申請紀錄
  const [chk,setChk]=useState(null);           // {state:'pending'|'approved'|'unknown', member, at, msg}
  // 已開通 → 轉到不帶參數的 LIFF 網址（進入系統）
  const goHome=()=>setTimeout(()=>{location.replace('https://liff.line.me/'+LIFF_ID)},1200);
  const recheck=async uid=>{
    setChk(c=>Object.assign({},c||{},{busy:true}));
    try{
      const list=await fetchMembers();const m=list.find(x=>x&&x.uid===uid);
      setChk(m?{state:'approved',member:m,at:Date.now()}:{state:'pending',at:Date.now()});
      if(m){setSt('status');goHome()}
      return m||null;
    }catch(e){setChk({state:'pending',at:Date.now(),msg:String(e.message)==='nofile'?'':'（檢查失敗，請稍後再試）'});return null}
  };
  useEffect(()=>{
    (async()=>{
      try{
        const L=await liffReady();
        if(new URLSearchParams(location.search).has('liff.state'))return;   // LIFF 中繼頁，等換頁
        if(!L.isLoggedIn()){L.login({redirectUri:location.href});return}
        const p=await L.getProfile();setProf(p);setInClient(L.isInClient());
        const r=joinGet(p.userId);
        if(r){setRec(r);setRole(r.role)}
        // 先查名單：已開通（包含沒申請過、直接被寫進名單的人）→ 直接轉進系統
        const m=await recheck(p.userId);
        if(m){if(!r)setRec({uid:p.userId,role:(memberInfo(m).roles[0]||'guest'),name:p.displayName,at:Date.now()});return}
        setSt(r?'status':'pick');
      }catch(e){setSt('error');setErr(String(e&&e.message||e))}
    })();
  },[]);
  const pick=async r=>{
    setRole(r);setErr('');setSent(false);
    const x={uid:prof.userId,role:r,name:prof.displayName,at:Date.now()};joinSet(x);setRec(x);
    if(!inClient){setSt('done');return}             // 不在聊天室：只顯示卡片給主管掃
    setSt('sending');
    try{
      await window.liff.sendMessages([buildJoinFlex({name:prof.displayName,role:r,uid:prof.userId}),{type:'text',text:prof.userId}]);
      setSent(true);
    }catch(e){
      const m=String(e&&e.message||e);
      setErr(/scope|permission|403/i.test(m)?'無法傳送到聊天室：LIFF 尚未開啟傳送訊息權限（chat_message.write）。\n仍可直接讓主管掃描下方 QR Code。':'無法傳送到聊天室：'+m+'\n仍可直接讓主管掃描下方 QR Code。');
    }
    setSt('done');
  };
  const copyUid=()=>{
    const t=prof.userId;const ok=()=>{setCopied(true);setTimeout(()=>setCopied(false),2000)};
    const fb=()=>{try{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();ok()}catch(_e){}};
    try{navigator.clipboard.writeText(t).then(ok).catch(fb)}catch(_e){fb()}
  };
  const close=()=>{try{window.liff.closeWindow()}catch(_e){}};
  return (
    <div className="min-h-screen max-w-md mx-auto p-6">
      <div className="serif text-3xl tracking-widest text-sageD text-center">緩緩</div>
      <div className="text-center text-xs tracking-[0.3em] text-brown mb-5">SLOWVE BODY SPA</div>
      {st==='loading'&&<div className="text-center text-mute">載入中…</div>}
      {st==='error'&&<Card className="p-4 text-warn text-sm whitespace-pre-line">{err}</Card>}
      {prof&&st==='pick'&&<>
        <div className="text-center text-lg mb-1">帳號開通申請</div>
        <div className="text-center text-sm text-mute mb-5">{prof.displayName}，請選擇你的身分</div>
        <div className="space-y-3">
          {JOIN_ROLES.map(r=><button key={r.id} className="w-full h-16 rounded-2xl border border-sage bg-card text-xl text-sageD active:bg-sageL" onClick={()=>pick(r.id)}>{r.label}</button>)}
        </div>
        {!inClient&&<div className="text-xs text-mute mt-4">目前不在「緩緩」官方帳號聊天室內，選擇身分後只會在畫面顯示申請卡，不會傳到聊天室。</div>}
      </>}
      {prof&&st==='status'&&rec&&<>
        {(!chk||chk.state!=='approved')&&<div className="mb-3 px-4 py-3 rounded-xl bg-brownL text-brown">
          <div className="font-semibold">你已申請開通帳號，目前尚未審查</div>
          <div className="text-sm mt-1">請聯繫店家工作人員或主管掃描 QR Code 完成帳號開通作業，或分享以下帳號申請碼</div>
          <div className="text-xs text-mute mt-1 num">申請時間 {(()=>{const d=new Date(rec.at);return ymd(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())})()}{chk&&chk.at&&!chk.busy?'・最後檢查 '+pad(new Date(chk.at).getHours())+':'+pad(new Date(chk.at).getMinutes())+':'+pad(new Date(chk.at).getSeconds()):''}{chk&&chk.msg?' '+chk.msg:''}</div>
        </div>}
        {chk&&chk.state==='approved'&&<div className="mb-3 px-4 py-3 rounded-xl bg-sageL text-sageD">
          <div className="font-semibold">✓ 帳號已開通（{memberInfo(chk.member).label||joinRoleLabel(rec.role)}）</div>
          <div className="text-sm mt-1">正在進入系統…</div>
        </div>}
        <button className="w-full h-12 mb-3 rounded-xl bg-sage text-white text-lg disabled:opacity-50" disabled={chk&&chk.busy} onClick={()=>recheck(prof.userId)}>{chk&&chk.busy?'檢查中…':'重新檢查'}</button>
        <JoinCard name={prof.displayName} role={rec.role} uid={prof.userId}/>
        <div className="grid grid-cols-2 gap-2 mt-4">
          <button className="h-11 rounded-xl border border-sage text-sageD" onClick={copyUid}>{copied?'✓ 已複製':'複製申請碼'}</button>
          <button className="h-11 rounded-xl border border-line bg-card" onClick={()=>{setSt('pick');setErr('')}}>更改身分重新申請</button>
        </div>
        {inClient&&<button className="w-full h-11 mt-2 rounded-xl border border-line bg-card" onClick={close}>回到聊天室</button>}
      </>}
      {st==='sending'&&<div className="text-center text-mute">傳送中…</div>}
      {prof&&st==='done'&&role&&<>
        {sent&&<div className="mb-3 px-3 py-2 rounded-xl bg-sageL text-sageD text-sm text-center">✓ 已傳送到聊天室</div>}
        {err&&<div className="mb-3 px-3 py-2 rounded-xl bg-warnL text-warn text-sm whitespace-pre-line">{err}</div>}
        <JoinCard name={prof.displayName} role={role} uid={prof.userId}/>
        <div className="grid grid-cols-2 gap-2 mt-4">
          <button className="h-11 rounded-xl border border-sage text-sageD" onClick={copyUid}>{copied?'✓ 已複製':'複製申請碼'}</button>
          <button className="h-11 rounded-xl border border-line bg-card" onClick={()=>{setSt('pick');setRole(null);setErr('')}}>重新選擇身分</button>
        </div>
        {inClient&&<button className="w-full h-11 mt-2 rounded-xl bg-sage text-white" onClick={close}>回到聊天室</button>}
      </>}
    </div>
  );
}

/* ========== 線上開通（v0.1-042） ==========
   申請人 LINE 登入 → GAS joinInfo（是否已開通、申請狀態、已用編號、開放到幾號）→ 填表 apply →
   老闆／主管在老闆頁審核 → GAS 把這個人寫進 GitHub 上的 members.json → 申請人重新檢查即進入系統 */
const MEMBER_HINT='slowve.memberHint';   // 剛核准、GitHub Pages 還沒更新時，先用 GAS 回傳的資料進入（只存在這支手機）

// 頁碼：第 1 頁 10～50 號，之後每頁 50 個，到老闆設定的上限為止（最多 100）
function numPages(min,max){const out=[];let a=min,b=Math.min(max,50);while(a<=max){out.push([a,b]);a=b+1;b=Math.min(max,a+49)}return out}
function NumberPicker({min,max,taken,value,onPick}){
  const pages=numPages(min,max);
  const [pg,setPg]=useState(()=>{const v=Number(value);const i=pages.findIndex(r=>v>=r[0]&&v<=r[1]);return i<0?0:i});
  const r=pages[Math.min(pg,pages.length-1)]||[min,max];
  const nums=[];for(let n=r[0];n<=r[1];n++)nums.push(n);
  const free=pages.reduce((a,x)=>{for(let n=x[0];n<=x[1];n++)if(!taken[String(n)])a++;return a},0);
  return (
    <div>
      <div className="flex items-center justify-between mb-2">
        <button type="button" className="h-9 px-3 rounded-lg border border-line bg-card disabled:opacity-30" disabled={pg<=0} onClick={()=>setPg(pg-1)} aria-label="上一頁">‹ 上一頁</button>
        <span className="text-sm num">{r[0]}～{r[1]} 號<span className="text-xs text-mute ml-1">（{pg+1}／{pages.length}）</span></span>
        <button type="button" className="h-9 px-3 rounded-lg border border-line bg-card disabled:opacity-30" disabled={pg>=pages.length-1} onClick={()=>setPg(pg+1)} aria-label="下一頁">下一頁 ›</button>
      </div>
      <div className="grid grid-cols-6 gap-1.5">
        {nums.map(n=>{const t=taken[String(n)];const on=String(value)===String(n);return (
          <button key={n} type="button" disabled={!!t} onClick={()=>onPick(String(n))} aria-label={n+' 號'+(t?'（已使用）':'')}
            className={'h-11 rounded-lg border num leading-none '+(on?'bg-sage border-sage text-white font-semibold':t?'bg-bg border-line text-mute/50':'bg-card border-line active:bg-sageL')}>
            {n}{t&&<span className="block text-[9px] mt-0.5">{t==='pending'?'申請中':'已使用'}</span>}
          </button>);})}
      </div>
      <div className="text-xs text-mute mt-2">可選 {free} 個號碼（灰色為已使用或別人申請中）</div>
