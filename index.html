        {f.source==='店內人員推薦'&&<FL label="推薦人（姓名或老師編號）"><input className={fin} maxLength={20} value={f.referrer} onChange={e=>set('referrer',e.target.value)}/></FL>}
        <Consent kind="staff" on={f.consent} set={v=>set('consent',v)}/>
        <Err/>
        <button className="w-full h-12 rounded-xl bg-sage text-white text-lg disabled:opacity-50" disabled={busy} onClick={send}>{busy?'送出中…':'送出簡歷'}</button>
        <Back to="pick"/>
      </>}

      {st==='status'&&app&&<>
        {app.status==='applied'&&<div className="mb-3 px-4 py-3 rounded-xl bg-brownL text-brown"><div className="font-semibold">簡歷已送出</div><div className="text-sm mt-1">店家會以{app.phone?<>手機 <span className="num">{app.phone}</span> </>:'你留的手機'}與你聯繫面試，請留意來電。</div></div>}
        {app.status==='interview'&&<div className="mb-3 px-4 py-3 rounded-xl bg-sageL text-sageD"><div className="font-semibold">已安排面試</div>{app.iv?<div className="text-sm mt-1">面試時間：<b className="num">{ivText(app.iv)}</b></div>:app._pre?<div className="text-sm mt-1 text-mute">讀取面試時間…</div>:app.note&&<div className="text-sm mt-1">{app.note}</div>}<div className="text-sm mt-1">如需改期，請直接聯繫店家。</div></div>}
        {app.status==='rejected'&&<div className="mb-3 px-4 py-3 rounded-xl bg-bg border border-line text-mute"><div className="font-semibold text-ink">感謝你的應徵</div><div className="text-sm mt-1">這次未能錄取，期待日後有機會合作。</div></div>}
        <Card className="p-4 text-sm mb-3">
          <div className="flex justify-between py-1 border-b border-line"><span className="text-mute">應徵職務</span><span>{joinRoleLabel(app.role)}</span></div>
          {app._pre?<div className="py-1 text-xs text-mute">讀取簡歷資料…</div>:<>
          <div className="flex justify-between py-1 border-b border-line"><span className="text-mute">姓名</span><span>{(app.last||'')+(app.first||'')}{app.nick?'（'+app.nick+'）':''}</span></div>
          <div className="flex justify-between py-1"><span className="text-mute">送出時間</span><span className="num">{clockText(app.at)}</span></div></>}
        </Card>
        <Err/>
        <button className="w-full h-12 mb-2 rounded-xl bg-sage text-white text-lg disabled:opacity-50" disabled={busy} onClick={recheck}>{busy?'檢查中…':'重新檢查'}</button>
        {app.status==='applied'&&!app._pre&&<button className="w-full h-11 rounded-xl border border-line bg-card" onClick={()=>startStaff(app.role)}>修改簡歷</button>}
        {app.status==='rejected'&&<button className="w-full h-11 rounded-xl border border-line bg-card" onClick={()=>setSt('home')}>重新申請</button>}
        {inClient&&<button className="w-full h-11 mt-2 rounded-xl border border-line bg-card" onClick={close}>回到聊天室</button>}
      </>}

      {st==='setup'&&app&&<>
        <div className="mb-4 px-4 py-3 rounded-xl bg-sageL text-sageD"><div className="font-semibold text-lg">🎉 恭喜錄取！</div><div className="text-sm mt-1">最後一步：設定{app.role==='teacher'?'工作型態、上下牌時間與你的編號':'上下班時間'}，送出後帳號立即開通。</div></div>
        {app.role==='teacher'&&<div className="mb-4"><div className="text-xs text-mute mb-1">工作型態</div>
          <div className="grid grid-cols-2 gap-2">{[[false,'正職'],[true,'兼職（支援）']].map(([v,l])=><button key={l} type="button" className={'h-12 rounded-xl border '+(f.support===v?'bg-sage border-sage text-white':'bg-card border-line')} onClick={()=>set('support',v)}>{l}</button>)}</div>
          {f.support&&<div className="text-xs text-mute mt-1">兼職（支援）老師每天下班時向櫃台領現金。</div>}</div>}
        {app.role==='teacher'?<div className="mb-4"><div className="text-xs text-mute mb-1">上牌時間（整點）</div>
          <div className="grid grid-cols-5 gap-1.5">{T_IN_OPTS.map(t=><button key={t} type="button" className={'h-11 rounded-xl border num '+(f.in===t?'bg-sage border-sage text-white':'bg-card border-line')} onClick={()=>{set('in',t);set('out',plusH(t,T_SHIFT_H))}}>{t}</button>)}</div>
          <div className="mt-2 text-sm">下牌時間：<b className="num">{f.out||'—'}</b><span className="text-xs text-mute ml-1">（上牌＋{T_SHIFT_H} 小時，之後可在「我的資料」修改）</span></div>
        </div>:<div className="mb-4"><div className="text-xs text-mute mb-1">{tLabel(app.role)[0]}／{tLabel(app.role)[1]}時間</div>
          <div className="flex items-center gap-2">
            <input type="time" step="1800" aria-label={tLabel(app.role)[0]+'時間'} className={fin+' w-0 flex-1 num'} value={f.in} onChange={e=>set('in',e.target.value)}/>
            <span className="text-mute">～</span>
            <input type="time" step="1800" aria-label={tLabel(app.role)[1]+'時間'} className={fin+' w-0 flex-1 num'} value={f.out} onChange={e=>set('out',e.target.value)}/>
          </div></div>}
        {app.role==='teacher'&&<>
          <div className="text-xs text-mute mb-1">選擇編號{f.tc&&<b className="ml-2 text-sageD num text-sm">{f.tc} 號</b>}</div>
          <div className="mb-4">{info._pre?<div className="h-24 rounded-xl border border-line bg-card flex items-center justify-center text-sm text-mute">讀取可選的編號…</div>:<NumberPicker min={info.min} max={info.max} taken={info.taken||{}} value={f.tc} onPick={v=>set('tc',v)}/>}</div>
        </>}
        <Err/>
        <button className="w-full h-12 rounded-xl bg-sage text-white text-lg disabled:opacity-50" disabled={busy||info._pre} onClick={setup}>{busy?'開通中…':'送出，開通帳號'}</button>
      </>}
    </GateShell>
  );
}

/* 設定 → 測試分身：列出目前的分身、一鍵清除（名單、履歷、請假、打卡、個人資料；訂單要老闆自己刪） */
function AltAdmin({S,saveS,toast,ask}){
  const st=useCloud();const [list,setList]=useState(null);const [mgr,setMgr]=useState([]);const [busy,setBusy]=useState(false);const [msg,setMsg]=useState('');
  const [all,setAll]=useState([]);
  const load=()=>fetchMembers(true).then(l=>{setAll(l);__memAll=l;setList(l.filter(x=>x&&isAltOf(x.uid,l)));setMgr(l.filter(x=>x&&memberInfo(x).admin==='manager'))}).catch(e=>setMsg('✗ '+e.message));
  const perm=async(m,on)=>{setBusy(true);setMsg('');try{await cloud.call({action:'altperm',uid:m.uid,on});setMgr(a=>a.map(x=>x.uid===m.uid?Object.assign({},x,{altOk:on?undefined:false}):x));toast((on?'已開放 ':'已關閉 ')+(m.name||'主管')+' 使用分身')}catch(e){setMsg('✗ '+e.message)}setBusy(false)};
  useEffect(()=>{load()},[]);
  const clear=async()=>{
    if(!await ask({title:'清除全部測試分身？',msg:'會把分身從開通名單移除，並刪掉它們的履歷、請假、打卡、補打卡、個人資料。\n分身登打過的訂單是日報表的一部分，請自己到每日訂單刪除。',okText:'清除',danger:true}))return;
    setBusy(true);setMsg('');
    try{const j=await cloud.call({action:'altclear'},60000);
      const tcs=(j.members||[]).map(m=>String(m.tc||'')).filter(Boolean);
      if(tcs.length){const n=clone(S);n.teachers=n.teachers.filter(t=>!tcs.includes(String(t)));n.support=(n.support||[]).filter(t=>!tcs.includes(String(t)));saveS(mergeSettings(n))}
      __testTc=null;__memAll=null;__memP=null;try{window.dispatchEvent(new Event('slowve-people'))}catch(_e){}toast('已清除 '+(j.members||[]).length+' 個分身');setMsg('✓ 已清除名單 '+(j.members||[]).length+' 筆、資料 '+(j.rows||0)+' 筆'+(tcs.length?'；設定的老師名單也拿掉 '+tcs.join('、')+' 號':''));
      setTimeout(load,1500);
    }catch(e){setMsg('✗ '+e.message)}setBusy(false)};
  return (<div className="text-sm">
    <div className="text-xs text-mute mb-2">老闆在 LINE 的歡迎畫面點「分身 1～9」，就能用虛擬帳號測試新老師、新櫃台的流程。分身在主櫃、月報、薪資、應徵與人員資料上都標「測試」。</div>
    {mgr.length>0&&<div className="mb-3"><div className="text-xs text-mute mb-1">開放主管使用分身（只有老闆能改）</div>
      {mgr.map(m=>{const ok=m.altOk!==false;return <button key={m.uid} type="button" disabled={busy||!st.on} className={'w-full mb-1.5 rounded-xl border px-3 py-2 text-left disabled:opacity-60 '+(ok?'bg-sageL border-sage':'bg-card border-line')} onClick={()=>perm(m,!ok)}>
        {ok?'☑':'☐'} {m.tc?m.tc+' ':''}{m.name||'主管'}<span className="ml-2 text-xs text-mute">{ok?'可以使用分身 1～9':'不能使用分身'}</span></button>})}</div>}
    {list===null?<div className="text-xs text-mute">讀取中…</div>:list.length===0?<div className="text-xs text-mute">目前沒有分身在開通名單上。</div>:
      list.map(m=><div key={m.uid} className="flex items-center gap-2 py-1 border-b border-line last:border-0"><span className="text-warn text-xs w-20 num">{altLabel(m.uid,all)||'分身 '+m.uid.slice(-1)}</span><span className="flex-1">{m.stage?'應徵中':(m.tc?m.tc+' ':'')+(m.name||'')}</span><span className="text-xs text-mute">{m.stage?'':memberInfo(m).label}</span></div>)}
    {!st.on?<div className="text-xs text-mute mt-2">登入雲端同步（老闆）後才能清除。</div>:
      <button className="w-full h-10 mt-3 rounded-xl border border-warn text-warn disabled:opacity-40" disabled={busy} onClick={clear}>{busy?'清除中…':'清除分身資料'}</button>}
    {msg&&<div className={'text-xs mt-2 '+(msg[0]==='✗'?'text-warn':'text-sageD')}>{msg}</div>}
  </div>);
}
/* 老闆頁：應徵與會員（約面試、錄取、不錄取；錄取後由申請人自己選編號開通） */
function JoinReview({S,saveS,toast,ask}){
  const st=useCloud();
  const [list,setList]=useState(null);
  const [meta,setMeta]=useState({});
  const [msg,setMsg]=useState('');
  const [tab,setTab]=useState('todo');
  const [openId,setOpenId]=useState(null);
  const [busy,setBusy]=useState('');
  const load=async()=>{setMsg('讀取中…');try{const j=await cloud.call({action:'applist'});setList(j.list||[]);setMeta(j);setMsg('');
    const s=syncGet();s.joinN=(j.list||[]).filter(a=>a.status==='applied').length;syncSet(s);cloud.emit();
    // 已開通的支援老師：自動標記為「支援」
    const sup=(j.list||[]).filter(a=>a.status==='approved'&&a.role==='teacher'&&a.tc);
    if(sup.length){const n=clone(S);let ch=false;sup.forEach(a=>{const t=String(a.tc);if(!n.teachers.map(String).includes(t)){n.teachers=[t,...n.teachers];ch=true}if(a.support&&!n.support.includes(t)){n.support=n.support.concat([t]);ch=true}});if(ch)saveS(mergeSettings(n))}
  }catch(e){setMsg('✗ '+e.message)}};
  useEffect(()=>{if(st.on)load()},[st.on]);
  if(!st.on)return <div className="text-sm text-mute">請先在下方「雲端同步」用 LINE 登入（老闆／主管），才能查看應徵與會員資料。</div>;
  const stage=async(a,to,note)=>{
    setBusy(a.uid);try{await cloud.call({action:'stage',uid:a.uid,to,note});await load();toast(JOIN_ST[to]?'已改為「'+JOIN_ST[to]+'」':'已更新')}catch(e){setMsg('✗ '+e.message)}setBusy('');
  };
  // v0.1-063：約面試改用日期＋時間選擇器（不再跳文字框）；面試時間連同進度寫進開通名單（沒有個資）
  const [ivFor,setIvFor]=useState(null);const [ivD,setIvD]=useState('');const [ivT,setIvT]=useState('');
  const interview=a=>{const m=/^(\S+) (\S+)$/.exec(a.iv||'');setIvD(m?m[1]:ymd(new Date(Date.now()+864e5)));setIvT(m?m[2]:'14:00');setIvFor(a.uid)};
  const ivSend=async a=>{if(!ivD||!ivT){setMsg('✗ 請選擇面試日期和時間');return}setIvFor(null);setBusy(a.uid);try{await cloud.call({action:'stage',uid:a.uid,to:'interview',iv:ivD+' '+ivT});await load();toast('已約面試 '+ivText(ivD+' '+ivT))}catch(e){setMsg('✗ '+e.message)}setBusy('')};
  const hire=async a=>{if(await ask({title:'錄取 '+((a.last||'')+(a.first||''))+'？',msg:'錄取後，申請人打開申請頁就會看到「恭喜錄取」，自己選'+(a.role==='teacher'?'編號、上下牌時間、正職／兼職':'上下班時間')+'，送出後帳號立即開通。\n請記得用手機通知對方。',okText:'錄取'}))stage(a,'hired')};
  const reject=async a=>{if(await ask({title:'不錄取？',msg:'申請人頁面會顯示「這次未能錄取」。資料會在 6 個月後自動清除。',okText:'不錄取',danger:true}))stage(a,'rejected')};
  const all=list||[];
  const groups={todo:all.filter(a=>a.status==='applied'||a.status==='interview'),hired:all.filter(a=>a.status==='hired'),done:all.filter(a=>a.status==='approved'||a.status==='rejected')};
  const shown=groups[tab];
  const K=({k,v})=>v?<div className="flex gap-2 py-0.5"><span className="w-20 shrink-0 text-mute">{k}</span><span className="flex-1 min-w-0 break-words">{v}</span></div>:null;
  return (
    <div className="text-sm">
      <div className="flex items-center gap-2 mb-2">
        <div className="flex-1 flex rounded-lg border border-line overflow-hidden text-xs">
          {[['todo','待處理'],['hired','已錄取'],['done','已完成']].map(([k,l])=><button key={k} className={'flex-1 h-9 '+(tab===k?'bg-sage text-white':'bg-card')} onClick={()=>setTab(k)}>{l}{list?' '+groups[k].length:''}</button>)}
        </div>
        <button className="h-9 px-3 rounded-lg border border-line text-xs" onClick={load}>重新整理</button>
      </div>
      {meta.github===false&&<div className="mb-2 px-3 py-2 rounded-lg bg-warnL text-warn text-xs">GAS 尚未設定 GITHUB_TOKEN，會員與錄取人員無法開通。</div>}
      {msg&&<div className={'text-xs mb-2 '+(msg[0]==='✗'?'text-warn':'text-mute')}>{msg}</div>}
      {list&&!shown.length&&<div className="text-xs text-mute py-2">{tab==='todo'?'目前沒有待處理的應徵。':tab==='hired'?'沒有等待開通的人。':'最近 60 天沒有紀錄。'}</div>}
      {shown.map(a=>{const nm=a.role==='guest'?a.nick:(a.last||'')+(a.first||'');const op=openId===a.uid;const age=ageOf(a.birth);return (
        <div key={a.uid} className={'rounded-xl border p-3 mb-2 '+(a.status==='applied'?'border-brown/50 bg-brownL/30':'border-line bg-card')}>
          <button className="w-full text-left" onClick={()=>setOpenId(op?null:a.uid)}>
            <div className="flex items-baseline gap-2">
              <b className="text-base">{nm}</b>{a.test&&<TestTag uid={a.uid}/>}{a.nick&&a.role!=='guest'&&<span className="text-xs text-mute">（{a.nick}）</span>}
              <span className="px-1.5 rounded bg-sage text-white text-xs">{joinRoleLabel(a.role)}</span>
              <span className={'ml-auto text-xs '+(a.status==='applied'?'text-brown font-semibold':a.status==='rejected'?'text-mute':'text-sageD')}>{JOIN_ST[a.status]}</span>
            </div>
            <div className="text-xs text-mute num mt-0.5">{a.gender==='F'?'女':a.gender==='M'?'男':''}{age!=null?'・'+age+' 歲':''}{a.years?'・'+a.years:''}{a.want?'・希望'+(a.want==='part'?'兼職':'正職'):''}・{clockText(a.at)} 送出{a.tc?'・'+a.tc+' 號':''} <span className="text-sageD">{op?'收起 ▲':'詳細 ▼'}</span></div>
            {(a.iv||a.note)&&<div className="text-xs text-sageD mt-0.5">面試：{a.iv?ivText(a.iv):a.note}</div>}
          </button>
          {a.phone&&<a href={'tel:'+a.phone} className="inline-flex items-center gap-1 mt-2 h-9 px-3 rounded-lg border border-sage text-sageD num">📞 {a.phone}</a>}
          {op&&<div className="mt-2 pt-2 border-t border-line text-xs">
            <K k="出生日期" v={a.birth?a.birth+(age!=null?'（'+age+' 歲'+(age<18?'，未成年':'')+'）':''):''}/>
            <K k="地址" v={(a.city||'')+(a.addr||'')}/>
            <K k="緊急聯絡" v={a.emgName?a.emgName+' '+(a.emgPhone||''):''}/>
            <K k="擅長" v={(a.skills||[]).join('、')}/>
            <K k="證照" v={a.certs}/>
            <K k="經歷" v={a.expNote}/>
            <K k="可上班" v={(a.slots||[]).join('、')}/>
            <K k="最快上班" v={a.start}/>
            <K k="方便聯絡" v={(a.contact||[]).join('、')}/>
            <K k="方便面試" v={(a.ivPref||[]).join('、')}/>
            <K k="得知管道" v={a.source?(a.source+(a.referrer?'：'+a.referrer:'')):''}/>
            <K k="LINE 名稱" v={a.lineName}/>
            {a.status==='approved'&&<K k="開通" v={(a.tc?a.tc+' 號・':'')+(a.in?a.in+'～'+a.out:'')+(a.support?'・兼職（支援）':'')}/>}
            {a.by&&<K k="處理人" v={a.by}/>}
          </div>}
          {ivFor===a.uid&&<div className="mt-3 rounded-xl border border-sage bg-sageL/30 p-3">
            <div className="text-xs text-mute mb-1">面試時間{(a.ivPref||[]).length?'（對方方便：'+a.ivPref.join('、')+'）':''}</div>
            <div className="flex gap-2"><input type="date" aria-label="面試日期" className="w-0 flex-[3] h-10 px-2 rounded-lg border border-line bg-card num" min={ymd(new Date())} value={ivD} onChange={e=>setIvD(e.target.value)}/><input type="time" step="900" aria-label="面試時間" className="w-0 flex-[2] h-10 px-2 rounded-lg border border-line bg-card num" value={ivT} onChange={e=>setIvT(e.target.value)}/></div>
            <div className="grid grid-cols-[1fr_2fr] gap-2 mt-2"><button className="h-9 rounded-lg border border-line bg-card" onClick={()=>setIvFor(null)}>取消</button><button className="h-9 rounded-lg bg-sage text-white" onClick={()=>ivSend(a)}>確定{ivD&&ivT?' '+ivText(ivD+' '+ivT):''}</button></div>
            <div className="text-[11px] text-mute mt-1">申請人打開申請頁就會看到面試時間；請也用手機通知對方。</div>
          </div>}
          {(a.status==='applied'||a.status==='interview')&&ivFor!==a.uid&&<div className="grid grid-cols-3 gap-2 mt-3">
            <button className="h-10 rounded-lg border border-line text-mute disabled:opacity-40" disabled={!!busy} onClick={()=>reject(a)}>不錄取</button>
            <button className="h-10 rounded-lg border border-sage text-sageD disabled:opacity-40" disabled={!!busy} onClick={()=>interview(a)}>{a.status==='interview'?'改面試時間':'約面試'}</button>
            <button className="h-10 rounded-lg bg-sage text-white disabled:opacity-40" disabled={!!busy} onClick={()=>hire(a)}>{busy===a.uid?'處理中…':'錄取'}</button>
          </div>}
          {a.status==='hired'&&<div className="mt-2 text-xs text-brown">等待對方在申請頁選{a.role==='teacher'?'編號、上下牌時間':'上下班時間'}後開通。
            <button className="ml-2 underline text-mute" onClick={()=>reject(a)}>取消錄取</button></div>}
        </div>);})}
      <div className="text-xs text-mute mt-1">履歷只存在 Google 試算表「加入申請」，不會放到公開的開通名單。不錄取的資料 6 個月後自動清除。</div>
    </div>
  );
}

/* ========== LINE 入口檢查（在 LINE App 內開啟時） ==========
   LINE 登入 → 讀 members.json → 未開通轉申請頁 → 首次設定編號／姓名（本機）→ 歡迎畫面選身分 → 各身分畫面

/* v0.1-059：老闆的測試分身（1～9）。userId＝老闆的 userId＋那一碼；GAS 驗證老闆本人後才認（請求帶 alt）。

function demoCalc(S,x){
  const ad=(x.ad||[]).map(id=>S.addons.find(a=>a.id===id)).filter(Boolean);

  let amt=price+ex*exPrice(x,S)+ad.reduce((s,a)=>s+a.price,0);if(x.emp)amt=Math.round(amt*(Number(S.empRate)||1));

  const call=async body=>{
    const t=window.liff&&window.liff.getIDToken&&window.liff.getIDToken();

        <button className="w-full h-11 mt-3 rounded-xl border border-sage text-sageD" onClick={()=>{setEdit(true);setMsg('')}}>修改我的資料</button>
      </>}

        <label className="block"><div className="text-xs text-mute mb-1">顯示名稱（店內看到的名字）</div><input className={fin} maxLength={20} value={f.name} onChange={e=>set('name',e.target.value)}/></label>

      </div>}
      {msg&&<div className={'text-sm mt-2 '+(msg[0]==='✗'?'text-warn':'text-sageD')}>{msg.replace(/^✗ /,'')}</div>}

/* 老闆頁：人員資料（全部老師／櫃台；開啟審核時可核准／退回修改） */

          {G.length?G.slice(0,gMax).map(g=>{const k='g'+g.uid;const op=open===k;return (

/* ---- 請假（v0.1-049）：老師／櫃台自己登記；設定 leaveReview 開啟時才需要老闆／主管審核 ---- */
const LEAVE_KIND={personal:'事假',sick:'病假',off:'休假'};
const LEAVE_ST={ok:'已登記',pending:'待審核',approved:'已核准',rejected:'已退回',cancelled:'已取消'};
const leaveTone=st=>st==='rejected'||st==='cancelled'?'text-mute line-through':st==='pending'?'text-brown':'text-sageD';
// 請假落在某月的天數（全天）或時數（部分時段）；已取消、已退回的不算
const leaveActive=L=>L.status!=='cancelled'&&L.status!=='rejected';
function leaveInMonth(L,ym){
  const a=ym+'-01',dim=new Date(Number(ym.slice(0,4)),Number(ym.slice(5)),0).getDate(),b=ym+'-'+pad(dim);
  const f=L.from>a?L.from:a,t=(L.to||L.from)<b?(L.to||L.from):b;
  if(f>t)return {days:0,hours:0,dates:[]};
  const dates=[];for(let d=parseYmd(f);ymd(d)<=t;d.setDate(d.getDate()+1))dates.push(ymd(d));
  if(L.all)return {days:dates.length,hours:0,dates};
  const m=x=>{const q=String(x||'0:0').split(':').map(Number);return q[0]*60+q[1]};
  return {days:0,hours:Math.max(0,(m(L.t2)-m(L.t1))/60),dates};
}
const leaveSum=(list,ym)=>{const r={personal:{days:0,hours:0},sick:{days:0,hours:0},off:{days:0,hours:0}};
  list.filter(leaveActive).forEach(L=>{const x=leaveInMonth(L,ym);if(r[L.kind]){r[L.kind].days+=x.days;r[L.kind].hours+=x.hours}});return r};
const dayHr=x=>x.days||x.hours?[x.days?x.days+' 天':'',x.hours?(+x.hours.toFixed(1))+' 小時':''].filter(Boolean).join(' '):'0';
const LEAVE_COL={personal:'#a0784f',sick:'#b5654f',off:'#6f7d62'};
const leaveWhen=L=>{const f=fmtDate(L.from).replace(/（.）/,'');return (L.to&&L.to!==L.from?f+'～'+fmtDate(L.to).replace(/（.）/,''):fmtDate(L.from))+'・'+(L.all?'全天':L.t1+'～'+L.t2)};
function LeavePanel({onList,kind,data,managed,onResp,plan}={}){   // plan（櫃台）：{shift,cfg:{offDays,brk,checks},hire} → 休假額度與排休預測   // kind：teacher／counter，老師和櫃台的請假分開
  const today=bizToday(loadSettings().cutoff);
  const [list,setList]=useState(data?data.list||[]:null);
  const [review,setReview]=useState(!!(data&&data.review));
  const [open,setOpen]=useState(false);
  useEffect(()=>{if(data){setList(data.list||[]);setReview(!!data.review);onList&&onList(data.list||[])}},[data]);
  const [f,setF]=useState({kind:'',from:today,to:today,all:true,t1:'',t2:'',reason:''});
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState('');
  const set=(k,v)=>{setF(p=>{const n=Object.assign({},p,{[k]:v});if(k==='from'&&n.to<v)n.to=v;return n});setErr('')};
  const call=async(body)=>{
    const t=window.liff&&window.liff.getIDToken&&window.liff.getIDToken();
    if(!t)throw new Error('取不到 LINE 身分，請關閉後重新開啟');
    const j=await cloud.call(Object.assign({action:'leave',idToken:t,role:kind||''},body),30000);
    setList(j.list||[]);setReview(!!j.review);onList&&onList(j.list||[]);onResp&&onResp(j);return j;
  };
  useEffect(()=>{if(!managed)call({op:'list'}).catch(e=>setErr(e.message))},[]);
  const submit=async()=>{
    if(!f.kind)return setErr('請選擇假別');
    if(!f.all&&(!f.t1||!f.t2||f.t2<=f.t1))return setErr('請選擇正確的請假時段');
    setBusy(true);try{await call({op:'add',form:f});setOpen(false);setF({kind:'',from:today,to:today,all:true,t1:'',t2:'',reason:''})}catch(e){setErr(e.message)}setBusy(false);
  };
  const cancel=async L=>{if(!window.confirm('取消 '+leaveWhen(L)+' 的'+LEAVE_KIND[L.kind]+'？'))return;setBusy(true);try{await call({op:'cancel',id:L.id})}catch(e){setErr(e.message)}setBusy(false)};
  const inp='w-full min-w-0 h-11 px-3 rounded-xl border border-line bg-card num';

  const yms=draft?Array.from(new Set([draft.from.slice(0,7),draft.to.slice(0,7)])):[ym];
  const over=quota!=null&&draft&&draft.kind==='off'?yms.filter(m=>offUsed((list||[]).concat([draft]),m)>quota):[];
  const preview=plan&&plan.shift&&plan.shift.in?yms.map(m=>({m,w:planCheck(m,plan.shift,(list||[]).concat(draft?[draft]:[]),plan.cfg,plan.hire)})):[];
  const later=(list||[]).filter(L=>L.from>ym+'-31');
  return (
    <div>
      {!open&&<button className="w-full h-11 rounded-xl bg-sage text-white" onClick={()=>{setOpen(true);setErr('')}}>＋ 我要請假</button>}

        <div className="grid grid-cols-3 gap-2 mb-3">{Object.keys(LEAVE_KIND).map(k=>{const full=k==='off'&&quota!=null&&offUsed(list,f.from.slice(0,7))>=quota;return <button key={k} type="button" disabled={full} className={'h-10 rounded-xl border disabled:opacity-40 '+(f.kind===k?'bg-sage border-sage text-white':'bg-card border-line')} onClick={()=>set('kind',k)}>{LEAVE_KIND[k]}{full&&<span className="block text-[9px] leading-none">本月已滿</span>}</button>})}</div>

          <label><div className="text-xs text-mute mb-1">結束日</div><input type="date" className={inp} disabled={!f.all} min={f.from} value={f.all?f.to:f.from} onChange={e=>set('to',e.target.value)}/></label>
        </div>
        <div className="grid grid-cols-2 gap-2 mb-2">{[[true,'全天'],[false,'部分時段']].map(([v,l])=><button key={l} type="button" className={'h-10 rounded-xl border '+(f.all===v?'bg-sage border-sage text-white':'bg-card border-line')} onClick={()=>set('all',v)}>{l}</button>)}</div>
        {!f.all&&<div className="flex items-center gap-2 mb-2"><input type="time" step="1800" aria-label="請假開始時間" className={inp+' w-0 flex-1'} value={f.t1} onChange={e=>set('t1',e.target.value)}/><span className="text-mute">～</span><input type="time" step="1800" aria-label="請假結束時間" className={inp+' w-0 flex-1'} value={f.t2} onChange={e=>set('t2',e.target.value)}/></div>}
        <input className={inp+' mb-2'} maxLength={100} placeholder="原因（選填）" value={f.reason} onChange={e=>set('reason',e.target.value)}/>
        {over.length>0&&<div className="text-sm text-warn mb-2">{over.map(m=>Number(m.slice(5))+' 月').join('、')}的休假會超過每月 {quota} 天，超過的部分只能請事假或病假。</div>}
        {draft&&preview.length>0&&<div className="mb-2 rounded-lg bg-card border border-line p-2">
          <div className="text-xs text-mute mb-1">排休後的勞基法檢查（假設其他日子都正常 {plan.shift.in}～{plan.shift.out} 上班{plan.cfg&&plan.cfg.brk?'，每天休息 '+minTxt(plan.cfg.brk):''}）</div>
          {preview.every(p=>!p.w.length)?<div className="text-xs text-sageD">✓ 符合勞基法工時規定</div>:preview.map(p=>p.w.map((x,i)=><div key={p.m+i} className={'mb-1 px-2 py-1 rounded text-xs '+LAW_TONE[x.lv]}>{x.lv==='bad'?'⚠ ':''}{x.t}</div>))}
        </div>}
        {err&&<div className="text-sm text-warn mb-2">{err}</div>}
        <div className="grid grid-cols-[1fr_2fr] gap-2">
          <button className="h-11 rounded-xl border border-line bg-card" onClick={()=>setOpen(false)}>取消</button>
          <button className="h-11 rounded-xl bg-sage text-white disabled:opacity-50" disabled={busy||over.length>0} onClick={submit}>{busy?'送出中…':review?'送出，等待審核':'送出請假'}</button>
        </div>
        <div className="text-[11px] text-mute mt-2">{review?'送出後由老闆／主管審核。':'送出即完成登記，不需要審核。'}可以取消還沒結束的請假。</div>
      </div>}
      {!open&&err&&<div className="text-sm text-warn mt-2">{err}</div>}
      {list!==null&&quota!=null&&<div className="mt-3 text-sm flex items-center justify-between rounded-xl bg-sageL/50 px-3 py-2"><span>本月休假（排休）</span><span className="num"><b className={offUsed(list,ym)>quota?'text-warn':''}>{offUsed(list,ym)}</b> ／ {quota} 天</span></div>}
      {list!==null&&plan&&plan.shift&&plan.shift.in&&!open&&(()=>{const w=planCheck(ym,plan.shift,list,plan.cfg,plan.hire);return <div className="mt-2 text-xs">{w.length?<><div className="text-mute mb-1">依目前的排休，本月假設正常上班會有：</div>{w.map((x,i)=><div key={i} className={'mb-1 px-2 py-1 rounded '+LAW_TONE[x.lv]}>{x.lv==='bad'?'⚠ ':''}{x.t}</div>)}</>:<span className="text-sageD">✓ 依目前的排休，本月假設正常上班符合勞基法工時規定</span>}</div>})()}

      <div className="text-xs text-mute mt-3 mb-1">{Number(ym.slice(5))} 月請假紀錄</div>

      {d&&<><div className="text-xs text-mute mt-2 mb-1">今天與之後</div>{up.length?up.map(L=><Row key={L.id} L={L}/>):<div className="text-xs text-mute py-1">沒有請假</div>}</>}

const MY_KEY='slowve.my.';   // 每月最後一次讀到的資料（v0.1-058 起改用下面的 boot 暫存）
/* v0.1-058：老師頁、櫃台頁打開時，先用這支手機上次的資料畫面，再「一次」向 GAS 確認（boot）：
   帶上每塊資料的異動時間，GAS 只回有變的部分。暫存：slowve.boot.{teacher|counter}＝{uid, sec:{'my:YYYY-MM'|'att:YYYY-MM'|leave|prof:{st,data,at}}} */
const BOOT_KEY='slowve.boot.';
const bootKk=(k,ym)=>(k==='my'||k==='att')?k+':'+ym:k;
function bootGet(page,uid){try{const x=JSON.parse(localStorage.getItem(BOOT_KEY+page+altSfx())||'null');return x&&x.uid===uid&&x.sec?x:{uid,sec:{}}}catch(_e){return {uid,sec:{}}}}
function bootSet(page,c){
  const ks=Object.keys(c.sec).filter(k=>k.indexOf(':')>0).sort();   // 每月的資料只留最近 4 個月
  const keep={};['my','att'].forEach(p=>ks.filter(k=>k.startsWith(p+':')).slice(-4).forEach(k=>{keep[k]=1}));
  ks.forEach(k=>{if(!keep[k])delete c.sec[k]});
  try{localStorage.setItem(BOOT_KEY+page+altSfx(),JSON.stringify(c))}catch(_e){}
}
const bootData=(page,uid,k,ym)=>{const x=bootGet(page,uid).sec[bootKk(k,ym)];return x?x.data:null};
function bootPut(page,uid,k,ym,data){if(!data||!data.st)return;const c=bootGet(page,uid);c.sec[bootKk(k,ym)]={st:data.st,data,at:Date.now()};bootSet(page,c)}
async function bootCall(page,uid,ym,want,force,extra){
  const c=bootGet(page,uid);const have={};
  if(!force)want.forEach(k=>{const x=c.sec[bootKk(k,ym)];if(x&&x.data)have[k]=x.st});
  const t=window.liff&&window.liff.getIDToken&&window.liff.getIDToken();
  if(!t)throw new Error('取不到 LINE 身分，請關閉後重新開啟');
  const j=await cloud.call(Object.assign({action:'boot',page,ym,want,have,idToken:t},extra||{}),40000);
  const c2=bootGet(page,uid);let changed=0;
  Object.keys(j.sec||{}).forEach(k=>{const x=j.sec[k],kk=bootKk(k,ym);if(x.same){if(c2.sec[kk])c2.sec[kk].at=Date.now()}else{c2.sec[kk]={st:x.st,data:x.data,at:Date.now()};changed++}});
  bootSet(page,c2);
  const out={};want.forEach(k=>{const x=c2.sec[bootKk(k,ym)];out[k]=x?x.data:null});
  return {d:out,j,changed};
}

/* 櫃台範例情境（範例時間 14:50）：
   5 位老師在班；3 個預約＋1 位現場候位 → 4 位老師已被「壓牌」（保留給某位客人）。
   訂單分「服務中（未結帳）」與「已結帳」；營業額、應有現金只算已結帳。
   空檔規則：被壓牌的老師，只要壓牌前的空檔 ≥ 服務時間（預設 60 分），仍可先接現場客。 */
const DEMO_NOW='14:50';
const DEMO_ORDERS=[
  {t:'14:25',sn:'0424',st:'serving',g:[{svc:'foot',min:60,tc:'58'}]},
  {t:'13:30',sn:'0423',st:'serving',g:[{svc:'dry',min:120,tc:'122',ld:1}]},
  {t:'12:25',sn:'0417',st:'paid',pay:'14:30',g:[{svc:'oil',min:90,tc:'77',ld:1,ex:1,ad:['guasha']}]},
  {t:'13:00',sn:'0419',st:'paid',pay:'14:05',g:[{svc:'foot',min:60,tc:'58'},{svc:'foot',min:60,tc:'36',emp:1}]},
  {t:'11:15',sn:'0413',st:'paid',pay:'12:20',g:[{svc:'foot',min:60,tc:'77',ad:['xiujiao']}]},
  {t:'10:05',sn:'0409',st:'paid',pay:'11:40',g:[{svc:'dry',min:90,tc:'77',promo:1,ld:1}]},
  {t:'09:15',sn:'0402',st:'paid',pay:'10:50',g:[{svc:'oil',min:60,tc:'122',ex:1}]},
];
// 預約／候位：hold＝壓到哪位老師的牌；at＝開始服務時間；min＝服務分鐘
const DEMO_BOOK=[
  {id:'b1',kind:'book',t:'15:00',at:'15:00',min:90,who:'陳先生',item:'油壓 90',hold:'77',how:'指定',st:'已確認'},
  {id:'b2',kind:'book',t:'15:30',at:'15:30',min:60,who:'林小姐',item:'腳底 60',hold:'36',how:'不指定・依輪班排入',st:'已確認'},
  {id:'b3',kind:'book',t:'19:00',at:'19:00',min:120,who:'王小姐',item:'指壓 120',hold:'122',how:'指定',st:'待確認'},
  {id:'w1',kind:'walk',t:'14:40',at:'15:25',min:60,who:'張先生',item:'指壓 60',hold:'58',how:'等最快下鐘',st:'約 15:25 可開始'},
];
// 班表（上牌～下牌）。25 號是晚班，18:00 才上牌
const DEMO_SHIFT={'122':['09:00','21:00'],'77':['10:00','20:00'],'36':['12:00','22:00'],'58':['13:00','23:00'],'12':['14:00','24:00'],'25':['18:00','02:00']};
// 範例的支援老師（正式版依設定的 support／之後 members.json 的 support 標記）
const DEMO_SUPPORT=['58','36'];
const DEMO_REST=[{tc:'12',s:'14:30',e:'15:40'}];
// 老師狀態：avail 可接客（rot＝輪班順位，先下鐘先輪）／serving 服務中（end＝預計下鐘）／rest 休息中
const DEMO_TSTAT=[
  {tc:'122',st:'serving',sn:'0423',note:'指壓 120',start:'13:30',end:'15:30'},
  {tc:'77',st:'avail',rot:3,since:'14:30'},
  {tc:'58',st:'serving',sn:'0424',note:'腳底 60',start:'14:25',end:'15:25'},
  {tc:'36',st:'avail',rot:2,since:'14:05'},
  {tc:'12',st:'rest',rot:1,note:'15:40 回來'},   // 原本排第 3，前兩位去服務後輪到第 1；休息中保留順位，來客時略過
];
const TST={avail:{label:'可接客',tone:'sage'},serving:{label:'服務中',tone:'brown'},rest:{label:'休息中',tone:''}};
const T_SORTS=[{id:'tc',label:'按編號'},{id:'rot',label:'輪班優先'},{id:'serv',label:'服務中優先'}];
function sortTeachers(list,by){
  const a=list.slice();
  const num=t=>Number(t.tc)||0;
  const rank={rot:{avail:0,serving:1,rest:2},serv:{serving:0,avail:1,rest:2}}[by];
  if(!rank)return a.sort((x,y)=>num(x)-num(y));
  // 輪班優先：在輪班中的人（含休息中但保留順位的）依順位排在最前面
  const inQ=t=>t.rot!=null&&(t.st==='avail'||t.st==='rest');
  if(by==='rot')return a.sort((x,y)=>{
    if(inQ(x)&&inQ(y))return x.rot-y.rot;if(inQ(x))return -1;if(inQ(y))return 1;
    const r=rank[x.st]-rank[y.st];if(r)return r;
    if(x.st==='serving')return x.end<y.end?-1:x.end>y.end?1:0;
    return num(x)-num(y);
  });
  return a.sort((x,y)=>{
    const r=rank[x.st]-rank[y.st];if(r)return r;
    if(x.st==='avail')return x.rot-y.rot;            // 可接客：依輪班順位
    if(x.st==='serving')return x.end<y.end?-1:x.end>y.end?1:0;   // 服務中：先下鐘的在前
    return num(x)-num(y);
  });
}

/* ---- 時間軸模型：分鐘數（跨午夜 +1440，例 02:00＝1560） ---- */
const tm=s=>{const a=String(s).split(':').map(Number);let m=a[0]*60+(a[1]||0);if(a[0]<6)m+=1440;return m};
const tf=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
const SLOT_LEN=60;                 // 空檔至少要能做 60 分鐘
const BK={done:{label:'已服務',cls:'bg-sageL text-sageD'},serve:{label:'服務中',cls:'bg-brownL text-brown'},book:{label:'預約',cls:'bg-warnL text-warn'},walk:{label:'現場',cls:'bg-warnL text-warn'},rest:{label:'休息',cls:'bg-bg text-mute border border-line'}};
function demoBlocks(){
  const b=[];
  DEMO_ORDERS.forEach(o=>o.g.forEach(x=>{const s=tm(o.t);b.push({tc:x.tc,s,e:s+x.min+(Number(x.ex)||0)*30,kind:o.st==='paid'?'done':'serve',who:'#'+o.sn,item:SVC_SHORT[x.svc]+' '+x.min})}));
  DEMO_BOOK.forEach(k=>{const s=tm(k.at);b.push({tc:k.hold,s,e:s+k.min,kind:k.kind,who:k.who,item:k.item,how:k.how})});
  DEMO_REST.forEach(r=>b.push({tc:r.tc,s:tm(r.s),e:tm(r.e),kind:'rest',who:'',item:'休息'}));
  return b.sort((x,y)=>x.s-y.s);
}
// 從 t0 起（在 [t0, until) 內，每 5 分鐘找一次）最早可連續空 len 分鐘的時間；找不到回 null
function freeAt(tc,blocks,t0,until,len){
  const sh=DEMO_SHIFT[tc];if(!sh)return null;
  const on=tm(sh[0]),off=tm(sh[1]);len=len||SLOT_LEN;
  for(let t=Math.ceil(Math.max(t0,on)/5)*5;t<until;t+=5){
    if(t+len>off)return null;
    if(!blocks.some(b=>b.tc===tc&&b.s<t+len&&b.e>t))return t;
  }
  return null;
}
// 從 t 起的空檔到什麼時候（下一個占用或下牌）
function gapEnd(tc,blocks,t){
  const off=tm(DEMO_SHIFT[tc][1]);
  const nx=blocks.filter(b=>b.tc===tc&&b.s>=t).sort((x,y)=>x.s-y.s)[0];
  return nx?{e:Math.min(nx.s,off),next:nx}:{e:off,next:null};
}

/* 時段牌況：橫排＝時段（預設現在這小時起 3 個小時，可前後切換）；直排＝這個時段在班的每一張牌。
   每格顯示這張牌在該小時內的占用（服務中／預約／現場／休息）；排序：整小時都不能排的在上、可排的在下。 */
function SlotBoard({n}){
  n=n||3;
  const blocks=useMemo(demoBlocks,[]);
  const NOW=tm(DEMO_NOW);const nowH=Math.floor(NOW/60)*60;
  const [h0,setH0]=useState(nowH);
  const MIN_H=9*60,MAX_H=25*60;   // 09:00～01:00 開始的時段
  const hours=Array.from({length:n},(_,i)=>h0+i*60);
  const col=H=>{
    const E=H+60;const t0=Math.max(H,NOW);
    const on=Object.keys(DEMO_SHIFT).filter(tc=>{const s=DEMO_SHIFT[tc];return tm(s[0])<E&&tm(s[1])>H});
    const cards=on.map(tc=>{
      const bs=blocks.filter(b=>b.tc===tc&&b.s<E&&b.e>H);
      const fs=E<=NOW?null:freeAt(tc,blocks,t0,E);
      const sh=DEMO_SHIFT[tc];
      return {tc,bs,fs,in:tm(sh[0])>H?tm(sh[0]):null,out:tm(sh[1])<E?tm(sh[1]):null};
    });
    cards.sort((a,b)=>(b.fs==null?1e9:b.fs)-(a.fs==null?1e9:a.fs)||Number(a.tc)-Number(b.tc));
    const avail=cards.filter(c=>c.fs!=null);
    const atStart=avail.filter(c=>c.fs===t0).length;
    const last=avail.length?Math.max.apply(null,avail.map(c=>c.fs)):null;
    return {H,E,past:E<=NOW,cards,atStart,all:avail.length,last,t0};
  };
  const cols=hours.map(col);
  const span=(b,H,E)=>b.s<=H&&b.e>=E?'整小時':b.s<=H?'～'+tf(b.e):b.e>=E?tf(b.s)+'～':tf(b.s)+'-'+tf(b.e);
  // 下一小時內即將開始的壓牌（說明為什麼這張牌現在不能排 60 分）
  const soon=(tc,E)=>blocks.find(b=>b.tc===tc&&(b.kind==='book'||b.kind==='walk')&&b.s>=E&&b.s<E+SLOT_LEN);
  return (
    <>
      <div className="flex items-center gap-2 mb-3">
        <button className="w-9 h-9 rounded-lg border border-line bg-card text-lg disabled:opacity-30" disabled={h0<=MIN_H} onClick={()=>setH0(h0-60)}>‹</button>
        <div className="flex-1 text-center text-sm"><span className="num">{tf(h0)}～{tf(h0+n*60)}</span>{h0!==nowH&&<button className="ml-2 text-xs text-sageD underline" onClick={()=>setH0(nowH)}>回到現在</button>}</div>
        <button className="w-9 h-9 rounded-lg border border-line bg-card text-lg disabled:opacity-30" disabled={h0>=MAX_H-(n-1)*60} onClick={()=>setH0(h0+60)}>›</button>
      </div>
      <div className="grid gap-2" style={{gridTemplateColumns:'repeat('+n+',minmax(0,1fr))'}}>
        {cols.map(c=>(
          <div key={c.H} className={c.past?'opacity-50':''}>
            <div className={'text-center text-sm num mb-1 '+(c.H===nowH?'text-brown font-semibold':'')}>{tf(c.H)}{c.H===nowH&&<span className="text-[10px] font-normal"> 現在</span>}</div>
            <div className="text-center text-[11px] text-mute mb-1.5">{c.cards.length} 張牌</div>
            <div className="space-y-1">
              {c.cards.map((k,i)=>{
                const full=k.fs!=null&&k.fs===c.t0,part=k.fs!=null&&!full;
                return (
                  <div key={k.tc} className={'rounded-lg px-1.5 py-1 text-[11px] leading-tight border '+(full?'border-sage bg-sageL/60':part?'border-sage/50 bg-card':'border-line bg-bg')}>
                    <div className="flex justify-between"><span className="text-mute">牌{i+1}</span><span className="num font-semibold">{k.tc}</span></div>
                    {k.in!=null&&<div className="text-mute">{tf(k.in)} 上牌</div>}
                    {k.bs.map((b,j)=><div key={j} className="mt-0.5 flex gap-1 items-center"><span className={'shrink-0 px-1 rounded '+BK[b.kind].cls}>{b.kind==='book'||b.kind==='walk'?'壓':BK[b.kind].label.slice(0,1)}</span><span className="num truncate">{span(b,c.H,c.E)}{(b.kind==='book'||b.kind==='walk')?' '+b.who.slice(0,1):''}</span></div>)}
                    {k.out!=null&&<div className="text-mute">{tf(k.out)} 下牌</div>}
                    {!c.past&&k.fs==null&&(()=>{const n=soon(k.tc,c.E);return n?<div className="mt-0.5 text-warn">→ <span className="num">{tf(n.s)}</span> 壓 {n.who.slice(0,1)}</div>:null})()}
                    {!c.past&&<div className={'mt-0.5 '+(full?'text-sageD font-semibold':part?'text-sageD':'text-mute')}>{full?'可排':part?tf(k.fs)+' 起可排':'不可排'}</div>}
                  </div>);})}
            </div>
            {!c.past&&<div className="mt-1.5 rounded-lg bg-card border border-line px-1.5 py-1 text-[11px] leading-snug">
              <div>{c.t0===c.H?'整點':tf(c.t0)+' '}可排 <b className={'num '+(c.atStart?'text-sageD':'text-warn')}>{c.atStart}</b> 張</div>
              {c.all>c.atStart&&<div className="text-sageD"><span className="num">{tf(c.last)}</span> 起 <b className="num">{c.all}</b> 張</div>}
            </div>}
          </div>))}
      </div>
      <div className="mt-3 flex flex-wrap gap-x-3 gap-y-1 text-[11px] text-mute">
        <span><span className={'px-1 rounded '+BK.serve.cls}>服</span> 服務中</span>
        <span><span className={'px-1 rounded '+BK.book.cls}>壓</span> 預約／現場壓牌</span>
        <span><span className={'px-1 rounded '+BK.rest.cls}>休</span> 休息</span>
        <span><span className={'px-1 rounded '+BK.done.cls}>已</span> 已服務</span>
      </div>
      <div className="text-[11px] text-mute mt-1">「可排」＝該時段內能連續空出 {SLOT_LEN} 分鐘（壓牌前的空檔夠 {SLOT_LEN} 分也算）。</div>
    </>
  );
}

/* 老師個人：今日預約情形（上牌到下牌，每小時一格） */
function MyDayStrip({tc,day}){
  const blocks=useMemo(demoBlocks,[]);
  const NOW=tm(DEMO_NOW);
  const sh=DEMO_SHIFT[tc]||['10:00','20:00'];
  const on=tm(sh[0]),off=tm(sh[1]);
  const TOMORROW=[{tc,s:tm('11:00'),e:tm('12:30'),kind:'book',who:'王先生',item:'油壓 90',how:'指定'},{tc,s:tm('17:00'),e:tm('18:00'),kind:'book',who:'林小姐',item:'腳底 60',how:'不指定・依輪班排入'}];
  const mine=day==='today'?blocks.filter(b=>b.tc===tc):TOMORROW;
  const now=day==='today'?NOW:-1;
  const hrs=[];for(let h=on;h<off;h+=60)hrs.push(h);
  const cls=h=>{const bs=mine.filter(b=>b.s<h+60&&b.e>h);if(bs.some(b=>b.kind==='book'||b.kind==='walk'))return 'book';if(bs.some(b=>b.kind==='serve'))return 'serve';if(bs.some(b=>b.kind==='done'))return 'done';if(bs.some(b=>b.kind==='rest'))return 'rest';return 'free'};
  const cnt=k=>hrs.filter(h=>cls(h)===k).length;
  const bk=mine.filter(b=>b.kind==='book'||b.kind==='walk');
  const COL={done:'#6f7d62',serve:'#a0784f',book:'#b5543c',walk:'#b5543c',rest:'#cfc6b8'};
  return (
    <>
      <div className="text-xs text-mute mb-2">上牌 <span className="num">{tf(on)}～{tf(off)}</span>・共 {hrs.length} 格（1 小時 1 格）</div>
      <div className="grid gap-[3px]" style={{gridTemplateColumns:'repeat('+hrs.length+',minmax(0,1fr))'}}>
        {hrs.map(h=>(
          <div key={h}>
            <div className="text-[10px] text-center text-mute num">{Math.floor(h/60)%24}</div>
            <div className={'relative h-11 rounded-md overflow-hidden border '+(cls(h)==='book'?'border-warn/50':'border-line')+' bg-card'}>
              {mine.filter(b=>b.s<h+60&&b.e>h).map((b,j)=>{const a=Math.max(b.s,h)-h,z=Math.min(b.e,h+60)-h;
                return <div key={j} className="absolute top-0 bottom-0" style={{left:(a/60*100)+'%',width:((z-a)/60*100)+'%',background:COL[b.kind],opacity:b.kind==='done'?0.55:0.9}}></div>})}
              {now>=h&&now<h+60&&<div className="absolute top-0 bottom-0 w-[2px] bg-ink" style={{left:((now-h)/60*100)+'%'}}></div>}
            </div>
          </div>))}
      </div>
      <div className="mt-2 flex flex-wrap gap-x-3 gap-y-1 text-[11px] text-mute">
        {[['book','預約'],['serve','服務中'],['done','已服務'],['rest','休息']].map(([k,l])=><span key={k} className="flex items-center gap-1"><span className="inline-block w-3 h-3 rounded-sm" style={{background:COL[k],opacity:k==='done'?0.55:0.9}}></span>{l}</span>)}
        {day==='today'&&<span className="flex items-center gap-1"><span className="inline-block w-[2px] h-3 bg-ink"></span>現在</span>}
      </div>

/* ========== 確認碼打卡／上牌 ==========
   主櫃點某位人員「上牌／打卡」→ 以「該人員 userId＋日期＋產生當下的時:分」算出 3 位數確認碼，並把這一刻記為上牌／打卡時間。
   人員在自己手機輸入確認碼，手機用自己的 userId 比對最近 10 分鐘（含快 1 分鐘的誤差），吻合即成功。
   主櫃畫面上的確認碼不倒數，關閉（做別的操作）後就看不到，只能重新產生；重新產生時以最新一次產生的時間為準。
   不經後端：演算法在公開程式裡，目的只是讓員工不容易看出規律。 */
const PUNCH_WIN=10;                       // 手機比對最近幾分鐘
const PUNCH_EASY=true;                     // 測試期：確認碼為 000、111…999 這類重複數字（正式改成 false＝隨機 3 位數）。主櫃與手機用同一份程式，一起切換
function punchHash(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}h^=h>>>15;h=Math.imul(h,0x2c1b3c6d);h^=h>>>12;return h>>>0}
// v0.1-057：櫃台（上班／下班）的確認碼另外算（加 |c），老師上牌的碼不能拿來打櫃台卡，反之亦然
function punchCode(uid,d,kind){const h=punchHash('slowve-punch|'+uid+(kind==='counter'?'|c':'')+'|'+ymd(d)+'|'+pad(d.getHours())+':'+pad(d.getMinutes()));return PUNCH_EASY?String(h%10).repeat(3):String(h%1000).padStart(3,'0')}
function punchVerify(uid,code,now,kind){
  now=now||new Date();
  for(let k=-1;k<=PUNCH_WIN;k++){const d=new Date(now.getTime()-k*60000);if(punchCode(uid,d,kind)===code)return d}
  return null;
}
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
// 示範模式的資料另外存，不會混進真正的備份
const DS=()=>IS_ROLE_DEMO?'slowve.demo.':P;
const jget=(k,def)=>{try{const x=JSON.parse(localStorage.getItem(DS()+k)||'null');return x==null?def:x}catch(_e){return def}};
const jset=(k,v)=>{try{localStorage.setItem(DS()+k,JSON.stringify(v))}catch(_e){}};

/* 示範人員（假的 userId）；正式版改讀 members.json */
const DEMO_STAFF=[
  {uid:'Udemo0000000000000000000000000122',name:'阿芳',tc:'122',roles:['teacher']},
  {uid:'Udemo0000000000000000000000000077',name:'Ally',tc:'77',roles:['teacher','counter','guest']},
  {uid:'Udemo0000000000000000000000000058',name:'阿明',tc:'58',roles:['teacher']},
  {uid:'Udemo0000000000000000000000000036',name:'小琪',tc:'36',roles:['teacher']},
  {uid:'Udemo0000000000000000000000000012',name:'小安',tc:'12',roles:['teacher']},
  {uid:'Udemo000000000000000000000000mei1',name:'小美',roles:['counter']},
  {uid:'Udemo000000000000000000000000lili',name:'麗麗',roles:['counter']},
];
const demoUidOf=x=>{const f=DEMO_STAFF.find(s=>s.tc===x||s.name===x);return f?f.uid:'Udemo-unknown'};
const PK={teacher:{in:'上牌',out:'下牌'},counter:{in:'上班',out:'下班'}};
const personLabel=p=>p.tc?p.tc+' '+p.name:p.name;

/* ---- 手機端：輸入確認碼 ---- */
function PunchPanel({me,kind,onDone,cloudRecs}){   // kind：teacher（上牌／下牌）／counter（上班／下班）
  const L=PK[kind];
  const uid=me&&me.uid;
  const key='mypunch-'+(kind==='counter'?'c-'+uid+'-'+bizToday(loadSettings().cutoff):uid+'-'+ymd(new Date()));   // 老師、櫃台的打卡分開存
  const [recs,setRecs]=useState(()=>jget(key,[]));
  const [st,setSt]=useState('idle');   // idle / input / fail
  const [act,setAct]=useState(null);
  const [val,setVal]=useState('');
  const [tries,setTries]=useState(0);
  const [ok,setOk]=useState(null);
  const inRef=useRef(null);
  const last=k=>{const r=recs.concat(cloudRecs||[]).filter(x=>x.k===k).map(x=>x.t).sort();return r.length?(k==='in'?r[0]:r[r.length-1]):null};   // 雲端的紀錄（換手機、補打卡）也算
  const start=k=>{setAct(k);setVal('');setTries(0);setOk(null);setSt('input');setTimeout(()=>{try{inRef.current.focus()}catch(_e){}},50)};
  const submit=()=>{
    if(!/^\d{3}$/.test(val))return;
    const d=punchVerify(uid,val,null,kind);
    if(d){
      const r={k:act,t:hm(d),at:Date.now()};const n=recs.concat([r]);setRecs(n);jset(key,n);
      onDone&&onDone({k:act,code:val,at:d.getTime()});   // v0.1-056：櫃台打卡上傳雲端
      setOk(r);setSt('idle');setVal('');setTries(0);return;
    }
    const n=tries+1;setTries(n);setVal('');
    if(n>=5)setSt('fail');
  };
  return (
    <div>
      <div className="flex justify-between text-sm mb-3"><span>今日{L.in} <span className="num">{last('in')||'—'}</span></span><span className={last('out')?'':'text-mute'}>{L.out} <span className="num">{last('out')||'—'}</span></span></div>
      {ok&&st==='idle'&&<div className="mb-3 px-3 py-2 rounded-xl bg-sageL text-sageD text-sm">✓ {L[ok.k]}成功・<span className="num">{ok.t}</span>（主櫃產生確認碼的時間）</div>}
      {st==='idle'&&<div className="grid grid-cols-2 gap-2">
        <button className="h-12 rounded-xl bg-sage text-white" onClick={()=>start('in')}>{L.in}打卡</button>
        <button className="h-12 rounded-xl border border-sage text-sageD bg-card" onClick={()=>start('out')}>{L.out}打卡</button>
      </div>}
      {st==='input'&&<div className="rounded-xl border border-sage bg-sageL/30 p-3">
        <div className="text-sm mb-2"><b>{L[act]}</b>：請向主櫃索取確認碼後輸入</div>
        <div className="flex gap-2">
          <input ref={inRef} className="flex-1 min-w-0 w-full h-14 px-3 rounded-xl border border-line bg-card text-3xl tracking-[0.5em] text-center num" inputMode="numeric" maxLength={3} placeholder="———" value={val}
            onChange={e=>setVal(e.target.value.replace(/\D/g,'').slice(0,3))} onKeyDown={e=>{if(e.key==='Enter')submit()}}/>
          <button className="px-5 h-14 rounded-xl bg-sage text-white disabled:opacity-40" disabled={val.length!==3} onClick={submit}>確認</button>
        </div>
        {tries>0&&tries<3&&<div className="text-sm text-warn mt-2">確認碼不正確（第 {tries} 次）</div>}
        {tries>=3&&<div className="text-sm text-warn mt-2">確認碼已錯誤 {tries} 次。再持續輸入錯誤時，請向主櫃索取確認碼。</div>}
        <button className="w-full h-9 mt-2 text-sm text-mute" onClick={()=>setSt('idle')}>取消</button>
      </div>}
      {st==='fail'&&<div className="rounded-xl border border-warn bg-warnL p-3 text-center">
        <div className="text-warn font-semibold">打卡未成功</div>
        <div className="text-sm text-warn mt-1">確認碼錯誤 5 次，請重新打卡。</div>
        <button className="mt-3 h-11 px-6 rounded-xl bg-sage text-white" onClick={()=>{setSt('idle');setTries(0)}}>重新打卡</button>
      </div>}
      <div className="text-xs text-mute mt-2">確認碼由主櫃產生，{PUNCH_WIN} 分鐘內輸入有效；{L.in}時間以主櫃產生確認碼的時間為準。</div>
    </div>
  );
}

/* ---- 主櫃：點人員上牌／打卡 → 產生確認碼 ---- */
function PunchDesk({op,people,recs,setRecs}){
  const [pick,setPick]=useState(null);     // 選中的人員
  const [show,setShow]=useState(null);     // {p,k,code,t,rid}
  const today=ymd(new Date());
  // v0.1-057：同一個人可以同時是老師和櫃台（主管老師下去卡班），兩種打卡分開記：pick＝{...人員, _r:'teacher'|'counter'}
  const role=p=>p._r||(p.tc?'teacher':'counter');
  const lastOf=(uid,r)=>{const a=recs.filter(x=>x.uid===uid&&(x.role||'teacher')===r);return a.length?a[a.length-1]:null};
  const gen=(p,k,rid)=>{
    const now=new Date();const t=hm(now);const code=punchCode(p.uid,now,role(p));
    let n;
    if(rid){n=recs.map(r=>r.id===rid?Object.assign({},r,{t,regen:(r.regen||0)+1,by:op.name}):r)}
    else{rid=String(Date.now());n=recs.concat([{id:rid,uid:p.uid,who:role(p)==='counter'?p.name:personLabel(p),role:role(p),k,t,by:op.name}])}
    setRecs(n);setShow({p,k,code,t,rid});setPick(null);
  };
  const Chip=({p})=>{const l=lastOf(p.uid,role(p));const on=l&&l.k==='in';const ct=role(p)==='counter';return (
    <button onClick={()=>{setShow(null);setPick(p)}} className={'rounded-xl border px-3 py-2 text-left min-w-[6.5rem] '+(on?'bg-sageL border-sage':'bg-card border-line')}>
      <div className="num font-semibold">{ct?p.name:(p.tc||p.name)}{!ct&&p.tc&&<span className="font-normal text-xs text-mute ml-1">{p.name}</span>}{ct&&p.tc&&<span className="font-normal text-[10px] text-brown ml-1">卡班</span>}{p.test&&<TestTag uid={p.uid}/>}</div>
      <div className={'text-[11px] '+(on?'text-sageD':'text-mute')}>{l?PK[role(p)][l.k]+' '+l.t:'未'+PK[role(p)].in}</div>
    </button>)};
  return (
    <>
      <div className="text-xs text-mute mb-2">點人員 → 選{PK.teacher.in}／{PK.teacher.out}（櫃台為{PK.counter.in}／{PK.counter.out}）→ 產生確認碼報給對方。產生的當下即記錄時間。</div>
      <div className="text-xs text-mute mb-1">老師</div>
      <div className="flex flex-wrap gap-2 mb-3">{people.filter(p=>p.tc).map(p=><Chip key={p.uid} p={Object.assign({},p,{_r:'teacher'})}/>)}</div>
      <div className="text-xs text-mute mb-1">櫃台人員</div>
      <div className="flex flex-wrap gap-2">{people.filter(p=>p.roles.includes('counter')).map(p=><Chip key={p.uid+'c'} p={Object.assign({},p,{_r:'counter'})}/>)}</div>
      <div className="text-sm text-mute mt-4 mb-1">今日打卡紀錄（{today.slice(5)}）</div>
      {recs.length===0?<Ph>還沒有紀錄</Ph>:
        <div className="max-h-56 overflow-y-auto">{recs.slice().reverse().map(r=>(
          <div key={r.id} className="flex items-center gap-3 py-1.5 border-b border-line last:border-0 text-sm">
            <span className="num w-12">{r.t}</span><span className="flex-1">{r.who}<span className={'ml-2 text-xs px-1.5 rounded '+(r.k==='in'?'bg-sageL text-sageD':'bg-brownL text-brown')}>{PK[r.role][r.k]}</span>{r.regen?<span className="ml-1 text-[11px] text-mute">重新產生 {r.regen} 次</span>:''}</span>
            <span className="text-xs text-mute">由 {r.by}</span>
          </div>))}</div>}

      {pick&&<div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center px-6" onClick={()=>setPick(null)}>
        <div className="w-full max-w-sm bg-card rounded-2xl p-5" onClick={e=>e.stopPropagation()}>
          <div className="text-lg mb-1">{personLabel(pick)}</div>
          <div className="text-sm text-mute mb-4">{role(pick)==='counter'&&pick.tc?'櫃台卡班・':''}{(l=>l?'目前：'+PK[role(pick)][l.k]+' '+l.t:'今天尚未'+PK[role(pick)].in)(lastOf(pick.uid,role(pick)))}</div>
          <div className="grid grid-cols-2 gap-2">
            <button className="h-14 rounded-xl bg-sage text-white text-lg" onClick={()=>gen(pick,'in')}>{PK[role(pick)].in}</button>
            <button className="h-14 rounded-xl border border-sage text-sageD text-lg" onClick={()=>gen(pick,'out')}>{PK[role(pick)].out}</button>
          </div>
          <button className="w-full h-10 mt-2 text-sm text-mute" onClick={()=>setPick(null)}>取消</button>
        </div>
      </div>}

      {show&&<div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center px-6" onClick={()=>setShow(null)}>
        <div className="w-full max-w-sm bg-card rounded-2xl p-6 text-center" onClick={e=>e.stopPropagation()}>
          <div className="text-sm text-mute">{personLabel(show.p)}・{PK[role(show.p)][show.k]}</div>
          <div className="text-xs text-mute mt-1">確認碼</div>
          <div className="serif text-7xl tracking-[0.2em] text-sageD num my-3 pl-[0.2em]">{show.code}</div>
          <div className="text-sm">已記錄{PK[role(show.p)][show.k]}時間 <b className="num">{show.t}</b></div>
          <div className="text-xs text-mute mt-2">請對方在自己手機輸入（{PUNCH_WIN} 分鐘內）。關閉後確認碼不再顯示。</div>
          <div className="grid grid-cols-2 gap-2 mt-5">
            <button className="h-12 rounded-xl border border-line bg-bg" onClick={()=>gen(show.p,show.k,show.rid)}>重新產生</button>
            <button className="h-12 rounded-xl bg-sage text-white" onClick={()=>setShow(null)}>完成</button>
          </div>
        </div>
      </div>}
    </>
  );
}

/* ---- 主櫃系統（店內 iPad）：操作人＋上牌打卡台＋櫃台營運畫面 ----
   操作人：老闆模式，或由櫃台人員用 LINE（QR Code）登入。
   換人登入前必須先「交班點清」：本班營業額（累計已結帳 − 前面各班已交的）− 本班支出 ＝ 應有現金，輸入實點現金記錄差額。
   櫃台人員須先完成上班打卡才能登入主櫃。老闆可設定主櫃隱藏營業額（交班時改為盲點：只輸入實點現金，差額只有老闆看得到）。 */
function MainCounter({me,mode,real,member}){
  const [people,setPeople]=useState(real?[]:DEMO_STAFF);   // 正式版：members.json 中有 teacher／counter 的人
  useEffect(()=>{if(!real)return;fetchMembers().then(list=>setPeople(list.map(x=>{const i=memberInfo(x);return {uid:x.uid,name:x.name||'',tc:i.roles.includes('teacher')?x.tc:'',roles:i.roles,test:!!x.test}}).filter(x=>x.tc||x.roles.includes('counter')))).catch(()=>{})},[]);
  const day=ymd(new Date());
  const [recs,setRecsS]=useState(()=>jget('punch-'+day,[]));
  const setRecs=n=>{setRecsS(n);jset('punch-'+day,n)};
  const [op,setOpS]=useState(()=>{
    if(real&&member){const i=memberInfo(member);return {name:member.name||'',kind:i.admin==='owner'?'owner':'counter',uid:member.uid,at:hm(new Date())}}
    return jget('mainc-op',null)||{name:'老闆',kind:'owner',at:hm(new Date())};
  });
  const [hand,setHandS]=useState(()=>jget('handover-'+day,[]));
  const [supPaid,setSupPaidS]=useState(()=>jget('suppay-'+day,[]));   // 支援老師付現紀錄 [{tc,amt,zh,t,by,at}]
  const [cfg,setCfgS]=useState(()=>jget('mainc-cfg',{hideRev:false}));
  const setCfg=c=>{setCfgS(c);jset('mainc-cfg',c)};
  const [login,setLogin]=useState(null);   // null／'count'（交班點清）／'pick'（選接手的人）
  const [pend,setPend]=useState(null);     // 已點清、尚未換人的交班資料
  const [cash,setCash]=useState('');const [note,setNote]=useState('');
  const [warn,setWarn]=useState('');
  const [showSet,setShowSet]=useState(false);
  const [showHand,setShowHand]=useState(false);
  const isOwner=op.kind==='owner';
  const hide=!!cfg.hideRev&&!isOwner;      // 老闆模式自己永遠看得到

  // 本班金額（範例資料：今天累計已結帳 − 前面各班已交班的；支出 350 算在第一班）
  const S=loadSettings();
  const cumPaid=DEMO_ORDERS.filter(o=>o.st==='paid').reduce((s,o)=>s+o.g.reduce((a,x)=>a+demoCalc(S,x).amt,0),0);
  const prevRev=hand.reduce((s,h)=>s+(h.rev||0),0),prevExp=hand.reduce((s,h)=>s+(h.exp||0),0);
  const lastAt=hand.length?(hand[hand.length-1].at||0):0;
  const shift={rev:Math.max(0,cumPaid-prevRev),exp:Math.max(0,350-prevExp),sup:supPaid.filter(r=>r.at>lastAt).reduce((a,r)=>a+r.amt,0)};
  shift.expected=shift.rev-shift.exp-shift.sup;
  const onPay=r=>{const n=supPaid.concat([Object.assign({},r,{t:hm(new Date()),by:op.name,at:Date.now()})]);setSupPaidS(n);jset('suppay-'+day,n)};
  const c=cash===''?null:Number(cash);
  const diff=c==null?null:c-shift.expected;

  const clockedIn=uid=>{const r=recs.filter(x=>x.uid===uid&&x.role==='counter');return r.length&&r[r.length-1].k==='in'};   // 登入主櫃要有櫃台上班打卡（老師上牌不算）
  const openLogin=()=>{setWarn('');setCash('');setNote('');setLogin(pend?'pick':'count')};
  const doCount=skip=>{
    setPend(skip?{from:op.name,skip:true}:{from:op.name,since:op.at,rev:shift.rev,exp:shift.exp,sup:shift.sup,expected:shift.expected,cash:c,diff,note:note.trim(),hidden:hide});
    setLogin('pick');
  };
  const switchTo=p=>{
    if(p&&!clockedIn(p.uid)){setWarn(p.name+' 今天還沒有上班打卡。請先由目前的主櫃（'+op.name+'）在「人員上牌／打卡」產生確認碼，'+p.name+' 在手機輸入完成上班打卡後，再登入主櫃。');return}
    const n={name:p?p.name:'老闆',kind:p?'counter':'owner',uid:p&&p.uid,at:hm(new Date())};
    const rec=Object.assign({},pend||{from:op.name,skip:true},{to:n.name,t:n.at,at:Date.now()});
    const h=hand.concat([rec]);setHandS(h);jset('handover-'+day,h);
    setOpS(n);jset('mainc-op',n);setLogin(null);setPend(null);setWarn('');
  };
  // 正式版：換人登入會整頁登出再登入，回來後把登出前點清的交班資料補上接手的人
  useEffect(()=>{
    if(!real)return;const hp=jget('handover-pending',null);if(!hp)return;
    const h=hand.concat([Object.assign({},hp,{to:op.name,t:op.at,at:Date.now()})]);setHandS(h);jset('handover-'+day,h);jset('handover-pending',null);
  },[]);
  const notIn=real&&op.kind==='counter'&&!clockedIn(op.uid);
  const wide=mode!=='phone';
  const canSeeDiff=isOwner||!cfg.hideRev;
  const opBar=(
    <div className={'bg-brownL/70 border-b border-line'}>
      <div className={(wide?'px-6':'max-w-md mx-auto px-4')+' py-2 flex items-center gap-3 flex-wrap'}>
        <span className="text-xs px-2 py-0.5 rounded bg-brown text-white">主櫃系統</span>
        <span className="text-sm">操作人：<b>{op.name}</b>{isOwner?'（老闆模式）':'（櫃台）'}<span className="text-xs text-mute ml-1 num">{op.at} 起</span></span>
        {hand.length>0&&<button className="text-xs text-mute underline" onClick={()=>setShowHand(true)}>今日交班 {hand.length} 次</button>}
        {cfg.hideRev&&<span className="text-[11px] px-1.5 rounded bg-card border border-line text-mute">營業額隱藏中</span>}
        <span className="ml-auto flex gap-2">
          {isOwner&&<button className="h-8 px-3 rounded-full bg-card border border-line text-sm" onClick={()=>setShowSet(true)}>主櫃設定</button>}
          <button className="h-8 px-3 rounded-full bg-card border border-brown text-brown text-sm" onClick={openLogin}>{pend?'換人登入':'交班／換人登入'}</button>
        </span>
      </div>
    </div>
  );
  const desk=(
    <Sec title="人員上牌／打卡" right={<span className="text-xs text-mute">確認碼 3 位數{PUNCH_EASY?'（測試期：111、222…）':''}・關閉後不再顯示</span>}>
      <PunchDesk op={op} people={people} recs={recs} setRecs={setRecs}/>
    </Sec>
  );
  const Row=({k,v,cls,big})=><div className={'flex justify-between py-1 '+(big?'pt-2 mt-1 border-t border-line':'')}><span className={big?'':'text-mute'}>{k}</span><span className={'num '+(big?'serif text-2xl text-brown ':'')+(cls||'')}>{v}</span></div>;
  return (
    <>
      {opBar}
      {notIn&&<div className="bg-warnL text-warn text-sm px-4 py-2 text-center">{op.name} 今天還沒有上班打卡，請先由老闆或上一班產生確認碼完成打卡。</div>}
      <CounterHome me={me} mode={mode} desk={desk} hideRev={hide} sup={{paid:supPaid,onPay}}/>

      {login&&<div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center px-6" onClick={()=>setLogin(null)}>
        <div className="w-full max-w-md bg-card rounded-2xl p-5 max-h-[92vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
          <div className="flex gap-2 mb-3 text-xs">
            {[['count','1 交班點清'],['pick','2 換人登入']].map(([k,l])=><span key={k} className={'px-2 py-1 rounded-full '+(login===k?'bg-sage text-white':'bg-bg text-mute border border-line')}>{l}</span>)}
          </div>
          {login==='count'&&<>
            <div className="text-lg">交班點清</div>
            <div className="text-sm text-mute mb-3">{op.name}・本班 <span className="num">{op.at}</span>～<span className="num">{hm(new Date())}</span>。請點清抽屜現金後輸入。</div>
            {hide?<div className="mb-3 px-3 py-2 rounded-xl bg-bg border border-line text-sm text-mute">老闆已設定隱藏營業額：請直接點清現金並輸入，差額由老闆查看。</div>:
              <div className="rounded-xl border border-line bg-bg px-3 py-2 mb-3 text-sm">
                <Row k="本班已結帳營業額" v={money(shift.rev)}/>
                <Row k="－ 本班現金支出" v={money(shift.exp)}/>
                {shift.sup>0&&<Row k="－ 本班支援老師現結" v={money(shift.sup)}/>}
                <Row k="應有現金" v={money(shift.expected)} big/>
              </div>}
            <label className="block mb-2"><div className="text-xs text-mute mb-1">實點現金</div>

          <div className="text-lg mb-3">主櫃設定（老闆）</div>
          <button className={'w-full rounded-xl border px-3 py-3 text-left '+(cfg.hideRev?'bg-sageL border-sage':'bg-card border-line')} onClick={()=>setCfg(Object.assign({},cfg,{hideRev:!cfg.hideRev}))}>
            <div>{cfg.hideRev?'☑':'☐'} 隱藏當前營業額</div>
            <div className="text-xs text-mute mt-1">櫃台人員操作主櫃時，今日營業額、未結帳合計、應有現金都顯示「＊＊＊」（單筆訂單金額仍顯示，才能收款）。交班點清改為只輸入實點現金，差額只有老闆看得到。</div>
          </button>

      {showHand&&<div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center px-6" onClick={()=>setShowHand(false)}>

            {!h.skip&&(canSeeDiff?<div className="text-xs text-mute num">應有 {money(h.expected)}（營業額 {money(h.rev)} − 支出 {money(h.exp)}{h.sup?' − 支援 '+money(h.sup):''}）・<span className={h.diff===0?'text-sageD':'text-warn'}>差額 {smoney(h.diff)}</span>{h.note?'・'+h.note:''}</div>:
              <div className="text-xs text-mute">差額由老闆查看</div>)}

      </div>}
    </>
  );
}

/* ---- 櫃台人員（個人，正式版 v0.1-055／差勤 v0.1-056） ----
   打卡：手機輸入主櫃確認碼 → 先存在這支手機 → 上傳 GAS（punch，GAS 再驗一次確認碼）。
   差勤：到職日起，正職櫃台每天都要有上班、下班打卡（請假的日子除外），沒有就記「異常」，本人可申請補打卡（填原因，老闆／主管核准）。
   扣薪（月薪）：日薪＝月薪÷30、時薪＝日薪÷8；遲到、早退按分鐘比例扣；事假扣全額、病假扣一半、休假（排休）不扣（依勞工請假規則）。
   支援櫃台（無底薪）：時薪 × 實際時數，每天下班向主櫃領現金（日結，記成現金支出）；不記異常、不扣薪。 */
const ATT_DEMO=true;   // 勞基法違規提示的「範例」差勤資料；跟老闆確認提示文字後改成 false（範例就不再顯示）
const toMin=t=>{const a=String(t||'').split(':');return a.length===2?Number(a[0])*60+Number(a[1]):null};
const minTxt=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?(h+' 小時'+(r?' '+r+' 分':'')):r+' 分'};
const hrTxt=m=>(+(m/60).toFixed(1))+' 時';
const leaveOn=(list,d)=>(list||[]).filter(L=>L.status!=='cancelled'&&L.status!=='rejected'&&L.from<=d&&(L.to||L.from)>=d);
const monthEndOf=ym=>ym+'-'+pad(new Date(Number(ym.slice(0,4)),Number(ym.slice(5)),0).getDate());
const shiftYm=(ym,n)=>{const d=new Date(Number(ym.slice(0,4)),Number(ym.slice(5))-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const workMin=(i,o)=>{let m=toMin(o)-toMin(i);if(m<0)m+=1440;return m};
const LEAVE_RATE={personal:1,sick:0.5,off:0};
/* v0.1-061：差勤檢查 10 條，老闆可在「設定 → 差勤檢查」逐條關閉；開關存在設定 attChecks（沒寫＝開），GAS 回傳給櫃台頁 */
const ATT_CHECKS=[
  ['miss','異常：沒有上下班打卡（缺上班或缺下班也算）','正職櫃台到職日起，沒打卡又沒請假記「異常」，可申請補打卡'],
  ['late','遲到','晚於上班時間打卡；月薪按分鐘比例扣薪'],
  ['early','早退','早於下班時間打卡；月薪按分鐘比例扣薪'],
  ['d8','每日超過 8 小時（加班提醒）','勞基法第 30、32 條'],
  ['d12','每日超過 12 小時','勞基法第 32 條'],
  ['w40','每週超過 40 小時','勞基法第 30 條'],
  ['m46','每月加班超過 46 小時','勞基法第 32 條'],
  ['c6','連續上班超過 6 天（一例一休）','勞基法第 36 條'],
  ['r11','下班到隔天上班少於 11 小時','勞基法第 34 條'],
  ['b4','連續工作 4 小時要休息 30 分鐘（提醒）','勞基法第 35 條'],
];
const ckOf=c=>{const o={};ATT_CHECKS.forEach(([k])=>{o[k]=!(c&&c[k]===false)});return o};   // 扣薪比例：事假全扣、病假扣半、休假不扣
const PAY_TYPE={monthly:'月薪',none:'無底薪（支援・時薪日結）'};
// 一天的上下班：第一次上班、最後一次下班
function inOutOf(recs){const r=recs||[];const i=r.filter(x=>x.k==='in'),o=r.filter(x=>x.k==='out');return {in:i.length?i[0].t:'',out:o.length?o[o.length-1].t:'',fixIn:i.some(x=>x.src==='fix'),fixOut:o.some(x=>x.src==='fix')}}
/* 差勤計算（櫃台頁與老闆月報共用）
   A：{hr, shift:{in,out}, punches:{date:[recs]}, fixes, leaves}；回傳每天的狀態、統計、扣薪、勞基法提示 */
function attCalc(A,ym,today){
  // A.teacher：老師（主管）下去卡班，一律算支援（時薪），不記異常、不扣薪
  const hr=A.teacher?Object.assign({hourly:0},A.hr||{},{payType:'none'}):(A.hr||null),sup=!!(hr&&hr.payType==='none'),monthly=!!(hr&&hr.payType!=='none'&&hr.hire);
  const sIn=(A.shift&&A.shift.in)||'',sOut=(A.shift&&A.shift.out)||'';
  const mStart=ym+'-01',mEnd=monthEndOf(ym);
  const from=hr&&hr.hire&&hr.hire>mStart?hr.hire:mStart;
  const kb=!!A.teacher;
  const ck=ckOf(A.checks);
  const to=mEnd<today?mEnd:today;
  const fixes=A.fixes||[];
  const days=[];
  for(let d=from;d<=to;d=addDays(d,1)){
    const io=inOutOf((A.punches||{})[d]);
    const L=leaveOn(A.leaves,d);const full=L.find(x=>x.all);
    const pend=fixes.filter(f=>f.date===d&&f.status==='pending');
    const rej=fixes.filter(f=>f.date===d&&f.status==='rejected');
    const x={date:d,in:io.in,out:io.out,fixIn:io.fixIn,fixOut:io.fixOut,leave:L,full:!!full,pend,rej,min:io.in&&io.out?workMin(io.in,io.out):null,late:0,early:0,issues:[],pay:0};
    if(monthly&&!full&&(ck.miss||ck.late||ck.early)){
      let es=sIn,ee=sOut;   // 部分時段請假：請在開頭／結尾的，應到／應退時間往後／往前移
      L.filter(z=>!z.all).forEach(z=>{if(es&&toMin(z.t1)<=toMin(es)&&toMin(z.t2)>toMin(es))es=z.t2;if(ee&&toMin(z.t2)>=toMin(ee)&&toMin(z.t1)<toMin(ee))ee=z.t1});
      if(d<today&&ck.miss){
        if(!io.in&&!io.out)x.issues.push('沒有上下班打卡');
        else{if(!io.in)x.issues.push('缺上班打卡');if(!io.out)x.issues.push('缺下班打卡')}
      }
      if(ck.late&&io.in&&es)x.late=Math.max(0,toMin(io.in)-toMin(es));
      if(ck.early&&io.out&&ee){   // 跨午夜：下班時間比上班早，表示過了午夜（換日前都算同一個營業日）
        const st=toMin(io.in||es||sIn||'00:00');const oA=toMin(io.out)+(toMin(io.out)<st?1440:0);const eA=toMin(ee)+(toMin(ee)<toMin(es||sIn||'00:00')?1440:0);
        x.early=Math.max(0,eA-oA)}
    }
    if(sup&&x.min!=null)x.pay=Math.round(x.min/60*(Number(hr.hourly)||0));
    days.push(x);
  }
  if(sup){const keep=days.filter(x=>x.in||x.out||x.leave.length);days.length=0;keep.forEach(x=>days.push(x))}   // 支援／卡班：只列有來的日子
  const worked=days.filter(x=>x.in||x.out);
  const lateMin=days.reduce((s,x)=>s+x.late+x.early,0);
  const salary=Number(hr&&hr.salary)||0,daily=salary/30,hourly=daily/8;
  // 請假扣薪：這個月（到職日以後）每一天的請假
  const lv={personal:0,sick:0,off:0};
  if(monthly)for(let d=from;d<=mEnd;d=addDays(d,1))leaveOn(A.leaves,d).forEach(L=>{if(lv[L.kind]==null)return;lv[L.kind]+=L.all?8:Math.min(8,Math.max(0,(toMin(L.t2)-toMin(L.t1))/60))});
  const dedLate=monthly?lateMin*hourly/60:0;
  const dedLeave={personal:lv.personal*hourly*LEAVE_RATE.personal,sick:lv.sick*hourly*LEAVE_RATE.sick};
  const ded=Math.round(dedLate+dedLeave.personal+dedLeave.sick);
  const law=lawCheck(Object.keys(A.punches||{}).sort().map(d=>{const io=inOutOf(A.punches[d]);return {date:d,in:io.in,out:io.out}}),ym,(A.cfg||{}).brk).filter(w=>ck[w.r==='ot'?'m46':w.r]);
  return {ck,days,sup,kb,monthly,hr,sIn,sOut,from,to,
    n:{work:worked.filter(x=>x.in).length,late:days.filter(x=>x.late>0).length,early:days.filter(x=>x.early>0).length,lateMin,
      issue:days.filter(x=>x.issues.length&&!x.pend.length).length,pend:fixes.filter(f=>f.status==='pending').length,
      min:days.reduce((s,x)=>s+(x.min||0),0),pay:days.reduce((s,x)=>s+x.pay,0)},
    lv,salary,daily,hourly,dedLate:Math.round(dedLate),dedLeave:{personal:Math.round(dedLeave.personal),sick:Math.round(dedLeave.sick)},ded,net:salary-ded,law};
}
/* 勞基法檢查（第 30、32、34、35、36 條）。days：[{date,in,out}]（可含上個月最後幾天，連續上班才算得準）；只回報落在 ym 的 */
function lawCheck(days,ym,brk){   // brk：每日休息（分鐘），從工時扣掉；有 30 分以上就不再提醒第 35 條
  brk=Number(brk)||0;
  const w=[];const inYm=d=>d.slice(0,7)===ym;
  const done=days.filter(x=>x.in&&x.out).map(x=>{const span=workMin(x.in,x.out);return Object.assign({},x,{span,min:Math.max(0,span-(span>240?brk:0))})});
  let ot=0;
  done.forEach(x=>{if(!inYm(x.date))return;const d=fmtDate(x.date);
    if(x.min>720)w.push({r:'d12',lv:'bad',date:x.date,t:d+' 工作 '+minTxt(x.min)+'，超過每日上限 12 小時（正常工時＋加班），違反勞基法第 32 條。'});
    else if(x.min>480)w.push({r:'d8',lv:'warn',date:x.date,t:d+' 工作 '+minTxt(x.min)+'，超過每日正常工時 8 小時，超過的 '+minTxt(x.min-480)+' 屬加班，需依法給加班費（第 30、32 條）。'});
    if(x.min>480)ot+=x.min-480;
    if(x.span>240&&brk<30)x.long=true;});
  // 每週 40 小時（週一～週日）
  const wk={};done.forEach(x=>{const d=parseYmd(x.date);const k=addDays(x.date,-((d.getDay()+6)%7));(wk[k]=wk[k]||[]).push(x)});
  Object.keys(wk).sort().forEach(k=>{const a=wk[k];const s=a.reduce((t,x)=>t+x.min,0);const e=addDays(k,6);if(!(inYm(k)||inYm(e)))return;
    if(s>2400)w.push({r:'w40',lv:'warn',date:k,t:fmtDate(k).replace(/（.）/,'')+'～'+fmtDate(e).replace(/（.）/,'')+' 這週工作 '+minTxt(s)+'，超過每週正常工時 40 小時，超過的部分屬加班（第 30 條）。'})});
  if(ot>46*60)w.push({r:'m46',lv:'bad',date:ym+'-31',t:'本月加班已達 '+minTxt(ot)+'，超過每月 46 小時上限（經工會或勞資會議同意最多 54 小時，每 3 個月合計不超過 138 小時），違反勞基法第 32 條。'});
  else if(ot>0)w.push({r:'ot',lv:'info',date:ym+'-31',t:'本月加班合計 '+minTxt(ot)+'（上限每月 46 小時）。'});
  // 連續上班超過 6 天
  const set={};days.filter(x=>x.in||x.out).forEach(x=>{set[x.date]=1});
  const ds=Object.keys(set).sort();let run=[];
  const flush=()=>{if(run.length>6&&inYm(run[run.length-1]))w.push({r:'c6',lv:'bad',date:run[0],t:fmtDate(run[0]).replace(/（.）/,'')+' 起連續上班 '+run.length+' 天（到 '+fmtDate(run[run.length-1]).replace(/（.）/,'')+'），超過 6 天；每 7 天應有 2 天休息（1 天例假、1 天休息日），違反勞基法第 36 條。'});run=[]};
  ds.forEach(d=>{if(run.length&&addDays(run[run.length-1],1)!==d)flush();run.push(d)});flush();
  // 下班到隔天上班至少休息 11 小時
  for(let i=1;i<done.length;i++){const a=done[i-1],b=done[i];if(addDays(a.date,1)!==b.date||!inYm(b.date))continue;
    const outAbs=toMin(a.out)<toMin(a.in)?toMin(a.out)+1440:toMin(a.out);const rest=1440+toMin(b.in)-outAbs;
    if(rest<660)w.push({r:'r11',lv:'bad',date:b.date,t:fmtDate(a.date).replace(/（.）/,'')+' 下班（'+a.out+'）到 '+fmtDate(b.date).replace(/（.）/,'')+' 上班（'+b.in+'）只休息 '+minTxt(rest)+'，少於 11 小時，違反勞基法第 34 條。'})}
  // 連續工作 4 小時應休息 30 分鐘（系統沒有休息打卡，只提醒）
  const lg=done.filter(x=>x.long&&inYm(x.date)).length;
  if(lg)w.push({r:'b4',lv:'info',date:ym+'-31',t:'本月有 '+lg+' 天連續工作超過 4 小時，請確認中間有安排至少 30 分鐘休息（第 35 條）。'});
  return w.sort((a,b)=>({bad:0,warn:1,info:2}[a.lv]-{bad:0,warn:1,info:2}[b.lv])||(a.date<b.date?-1:1));
}
const LAW_RULES=[
  ['每日、每週工時（第 30、32 條）',['每日正常工時不超過 8 小時，每週不超過 40 小時。','正常工時加上加班，每日不超過 12 小時。','每月加班原則上不超過 46 小時；經工會或勞資會議同意，每月最多 54 小時，每 3 個月合計不超過 138 小時。']],
  ['連續上班天數：一例一休（第 36 條）',['每 7 天應有 2 天休息，1 天例假、1 天休息日。','一般情況不得連續上班超過 6 天。','經勞動部指定的特殊行業，並經工會或勞資會議同意（30 人以上要報主管機關備查），例假可在 7 天週期內調整，最長連續上班 12 天；不是每個行業都適用。']],
  ['換班休息（第 34 條）',['輪班換班時，中間至少要連續休息 11 小時。','天災等例外或經勞動部公告的特殊行業，經工會或勞資會議同意可以縮短，但不得少於 8 小時。']],

  const [view,setView]=useState(null);
  const [pre,setPre]=useState(null);
  const [real,setReal]=useState(null);   // 本人的 userId 與名單（歡迎畫面的測試分身用）
  const run=async()=>{
    setSt('loading');setErr('');
    try{
      const L=await liffReady();
      if(new URLSearchParams(location.search).has('liff.state'))return;   // LIFF 中繼頁
      if(!L.isLoggedIn()){L.login({redirectUri:location.href});return}
      let p=await L.getProfile();
      let list=[];
      try{list=await fetchMembers(true)}catch(e){if(String(e.message)!=='nofile')throw new Error('讀取開通名單失敗，請檢查網路後重試')}
      setReal({uid:p.userId,list});
      const an=altGet();
      if(an){const o=list.find(x=>x&&x.uid===p.userId);   // 只有老闆可以用分身
        if(!altOk(o)){altSwitch(0);return}
        p=Object.assign({},p,{userId:p.userId+an,displayName:'分身'+an})}
      setProf(p);
      const hit=list.find(x=>x&&x.uid===p.userId);
      const m=(hit&&!isApplicant(hit)?hit:null)||hintGet(p.userId);   // 剛核准、GitHub Pages 還沒更新：先用核准時的資料
      // v0.1-053：沒開通 → 線上申請頁（第一次來：成為會員／成為工作夥伴；應徵中：直接顯示目前階段）
      if(!m){setPre(hit||null);setSt(GAS_URL?'join':'notmember');return}
      setMem(m);
      let mine=meGet(p.userId);
      // 線上開通的人：名單上已有姓名（老師還有編號）→ 不用再設定，直接進歡迎畫面
      if(!mine&&m.name&&(m.tc||!memberInfo(m).roles.includes('teacher'))){mine={uid:p.userId,code:m.tc||'',name:m.name,at:Date.now()};meSet(mine)}
      // v0.1-054：編號以名單為準（老闆改了編號，這支手機也跟著改）
      if(mine&&m.tc&&String(mine.code)!==String(m.tc)){mine=Object.assign({},mine,{code:String(m.tc)});meSet(mine)}
      setMe(mine);
      // 這台被設為主櫃（店內 iPad）：櫃台人員或老闆登入後直接進主櫃系統，操作人＝登入的人
      let mc=false;try{mc=localStorage.getItem('slowve.mainc')==='1'}catch(_e){}
      const mi=memberInfo(m);
      if(mc&&(mi.roles.includes('counter')||mi.admin==='owner')){setMe(mine||{uid:p.userId,name:m.name||p.displayName,code:m.tc||''});setView('mainc');setSt('view');return}
      setSt(mine?'welcome':'profile');
    }catch(e){setErr(String(e&&e.message||e));setSt('error')}
  };
  useEffect(()=>{run()},[]);
  const views=mem?viewsOf(mem):[];
  const lay=useLayout();
  const pick=v=>{try{localStorage.setItem(VIEW_KEY+altSfx(),v)}catch(_e){}setView(v);setSt('view')};
  if(st==='join')return <JoinOnline pre={pre} prof0={prof}/>;
  if(st==='view'&&view){
    return <RoleView real member={mem} view={view} me={me} mode={lay.mode} bar={<RoleBar view={view} me={me} wide={lay.mode!=='phone'} canSwitch={views.length>1} onSwitch={()=>{setView(null);setSt('welcome')}}/>}/>;
  }
  return (
    <GateShell>
      {st==='loading'&&<div className="text-center text-mute">確認帳號中…</div>}
      {st==='error'&&<Card className="p-4 text-center"><div className="text-warn text-sm whitespace-pre-line mb-3">{err}</div><button className="h-11 px-6 rounded-xl bg-sage text-white" onClick={run}>重試</button></Card>}
      {st==='notmember'&&<Card className="p-5 text-center">
        <div className="text-lg mb-1">{prof?prof.displayName+'，':''}你的帳號尚未開通</div>
        <div className="text-sm text-mute mb-4">請先申請開通帳號，並聯繫店家工作人員或主管完成開通。</div>
        <button className="w-full h-12 rounded-xl bg-sage text-white text-lg" onClick={()=>location.replace('https://liff.line.me/'+LIFF_ID+'?mode=join')}>申請開通帳號</button>
      </Card>}
      {st==='profile'&&mem&&<ProfileForm m={mem} prof={prof} me={me} onSave={x=>{meSet(x);setMe(x);setSt('welcome')}} onCancel={me?()=>setSt('welcome'):null}/>}
      {st==='welcome'&&me&&<Welcome me={me} views={views} onPick={pick} onEdit={mem&&!mem.name?()=>setSt('profile'):null}/>}
      {st==='welcome'&&!altGet()&&altOk(mem)&&real&&<AltPicker real={real}/>}
    </GateShell>
  );
}

}
